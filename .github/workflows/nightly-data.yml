# Unified nightly build of council-data.json.
#
# WHY ONE WORKFLOW: every script below mutates the SAME council-data.json.
# If they run as separate workflows they race and clobber each other (last
# commit wins). This runs them sequentially against one checkout and commits
# ONCE, in dependency order. It REPLACES the separate sync-overrides /
# sync-council-data / sheet-votes workflows — delete or disable those.
#
# ORDER MATTERS (do not reshuffle):
#   1. sheet sync_votes.py   — rebuilds alders[] from Alder Bios + sets votemeta
#                              and the hand-entered (unmapped) vote positions.
#   2. sheet sync_overrides  — donor industries/flags/vocab + Donor Merges
#                              (dedupe) + Donor Clusters (relate).
#   3. ingest_votes.py       — LAST. Overlays the auto-populated featured-vote
#                              positions + the rollcall tier + committees ON TOP
#                              of the rebuilt alders. If this ran before step 1,
#                              the bio-rebuild would wipe the auto positions.
#
# ingest.py (SBE donors) is NOT here — it runs on its own quarterly cadence and
# commits raw donors; the next nightly run re-applies merges/overrides on top.
#
# BOT WALL: ingest_votes hits puddle.datamade.us, which blocks datacenter IPs.
# Its step is continue-on-error so a block doesn't strand the editorial/donor
# updates — votes change only on meeting days and can be refreshed locally.

name: Nightly data build

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install gspread google-auth

      - name: 1) Sheet → alder bios (preserves existing vote positions)
        run: python3 campaign-finance/sheets-sync/sync_bios.py --data-file campaign-finance/council-data.json

      - name: 2) Sheet → donor overrides, merges, clusters
        run: python3 campaign-finance/sheets-sync/sync_overrides.py --data-file campaign-finance/council-data.json

      - name: 3) Councilmatic → rollcall, auto featured positions, committees
        continue-on-error: true     # bot wall may block from CI; see header note
        run: python3 campaign-finance/ingest_votes.py --data campaign-finance/council-data.json --map campaign-finance/featured_vote_map.json

      - name: 4) All Votes admin tab (two-way) → featured flags + tags
        continue-on-error: true     # needs Datasette (bot wall) AND Sheet write access
        run: python3 campaign-finance/sync_allvotes.py --data campaign-finance/council-data.json --map campaign-finance/featured_vote_map.json

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain campaign-finance/council-data.json)" ]; then
            git config user.name  "ipg-data-sync[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add campaign-finance/council-data.json
            git commit -m "Nightly data build ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes — nothing to commit."
          fi
