name: Sync council data from Google Sheet

# Runs nightly at 02:00 UTC (9 PM Central) and on manual trigger.
# Reads two sets of tabs from the Google Sheet and updates council-data.json:
#   - sync_votes.py:     Alder Bios, Votes, Vote Metadata
#   - sync_overrides.py: Donor Overrides, Industry Tags, Flag Types
# Any changes are committed back to the repo. The Squarespace embed reads
# council-data.json from the raw GitHub URL, so changes go live within
# minutes of the commit.

on:
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch:       # also allow manual runs from the Actions tab

permissions:
  contents: write          # needed to commit the updated JSON back

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Sync votes & alder bios
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python campaign-finance/sheets-sync/sync_votes.py \
            --data-file campaign-finance/council-data.json

      - name: Sync donor overrides
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python campaign-finance/sheets-sync/sync_overrides.py \
            --data-file campaign-finance/council-data.json

      - name: Commit and push if changed
        run: |
          git config user.name "ipg-sheets-sync[bot]"
          git config user.email "actions@github.com"
          git add campaign-finance/council-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync council data from Google Sheet"
            git push
          fi
