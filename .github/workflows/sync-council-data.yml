# Nightly sync of Chicago City Council roll-call data into council-data.json.
#
# Runs ingest_votes.py against DataMade's Councilmatic Datasette and commits the
# refreshed council-data.json if (and only if) it changed.
#
# IMPORTANT — bot detection on the data host:
#   puddle.datamade.us uses bot detection that tends to block DATACENTER IPs,
#   which is exactly what GitHub-hosted runners use. If this job starts failing
#   at the "SELECT 1" connectivity check, that's the cause. Two fixes, in order
#   of preference:
#     1. Run ingest_votes.py on a self-hosted runner (a small always-on box on a
#        residential/business IP). Change `runs-on:` below to your runner label.
#     2. Point the sync at Legistar's API directly instead of the Datasette
#        (same upstream data); this needs a ingest_votes.py source switch we can
#        add later. Until then, the sync can also just be run by hand monthly
#        after council meetings — the data only changes when the Council votes.
#
# The campaign-finance ingest (ingest.py / SBE) is intentionally NOT in this
# workflow — it has a different (quarterly) cadence. Add it as a separate job
# or workflow if you want them automated together.

name: Sync council votes

on:
  schedule:
    - cron: "30 9 * * *"     # 09:30 UTC daily (~early morning Chicago)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the refreshed data file

concurrency:
  group: sync-council-votes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest     # see bot-detection note above; swap for a self-hosted label if blocked
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run vote sync
        working-directory: campaign-finance
        run: |
          python3 ingest_votes.py \
            --data ./council-data.json \
            --map ./featured_vote_map.json

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain campaign-finance/council-data.json)" ]; then
            git config user.name  "ipg-vote-sync[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add campaign-finance/council-data.json
            git commit -m "Nightly council vote sync ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes in council-data.json — nothing to commit."
          fi
