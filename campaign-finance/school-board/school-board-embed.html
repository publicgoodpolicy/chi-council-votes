    // R1(ii) is untouched by this: the seat selector still reads
    // visibleRoster(), so while the column is all-blank the President is not
    // SELECTABLE — the page is reached from the roster tab, and only there.
    // ==========================================================
    var isPresident = (row.seat === PRESIDENT_SEAT);

    // ---- string 5: the vacancy renders as a SEAT, with NO member page ----
    if(!isMember(row)){
      return h + '<div class="ipg-sb-card">'
        + '<div class="ipg-sb-seat">Seat '+esc(row.seat)+'</div>'
        + '<div class="ipg-sb-name serif">'+esc(S.vacant)+'</div>'
        + '<div class="ipg-sb-meta">This seat is currently vacant. There is no member page for a seat with no member.</div>'
        + '</div>';
    }

    h += '<div class="ipg-sb-card">'
       // D-R2b gives the President page its own heading, in place of the seat
       // label every other member page carries.
       + '<div class="ipg-sb-seat">'
       + esc(isPresident ? SBD.presidentHeading : 'Seat '+row.seat)+'</div>'
       // ---- string 2: the badge marks the EXCEPTION; elected carry none ----
       + '<div class="ipg-sb-name serif">'+esc(row.name)
       + (row.seat_type==='appointed' ? '<span class="ipg-sb-badge">'+esc(S.appointed)+'</span>' : '')
       + '</div>';
    var meta = [];
    if(row.term_start) meta.push('Term began '+esc(row.term_start));
    if(row.source_url) meta.push('<a href="'+esc(row.source_url)+'" target="_blank" rel="noopener">Source</a>');
    if(meta.length) h += '<div class="ipg-sb-meta">'+meta.join(' &middot; ')+'</div>';
    h += '</div>';

    // ==========================================================
    // PS-127 (iii) and (iv): the President's vote table is conditional, and the
    // condition is seatVisible() — THE SAME PREDICATE every other PS-125 surface
    // consumes, never a second one. While no President position is recorded the
    // page carries R6's sentence and no vote table; on the first recorded
    // position this branch stops firing and the page renders votes exactly as
    // any member's does, at the same instant the seat resurfaces on the selector
    // and the matrix. One predicate, so the surfaces cannot disagree.
    // ==========================================================
    if(isPresident && !seatVisible(row.seat))
      return h + '<div class="ipg-sb-card"><div class="ipg-sb-empty">'+esc(SV.president)+'</div></div>'
             + financeSection(row);

    // The finance section is INDEPENDENT of the voting record: a member with no
    // recorded votes still has campaign finance, and the born state (zero votes)
    // must not suppress it. So every real-member return below carries it.
    if(!voteCount()) return h + emptyToolCard() + financeSection(row);
    // string 3 — roster present, no recorded position on anything
    if(!hasAnyRecordedPosition(row.seat))
      return h + '<div class="ipg-sb-card"><div class="ipg-sb-empty">'+esc(S.noVotesForMember)+'</div></div>'
             + financeSection(row);

    var tags = allTags();
    h += '<div class="ipg-sb-card">';
    if(tags.length){
      h += '<div class="ipg-sb-chips">';
      ['All'].concat(tags).forEach(function(t){
        h += '<button type="button" class="ipg-sb-chip" data-tag="'+esc(t)+'" aria-pressed="'+(state.tag===t)+'">'+esc(t)+'</button>';
      });
      h += '</div>';
    }
    // PS-124: date-descending. This list previously rendered in sheet row order
    // — the ingest imposes none, so the artifact's array order was the Sheet's.
    var shown = votemetaSorted().filter(function(vm){
      return state.tag==='All' || voteTags(vm).indexOf(state.tag)>=0; });
    if(!shown.length){
      h += '<div class="ipg-sb-empty">No votes carry the tag &ldquo;'+esc(state.tag)+'&rdquo;.</div>';
    } else {
      shown.forEach(function(vm){
        var cbName = castByFor(vm.vote_id, row.seat);
        h += '<div class="ipg-sb-vote">'
           + '<h4>'+esc(vm.full || vm.code)+' '+featuredMark(vm)+' '
           + pillAt(row.seat, seatPosition(vm, row.seat))+castByMark(cbName)+'</h4>'
           + castByNote(cbName)
           + (vm.date ? '<div class="ipg-sb-when">'+esc(vm.date)+'</div>' : '')
           + (vm.desc ? '<p>'+esc(vm.desc)+'</p>' : '')
           + (vm.source_url ? '<div class="ipg-sb-when"><a href="'+esc(vm.source_url)+'" target="_blank" rel="noopener">Source</a></div>' : '')
           + '</div>';
      });
    }
    return h + '</div>' + financeSection(row);
  }

  // ==========================================================
  // B.1 — the member page's finance section. DIRECT-ONLY, by ratification 2.
  // Independent expenditure does not appear here at all; it lives on Spend by
  // member. This mirrors the council, whose member page likewise renders no IE
  // (G1 R1-a) — the separation is achieved by absence, and the three-stream view
  // is where the streams meet, side by side and never summed.
  // ==========================================================
  // ==========================================================
  // SBFIN-2 B.1 — the election scope, and the ALL-ELECTIONS view.
  //
  // F1's repair lives here. Before SBFIN-2 the tiles were election-scoped while the
  // Donors tile, coverage bar and donor list read one all-elections, self-funding-
  // inclusive list, so a self-funder rendered both as a top donor and as the tile that
  // says it is "not included in Raised". Every surface below now reads ONE scope object,
  // so the two bases cannot drift apart again: there is only one.
  //
  // The all-elections view is DERIVED here and never stored (SBFIN-2 A). Summing one
  // stream across a member's own elections is not a stream fusion — the four streams stay
  // in their own fields and nothing adds two of them together, which is what
  // [SBF/NEVERSUM] asserts.
  // ==========================================================
  var ALL_ELECTIONS = 'all';
  var STREAM_KEYS = ['direct', 'self_funding', 'ie_support', 'ie_oppose'];

  function round2(n){ return Math.round(Number(n||0)*100)/100; }

  // Scope options: the member's elections, plus All elections where there is more than
  // one. A single-election member gets no selector and no All option — there would be
  // nothing to combine.
  function finScopeKeys(fm){
    var keys = finElections(fm);
    return keys.length > 1 ? keys.concat([ALL_ELECTIONS]) : keys;
  }

  // One row per donor across elections: amounts and counts summed, itemized rows
  // concatenated and re-sorted by date. A donor who gave in both elections is ONE donor,
  // which is why the Donors tile cannot just add the per-election counts.
  function mergeDonorRows(map){
    var by = {}, order = [];
    Object.keys(map || {}).forEach(function(ek){
      (map[ek] || []).forEach(function(d){
        var e = by[d.donor_id];
        if(!e){
          e = by[d.donor_id] = { donor_id:d.donor_id, name:d.name, type:d.type,
                                 industries:(d.industries||[]).slice(),
                                 industry_class:d.industry_class, cluster_id:d.cluster_id,
                                 amount:0, count:0, items:[] };
          order.push(d.donor_id);
        }
        e.amount = round2(e.amount + Number(d.amount||0));
        e.count += Number(d.count||0);
        e.items = e.items.concat(d.items || []);
      });
    });
    var out = order.map(function(id){ return by[id]; });
    out.forEach(function(d){ d.items.sort(function(a,b){
      return String(a.date||'').localeCompare(String(b.date||'')); }); });
    out.sort(function(a,b){ return b.amount - a.amount ||
      String(a.donor_id).localeCompare(String(b.donor_id)); });
    return out;
  }

  // Mirrors build_sb_finance.coverage_for EXACTLY, and is used ONLY for the derived
  // all-elections view. Every stored scope reads its precomputed coverage from the
  // artifact — the render still does no arithmetic a gate cannot reproduce, and the
  // fixture reproduces this one.
  function coverageFrom(rows){
    var d = { substantive:0, individual_only:0, unclassified:0 }, tot = 0;
    rows.forEach(function(r){
      var k = r.industry_class || 'unclassified';
      d[k] = round2(d[k] + Number(r.amount||0));
      tot = round2(tot + Number(r.amount||0));
    });
    var share = tot ? d.substantive / tot : 0;
    return { donor_total:tot, donor_count:rows.length, dollars:d,
             substantive_share:share,
             meets_industry_threshold: share >= Number((F && F.industry_threshold) || 0.5) };
  }

  function finScope(fm, key){
    if(!fm) return null;
    if(key === ALL_ELECTIONS){
      var acc = {};
      STREAM_KEYS.forEach(function(s){ acc[s] = { amount:0, count:0 }; });
      finElections(fm).forEach(function(k){
        var e = (fm.elections||{})[k] || {};
        STREAM_KEYS.forEach(function(s){
          var v = e[s] || {};
          acc[s].amount = round2(acc[s].amount + Number(v.amount||0));
          acc[s].count += Number(v.count||0);
        });
      });
      var rows = mergeDonorRows(fm.donors_by_election);
      acc.key = ALL_ELECTIONS; acc.isAll = true; acc.label = SF.allElections;
      acc.donors = rows; acc.coverage = rows.length ? coverageFrom(rows) : null;
      return acc;
    }
    var e2 = (fm.elections||{})[key];
    if(!e2) return null;
    var out = { key:key, isAll:false, label:(e2.label || key),
                donors: ((fm.donors_by_election||{})[key]) || [],
                coverage: ((fm.coverage_by_election||{})[key]) || null };
    STREAM_KEYS.forEach(function(s){ out[s] = e2[s] || { amount:0, count:0 }; });
    return out;
  }

  // ==========================================================
  // SBFIN-2 B.2 — the labeled, clickable industry bar. Exit 1: DIRECT-ONLY, and the view
  // says so in its own sentence rather than leaving it to a gate (the council's
  // alderMixSubView idiom). Mechanics mirror the council's renderDollarBar: one segment
  // per industry, segment AND legend row both clickable on the same data-industry,
  // toggle-to-clear, dimming, and filtering IN PLACE — no scroll, no navigation.
  // ==========================================================
  function indMeta(key){
    var t = (F && F.industry_tags || {})[key];
    return t || { label:key, color:'#a9a299' };
  }
  function industryTotals(rows){
    var by = {}, order = [];
    rows.forEach(function(d){
      var inds = (d.industries && d.industries.length) ? d.industries : ['unclassified'];
      inds.forEach(function(i){
        if(!by[i]){ by[i] = { industry:i, amount:0, donors:0 }; order.push(i); }
        by[i].amount = round2(by[i].amount + Number(d.amount||0));
        by[i].donors += 1;
      });
    });
    return order.map(function(k){ return by[k]; }).sort(function(a,b){
      return b.amount - a.amount || a.industry.localeCompare(b.industry); });
  }
  function dollarBar(inds, active){
    var grand = inds.reduce(function(s,x){ return s + Number(x.amount||0); }, 0);
    if(grand <= 0) return '';
    var isFiltered = !!(active && active !== 'All');
    var h = '<div class="ipg-sb-dollarbar">';
    inds.forEach(function(x){
      var meta = indMeta(x.industry);
      var p = (x.amount / grand) * 100;
      if(p < 0.3) return;
      var pstr = p >= 10 ? Math.round(p)+'%' : p.toFixed(1)+'%';
      var dim = (isFiltered && active !== x.industry) ? ';opacity:.32' : '';
      h += '<button type="button" class="ipg-sb-bar-seg" data-industry="'+esc(x.industry)+'"'
         + ' style="flex:'+p+' 0 0;background:'+esc(meta.color)+dim+'"'
         + ' title="'+esc(meta.label+' — '+money(x.amount)+' ('+pstr+'). '+SF.barSegmentHint)+'">'
         + (p >= 8 ? '<span class="l">'+esc(meta.label)+'</span><span class="p">'+esc(pstr)+'</span>' : '')
         + '</button>';
    });
    h += '</div><div class="ipg-sb-bar-legend">';
    inds.forEach(function(x){
      if(Number(x.amount||0) <= 0) return;
      var meta = indMeta(x.industry);
      var p = (x.amount / grand) * 100;
      var pstr = p >= 10 ? Math.round(p)+'%' : p.toFixed(1)+'%';
      var dim = (isFiltered && active !== x.industry) ? ' dim' : '';
      h += '<button type="button" class="ipg-sb-legend-item'+dim+'" data-industry="'+esc(x.industry)+'">'
         + '<i style="background:'+esc(meta.color)+'"></i>'
         + '<span class="l">'+esc(meta.label)+'</span>'
         + '<span class="p">'+esc(pstr)+'</span>'
         + '<span class="a">'+esc(money(x.amount))+'</span></button>';
    });
    return h + '</div>';
  }

  // ==========================================================
  // SBFIN-2 B.3 — the donor profile. Reads the artifact's itemized dated rows; scopes to
  // the active election filter, so what the panel shows and what the page shows are the
  // same money.
  // ==========================================================
  function scopeKeysFor(fm, scopeKey){
    return scopeKey === ALL_ELECTIONS ? finElections(fm) : [scopeKey];
  }
  // Every seated member this donor gave to, within the school-board universe and the
  // active scope. Thin by construction — 16 committees — and that is not a defect.
  // SBFIN-5 B — the parent total and its children come out of ONE walk.
  //
  // MODAL-NEST-1 refuted H4: an item carries date, amount and its flags and NO member,
  // donor, election or stream key. Member identity existed at spendDonorAggregate and was
  // dropped in the concat, so the flat list below the recipient rows could not be
  // attributed to any of them — for the 59 donors spanning more than one member, no
  // recipient figure was reconstructible from what was on screen.
  //
  // Identity is threaded HERE rather than downstream because this is the loop that already
  // sums the parent. Children are the same `d` rows the total adds, grouped by the election
  // key the loop is already iterating, so children sum to their parent BY CONSTRUCTION and
  // not by a second agreeing computation. Guard 3 asserts it anyway. One resolution passed
  // down (scopeKey, in), nothing re-derived downstream — the SBFIN-4 A convention.
  //
  // The amount/count arithmetic is UNCHANGED: same addends, same order, same round2 points.
  // The election grouping is additive.
  function donorRecipients(donorId, scopeKey){
    var out = [];
    ((F && F.members) || []).forEach(function(fm){
      if(!fm.donors_by_election) return;
      var amt = 0, cnt = 0, hit = false, groups = [];
      scopeKeysFor(fm, scopeKey).forEach(function(k){
        var gAmt = 0, gCnt = 0, gItems = [], gHit = false;
        (fm.donors_by_election[k] || []).forEach(function(d){
          if(d.donor_id !== donorId) return;
          hit = true; amt = round2(amt + Number(d.amount||0)); cnt += Number(d.count||0);
          gHit = true; gAmt = round2(gAmt + Number(d.amount||0)); gCnt += Number(d.count||0);
          gItems = gItems.concat(d.items || []);
        });
        if(gHit) groups.push({ ek:k, label:((F && F.election_labels)||{})[k] || k,
                               amount:gAmt, count:gCnt, items:gItems });
      });
      // D-8 — most recent election first, the order the board-wide selector already uses.
      groups.sort(function(a,b){ return String(b.ek).localeCompare(String(a.ek)); });
      groups.forEach(function(g){ g.items.sort(function(a,b){
        return String(a.date||'').localeCompare(String(b.date||'')); }); });
      if(hit) out.push({ seat:fm.seat, name:fm.name, amount:amt, count:cnt, elections:groups });
    });
    out.sort(function(a,b){ return b.amount - a.amount; });
    return out;
  }
  // A family member's giving inside THIS tool. The artifact deliberately carries no
  // cluster totals — those are elections-wide and would describe a universe the reader is
  // not looking at — so the figure shown is summed from the same rows as everything else.
  function familyAmount(donorId, scopeKey){
    var amt = 0;
    ((F && F.members) || []).forEach(function(fm){
      if(!fm.donors_by_election) return;
      scopeKeysFor(fm, scopeKey).forEach(function(k){
        (fm.donors_by_election[k] || []).forEach(function(d){
          if(d.donor_id === donorId) amt = round2(amt + Number(d.amount||0));
        });
      });
    });
    return amt;
  }
  function itemChips(it){
    var out = '';
    // No `self-funding` chip can ever render here: the candidate's own contributions are
    // dropped at donor grain upstream, so no itemized row in this artifact is one. The
    // vocabulary keeps the other three.
    if(it.is_loan) out += '<span class="ipg-sb-ichip loan">'+esc(SF.chipLoan)+'</span>';
    if(it.is_in_kind) out += '<span class="ipg-sb-ichip inkind">'+esc(SF.chipInKind
      + (it.in_kind_description ? ' · '+it.in_kind_description : ''))+'</span>';
    if(it.is_aggregate) out += '<span class="ipg-sb-ichip agg">'
      + esc(fill(SF.chipAggregate, String(it.contribution_count || '?')))+'</span>';
    return out;
  }
  function fmtItemDate(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
    if(!m) return esc(String(s||'—'));
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return esc((MON[Number(m[2])-1]||'') + ' ' + Number(m[3]) + ', ' + m[1]);
  }
  function findDonorRow(donorId, fm, scope){
    for(var i=0;i<scope.donors.length;i++){
      if(scope.donors[i].donor_id === donorId) return scope.donors[i];
    }
    return null;
  }
  // ONE profile renderer. The member page passes the row it found in its own scope; the
  // Political Spend sub-tabs pass a row aggregated across members. Both render the same
  // panel, so a donor looks the same wherever the reader reached them from.
  // The same donor, summed across every member for one election — the Political Spend
  // profile's subject. Items are concatenated and re-sorted so the contribution list reads
  // chronologically regardless of which member each row was filed against.
  function spendDonorAggregate(donorId, ek){
    var out = null;
    spendDonorRows(ek).forEach(function(x){
      if(x.d.donor_id !== donorId) return;
      if(!out) out = { donor_id: x.d.donor_id, name: x.d.name, type: x.d.type,
                       industries: (x.d.industries || []).slice(), cluster_id: x.d.cluster_id,
                       amount: 0, count: 0, items: [] };
      out.amount = round2(out.amount + Number(x.d.amount || 0));
      out.count += Number(x.d.count || 0);
      out.items = out.items.concat(x.d.items || []);
    });
    if(out) out.items.sort(function(a, b){
      return String(a.date || '').localeCompare(String(b.date || '')); });
    return out;
  }

  function donorProfileHtml(fm, scope){
    var d = fm ? findDonorRow(state.finDonor, fm, scope) : spendDonorAggregate(state.finDonor, scope.key);
    if(!d) return '';
    var inds = (d.industries||[]).map(function(i){
      var meta = indMeta(i);
      return '<span class="ipg-sb-chip-ind" style="background:'+esc(meta.color)+'">'
           + esc(meta.label)+'</span>'; }).join('');
    var h = '<div class="ipg-sb-modal-overlay" id="ipg-sb-donor-overlay">'
      + '<div class="ipg-sb-modal" role="dialog" aria-modal="true" aria-label="'+esc(SF.profileKicker)+'">'
      + '<button class="ipg-sb-modal-close" id="ipg-sb-donor-close" aria-label="Close">×</button>'
      + '<div class="ipg-sb-modal-head">'
      + '<div class="ipg-sb-modal-kicker">'+esc(SF.profileKicker)+'</div>'
      + '<div class="ipg-sb-modal-name serif">'+esc(d.name || d.donor_id)+'</div>'
      + '<div class="ipg-sb-modal-meta">'+inds
      + (d.type ? ' <span class="ipg-sb-dtype">'+esc(d.type)+'</span>' : '')
      + ' <span class="ipg-sb-dscope">'+esc(scope.label)+'</span></div></div>';

    h += '<div class="ipg-sb-stats">'
       + statTile(money(d.amount), 'Given in this view')
       + statTile(String(d.count), d.count===1 ? 'Contribution' : 'Contributions')
       + '</div>';

    // Donor family (rollup), where one exists.
    var fam = d.cluster_id ? ((F && F.donor_clusters || {})[d.cluster_id]) : null;
    if(fam){
      h += '<div class="ipg-sb-fin-sub">'+esc(SF.familyHead)+'</div>'
         + '<div class="ipg-sb-note">'+esc(fill(SF.familyNote, esc(fam.name||'')))+'</div>';
      (fam.members||[]).forEach(function(mm){
        var amt = familyAmount(mm.donor_id, scope.key);
        h += '<div class="ipg-sb-donor"><div><div class="n">'+esc(mm.name || mm.donor_id)
           + (mm.role ? ' <span class="ipg-sb-role">'+esc(mm.role)+'</span>' : '')+'</div>'
           + (amt > 0 ? '' : '<div class="s">'+esc(SF.familyNoneHere)+'</div>')
           + '</div><div class="a">'+esc(amt > 0 ? money(amt) : '—')+'</div></div>';
      });
    }

    // SBFIN-5 B / D-5 — the contributions nest under the recipient they were given to.
    // The flat "Contributions" table that used to sit below this list is GONE: it listed
    // every item this donor gave anywhere in scope, under a set of per-recipient totals it
    // could not be attributed to. D-5b scopes children to the (donor, recipient) pair, so
    // expanding a row shows that row's money and never the donor's whole footprint.
    var recs = donorRecipients(d.donor_id, scope.key);
    h += '<div class="ipg-sb-fin-sub">'+esc(SF.recipientsHead)+'</div>';
    recs.forEach(function(r){
      var open = !!state.finOpenRecip[r.seat];
      var nEl = (r.elections || []).length;
      // D-5a — collapsed by default, and the parent says what is inside it before you open
      // it: how many contributions, and across how many elections. The election count is
      // load-bearing under the All-elections landing scope (SBFIN-3 C), where a parent can
      // span cycles; without it a reader cannot tell a one-cycle row from a two-cycle one.
      var sub = r.count + (r.count===1 ? ' contribution' : ' contributions')
              + (nEl > 1 ? ' · ' + nEl + ' elections' : '');
      h += '<button type="button" class="ipg-sb-donor ipg-sb-donor-click ipg-sb-recip'
         + (open ? ' open' : '') + '" data-recip="'+esc(r.seat)+'" aria-expanded="'+(open?'true':'false')+'">'
         + '<div><div class="n"><span class="ipg-sb-caret" aria-hidden="true">'+(open?'▾':'▸')+'</span> '
         + 'Seat '+esc(r.seat)+' — '+esc(r.name)+'</div>'
         + '<div class="s">'+esc(sub)+'</div></div>'
         + '<div class="a">'+esc(money(r.amount))+'</div></button>';
      if(!open) return;
      // money() rounds each figure independently, so summing rounded children drifts against
      // the rounded parent — measured at up to $3 across a 38-item group before this. The
      // remedy is the one already ratified in this file for the industry bar (apportion, the
      // elections tool's largest-remainder): apportion the subtotals to the parent, then each
      // group's children to ITS apportioned subtotal, so the chain is exact at both levels.
      // The parent keeps its own rounded true value; only the parts are allocated.
      var subs = apportion((r.elections || []).map(function(g){ return { raw:g.amount }; }), r.amount);
      h += '<div class="ipg-sb-kids">';
      (r.elections || []).forEach(function(g, gi){
        // D-8 — an election sub-header carrying its own subtotal. Children may not mix
        // elections undifferentiated; no ruling permitting that was sought or given.
        h += '<div class="ipg-sb-kidhead"><span>'+esc(g.label)+'</span>'
           + '<span class="a">'+esc(fmtWhole(subs[gi]))+'</span></div>';
        var kids = apportion(g.items.map(function(it){ return { raw:Number(it.amount||0) }; }), subs[gi]);
        g.items.forEach(function(it, ii){
          h += '<div class="ipg-sb-kid"><div class="l">'+fmtItemDate(it.date)
             + '<span class="c">'+itemChips(it)+'</span></div>'
             + '<div class="a">'+esc(fmtWhole(kids[ii]))+'</div></div>';
        });
      });
      h += '</div>';
    });
    h += '<div class="ipg-sb-modal-foot">'+esc(SF.profileFoot)+'</div>';
    return h + '</div></div>';
  }

  function financeSection(row){
    var h = '<div class="ipg-sb-card ipg-sb-fin">'
          + '<div class="ipg-sb-fin-h">Campaign finance</div>';
    if(state.finStatus==='loading')
      return h + '<div class="ipg-sb-empty">Loading campaign finance data&hellip;</div></div>';
    if(state.finStatus==='error')
      return h + '<div class="ipg-sb-err">Could not load campaign finance data ('
        + esc(state.finError||'unknown error')+'). The voting record above is unaffected.</div></div>';

    var fm = finMember(row.seat);
    if(!fm) return h + '<div class="ipg-sb-empty">'+esc(SF.noRecord)+'</div></div>';
    // The four ratified states. no_record and vacancy are terminal.
    if(fm.finance_state==='no_record' || fm.finance_state==='vacancy')
      return h + '<div class="ipg-sb-empty">'+esc(SF.noRecord)+'</div></div>';

    var keys = finScopeKeys(fm);
    if(!keys.length) return h + '<div class="ipg-sb-empty">'+esc(SF.noRecord)+'</div></div>';
    var ek = pickElection(fm, state.finElection);
    var scope = finScope(fm, ek);
    if(!scope) return h + '<div class="ipg-sb-empty">'+esc(SF.noRecord)+'</div></div>';

    // ---- B.4: the Verified / ISBE block. Banner + filed committee name + source date.
    // NO Sunshine link: the committee route errors for these committees (G2 R0 measured
    // 500 on a real school-board committee against 200 on a council one), so the link is
    // held. The block renders without it rather than not at all — the provenance is the
    // point, and the link was only ever one way of showing it.
    (fm.committees||[]).forEach(function(cm){
      if(cm.data_quality === 'REAL')
        h += '<div class="ipg-sb-verified">'+esc(SF.verified)+'</div>';
      var bits = [];
      if(cm.name) bits.push('<strong>'+esc(cm.name)+'</strong>');
      if(cm.last_updated) bits.push(esc(fill(SF.updated, cm.last_updated)));
      if(bits.length) h += '<div class="ipg-sb-meta">'+bits.join(' &middot; ')+'</div>';
    });

    // ---- Election scope. `All elections` is an explicit option (ratification 4), never
    // the default: the most recent election leads, as it did before.
    if(keys.length>1){
      h += '<div class="ipg-sb-row"><label for="ipg-sb-fin-el">Election</label>'
         + '<select id="ipg-sb-fin-el">';
      keys.forEach(function(k){
        var lab = (k===ALL_ELECTIONS) ? SF.allElections : ((fm.elections[k]||{}).label || k);
        h += '<option value="'+esc(k)+'"'+(k===ek?' selected':'')+'>'+esc(lab)+'</option>';
      });
      h += '</select></div>';
      if(scope.isAll) h += '<div class="ipg-sb-note">'+esc(SF.allElectionsDisclosure)+'</div>';
    } else {
      h += '<div class="ipg-sb-meta">'+esc(scope.label)+'</div>';
    }

    // ---- Stat tiles. Every one reads the SAME scope object as the donor list below it,
    // which is the whole of F1's repair. Avg. gift is the only derived figure and is a
    // ratio of two displayed numbers, never a sum of streams.
    var raised = Number(scope.direct.amount||0), ncontrib = Number(scope.direct.count||0);
    var avg = ncontrib ? raised/ncontrib : 0;
    h += '<div class="ipg-sb-stats">';
    h += statTile(money(raised), 'Raised');
    // Donor count is knowable only where donor detail exists. For a totals-only member it
    // is NOT derivable from contribution counts, so the tile is omitted rather than filled
    // with a number that would silently mean something else. Under All elections it is the
    // DISTINCT donor count, not the sum of the per-election counts.
    if(scope.coverage) h += statTile(String(scope.coverage.donor_count), 'Donors');
    h += statTile(money(avg), 'Avg. gift');
    h += statTile(String(ncontrib), 'Contributions');
    h += '</div>';

    // Self-funding: its OWN tile, never folded into Raised (ratification 8), and never a
    // donor row (SBFIN-2 A dropped those donors upstream, which is why the two figures
    // beside each other are now on the same basis).
    var self = Number((scope.self_funding||{}).amount||0);
    if(self>0){
      h += '<div class="ipg-sb-selffund">'
         + '<div class="ipg-sb-stat"><div class="v">'+esc(money(self))+'</div>'
         + '<div class="l">Self-funding</div></div>'
         + '<div class="ipg-sb-meta">Money the candidate put into their own committee. '
         + 'Shown separately and not included in the Raised figure above.</div></div>';
    }

    // The ratified thinness state, carried as data by the artifact.
    if(fm.finance_state==='totals_only')
      h += '<div class="ipg-sb-note">'+esc(SF.thinness)+'</div>';

    // ---- B.2: the labeled, clickable industry bar. Still gated at the ratified >=50%
    // substantive share; what changed is what the bar CHARTS — industries, labeled and
    // clickable, rather than three coverage classes.
    var rows = scope.donors || [];
    var filter = state.finIndustry;
    if(scope.coverage && rows.length){
      var n = pct(scope.coverage.substantive_share);
      if(scope.coverage.meets_industry_threshold){
        var inds = industryTotals(rows);
        h += '<div class="ipg-sb-fin-sub">'+esc(SF.barHead)+'</div>'
           + '<div class="ipg-sb-meta">'+esc(SF.barSub)+'</div>'
           + dollarBar(inds, filter)
           + '<div class="ipg-sb-note">'+esc(SF.barDirectOnly)+'</div>'
           + '<div class="ipg-sb-note">'+esc(fill(SF.barDisclosure, n))+'</div>';
        // F11: the word `self-funding` is an industry TAG on a donor, and it is not the
        // is_self stream that has its own tile above. Rendered only when the tag is
        // actually present, so the page explains a distinction it is currently drawing.
        var hasSelfTag = inds.some(function(x){ return x.industry === 'self-funding'; });
        if(hasSelfTag) h += '<div class="ipg-sb-note">'+esc(SF.selfTagVsStream)+'</div>';
      } else {
        h += '<div class="ipg-sb-note">'+esc(fill(SF.belowThreshold, n))+'</div>';
      }
    }

    // ---- Industry filter, applied in place. No scroll, no navigation.
    var shownRows = rows;
    if(filter && filter !== 'All'){
      shownRows = rows.filter(function(d){
        var di = (d.industries && d.industries.length) ? d.industries : ['unclassified'];
        return di.indexOf(filter) >= 0;
      });
      h += '<div class="ipg-sb-filterbar">'
         + esc(fill(SF.filtered, indMeta(filter).label)) + ' &middot; '
         + esc(shownRows.length + (shownRows.length===1 ? ' donor' : ' donors'))
         + ' <button type="button" class="ipg-sb-more" id="ipg-sb-fin-clear">'
         + esc(SF.clearFilter)+'</button></div>';
    }

    // ---- Itemized donors — top 10 + toggle. Rows are clickable into the profile.
    if(rows.length){
      var all = shownRows, show = state.finShowAllDonors ? all.length : Math.min(10, all.length);
      h += '<div class="ipg-sb-fin-sub">Top donors</div>';
      if(!all.length){
        h += '<div class="ipg-sb-empty">'+esc(SF.filterEmpty)+'</div>';
      }
      for(var i=0;i<show;i++){
        var dn = all[i];
        var indLabels = (dn.industries||[]).map(function(x){ return indMeta(x).label; });
        h += '<button type="button" class="ipg-sb-donor ipg-sb-donor-click" data-donor="'+esc(dn.donor_id)+'">'
           + '<div><div class="n">'+esc(dn.name||dn.donor_id)+'</div>'
           + '<div class="s">'+esc(dn.count + (dn.count===1?' contribution':' contributions'))
           + (indLabels.length ? ' &middot; '+esc(indLabels.join(', ')) : '')
           + '</div></div><div class="a">'+esc(money(dn.amount))+'</div></button>';
      }
      if(all.length>10)
        h += '<button type="button" class="ipg-sb-more" id="ipg-sb-fin-more">'
           + (state.finShowAllDonors ? 'Show top 10 only' : 'Show all '+all.length+' donors')+'</button>';
    }

    // Un-itemized disclosure — the council's REPAIR-AGG-1 component, present and
    // DORMANT-CORRECT: PS-96 measured the un-keyed class absent from the elections
    // artifact, so this renders nothing at all rather than a $0 line ([E1.2]).
    if(fm.unitemized && Number(fm.unitemized.amount||0) > 0){
      h += '<div class="ipg-sb-donor"><div><div class="n">Small-dollar and un-itemized contributions</div>'
         + '<div class="s">Contributions reported to the state in aggregate, without individual donor '
         + 'identities. Counted in this member’s totals; not attributable to any listed donor.</div></div>'
         + '<div class="a">'+esc(money(fm.unitemized.amount))+'</div></div>';
    }
    h += '</div>';
    if(state.finDonor) h += donorProfileHtml(fm, scope);
    return h;
  }

  // ==========================================================
  // B.2 — Spend by member. The council's Spend-by-alder form, mirrored: three
  // streams, INDEPENDENT SCALES disclosed, sorted by direct, and the row's
  // right-hand amount is DIRECT ALONE. No expression in this function adds any
  // two streams together, and [SBF/NEVERSUM] asserts that structurally — the
  // check the council's own surface does not have.
  // Self-funding is deliberately absent here: it lives on the member page, and
  // mirror fidelity means this view carries exactly the council's three streams.
  // ==========================================================
  // SBFIN-2 C: the body only. Chrome (sub-tabs + election selector) moved to spendView,
  // and the row markup below is UNCHANGED — [SBF/NEVERSUM] walks these rows, and a check
  // that has to be taught a new path is a check that stopped proving the old one.
  function spendByMemberBody(ek){
    var rows = [];
    F.members.forEach(function(m){
      var e = (m.elections||{})[ek];
      if(!e) return;
      var direct = Number(e.direct.amount||0),
          sup    = Number(e.ie_support.amount||0),
          opp    = Number(e.ie_oppose.amount||0);
      if(!direct && !sup && !opp) return;
      rows.push({ seat:m.seat, name:m.name||m.display_name||m.seat,
                  direct:direct, sup:sup, opp:opp });
    });
    rows.sort(function(a,b){ return b.direct - a.direct; });   // by DIRECT alone

    var h = '';
    if(!rows.length) return '<div class="ipg-sb-empty">'+esc(SP.emptySurface)+'</div>';

    var anyIE = rows.some(function(r){ return r.sup || r.opp; });
    h += '<div class="ipg-sb-meta">' + SP.header + (anyIE ? SP.headerNeverSummed : '')
       + '<span class="ipg-sb-meta-sub">' + SP.headerSub + '</span></div>';
    if(anyIE){
      h += '<div class="ipg-sb-howto">'+SP.howToRead+'</div>';
      h += '<div class="ipg-sb-spend-key">'
         + '<span><i style="background:var(--teal)"></i>'+esc(SP.legDirect)+'</span>'
         + '<span><i style="background:#3f9d78"></i>'+esc(SP.legFor)+'</span>'
         + '<span><i style="background:#c0563a"></i>'+esc(SP.legAgainst)+'</span></div>';
    }

    // TWO independent scales, exactly as the council: direct against the top
    // direct, both IE streams against the top IE. Never a shared denominator.
    var maxDirect = Math.max.apply(null, [1].concat(rows.map(function(r){ return r.direct; })));
    var maxIE = Math.max.apply(null, [1].concat(rows.map(function(r){ return Math.max(r.sup,r.opp); })));
    function bar(lab, frac, color, amt){
      var w = Math.max(amt>0?2:0, Math.min(100, frac*100)).toFixed(2);
      return '<div class="ipg-sb-barline"><span class="lab">'+esc(lab)+'</span>'
           + '<span class="track"><span style="width:'+w+'%;background:'+color+'"></span></span>'
           + '<span class="amt">'+esc(money(amt))+'</span></div>';
    }
    rows.forEach(function(r){
      h += '<div class="ipg-sb-spend-row" data-spend-seat="'+esc(r.seat)+'">'
         + '<div class="ipg-sb-spend-main"><div class="n">Seat '+esc(r.seat)+' &middot; '+esc(r.name)+'</div>'
         + bar(SP.labDirect, r.direct/maxDirect, 'var(--teal)', r.direct)
         + ((r.sup||r.opp)
             ? ((r.sup ? bar(SP.labFor, r.sup/maxIE, '#3f9d78', r.sup) : '')
              + (r.opp ? bar(SP.labAgainst, r.opp/maxIE, '#c0563a', r.opp) : ''))
             : '<div class="ipg-sb-noie">'+esc(SP.emptyRowIE)+'</div>')
         + '</div>'
         // The row amount is DIRECT ALONE — never a combined figure.
         + '<div class="ipg-sb-spend-amt">'+esc(money(r.direct))+'</div></div>';
    });
    return h;
  }

  // ==========================================================
  // SBFIN-2 C — Political Spend. Four sub-tabs over ONE election scope.
  //
  // Every view below is a RENDER-TIME DERIVATION of donors_by_election. No artifact byte
  // was added for any of them (census R6 rows 1-4): the member pages already carry every
  // donor row, and these are re-groupings of the same rows.
  //
  // Spend by member is the LANDING sub-tab, deliberately: it is the surface that already
  // shipped, and [SBF/NEVERSUM] walks its rows. Keeping it where the check finds it means
  // the check keeps passing unadapted rather than being taught a new path.
  //
  // NOT built here, both ratified: Flag totals (banked — 4 SB donors carry a flag and the
  // flag vocabulary is broken, census F2), and the council's IE-PAC row kind in Browse
  // donors, whose headline is a fused support+oppose figure. Exit 1 declines that; IE
  // stays in Spend by member's three-stream form.
  // ==========================================================
  var SPEND_SUBS = [['members', 'Spend by member'], ['donors', 'Browse donors'],
                    ['industries', 'Industry totals'], ['mix', 'Industries by member']];

  // Board-wide election keys, most recent first.
  // SBFIN-3 B.4 — the label fix. `elections[].label` is a PER-MEMBER label: build_rollups
  // writes a returner's prior window as "2024: District N", the member's own prior race,
  // which is correct and ruled on a member page. Assigning it in a roster loop made the
  // BOARD-WIDE selector read whatever the last member happened to carry — "2024: District
  // 10". The election-wide label is now minted in the artifact from election-windows.json,
  // the file that defines the buckets, and cross-member views read only that.
  function spendElectionKeys(){
    var keys = {};
    ((F && F.members) || []).forEach(function(m){
      Object.keys(m.elections || {}).forEach(function(k){ keys[k] = 1; }); });
    var labels = {};
    Object.keys(keys).forEach(function(k){
      labels[k] = ((F && F.election_labels) || {})[k] || k; });
    return { keys: Object.keys(keys).sort().reverse(), labels: labels };
  }
  // Every donor row on the board, for one election. The single source all four views group.
  function spendDonorRows(ek){
    var out = [];
    var eks = spendElectionsFor(ek);
    ((F && F.members) || []).forEach(function(m){
      eks.forEach(function(k){
        ((m.donors_by_election || {})[k] || []).forEach(function(d){ out.push({ m: m, d: d }); });
      });
    });
    return out;
  }
  // Rollup-first, as the council's Browse donors is: a donor inside a family groups under
  // the family, so the list ranks households and affiliated PACs as one giver rather than
  // scattering them. Dollars are summed from THESE rows — the artifact carries no family
  // totals, deliberately (they would be elections-wide).
  function browseRows(ek){
    var by = {}, order = [];
    spendDonorRows(ek).forEach(function(x){
      var fam = x.d.cluster_id ? ((F.donor_clusters || {})[x.d.cluster_id]) : null;
      var key = x.d.cluster_id || ('d:' + x.d.donor_id);
      var e = by[key];
      if(!e){
        e = by[key] = { key: key, donor_id: x.d.donor_id, cluster_id: x.d.cluster_id || null,
                        name: fam ? (fam.name || x.d.name) : x.d.name,
                        type: x.d.type, industries: {}, amount: 0, count: 0,
                        entities: {}, members: {} };
        order.push(key);
      }
      e.amount = round2(e.amount + Number(x.d.amount || 0));
      e.count += Number(x.d.count || 0);
      e.entities[x.d.donor_id] = 1;
      e.members[x.m.seat] = 1;
      ((x.d.industries && x.d.industries.length) ? x.d.industries : ['unclassified'])
        .forEach(function(i){ e.industries[i] = 1; });
    });
    return order.map(function(k){
      var e = by[k];
      e.industryList = Object.keys(e.industries);
      e.entityCount = Object.keys(e.entities).length;
      e.memberCount = Object.keys(e.members).length;
      return e;
    }).sort(function(a, b){ return b.amount - a.amount || String(a.name||'').localeCompare(String(b.name||'')); });
  }
  // Board-wide industry totals. A donor with several tags counts in EACH, which is the
  // council's behaviour and is disclosed in the view's own sentence rather than hidden.
  // SBFIN-3 B.3 — three streams per industry. `direct` is attributed by the DONOR's tag;
  // `support`/`oppose` by the SPENDING COMMITTEE's tag. Two different classifiers in one
  // bar, which is why the view carries the two-classifier disclosure rather than leaving a
  // reader to assume one rule produced both.
  //
  // `amount` here is the fused deployment — carve (a), an ELECTION-WIDE aggregate, where
  // no candidate is in view. Nothing per-member is fused anywhere.
  function spendIndustryTotals(ek){
    var by = {}, order = [];
    function slot(i){
      if(!by[i]){ by[i] = { industry: i, amount: 0, direct: 0, support: 0, oppose: 0,
                            donors: {}, members: {} }; order.push(i); }
      return by[i];
    }
    spendDonorRows(ek).forEach(function(x){
      ((x.d.industries && x.d.industries.length) ? x.d.industries : ['unclassified'])
        .forEach(function(i){
          var e = slot(i);
          e.direct = round2(e.direct + Number(x.d.amount || 0));
          e.donors[x.d.donor_id] = 1;
          e.members[x.m.seat] = 1;
        });
    });
    ieSpenders(ek).forEach(function(sp){
      ((sp.industries && sp.industries.length) ? sp.industries : ['unclassified'])
        .forEach(function(i){
          var e = slot(i);
          e.support = round2(e.support + Number(sp.support.amount || 0));
          e.oppose = round2(e.oppose + Number(sp.oppose.amount || 0));
          (sp.targets || []).forEach(function(t){ e.members[t.seat] = 1; });
        });
    });
    return order.map(function(k){
      var e = by[k];
      e.amount = round2(e.direct + e.support + e.oppose);
      e.donorCount = Object.keys(e.donors).length;
      e.memberCount = Object.keys(e.members).length;
      return e;
    }).sort(function(a, b){ return b.amount - a.amount || a.industry.localeCompare(b.industry); });
  }

  // ==========================================================
  // SBFIN-3 B — independent expenditure enters the spend family.
  //
  // THE SCOPED [SBF/NEVERSUM] AMENDMENT, verbatim and in force:
  //
  //   Fusion of money streams is FORBIDDEN on any per-member or per-candidate surface,
  //   without exception. It is permitted in exactly two scopes: (a) election-wide
  //   aggregates and (b) a single spender's own spend. Where permitted, every part must
  //   be separately labeled and the fused label must name deployment ("total deployed"),
  //   never "independent". The per-member prohibition is asserted per member per election,
  //   by figure; the two carves are asserted to occur only on the surfaces that own them.
  //
  // The amendment TIGHTENS the per-member case and carves exactly two holes with a stated
  // rule. Any future request to widen it is a finding, not an edit.
  //
  // What went wrong before it (planner error 48): exit 1 was ratified about INDUSTRY
  // surfaces and applied to the whole spend family, so the two IE committees were excluded
  // from Browse donors — hiding $1,185,635.74, about a quarter of the 2024 money, from the
  // one view whose purpose is who spent the most.
  //
  // NO FUSED FIGURE IS STORED. The artifact carries support and oppose as separate keys;
  // every fused figure below is computed here, on a surface entitled to it.
  // ==========================================================
  // Per election, or merged across every election. Merging sums support and oppose WITHIN
  // their own streams — the two are never added here, only where a surface owns carve (b).
  // Targets merge per seat and their rows concatenate, so the detail view reads the same
  // whether one election is in scope or all of them.
  function ieSpenders(ek){
    var byE = (F && F.ie_spenders) || {};
    if(ek !== ALL_ELECTIONS) return byE[ek] || [];
    var by = {}, order = [];
    spendElectionsFor(ek).forEach(function(k){
      (byE[k] || []).forEach(function(sp){
        var e = by[sp.committee_id];
        if(!e){
          e = by[sp.committee_id] = { committee_id: sp.committee_id, name: sp.name,
                sbe_committee_id: sp.sbe_committee_id,
                industries: (sp.industries || []).slice(),
                support: { amount: 0, count: 0 }, oppose: { amount: 0, count: 0 },
                _t: {}, targets: [] };
          order.push(sp.committee_id);
        }
        ['support', 'oppose'].forEach(function(st){
          e[st].amount = round2(e[st].amount + Number(sp[st].amount || 0));
          e[st].count += Number(sp[st].count || 0);
        });
        (sp.targets || []).forEach(function(t){
          var g = e._t[t.seat];
          if(!g){
            g = e._t[t.seat] = { seat: t.seat, member_id: t.member_id, name: t.name,
                  candidacy_id: t.candidacy_id,
                  support: { amount: 0, count: 0 }, oppose: { amount: 0, count: 0 }, rows: [] };
          }
          ['support', 'oppose'].forEach(function(st){
            g[st].amount = round2(g[st].amount + Number(t[st].amount || 0));
            g[st].count += Number(t[st].count || 0);
          });
          g.rows = g.rows.concat(t.rows || []);
        });
      });
    });
    return order.map(function(id){
      var e = by[id];
      e.targets = Object.keys(e._t).map(function(k){ return e._t[k]; });
      e.targets.forEach(function(t){ t.rows.sort(function(a, b){
        return String(a.date || '').localeCompare(String(b.date || '')); }); });
      e.targets.sort(function(a, b){
        return -(a.support.amount + a.oppose.amount) + (b.support.amount + b.oppose.amount); });
      delete e._t;
      return e;
    }).sort(function(a, b){
      return (b.support.amount + b.oppose.amount) - (a.support.amount + a.oppose.amount); });
  }
  function ieDeployed(sp){            // carve (b): a single spender's own spend
    return round2(Number(sp.support.amount || 0) + Number(sp.oppose.amount || 0));
  }
  function ieSpenderById(ek, id){
    var l = ieSpenders(ek);
    for(var i = 0; i < l.length; i++) if(l[i].committee_id === id) return l[i];
    return null;
  }
  // Largest-remainder, the elections tool's ratified remedy (render.js:1131): money()
  // rounds each part independently, which can drift a dollar against round(total). The
  // displayed parts must sum to the displayed whole.
  function apportion(parts, total){
    var floors = parts.map(function(p){ return Math.floor(p.raw); });
    var left = Math.round(total) - floors.reduce(function(a, b){ return a + b; }, 0);
    parts.map(function(p, i){ return i; })
      .sort(function(a, b){ return (parts[b].raw - Math.floor(parts[b].raw))
                                 - (parts[a].raw - Math.floor(parts[a].raw)); })
      .slice(0, Math.max(0, left)).forEach(function(i){ floors[i] += 1; });
    return floors;
  }
  function fmtWhole(n){ return '$' + Number(n).toLocaleString('en-US'); }

  // ---- B.2 — the IE detail view, the school-board equivalent of the council's ----
  function ieDetailHtml(ek, ekLabel){
    var sp = ieSpenderById(ek, state.spendIE);
    if(!sp) return '';
    var chips = (sp.industries || []).map(function(i){
      var m = indMeta(i);
      return '<span class="ipg-sb-chip-ind" style="background:' + esc(m.color) + '">'
           + esc(m.label) + '</span>'; }).join('');
    var h = '<div class="ipg-sb-modal-overlay" id="ipg-sb-ie-overlay">'
      + '<div class="ipg-sb-modal" role="dialog" aria-modal="true" aria-label="' + esc(SPI.kicker) + '">'
      + '<button class="ipg-sb-modal-close" id="ipg-sb-ie-close" aria-label="Close">×</button>'
      + '<div class="ipg-sb-modal-head">'
      + '<div class="ipg-sb-modal-kicker">' + esc(SPI.kicker) + '</div>'
      + '<div class="ipg-sb-modal-name serif">' + esc(sp.name)
      + ' <span class="ipg-sb-pac-tag">' + esc(SPI.pacTag) + '</span></div>'
      + '<div class="ipg-sb-modal-meta">' + chips
      + ' <span class="ipg-sb-dscope">' + esc(ekLabel) + '</span></div></div>';
    h += '<div class="ipg-sb-note">' + esc(SPI.caution) + '</div>';
    // Carve (b). The fused figure is this spender's own deployment, every part labeled,
    // and the fused label names DEPLOYMENT, never "independent".
    h += '<div class="ipg-sb-stats">'
       + statTile(money(ieDeployed(sp)), SPI.deployedLabel)
       + statTile(money(sp.support.amount), SPI.supportLabel)
       + statTile(money(sp.oppose.amount), SPI.opposeLabel)
       + '</div>';
    h += '<div class="ipg-sb-fin-sub">' + esc(SPI.targetsHead) + '</div>';
    (sp.targets || []).forEach(function(t){
      var bits = [];
      if(Number(t.support.amount || 0) > 0)
        bits.push(esc(money(t.support.amount) + ' ' + SPI.forWord));
      if(Number(t.oppose.amount || 0) > 0)
        bits.push(esc(money(t.oppose.amount) + ' ' + SPI.againstWord));
      var n = (t.rows || []).length;
      bits.push(esc(n + (n === 1 ? ' expenditure' : ' expenditures')));
      // Per-member row: the amounts are the two streams SEPARATELY. No fused per-member
      // figure renders here — the prohibition has no carve on a per-member figure, and
      // this row is per-member even though the panel it sits in is per-spender.
      h += '<button type="button" class="ipg-sb-donor ipg-sb-donor-click" data-spend-seat="'
         + esc(t.seat) + '"><div><div class="n">Seat ' + esc(t.seat) + ' — ' + esc(t.name)
         + '</div><div class="s">' + bits.join(' &middot; ') + '</div></div>'
         + '<div class="a">' + esc(money(t.support.amount)) + ' / ' + esc(money(t.oppose.amount))
         + '</div></button>';
    });
    h += '<div class="ipg-sb-note">' + esc(SPI.targetsNote) + '</div>';
    h += '<div class="ipg-sb-modal-foot">' + esc(SF.profileFoot) + '</div>';
    return h + '</div></div>';
  }

  function spendChrome(ek, keys, labels){
    var h = '<div class="ipg-sb-card">';
    h += '<div class="ipg-sb-subtabs">' + SPEND_SUBS.map(function(p){
      return '<button type="button" class="ipg-sb-subtab'
           + (state.spendSub === p[0] ? ' active' : '') + '" data-spendsub="' + esc(p[0]) + '">'
           + esc(p[1]) + '</button>'; }).join('') + '</div>';
    h += '<div class="ipg-sb-row"><label for="ipg-sb-spend-el">Election</label><select id="ipg-sb-spend-el">';
    keys.forEach(function(k){
      var lab = (k === ALL_ELECTIONS) ? SF.allElections : labels[k];
      h += '<option value="' + esc(k) + '"' + (k === ek ? ' selected' : '') + '>'
         + esc(lab) + '</option>'; });
    h += '</select></div>';
    // The board-wide All-elections disclosure. NOT the member card's string, which is
    // written about one member's own runs and would be false here.
    if(ek === ALL_ELECTIONS) h += '<div class="ipg-sb-note">' + esc(SPC.allElectionsBoard) + '</div>';
    return h;
  }

  // ==========================================================
  // SBFIN-3 C — the all-elections LANDING scope, Political Spend only.
  //
  // Browse donors, Industry Totals and Industries by member open on All elections, so the
  // IE money is on screen rather than one selector away: all school-board IE is 2024-only
  // and the most-recent election is 2026, so a most-recent default showed none of it.
  //
  // SPEND BY MEMBER IS DELIBERATELY EXCLUDED. It keeps its most-recent default and is not
  // offered the All-elections option. The MEMBER PAGE is untouched entirely — SBFIN-2
  // ratification 4 stands, All elections is an option there and never its default.
  //
  // Everything below is derived at render from the per-election artifact. Nothing is
  // minted: direct sums exactly as the member card's existing derivation does, and IE
  // support and oppose sum across elections WITHIN their own streams — never with each
  // other, never with direct. The amendment's carves are unchanged in kind, only in
  // extent: a spender's row amount is still support+oppose (carve b) and Industry Totals'
  // headline is still `total deployed` (carve a), now over every election.
  // ==========================================================
  var SPEND_ALL_SUBS = { donors: 1, industries: 1, mix: 1 };

  function spendScopeOptions(sub){
    var el = spendElectionKeys();
    var keys = el.keys.slice();
    if(SPEND_ALL_SUBS[sub]) keys.unshift(ALL_ELECTIONS);
    return { keys: keys, labels: el.labels };
  }
  function spendScope(sub){
    var el = spendElectionKeys();
    if(SPEND_ALL_SUBS[sub]){
      if(state.spendElection === ALL_ELECTIONS) return ALL_ELECTIONS;
      if(state.spendElection && el.keys.indexOf(state.spendElection) >= 0) return state.spendElection;
      return ALL_ELECTIONS;                 // the landing scope
    }
    if(state.spendElection && el.keys.indexOf(state.spendElection) >= 0) return state.spendElection;
    return el.keys[0];                      // Spend by member: most recent, as before
  }
  // The concrete elections a scope covers. One key, or every key.
  function spendElectionsFor(ek){
    return ek === ALL_ELECTIONS ? spendElectionKeys().keys : [ek];
  }

  function spendView(ekIn){
    if(state.finStatus==='loading')
      return '<div class="ipg-sb-card"><div class="ipg-sb-empty">Loading campaign finance data&hellip;</div></div>';
    if(state.finStatus==='error')
      return '<div class="ipg-sb-card"><div class="ipg-sb-err">Could not load campaign finance data ('
        + esc(state.finError||'unknown error')+').</div></div>';
    if(!F || !F.members) return '<div class="ipg-sb-card"><div class="ipg-sb-empty">'+esc(SP.emptySurface)+'</div></div>';

    var sub = state.spendSub || 'members';
    var el = spendScopeOptions(sub);
    if(!el.keys.length) return '<div class="ipg-sb-card"><div class="ipg-sb-empty">'+esc(SP.emptySurface)+'</div></div>';
    // The scope is resolved ONCE, by render(), and passed in. Two call sites resolving it
    // independently is precisely what produced F-C1: they agreed until SBFIN-3 C changed one
    // of them. A caller that forgets to pass it still gets the right answer, but the body and
    // the modals can no longer disagree by construction.
    var ek = (ekIn != null) ? ekIn : spendScope(sub);
    var h = spendChrome(ek, el.keys, el.labels);
    if(state.spendSub === 'donors')          h += browseDonorsBody(ek);
    else if(state.spendSub === 'industries') h += (state.spendIndustryDetail
                                                   ? industryDetailBody(ek) : industryTotalsBody(ek));
    else if(state.spendSub === 'mix')        h += industriesByMemberBody(ek);
    else                                     h += spendByMemberBody(ek);
    return h + '</div>';
  }

  // ---- C.1 Browse donors -------------------------------------------------
  function browseDonorsBody(ek){
    var rows = browseRows(ek);
    var types = {}; rows.forEach(function(r){ if(r.type) types[r.type] = 1; });
    var inds = {}; rows.forEach(function(r){ r.industryList.forEach(function(i){ inds[i] = 1; }); });
    var h = '<div class="ipg-sb-meta">' + esc(SPC.browseIntro)
          + '<span class="ipg-sb-meta-sub">' + esc(SPC.browseSub) + '</span></div>'
          // The SBFIN-2 C direct-only sentence was REMOVED here: with IE spenders in the
          // list it is false. Its replacement says what the mixed list contains, so a
          // reader can tell a contribution from an independent expenditure at a glance.
          + '<div class="ipg-sb-note">' + esc(SPC.mixedListNote) + '</div>';

    h += '<div class="ipg-sb-filters">'
       + '<div class="ipg-sb-field grow"><label for="ipg-sb-bd-q">Search donors</label>'
       + '<input type="text" id="ipg-sb-bd-q" placeholder="' + esc(SPC.searchPlaceholder) + '" value="'
       + esc(state.spendSearch || '') + '" autocomplete="off"></div>'
       + '<div class="ipg-sb-field"><label for="ipg-sb-bd-type">Donor type</label>'
       + '<select id="ipg-sb-bd-type"><option value="All">All types</option>';
    Object.keys(types).sort().forEach(function(t){
      h += '<option value="' + esc(t) + '"' + (state.spendType === t ? ' selected' : '') + '>'
         + esc(t) + '</option>'; });
    h += '</select></div>'
       + '<div class="ipg-sb-field"><label for="ipg-sb-bd-ind">Industry</label>'
       + '<select id="ipg-sb-bd-ind"><option value="All">All industries</option>';
    Object.keys(inds).sort(function(a,b){ return indMeta(a).label.localeCompare(indMeta(b).label); })
      .forEach(function(i){
        h += '<option value="' + esc(i) + '"' + (state.spendIndustry === i ? ' selected' : '') + '>'
           + esc(indMeta(i).label) + '</option>'; });
    h += '</select></div></div>';
    // No Flag filter: Flag totals is banked, and a filter over a vocabulary the tool does
    // not carry would offer a control that cannot be honoured.

    // B.1 — IE spenders join the SAME ranked list as direct givers, so the reader sees who
    // spent most regardless of channel. The row amount is support + oppose: carve (b), a
    // single spender's own deployment. It is the ordering key AND the displayed figure,
    // mirroring the council (cfIESpenders sorts on total).
    ieSpenders(ek).forEach(function(sp){
      rows.push({ key: 'ie:' + sp.committee_id, ie: true, committee_id: sp.committee_id,
                  name: sp.name, type: 'PAC',
                  industryList: (sp.industries || []).slice(),
                  amount: ieDeployed(sp),
                  support: Number(sp.support.amount || 0), oppose: Number(sp.oppose.amount || 0),
                  count: (sp.targets || []).reduce(function(a, t){
                    return a + ((t.rows || []).length); }, 0),
                  entityCount: 1,
                  memberCount: (sp.targets || []).length });
    });
    rows.sort(function(a, b){ return b.amount - a.amount
      || String(a.name || '').localeCompare(String(b.name || '')); });

    var q = String(state.spendSearch || '').toLowerCase();
    var shown = rows.filter(function(r){
      if(q && String(r.name || '').toLowerCase().indexOf(q) < 0) return false;
      if(state.spendType && state.spendType !== 'All' && r.type !== state.spendType) return false;
      if(state.spendIndustry && state.spendIndustry !== 'All'
         && r.industryList.indexOf(state.spendIndustry) < 0) return false;
      return true;
    });
    var bits = [];
    if(state.spendType && state.spendType !== 'All') bits.push('type: ' + state.spendType);
    if(state.spendIndustry && state.spendIndustry !== 'All')
      bits.push('industry: ' + indMeta(state.spendIndustry).label);
    if(q) bits.push('search: ' + state.spendSearch);
    h += '<div class="ipg-sb-meta">' + esc(shown.length + (shown.length === 1 ? ' result' : ' results'))
       + esc(' matched.')
       + (bits.length ? ' ' + esc(fill(SPC.filteredBy, bits.join(' + ')))
          + ' <button type="button" class="ipg-sb-more" id="ipg-sb-bd-clear">'
          + esc(SPC.clearFilters) + '</button>' : '')
       + '<span class="ipg-sb-meta-sub">' + esc(SPC.browseRollupNote) + '</span></div>';
    if(!shown.length) return h + '<div class="ipg-sb-empty">' + esc(SPC.browseEmpty) + '</div>';

    var n = state.spendShowAll ? shown.length : Math.min(25, shown.length);
    for(var i = 0; i < n; i++){
      var r = shown[i];
      var sub = [];
      if(!r.ie){
        if(r.entityCount > 1) sub.push(r.entityCount + ' entities');
        sub.push(r.memberCount + (r.memberCount === 1 ? ' member' : ' members'));
        sub.push(r.count + (r.count === 1 ? ' contribution' : ' contributions'));
      }
      if(r.ie){
        // Split visible on the row itself AND on click (ratification 2). Both parts are
        // labeled; the fused figure is the row amount, which this surface owns.
        var ieSub = [];
        if(r.support > 0) ieSub.push(money(r.support) + ' ' + SPI.forWord);
        if(r.oppose > 0) ieSub.push(money(r.oppose) + ' ' + SPI.againstWord);
        ieSub.push(r.count + (r.count === 1 ? ' expenditure' : ' expenditures'));
        h += '<button type="button" class="ipg-sb-donor ipg-sb-donor-click ipg-sb-ie-row" data-ie="'
           + esc(r.committee_id) + '"><div><div class="n">' + esc(r.name)
           + ' <span class="ipg-sb-pac-tag">' + esc(SPI.pacTag) + '</span></div>'
           + '<div class="s">' + esc(ieSub.join(' · ')) + '</div></div>'
           + '<div class="a">' + esc(money(r.amount)) + '</div></button>';
      } else {
      h += '<button type="button" class="ipg-sb-donor ipg-sb-donor-click" data-donor="'
         + esc(r.donor_id) + '"><div><div class="n">' + esc(r.name || r.donor_id)
         + (r.entityCount > 1 ? ' <span class="ipg-sb-role">' + esc(SPC.rollupPill) + '</span>' : '')
         + '</div><div class="s">' + esc(sub.join(' · ')) + '</div></div>'
         + '<div class="a">' + esc(money(r.amount)) + '</div></button>';
      }
    }
    if(shown.length > 25)
      h += '<button type="button" class="ipg-sb-more" id="ipg-sb-bd-more">'
         + (state.spendShowAll ? 'Show top 25 only' : 'Show all ' + shown.length + ' results') + '</button>';
    return h;
  }

  // ---- C.2 Industry totals ----------------------------------------------
  function industryTotalsBody(ek){
    var inds = spendIndustryTotals(ek);
    var h = '<div class="ipg-sb-meta">' + esc(SPC.indIntro)
          + '<span class="ipg-sb-meta-sub">' + esc(SPC.indSub) + '</span></div>'
          // The SBFIN-2 C direct-only sentence was REPLACED here: this surface now carries
          // independent spending, so it was false. The two-classifier disclosure takes its
          // place and says something the old sentence never did.
          + '<div class="ipg-sb-note">' + esc(SPC.twoClassifier) + '</div>';
    if(!inds.length) return h + '<div class="ipg-sb-empty">' + esc(SPC.indEmpty) + '</div>';
    var grand = inds.reduce(function(s, x){ return s + Number(x.amount || 0); }, 0);
    h += '<div class="ipg-sb-fin-sub">' + esc(SPC.indBarHead) + '</div>'
       + '<div class="ipg-sb-meta">' + esc(fill(SPC.indBarSub, money(grand))) + '</div>'
       + '<div class="ipg-sb-bar-legend ipg-sb-streamkey">'
       + '<span><i style="background:var(--teal)"></i>' + esc(SPI.segDirect) + '</span>'
       + '<span><i style="background:#3f9d78"></i>' + esc(SPI.segSupport) + '</span>'
       + '<span><i style="background:#c0563a"></i>' + esc(SPI.segOppose) + '</span></div>'
       + dollarBar(inds, 'All')
       + '<div class="ipg-sb-fin-sub">' + esc(SPC.indListHead) + '</div>';
    inds.forEach(function(x){
      var meta = indMeta(x.industry);
      // Carve (a): election-wide, so the fused figure is permitted — and it is labeled
      // `total deployed`, never "independent". Every part is separately labeled below it,
      // and largest-remainder makes the displayed parts sum EXACTLY to the displayed total.
      var streams = [];
      if(x.direct > 0)  streams.push({ lab: SPI.segDirect,  cls: 'bd-d', raw: x.direct });
      if(x.support > 0) streams.push({ lab: SPI.segSupport, cls: 'bd-s', raw: x.support });
      if(x.oppose > 0)  streams.push({ lab: SPI.segOppose,  cls: 'bd-o', raw: x.oppose });
      var disp = apportion(streams, x.amount);
      var parts = streams.map(function(st, i){
        return '<span class="ipg-sb-bd ' + st.cls + '">' + esc(st.lab) + ' '
             + esc(fmtWhole(disp[i])) + '</span>'; });
      var segs = streams.map(function(st, i){
        var w = x.amount > 0 ? (st.raw / x.amount * 100) : 0;
        return '<span class="ipg-sb-bar-seg static" style="flex:' + w + ' 0 0;background:'
             + (st.cls === 'bd-d' ? 'var(--teal)' : st.cls === 'bd-s' ? '#3f9d78' : '#c0563a')
             + '"></span>'; }).join('');
      h += '<button type="button" class="ipg-sb-indrow ipg-sb-donor-click" data-industry-drill="'
         + esc(x.industry) + '">'
         + '<div class="ipg-sb-indrow-top"><span class="n">' + esc(meta.label) + '</span>'
         + '<span class="a">' + esc(money(x.amount)) + ' <span class="lab">'
         + esc(SPI.deployedLabel) + '</span></span></div>'
         + '<div class="ipg-sb-dollarbar mini">' + segs + '</div>'
         + '<div class="ipg-sb-indrow-parts">' + parts.join(' <span class="sep">·</span> ')
         + '</div></button>';
    });
    return h;
  }

  function industryDetailBody(ek){
    var key = state.spendIndustryDetail, meta = indMeta(key);
    var rows = spendDonorRows(ek).filter(function(x){
      return ((x.d.industries && x.d.industries.length) ? x.d.industries : ['unclassified'])
             .indexOf(key) >= 0; });
    var h = '<div class="ipg-sb-fin-sub">' + esc(meta.label)
          + ' <button type="button" class="ipg-sb-more" id="ipg-sb-ind-back">'
          + esc(SPC.indBack) + '</button></div>'
          + '<div class="ipg-sb-note">' + esc(SPC.directOnlyIndustries) + '</div>';
    if(!rows.length) return h + '<div class="ipg-sb-empty">' + esc(SPC.indEmpty) + '</div>';

    var byDonor = {}, dorder = [], byMember = {}, morder = [];
    rows.forEach(function(x){
      if(!byDonor[x.d.donor_id]){
        byDonor[x.d.donor_id] = { name: x.d.name, donor_id: x.d.donor_id, amount: 0, count: 0 };
        dorder.push(x.d.donor_id); }
      byDonor[x.d.donor_id].amount = round2(byDonor[x.d.donor_id].amount + Number(x.d.amount || 0));
      byDonor[x.d.donor_id].count += Number(x.d.count || 0);
      if(!byMember[x.m.seat]){
        byMember[x.m.seat] = { seat: x.m.seat, name: x.m.name, amount: 0 };
        morder.push(x.m.seat); }
      byMember[x.m.seat].amount = round2(byMember[x.m.seat].amount + Number(x.d.amount || 0));
    });
    h += '<div class="ipg-sb-fin-sub">' + esc(SPC.indDonorsHead) + '</div>';
    dorder.map(function(k){ return byDonor[k]; })
      .sort(function(a, b){ return b.amount - a.amount; })
      .forEach(function(d){
        h += '<button type="button" class="ipg-sb-donor ipg-sb-donor-click" data-donor="'
           + esc(d.donor_id) + '"><div><div class="n">' + esc(d.name || d.donor_id) + '</div>'
           + '<div class="s">' + esc(d.count + (d.count === 1 ? ' contribution' : ' contributions'))
           + '</div></div><div class="a">' + esc(money(d.amount)) + '</div></button>';
      });
    h += '<div class="ipg-sb-fin-sub">' + esc(SPC.indMembersHead) + '</div>';
    morder.map(function(k){ return byMember[k]; })
      .sort(function(a, b){ return b.amount - a.amount; })
      .forEach(function(m){
        h += '<button type="button" class="ipg-sb-donor ipg-sb-donor-click" data-spend-seat="'
           + esc(m.seat) + '"><div><div class="n">Seat ' + esc(m.seat) + ' — ' + esc(m.name)
           + '</div></div><div class="a">' + esc(money(m.amount)) + '</div></button>';
      });
    return h;
  }

  // ---- C.3 Industries by member -----------------------------------------
  function industriesByMemberBody(ek){
    // Exit 1's sentence is the FIRST thing this view says, as the council's does.
    var h = '<div class="ipg-sb-meta">' + esc(SPC.mixIntro)
          + '<span class="ipg-sb-meta-sub">' + esc(SPC.mixSub) + '</span></div>';
    var any = false, body = '';
    // Roster order, which is the board's own seat order — never a string sort, which
    // would put seat 10A before seat 2A.
    ((F && F.members) || []).forEach(function(m){
      var rows;
      if(ek === ALL_ELECTIONS){
        // Same derivation the member card uses for its own All-elections view: one row per
        // donor, amounts summed. A donor who gave in two elections is one donor.
        var sub = {};
        spendElectionsFor(ek).forEach(function(k){
          if((m.donors_by_election || {})[k]) sub[k] = m.donors_by_election[k]; });
        rows = mergeDonorRows(sub);
      } else {
        rows = (m.donors_by_election || {})[ek] || [];
      }
      if(!rows.length) return;
      var inds = industryTotals(rows);
      var tot = inds.reduce(function(s, x){ return s + Number(x.amount || 0); }, 0);
      if(tot <= 0) return;
      any = true;
      var cm = (m.committees || [])[0];
      var badge = (cm && cm.data_quality === 'REAL')
        ? '<span class="ipg-sb-verified-pill">' + esc(SPC.verifiedPill) + '</span>' : '';
      body += '<div class="ipg-sb-mixrow">'
            + '<button type="button" class="ipg-sb-mixhead" data-spend-seat="' + esc(m.seat) + '">'
            + '<span class="n"><strong>Seat ' + esc(m.seat) + '</strong> — ' + esc(m.name) + ' ' + badge + '</span>'
            + '<span class="a">' + esc(money(tot)) + '</span></button>'
            + dollarBarStatic(inds) + '</div>';
    });
    if(!any) return h + '<div class="ipg-sb-empty">' + esc(SPC.mixEmpty) + '</div>';
    return h + body;
  }
  // A STATIC bar: no data-industry, so nothing here is clickable into a filter that would
  // belong to a different member's page. The row itself navigates; the segments do not.
  function dollarBarStatic(inds){
    var grand = inds.reduce(function(s, x){ return s + Number(x.amount || 0); }, 0);
    if(grand <= 0) return '';
    var h = '<div class="ipg-sb-dollarbar">';
    inds.forEach(function(x){
      var meta = indMeta(x.industry);
      var p = (x.amount / grand) * 100;
      if(p < 0.3) return;
      var pstr = p >= 10 ? Math.round(p) + '%' : p.toFixed(1) + '%';
      h += '<span class="ipg-sb-bar-seg static" style="flex:' + p + ' 0 0;background:'
         + esc(meta.color) + '" title="' + esc(meta.label + ' — ' + money(x.amount) + ' (' + pstr + ')') + '">'
         + (p >= 12 ? '<span class="l">' + esc(meta.label) + '</span>' : '') + '</span>';
    });
    return h + '</div>';
  }


  // Complete record — CARD-PER-VOTE for the selected seat, the council's
  // .rec-vote idiom (SBVOTE-2 B.3). Not a matrix; the all-seats grid is its
  // own view, exactly as the council splits them.
  function recordView(){
    if(!voteCount()) return emptyToolCard();
    if(state.seat==null) state.seat = (members()[0]||(D.members||[])[0]).seat;
    var row = seatRow(state.seat);
    var h = seatSelector();
    if(row && !isMember(row)){
      return h + '<div class="ipg-sb-card"><div class="ipg-sb-empty">'
        + esc(S.vacant)+' — this seat has no member, so it has no voting record.</div></div>';
    }
    var meta = metaByVoteId(), tags = allTags();
    h += '<div class="ipg-sb-card">'
       + '<div class="ipg-sb-row"><label for="ipg-sb-rec-q">Search</label>'
       + '<input id="ipg-sb-rec-q" type="search" placeholder="Title or description" value="'+esc(state.recQuery)+'"/></div>';
    if(tags.length){
      h += '<div class="ipg-sb-chips">';
      ['All'].concat(tags).forEach(function(t){
        h += '<button type="button" class="ipg-sb-chip" data-rectag="'+esc(t)+'" aria-pressed="'+(state.recTag===t)+'">'+esc(t)+'</button>';
      });
      h += '</div>';
    }
    var q = state.recQuery.trim().toLowerCase();
    var rows = votesSorted().filter(function(v){
      var vm = meta[v.id]||{};
      if(state.recTag!=='All' && voteTags(vm).indexOf(state.recTag)<0) return false;
      if(!q) return true;
      return (String(v.title||'')+' '+String(vm.desc||'')).toLowerCase().indexOf(q)>=0;
    });
    // One row renderer, so the markers and the attribution cannot be applied to
    // the key-votes section and forgotten in the grouped list below it.
    function recRow(v){
      var vm = meta[v.id]||{}, tag = vm.tag||v.tag;
      var p = (v.positions && v.positions[String(state.seat)]);
      var cbName = castByFor(v.id, state.seat);
      return '<div class="ipg-sb-rec-vote"><div>'
         + '<div class="ipg-sb-rec-meta">'+(v.date?esc(v.date):'')
         + (tag?'<span class="ipg-sb-rec-tag">'+esc(tag)+'</span>':'')
         + featuredMark(vm)+'</div>'
         + '<div class="ipg-sb-rec-title">'+esc(v.title||vm.full||v.id)+'</div>'
         + castByNote(cbName)+'</div>'
         + '<div class="ipg-sb-rec-right">'
         + recPosAt(state.seat, p==null||p===''?NOT_RECORDED:p)+castByMark(cbName)+'</div>'
         + '</div>';
    }

    // PS-123's key-votes surface, in the SHOW-EMPTY form ratified at G4: the
    // heading and an empty state render even when nothing is flagged, so the
    // feature is never invisible. Sits above the full record.
    var featIds = {};
    featuredVotes().forEach(function(vm){ if(vm.vote_id) featIds[vm.vote_id]=1; });
    var featRows = rows.filter(function(v){ return featIds[v.id]; });
    h += '<div class="ipg-sb-keyvotes"><h4>'+esc(SPF.keyVotesHeading)+'</h4>';
    if(!featRows.length){
      h += '<div class="ipg-sb-empty">'+esc(SPF.keyVotesEmpty)+'</div>';
    } else {
      h += '<div class="ipg-sb-rec">';
      featRows.forEach(function(v){ h += recRow(v); });
      h += '</div>';
    }
    h += '</div>';

    if(!rows.length) return h + '<div class="ipg-sb-empty">No votes match these filters.</div></div>';
    // PS-124: grouped by outcome in the ratified order, date-descending WITHIN
    // each group (`rows` is already date-descending and grouping is stable), the
    // header carrying the outcome name verbatim.
    groupByOutcome(rows).forEach(function(g){
      h += '<h4 class="ipg-sb-outcome-head">'+esc(g.outcome)+'</h4>'
         + '<div class="ipg-sb-rec">';
      g.votes.forEach(function(v){ h += recRow(v); });
      h += '</div>';
    });
    return h + '</div>';
  }

  // All-seats matrix — the council's compare-by-issue idiom WITH its legend.
  function matrixView(){
    if(!voteCount()) return emptyToolCard();
    // PS-124 leaves matrix ORDERING untouched; PS-125 governs PRESENCE, so the
    // all-blank President seat is omitted here too (ratified 2026-08-16).
    var roster = visibleRoster(), votes = votesSorted();
    var h = '<div class="ipg-sb-card">';
    h += '<div class="ipg-sb-mx-legend"><strong>Key:</strong>';
    ['Affirmative','Oppositional','Neutral','-'].forEach(function(k){
      var d = display(k);
      h += '<span class="mx-key '+d.mx+'">'+esc(d.label)+'</span>';
    });
    h += '</div>';
    h += '<div class="ipg-sb-matrix-wrap"><table class="ipg-sb-matrix"><thead><tr>'
       + '<th class="seat-col">Seat</th>';
    var mxMeta = metaByVoteId();
    votes.forEach(function(v){
      h += '<th>'+esc(v.title||v.id)+featuredMark(mxMeta[v.id])+'</th>'; });
    h += '</tr></thead><tbody>';
    roster.forEach(function(m){
      h += '<tr'+(isMember(m)?'':' class="vacant-row"')+'>'
         + '<td class="seat-col">'+esc(m.seat)+' — '+esc(memberLabel(m))+'</td>';
      votes.forEach(function(v){
        var p = (v.positions && v.positions[String(m.seat)]);
        var d = displayAt(m.seat, p==null||p===''?NOT_RECORDED:p);
        var cbName = castByFor(v.id, m.seat);
        h += '<td class="'+d.mx+'">'+esc(d.label)+castByMark(cbName)+'</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div></div>';
  }

  // ==========================================================
  // SBV-BOARD-1 — THE BOARD. PS-127 (i) and (v); D-R2c and D-R2d.
  //
  // (i)  Every roster row, always — via fullRoster(), the ruling's sole
  //      exception to the PS-125 filter. This is that function's only caller.
  // (v)  NO per-seat vote or position counts render here, deliberately: seat
  //      10B is the vacancy and its position column holds its PREDECESSOR's
  //      votes, which PS-121's cast-by attribution explains on the surfaces
  //      that show them. A count on a roster row would carry the number with
  //      none of that attribution, so the roster's job is people and
  //      click-through and nothing arithmetic.
  // D-R2c  name, seat code, the appointed designation, term start where
  //      present — the same facts the member page renders today, no more. The
  //      appointed/elected designation is rendered as the member page renders
  //      it: appointed carries the badge, elected carries none, which is
  //      ratified string 2's rule (the exception is what gets labeled).
  // D-R2d  the President's row carries `Board President` in the seat slot.
  // ==========================================================
  function boardView(){
    var roster = fullRoster();
    if(!roster.length)
      return '<div class="ipg-sb-card"><div class="ipg-sb-empty">No roster is available yet.</div></div>';
    var h = '<div class="ipg-sb-card">';
    roster.forEach(function(m){
      var slot = (m.seat === PRESIDENT_SEAT)
        ? SBD.presidentDesignation
        : ('Seat ' + m.seat);
      h += '<div class="ipg-sb-roster-row" data-board-seat="'+esc(m.seat)+'">'
         + '<div class="ipg-sb-roster-seat">'+esc(slot)+'</div>'
         + '<div class="ipg-sb-roster-main">'
         + '<div class="ipg-sb-roster-name">'+esc(memberLabel(m))
         + (isMember(m) && m.seat_type==='appointed'
              ? '<span class="ipg-sb-badge">'+esc(S.appointed)+'</span>' : '')
         + '</div>'
         + (isMember(m) && m.term_start
              ? '<div class="ipg-sb-meta">Term began '+esc(m.term_start)+'</div>' : '')
         + '</div></div>';
    });
    return h + '</div>';
  }

  function methodologyView(){
    var h = '<div class="ipg-sb-card ipg-sb-meth">';
    h += '<h3>How this tool works</h3>';
    // ---- string 4, verbatim ----
    h += '<p>'+esc(S.methodology)+'</p>';
    h += '<h3>How to read a position</h3><ul>';
    Object.keys(POSITION_DISPLAY).forEach(function(k){
      var d = POSITION_DISPLAY[k];
      h += '<li>'+pill(k)+' &mdash; '
         + (d.recorded ? 'a position recorded in the source record.'
                       : 'no position has been recorded for this member on this vote &mdash; '
                         + 'distinct from '+pill('Neutral')+', which is an entered position.')
         + '</li>';
    });
    h += '</ul>';
    // ---- PS-125's methodology sentence, verbatim ----
    h += '<p>'+esc(SV.notRecorded)+'</p>';
    // ---- R6's president sentence, verbatim ----
    h += '<h3>The Board President</h3>';
    h += '<p>'+esc(SV.president)+'</p>';
    // ---- PS-123's two key-votes strings, verbatim ----
    h += '<h3>'+esc(SPF.keyVotesHeading)+'</h3>';
    h += '<p>'+esc(SV.keyVotes1)+'</p>';
    h += '<p>'+esc(SV.keyVotes2)+'</p>';
    h += '<h3>Seats and members</h3>';
    h += '<p>Appointed members are labelled; elected members are not, because election is the '
       + 'default this tool exists to track. A seat with no member is shown as '
       + esc(S.vacant)+' and has no member page.</p>';

    h += '<p>We rely on readers to help us keep this accurate.<br>'
       + '<button type="button" class="ipg-sb-fb-btn">'+esc(FB.trigger)+'</button></p>';
