<!-- ===================================================================
  INSTITUTE FOR THE PUBLIC GOOD — Chicago Board of Education Voting Tool
  Paste this whole block into a Squarespace Code Block (Edit → add block →
  Code), or Settings → Advanced → Code Injection for a full-page version.
  Self-contained. Loads Poppins from Google Fonts; display face is Georgia.

  SBVOTE-1 built this tool; SBVOTE-2 restyled it to read as the council
  voting tool's sibling. What it SAYS is unchanged — the ratified strings,
  the position map, the vacancy behaviour and the single-fetch/zero-coupling
  properties are all SBVOTE-1's and were not reopened.

  ===================================================================
  WHAT THIS EMBED IS, AND WHAT IT IS NOT
  -------------------------------------------------------------------
  It mirrors the council voting tool's VOTES-FAMILY structure only: the
  member view, the complete-record browser, the all-seats matrix, and the
  methodology shell. The council tool's ward routing, committee blocks, bio
  grid, finance half and vote-correlation card are deliberately absent —
  the board has seats rather than wards, the roster carries none of those
  fields, and campaign finance is out of scope at launch (V4).

  ZERO COUPLING. This embed reads exactly ONE file — the school-board
  artifact — and shares no component, no data source and no state with
  either finance embed. The visual language is shared; the code is not.

  DISPLAY FACE is Georgia. The council tool carried a Recoleta @font-face
  whose source 404s — measured at SBVOTE-2 G1, 2026-08-08 — so Georgia was
  always what rendered. Ishan ratified Georgia as the intended face and the
  dead declaration was removed from both tools.

  ===================================================================
  THE POSITION VOCABULARY, AND THE ONE PLACE IT IS TRANSLATED
  -------------------------------------------------------------------
  The artifact stores the SEMANTIC set exactly as an editor entered it:
  Affirmative / Oppositional / Neutral, plus "-" for a blank cell. No
  translation exists anywhere upstream — not in the ingest, not in the
  artifact (ratified D-1; the ingest's own self-test asserts the absence
  of a display map). POSITION_DISPLAY below is the render boundary and
  the ONLY place the mapping exists, for every view.

  "-" IS NOT A POSITION. It means no position has been recorded. It is
  rendered as "Not recorded", visually and textually distinct from
  "Neutral", which IS an entered position. Collapsing the two would
  assert a position nobody recorded.

  CAUTION, because the same character means something else next door:
  in the COUNCIL artifact "-" is minted for absent/excused — a factual
  claim about attendance. Here it is minted for a blank cell — an
  absence of record. The two are not interchangeable and this map must
  never be reused for the council tool.
  =================================================================== -->

<script>
(function(){
  var app = document.getElementById('ipg-sb-app');
  var D = null;
  var state = { view:'member', seat:null, tag:'All', recQuery:'', recTag:'All',
                status:'loading', error:null };

  // ==========================================================
  // THE RENDER BOUNDARY — D-1's four-value map, declared as data.
  // Four pairs, visible in one place, serving EVERY view.
  // ==========================================================
  var POSITION_DISPLAY = {
    'Affirmative':  { label:'Yes',          cls:'pill-aff',      rec:'aff',      mx:'mx-aff', recorded:true  },
    'Oppositional': { label:'No',           cls:'pill-opp',      rec:'opp',      mx:'mx-opp', recorded:true  },
    'Neutral':      { label:'Present',      cls:'pill-neu',      rec:'neu',      mx:'mx-neu', recorded:true  },
    '-':            { label:'Not recorded', cls:'pill-norecord', rec:'norecord', mx:'mx-na',  recorded:false }
  };
  var NOT_RECORDED = '-';

  // ==========================================================
  // THE RATIFIED STRINGS — register entry `SBVOTE-1 G1+G3 — display
  // strings 1–5`, verbatim. Editorial text; do not reword in code.
  // ==========================================================
  var S = {
    emptyTool: 'Voting records for the Chicago Board of Education begin with the board seated in January 2025. Votes will appear here as they are recorded.',
    appointed: 'Appointed',
    noVotesForMember: 'No recorded votes yet for this member.',
    methodology: 'Vote positions are entered from public Board of Education records and meeting minutes; each vote links to its source.',
    vacant: 'Vacant'
  };

  // Feedback copy — the council's set transcribed verbatim (SBVOTE-2 G1 census),
  // with exactly three ratified deltas: the subject prefix (in IPG_SB_FEEDBACK),
  // the placeholder, and the context disclosure.
  var FB = {
    fab: 'Feedback',
    trigger: 'Report a correction or bug',
    kicker: 'Help us keep this accurate',
    title: 'Report a correction or bug',
    intro: 'Tell us what looks wrong or what we’re missing — the more specific, the faster we can fix it.',
    contextLabel: 'What you’re viewing:',
    disclosure: "Sending this report includes what you’re viewing — the seat, member, and vote on screen — so we can find the issue faster.",
    typeLabel: 'Type',
    types: ['Data correction','Missing data / addition','Bug or display issue','General comment'],
    commentLabel: 'What’s wrong / what to add',
    required: '(required)',
    optional: '(optional)',
    placeholder: "e.g. Seat 3B’s vote on the budget is shown as Yes, but the Board minutes show No.",
    linkLabel: 'Source / link with the correct info',
    shots: 'Have a screenshot? After sending this, email it to ',
    shotsTail: ' and mention what you reported — we’ll match it to this report.',
    nameLabel: 'Your name',
    emailLabel: 'Your email',
    emailHint: '(optional — only if you’d like a reply)',
    submit: 'Send to IPG',
    needComment: 'Please add a short description first.',
    sending: 'Sending…',
    thanks: 'Thank you — your report reached the IPG team. We review every submission. Have a screenshot? Email it to ',
    failed: 'Couldn’t send just now — ',
    failedLink: 'email it instead',
    mailtoDone: 'Your email app should have opened with the details filled in. (No mail app? Email '
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function display(v){
    var d = POSITION_DISPLAY[v];
    // An unmapped value is a defect, not a fifth state: show it rather than
    // silently bucketing it (the council tool's posKey folds unknowns into
    // "absent", which is exactly how a mis-mapped value hides).
    if(!d) return { label:'Unrecognised value: '+String(v), cls:'pill-norecord',
                    rec:'norecord', mx:'mx-na', recorded:false };
    return d;
  }
  function pill(v){ var d=display(v); return '<span class="ipg-sb-pill '+d.cls+'">'+esc(d.label)+'</span>'; }
  function recPos(v){ var d=display(v); return '<span class="ipg-sb-rec-pos '+d.rec+'">'+esc(d.label)+'</span>'; }

  // ---- roster helpers -------------------------------------------------
  // A row describes a MEMBER iff `name` is non-blank — the same predicate the
  // artifact's own validation uses (D-2 as amended). Vacancy semantics are not
  // re-derived here.
  function isMember(m){ return !!String(m && m.name || '').trim(); }
  function members(){ return (D && D.members || []).filter(isMember); }
  function seatRow(seat){ return (D && D.members || []).filter(function(m){ return m.seat===seat; })[0] || null; }
  function memberLabel(m){ return isMember(m) ? m.name : S.vacant; }

  function voteTags(v){
    if(!v) return [];
    var t = (v.tags!=null ? v.tags : v.tag);
    if(Array.isArray(t)) return t.map(function(s){return String(s).trim();}).filter(Boolean);
    return String(t||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
  }
  function allTags(){
    var s = {};
    (D && D.votemeta || []).forEach(function(vm){ voteTags(vm).forEach(function(t){ s[t]=1; }); });
    return Object.keys(s).sort();
  }
  function rollcallById(id){
    if(!D || !id) return null;
    var list = ((D.rollcall||{}).votes)||[];
    for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
    return null;
  }
  // The join, seat-keyed. The referential key is the SEAT, not the member id —
  // a real seat can have no member (D-4), and a position column exists for it.
  function seatPosition(vm, seat){
    var rc = rollcallById(vm && vm.vote_id);
    if(!rc || !rc.positions) return NOT_RECORDED;
    var p = rc.positions[String(seat)];
    return (p==null || p==='') ? NOT_RECORDED : p;
  }
  function hasAnyRecordedPosition(seat){
    return (D && D.votemeta || []).some(function(vm){
      return display(seatPosition(vm, seat)).recorded; });
  }
  function voteCount(){ return ((D && D.rollcall || {}).votes || []).length; }
  function votesSorted(){
    return (((D&&D.rollcall||{}).votes)||[]).slice().sort(function(a,b){
      return String(b.date||'').localeCompare(String(a.date||'')); });
  }
  function metaByVoteId(){
    var m={}; (D&&D.votemeta||[]).forEach(function(vm){ if(vm.vote_id) m[vm.vote_id]=vm; }); return m;
  }

  // ---- chrome ---------------------------------------------------------
  var TABS = [['member','By member'],['record','Complete record'],
              ['matrix','All seats'],['methodology','Methodology']];

  function head(){
    return '<div class="ipg-sb-head">'
      + '<h1 class="ipg-sb-title serif">How is your Chicago Board of Education member voting?</h1>'
      + '<p class="ipg-sb-sub">Recorded votes of the seated Board, by member and by seat.</p></div>'
      + '<div class="ipg-sb-tabs">' + TABS.map(function(p){
          return '<button type="button" class="ipg-sb-tab'+(state.view===p[0]?' active':'')
               + '" data-view="'+p[0]+'">'+p[1]+'</button>'; }).join('') + '</div>';
  }

  // Empty state at the whole-tool grain — string 1. This is the BORN STATE:
  // a roster with zero votes renders this, never an error and never a blank.
  function emptyToolCard(){
    return '<div class="ipg-sb-card"><div class="ipg-sb-empty">'+esc(S.emptyTool)+'</div></div>';
  }
  function seatSelector(){
    var h = '<div class="ipg-sb-card"><div class="ipg-sb-row"><label for="ipg-sb-seat-sel">Seat</label>'
          + '<select id="ipg-sb-seat-sel">';
    (D.members||[]).forEach(function(m){
      // The vacancy APPEARS in the selector — the seat is a real fact about
      // the board — and selecting it reaches a seat notice, not a member page.
      h += '<option value="'+esc(m.seat)+'"'+(m.seat===state.seat?' selected':'')+'>'
         + esc(m.seat)+' — '+esc(memberLabel(m))+'</option>';
    });
    return h + '</select></div></div>';
  }

  function memberView(){
    var roster = (D.members||[]);
    if(!roster.length) return '<div class="ipg-sb-card"><div class="ipg-sb-empty">No roster is available yet.</div></div>';
    if(state.seat==null) state.seat = (members()[0]||roster[0]).seat;
    var row = seatRow(state.seat);
    var h = seatSelector();
    if(!row) return h + '<div class="ipg-sb-card"><div class="ipg-sb-empty">That seat is not in the roster.</div></div>';

    // ---- string 5: the vacancy renders as a SEAT, with NO member page ----
    if(!isMember(row)){
      return h + '<div class="ipg-sb-card">'
        + '<div class="ipg-sb-seat">Seat '+esc(row.seat)+'</div>'
        + '<div class="ipg-sb-name serif">'+esc(S.vacant)+'</div>'
        + '<div class="ipg-sb-meta">This seat is currently vacant. There is no member page for a seat with no member.</div>'
        + '</div>';
    }

    h += '<div class="ipg-sb-card">'
       + '<div class="ipg-sb-seat">Seat '+esc(row.seat)+'</div>'
       // ---- string 2: the badge marks the EXCEPTION; elected carry none ----
       + '<div class="ipg-sb-name serif">'+esc(row.name)
       + (row.seat_type==='appointed' ? '<span class="ipg-sb-badge">'+esc(S.appointed)+'</span>' : '')
       + '</div>';
    var meta = [];
    if(row.term_start) meta.push('Term began '+esc(row.term_start));
    if(row.source_url) meta.push('<a href="'+esc(row.source_url)+'" target="_blank" rel="noopener">Source</a>');
    if(meta.length) h += '<div class="ipg-sb-meta">'+meta.join(' &middot; ')+'</div>';
    h += '</div>';

    if(!voteCount()) return h + emptyToolCard();
    // string 3 — roster present, no recorded position on anything
    if(!hasAnyRecordedPosition(row.seat))
      return h + '<div class="ipg-sb-card"><div class="ipg-sb-empty">'+esc(S.noVotesForMember)+'</div></div>';

    var tags = allTags();
    h += '<div class="ipg-sb-card">';
    if(tags.length){
      h += '<div class="ipg-sb-chips">';
      ['All'].concat(tags).forEach(function(t){
        h += '<button type="button" class="ipg-sb-chip" data-tag="'+esc(t)+'" aria-pressed="'+(state.tag===t)+'">'+esc(t)+'</button>';
      });
      h += '</div>';
    }
    var shown = (D.votemeta||[]).filter(function(vm){
      return state.tag==='All' || voteTags(vm).indexOf(state.tag)>=0; });
    if(!shown.length){
      h += '<div class="ipg-sb-empty">No votes carry the tag &ldquo;'+esc(state.tag)+'&rdquo;.</div>';
    } else {
      shown.forEach(function(vm){
        h += '<div class="ipg-sb-vote">'
           + '<h4>'+esc(vm.full || vm.code)+' '+pill(seatPosition(vm, row.seat))+'</h4>'
           + (vm.date ? '<div class="ipg-sb-when">'+esc(vm.date)+'</div>' : '')
           + (vm.desc ? '<p>'+esc(vm.desc)+'</p>' : '')
           + (vm.source_url ? '<div class="ipg-sb-when"><a href="'+esc(vm.source_url)+'" target="_blank" rel="noopener">Source</a></div>' : '')
           + '</div>';
      });
    }
    return h + '</div>';
  }

  // Complete record — CARD-PER-VOTE for the selected seat, the council's
  // .rec-vote idiom (SBVOTE-2 B.3). Not a matrix; the all-seats grid is its
  // own view, exactly as the council splits them.
  function recordView(){
    if(!voteCount()) return emptyToolCard();
    if(state.seat==null) state.seat = (members()[0]||(D.members||[])[0]).seat;
    var row = seatRow(state.seat);
    var h = seatSelector();
    if(row && !isMember(row)){
      return h + '<div class="ipg-sb-card"><div class="ipg-sb-empty">'
        + esc(S.vacant)+' — this seat has no member, so it has no voting record.</div></div>';
    }
    var meta = metaByVoteId(), tags = allTags();
    h += '<div class="ipg-sb-card">'
       + '<div class="ipg-sb-row"><label for="ipg-sb-rec-q">Search</label>'
       + '<input id="ipg-sb-rec-q" type="search" placeholder="Title or description" value="'+esc(state.recQuery)+'"/></div>';
    if(tags.length){
      h += '<div class="ipg-sb-chips">';
      ['All'].concat(tags).forEach(function(t){
        h += '<button type="button" class="ipg-sb-chip" data-rectag="'+esc(t)+'" aria-pressed="'+(state.recTag===t)+'">'+esc(t)+'</button>';
      });
      h += '</div>';
    }
    var q = state.recQuery.trim().toLowerCase();
    var rows = votesSorted().filter(function(v){
      var vm = meta[v.id]||{};
      if(state.recTag!=='All' && voteTags(vm).indexOf(state.recTag)<0) return false;
      if(!q) return true;
      return (String(v.title||'')+' '+String(vm.desc||'')).toLowerCase().indexOf(q)>=0;
    });
    if(!rows.length) return h + '<div class="ipg-sb-empty">No votes match these filters.</div></div>';
    h += '<div class="ipg-sb-rec">';
    rows.forEach(function(v){
      var vm = meta[v.id]||{}, tag = vm.tag||v.tag;
      var p = (v.positions && v.positions[String(state.seat)]);
      h += '<div class="ipg-sb-rec-vote"><div>'
         + '<div class="ipg-sb-rec-meta">'+(v.date?esc(v.date):'')
         + (tag?'<span class="ipg-sb-rec-tag">'+esc(tag)+'</span>':'')+'</div>'
         + '<div class="ipg-sb-rec-title">'+esc(v.title||vm.full||v.id)+'</div></div>'
         + '<div class="ipg-sb-rec-right">'+recPos(p==null||p===''?NOT_RECORDED:p)+'</div>'
         + '</div>';
    });
    return h + '</div></div>';
  }

  // All-seats matrix — the council's compare-by-issue idiom WITH its legend.
  function matrixView(){
    if(!voteCount()) return emptyToolCard();
    var roster = (D.members||[]), votes = votesSorted();
    var h = '<div class="ipg-sb-card">';
    h += '<div class="ipg-sb-mx-legend"><strong>Key:</strong>';
    ['Affirmative','Oppositional','Neutral','-'].forEach(function(k){
      var d = display(k);
      h += '<span class="mx-key '+d.mx+'">'+esc(d.label)+'</span>';
    });
    h += '</div>';
    h += '<div class="ipg-sb-matrix-wrap"><table class="ipg-sb-matrix"><thead><tr>'
       + '<th class="seat-col">Seat</th>';
    votes.forEach(function(v){ h += '<th>'+esc(v.title||v.id)+'</th>'; });
    h += '</tr></thead><tbody>';
    roster.forEach(function(m){
      h += '<tr'+(isMember(m)?'':' class="vacant-row"')+'>'
         + '<td class="seat-col">'+esc(m.seat)+' — '+esc(memberLabel(m))+'</td>';
      votes.forEach(function(v){
        var p = (v.positions && v.positions[String(m.seat)]);
        var d = display(p==null||p===''?NOT_RECORDED:p);
        h += '<td class="'+d.mx+'">'+esc(d.label)+'</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div></div>';
  }

  function methodologyView(){
    var h = '<div class="ipg-sb-card ipg-sb-meth">';
    h += '<h3>How this tool works</h3>';
    // ---- string 4, verbatim ----
    h += '<p>'+esc(S.methodology)+'</p>';
    h += '<h3>How to read a position</h3><ul>';
    Object.keys(POSITION_DISPLAY).forEach(function(k){
      var d = POSITION_DISPLAY[k];
      h += '<li>'+pill(k)+' &mdash; '
         + (d.recorded ? 'a position recorded in the source record.'
                       : 'no position has been recorded for this member on this vote &mdash; '
                         + 'distinct from '+pill('Neutral')+', which is an entered position.')
         + '</li>';
    });
    h += '</ul>';
    h += '<h3>Seats and members</h3>';
    h += '<p>Appointed members are labelled; elected members are not, because election is the '
       + 'default this tool exists to track. A seat with no member is shown as '
       + esc(S.vacant)+' and has no member page.</p>';
    h += '<h3>Spotted something wrong?</h3>';
    h += '<p>We rely on readers to help us keep this accurate.<br>'
       + '<button type="button" class="ipg-sb-fb-btn">'+esc(FB.trigger)+'</button></p>';
    return h + '</div>';
  }

  function render(){
    var h = head() + '<div class="ipg-sb-body">';
    if(state.status==='loading'){
      h += '<div class="ipg-sb-card"><div class="ipg-sb-empty">Loading Board voting data&hellip;</div></div>';
    } else if(state.status==='error'){
      // A stated error, never a blank page — the council embed's idiom.
      h += '<div class="ipg-sb-card"><div class="ipg-sb-err"><strong>Could not load Board voting data.</strong><br/>'
         + esc(state.error||'unknown error')
         + '<br/>The data file may be temporarily unavailable. Please try again shortly.</div></div>';
    } else if(state.view==='member'){    h += memberView();
    } else if(state.view==='record'){    h += recordView();
    } else if(state.view==='matrix'){    h += matrixView();
    } else {                             h += methodologyView(); }
    h += '</div><div class="ipg-sb-foot"><strong>Institute for the Public Good</strong> &middot; '
       + 'Vote positions are entered from public Board of Education records.</div>';
    app.innerHTML = h;
    wire();
    mountFab();
  }

  function wire(){
    app.querySelectorAll('[data-view]').forEach(function(b){
      b.onclick = function(){ state.view = b.getAttribute('data-view'); render(); }; });
    var sel = document.getElementById('ipg-sb-seat-sel');
    if(sel) sel.onchange = function(){ state.seat = sel.value; state.tag='All'; render(); };
    app.querySelectorAll('[data-tag]').forEach(function(b){
      b.onclick = function(){ state.tag = b.getAttribute('data-tag'); render(); }; });
    app.querySelectorAll('[data-rectag]').forEach(function(b){
      b.onclick = function(){ state.recTag = b.getAttribute('data-rectag'); render(); }; });
    var q = document.getElementById('ipg-sb-rec-q');
    if(q) q.oninput = function(){ state.recQuery = q.value; var p=q.selectionStart; render();
      var n=document.getElementById('ipg-sb-rec-q'); if(n){ n.focus(); n.setSelectionRange(p,p);} };
    app.querySelectorAll('.ipg-sb-fb-btn').forEach(function(b){ b.onclick = openFeedback; });
  }

  // ---- feedback -------------------------------------------------------
  function fbContext(){
    var bits = [];
    var name = ({member:'By member',record:'Complete record',matrix:'All seats',
                 methodology:'Methodology'})[state.view] || state.view;
    bits.push('View: '+name);
    if(state.seat){
      var r = seatRow(state.seat);
      bits.push('Seat '+state.seat+(r && isMember(r) ? ' — '+r.name : ' — '+S.vacant));
    }
    if(state.tag && state.tag!=='All') bits.push('Tag: '+state.tag);
    if(state.recTag && state.recTag!=='All') bits.push('Record tag: '+state.recTag);
    return bits.join(' · ');
  }

  function mountFab(){
    if(IPG_SB_FEEDBACK.floatingButton===false) return;
    if(document.getElementById('ipg-sb-fb-fab')) return;
    var fab = document.createElement('button');
    fab.id='ipg-sb-fb-fab'; fab.className='ipg-sb-fb-fab'; fab.type='button';
    fab.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
      +'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
      +'<span>'+esc(FB.fab)+'</span>';
    fab.onclick = openFeedback;
    document.body.appendChild(fab);
  }

  function openFeedback(){
    if(document.getElementById('ipg-sb-fb-overlay')) return;
    var o = document.createElement('div');
    o.className='ipg-sb-modal-overlay'; o.id='ipg-sb-fb-overlay';
    o.innerHTML =
      '<div class="ipg-sb-modal" role="dialog" aria-modal="true" aria-label="'+esc(FB.title)+'">'
      + '<button class="ipg-sb-modal-close" id="ipg-sb-fb-close" aria-label="Close">×</button>'
      + '<div class="ipg-sb-modal-head"><div class="ipg-sb-modal-kicker">'+esc(FB.kicker)+'</div>'
      + '<div class="ipg-sb-modal-name">'+esc(FB.title)+'</div>'
      + '<div class="ipg-sb-modal-meta">'+esc(FB.intro)+'</div></div>'
      + '<div id="ipg-sb-fb-body">'
      + '<div class="ipg-sb-fb-context"><strong>'+esc(FB.contextLabel)+'</strong> '+esc(fbContext())
      // ---- ratified delta 3: the context capture is disclosed ----
      + '<br>'+esc(FB.disclosure)+'</div>'
      + '<div class="ipg-sb-fb-field"><label for="ipg-sb-fb-type">'+esc(FB.typeLabel)+'</label>'
      + '<select id="ipg-sb-fb-type">'
      + FB.types.map(function(t){ return '<option>'+esc(t)+'</option>'; }).join('')
      + '</select></div>'
      + '<div class="ipg-sb-fb-field"><label for="ipg-sb-fb-comment">'+esc(FB.commentLabel)
      + ' <span class="ipg-sb-fb-hint">'+esc(FB.required)+'</span></label>'
      // ---- ratified delta 2: the placeholder, re-authored for seats ----
      + '<textarea id="ipg-sb-fb-comment" placeholder="'+esc(FB.placeholder)+'"></textarea></div>'
      + '<div class="ipg-sb-fb-field"><label for="ipg-sb-fb-link">'+esc(FB.linkLabel)
      + ' <span class="ipg-sb-fb-hint">'+esc(FB.optional)+'</span></label>'
      + '<input type="url" id="ipg-sb-fb-link" placeholder="https://…"></div>'
      + '<div class="ipg-sb-fb-field"><label>Screenshots</label><div class="ipg-sb-fb-hint">'
      + esc(FB.shots)+'<a href="mailto:'+esc(IPG_SB_FEEDBACK.email)+'">'+esc(IPG_SB_FEEDBACK.email)+'</a>'
      + esc(FB.shotsTail)+'</div></div>'
      + '<div class="ipg-sb-fb-field"><label for="ipg-sb-fb-name">'+esc(FB.nameLabel)
      + ' <span class="ipg-sb-fb-hint">'+esc(FB.optional)+'</span></label><input type="text" id="ipg-sb-fb-name"></div>'
      + '<div class="ipg-sb-fb-field"><label for="ipg-sb-fb-email">'+esc(FB.emailLabel)
      + ' <span class="ipg-sb-fb-hint">'+esc(FB.emailHint)+'</span></label><input type="email" id="ipg-sb-fb-email"></div>'
      + '<div class="ipg-sb-fb-actions"><button class="ipg-sb-fb-submit" id="ipg-sb-fb-submit">'+esc(FB.submit)+'</button>'
      + '<span class="ipg-sb-fb-status" id="ipg-sb-fb-status"></span></div>'
      + '</div></div>';
    document.body.appendChild(o);
    document.getElementById('ipg-sb-fb-close').onclick = closeFeedback;
    o.onclick = function(e){ if(e.target===o) closeFeedback(); };
    document.getElementById('ipg-sb-fb-submit').onclick = submitFeedback;
  }
  function closeFeedback(){
    var o = document.getElementById('ipg-sb-fb-overlay'); if(o) o.remove();
  }
  function fbMailto(type,comment,link,name,email,ctx){
    return 'mailto:'+encodeURIComponent(IPG_SB_FEEDBACK.email)
      + '?subject='+encodeURIComponent(IPG_SB_FEEDBACK.subjectPrefix+type)
      + '&body='+encodeURIComponent(comment+'\n\n'+(link?('Source: '+link+'\n'):'')
        + (name?('From: '+name+'\n'):'')+(email?('Reply to: '+email+'\n'):'')+'\n'+ctx);
  }
  function fbDone(msg){
    var b = document.getElementById('ipg-sb-fb-body');
    if(b) b.innerHTML = '<div class="ipg-sb-fb-done"><div class="big">✓</div><p>'+esc(msg)+'</p></div>';
  }
  function submitFeedback(){
    var g = function(id){ return document.getElementById(id); };
    var comment = (g('ipg-sb-fb-comment').value||'').trim();
    var status = g('ipg-sb-fb-status');
    if(!comment){ status.className='ipg-sb-fb-status err'; status.textContent=FB.needComment; return; }
    var type=g('ipg-sb-fb-type').value, link=(g('ipg-sb-fb-link').value||'').trim();
    var name=(g('ipg-sb-fb-name').value||'').trim(), email=(g('ipg-sb-fb-email').value||'').trim();
    var ctx=fbContext();
    if(IPG_SB_FEEDBACK.endpoint){
      var btn=g('ipg-sb-fb-submit'); btn.disabled=true;
      status.className='ipg-sb-fb-status'; status.textContent=FB.sending;
      var fd=new FormData();
      if(IPG_SB_FEEDBACK.accessKey) fd.append('access_key',IPG_SB_FEEDBACK.accessKey);
      // The per-tool identifier: both voting tools share one inbox and sort by prefix.
      fd.append('subject', IPG_SB_FEEDBACK.subjectPrefix+type);
      fd.append('from_name', name||'IPG tool visitor');
      if(email) fd.append('email',email);
      fd.append('type',type);
      fd.append('comment',comment);
      if(link) fd.append('link',link);
      fd.append('context',ctx);
      fetch(IPG_SB_FEEDBACK.endpoint,{method:'POST',headers:{'Accept':'application/json'},body:fd})
        .then(function(r){ return r.json().catch(function(){ return {}; })
          .then(function(j){ return r.ok && j.success!==false && j.ok!==false; }); })
        .then(function(ok){
          if(!ok) throw new Error('bad response');
          fbDone(FB.thanks+IPG_SB_FEEDBACK.email+'.');
        })
        .catch(function(){
          btn.disabled=false; status.className='ipg-sb-fb-status err'; status.textContent=FB.failed;
          var a=document.createElement('a');
          a.href=fbMailto(type,comment,link,name,email,ctx); a.textContent=FB.failedLink;
          a.style.color='var(--sage)'; status.appendChild(a);
        });
    } else {
      window.location.href=fbMailto(type,comment,link,name,email,ctx);
      fbDone(FB.mailtoDone+IPG_SB_FEEDBACK.email+' directly.)');
    }
  }

  function loadData(){
    return fetch(IPG_SB_CONFIG.dataUrl, {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ D = j; state.status='ready'; })
      .catch(function(e){ state.status='error'; state.error=e && e.message || String(e); });
  }

  render();
  loadData().then(render);
})();
</script>
