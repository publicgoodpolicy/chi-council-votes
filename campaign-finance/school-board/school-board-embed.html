  function render(){
    var h = head() + '<div class="ipg-sb-body">';
    if(state.status==='loading'){
      h += '<div class="ipg-sb-card"><div class="ipg-sb-empty">Loading Board voting data&hellip;</div></div>';
    } else if(state.status==='error'){
      // A stated error, never a blank page — the council embed's idiom.
      h += '<div class="ipg-sb-card"><div class="ipg-sb-err"><strong>Could not load Board voting data.</strong><br/>'
         + esc(state.error||'unknown error')
         + '<br/>The data file may be temporarily unavailable. Please try again shortly.</div></div>';
    } else if(state.view==='member'){    h += memberView();
    } else if(state.view==='record'){    h += recordView();
    } else if(state.view==='matrix'){    h += matrixView();
    } else if(state.view==='spend'){
      // SBFIN-4 A.1 — F-C1's fix. These two modals resolved the election with the PRE-SBFIN-3-C
      // rule (`state.spendElection || most-recent`) while the body resolved through
      // spendScope(sub). At the ratified All-elections landing state.spendElection is null, so
      // the body rendered every election's rows while the modals looked in 2026 alone — and
      // every 2024-only row's lookup returned nothing, so the modal rendered as an empty
      // string. The click fired, the state set, the render ran, and nothing appeared.
      // Measured before the fix: 13 of the 25 rendered rows dead, and they were exactly the
      // 13 with no 2026 money. ONE resolver now, the same one the body uses.
      var _sub = state.spendSub || 'members';
      var _ek = spendScope(_sub);
      var _lab = (_ek === ALL_ELECTIONS) ? SF.allElections
                                         : (spendElectionKeys().labels[_ek] || _ek);
      h += spendView(_ek);
      if(state.finDonor) h += donorProfileHtml(null, { key:_ek, label:_lab });
      if(state.spendIE)  h += ieDetailHtml(_ek, _lab);
    } else if(state.view==='board'){     h += boardView();
    } else {                             h += methodologyView(); }
    h += '</div>' + feedbackBarHtml()
       + '<div class="ipg-sb-foot"><strong>Institute for the Public Good</strong> &middot; '
       + 'Vote positions are entered from public Board of Education records.</div>';
    app.innerHTML = h;
    wire();
    mountFab();
  }

  // ==========================================================
  // SBFIN-2 B.5 — the ratified footer, VERBATIM, on every tab.
  //
  // The string is the council's composed feedbackBarHtml text on its
  // methodologyUrl === null branch, ratified verbatim at SBFIN-2's charter. It renders
  // from render(), outside the per-view branch, so no tab can be missed by construction.
  //
  // F8: `methodologyUrl` is a real key on IPG_SB_FEEDBACK, mirroring the council's
  // FEEDBACK_CONFIG, rather than the branch being hardcoded — so the sentence can be
  // switched to a real link later without a code edit.
  //
  // F9, flagged not silently resolved: the ratified sentence says a methodology page is
  // "on the way" while this tool already ships a Methodology tab. The string is ratified
  // and is NOT altered here; the tension is recorded for a later re-ratification.
  // ==========================================================
  function feedbackBarHtml(){
    var m = IPG_SB_FEEDBACK.methodologyUrl;
    var meth = m
      ? 'If you have questions about our data sources and methodology, see our <a href="'
        + esc(m) + '" target="_blank" rel="noopener">methodology page</a>. '
      : 'If you have questions about our data sources and methodology, a full methodology page is on the way. ';
    return '<div class="ipg-sb-feedback-bar">'
      + '<strong>We\u2019re committed to keeping this data as accurate as possible.</strong> '
      + meth
      + 'If you spot an error in the data or a visualization, have something to add, or hit a bug, '
      + '<button class="ipg-sb-fb-inline ipg-sb-fb-btn" type="button">click here to let us know</button>.'
      + '</div>';
  }

  function wire(){
    app.querySelectorAll('[data-view]').forEach(function(b){
      b.onclick = function(){ state.view = b.getAttribute('data-view'); render(); }; });
    var sel = document.getElementById('ipg-sb-seat-sel');
    if(sel) sel.onchange = function(){ state.seat = sel.value; state.tag='All'; render(); };
    app.querySelectorAll('[data-tag]').forEach(function(b){
      b.onclick = function(){ state.tag = b.getAttribute('data-tag'); render(); }; });
    app.querySelectorAll('[data-rectag]').forEach(function(b){
      b.onclick = function(){ state.recTag = b.getAttribute('data-rectag'); render(); }; });
    var q = document.getElementById('ipg-sb-rec-q');
    if(q) q.oninput = function(){ state.recQuery = q.value; var p=q.selectionStart; render();
      var n=document.getElementById('ipg-sb-rec-q'); if(n){ n.focus(); n.setSelectionRange(p,p);} };
    app.querySelectorAll('.ipg-sb-fb-btn').forEach(function(b){ b.onclick = openFeedback; });
    var fe = document.getElementById('ipg-sb-fin-el');
    // SBFIN-5 B — an election change re-scopes every recipient total, so the expanded rows
    // are cleared with it: a row left open across a scope change would redraw with different
    // children under a different parent figure, which reads as the disclosure changing under
    // the reader rather than the scope changing.
    if(fe) fe.onchange = function(){ state.finElection = fe.value; state.finShowAllDonors=false;
                                     state.finOpenRecip = {}; render(); };
    var fm = document.getElementById('ipg-sb-fin-more');
    if(fm) fm.onclick = function(){ state.finShowAllDonors = !state.finShowAllDonors; render(); };
    var se = document.getElementById('ipg-sb-spend-el');
    if(se) se.onchange = function(){ state.spendElection = se.value;
                                     state.spendShowAll = false;
                                     state.finOpenRecip = {}; render(); };

    // C: sub-tabs. Switching sub-tab clears the sub-tab-local state (filters, drill,
    // paging) so a control left set on one view cannot silently scope another.
    app.querySelectorAll('[data-spendsub]').forEach(function(b){
      b.onclick = function(){
        state.spendSub = b.getAttribute('data-spendsub');
        state.spendSearch=''; state.spendType='All'; state.spendIndustry='All';
        state.spendIndustryDetail=null; state.spendShowAll=false; state.finDonor=null;
        state.spendIE=null;
        // Reset the scope too: each sub-tab lands on its OWN default (All elections for
        // the three, most-recent for Spend by member). Carrying a chosen election across a
        // sub-tab switch would mean a sub-tab never lands where it was ratified to land.
        state.spendElection=null;
        render();
      };
    });
    var bq = document.getElementById('ipg-sb-bd-q');
    if(bq) bq.oninput = function(){ state.spendSearch = bq.value; state.spendShowAll=false;
      var pos = bq.selectionStart; render();
      var nq = document.getElementById('ipg-sb-bd-q');
      if(nq){ nq.focus(); nq.setSelectionRange(pos,pos); } };
    var bt = document.getElementById('ipg-sb-bd-type');
    if(bt) bt.onchange = function(){ state.spendType = bt.value; state.spendShowAll=false; render(); };
    var bi = document.getElementById('ipg-sb-bd-ind');
    if(bi) bi.onchange = function(){ state.spendIndustry = bi.value; state.spendShowAll=false; render(); };
    var bc = document.getElementById('ipg-sb-bd-clear');
    if(bc) bc.onclick = function(){ state.spendSearch=''; state.spendType='All';
      state.spendIndustry='All'; state.spendShowAll=false; render(); };
    var bm = document.getElementById('ipg-sb-bd-more');
    if(bm) bm.onclick = function(){ state.spendShowAll = !state.spendShowAll; render(); };
    app.querySelectorAll('[data-industry-drill]').forEach(function(b){
      b.onclick = function(){ state.spendIndustryDetail = b.getAttribute('data-industry-drill');
                              render(); }; });
    var ib = document.getElementById('ipg-sb-ind-back');
    if(ib) ib.onclick = function(){ state.spendIndustryDetail = null; render(); };

    // B.2 — the IE detail view.
    app.querySelectorAll('[data-ie]').forEach(function(b){
      b.onclick = function(){ state.spendIE = b.getAttribute('data-ie'); render(); }; });
    var iov = document.getElementById('ipg-sb-ie-overlay');
    if(iov){
      var iclose = function(){ state.spendIE = null;
        document.removeEventListener('keydown', iesc); render(); };
      var iesc = function(e){ if(e.key === 'Escape') iclose(); };
      document.addEventListener('keydown', iesc);
      iov.onclick = function(e){ if(e.target === iov) iclose(); };
      var icb = document.getElementById('ipg-sb-ie-close');
      if(icb) icb.onclick = iclose;
    }
    // SBV-BOARD-1 — the roster's click-through. A PARALLEL attribute, not a
    // reuse of `data-spend-seat`: that one's handler additionally clears three
    // finance-state keys, which is right when arriving from Political Spend and
    // meaningless from a roster, and reusing it would tie the roster's
    // behaviour to the finance view's reset policy. The existing attribute is
    // untouched. Tag reset mirrors the seat selector's own handler, which is
    // the incumbent "you are now looking at a different member" transition.
    app.querySelectorAll('[data-board-seat]').forEach(function(r){
      r.onclick = function(){ state.seat = r.getAttribute('data-board-seat');
                              state.tag='All'; state.view='member'; render(); }; });
    app.querySelectorAll('[data-spend-seat]').forEach(function(r){
      r.onclick = function(){ state.seat = r.getAttribute('data-spend-seat');
                              state.view='member'; state.finElection=null;
                              state.finIndustry='All'; state.finDonor=null; render(); }; });

    // B.2 — segment AND legend row carry the same data-industry and the same handler.
    // Toggle-to-clear, and the filter applies IN PLACE: no scroll, no navigation.
    app.querySelectorAll('[data-industry]').forEach(function(b){
      b.onclick = function(e){
        e.preventDefault(); e.stopPropagation();
        var k = b.getAttribute('data-industry');
        state.finIndustry = (state.finIndustry === k) ? 'All' : k;
        state.finShowAllDonors = false;
        render();
      };
    });
    var fc = document.getElementById('ipg-sb-fin-clear');
    if(fc) fc.onclick = function(){ state.finIndustry='All'; render(); };

    // B.3 — the donor profile. Opening a DIFFERENT donor clears the expanded rows, so an
    // open seat never carries over onto a subject it was not opened against (SBFIN-5 B).
    app.querySelectorAll('[data-donor]').forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute('data-donor');
        if(id !== state.finDonor) state.finOpenRecip = {};
        state.finDonor = id; render(); }; });
    // SBFIN-5 B / D-5a — expand-collapse on the recipient row. Toggle only: it moves no
    // other state, so the row's money and the modal's scope are unchanged by opening it.
    app.querySelectorAll('[data-recip]').forEach(function(b){
      b.onclick = function(){
        var k = b.getAttribute('data-recip');
        if(state.finOpenRecip[k]) delete state.finOpenRecip[k];
        else state.finOpenRecip[k] = 1;
        render(); }; });
    var ov = document.getElementById('ipg-sb-donor-overlay');
    if(ov){
      var close = function(){ state.finDonor = null; state.finOpenRecip = {};
        document.removeEventListener('keydown', escFn); render(); };
      var escFn = function(e){ if(e.key === 'Escape') close(); };
      document.addEventListener('keydown', escFn);
      ov.onclick = function(e){ if(e.target === ov) close(); };
      var cb = document.getElementById('ipg-sb-donor-close');
      if(cb) cb.onclick = close;
    }
  }

  function fbContext(){
    var bits = [];
    // R3: this map is a SECOND declaration of the tab labels and had already
    // drifted — `spend` was missing, so a report filed from Political Spend
    // recorded the raw view id. The new tab and the pre-existing omission are
    // repaired together, in the commit that adds the tab.
    var name = ({member:'By member',record:'Complete record',matrix:'All seats',
                 spend:'Political Spend',board:'The Board',
                 methodology:'Methodology'})[state.view] || state.view;
    bits.push('View: '+name);
    if(state.seat){
      var r = seatRow(state.seat);
      bits.push('Seat '+state.seat+(r && isMember(r) ? ' — '+r.name : ' — '+S.vacant));
    }
    if(state.tag && state.tag!=='All') bits.push('Tag: '+state.tag);
    if(state.recTag && state.recTag!=='All') bits.push('Record tag: '+state.recTag);
    return bits.join(' · ');
  }

  function fbMailto(type,comment,link,name,email,ctx){
    return 'mailto:'+encodeURIComponent(IPG_SB_FEEDBACK.email)
      + '?subject='+encodeURIComponent(IPG_SB_FEEDBACK.subjectPrefix+type)
      + '&body='+encodeURIComponent(comment+'\n\n'+(link?('Source: '+link+'\n'):'')
        + (name?('From: '+name+'\n'):'')+(email?('Reply to: '+email+'\n'):'')+'\n'+ctx);
  }
  function fbDone(msg){
    var b = document.getElementById('ipg-sb-fb-body');
    if(b) b.innerHTML = '<div class="ipg-sb-fb-done"><div class="big">✓</div><p>'+esc(msg)+'</p></div>';
  }
  function submitFeedback(){
    var g = function(id){ return document.getElementById(id); };
    var comment = (g('ipg-sb-fb-comment').value||'').trim();
    var status = g('ipg-sb-fb-status');
    if(!comment){ status.className='ipg-sb-fb-status err'; status.textContent=FB.needComment; return; }
    var type=g('ipg-sb-fb-type').value, link=(g('ipg-sb-fb-link').value||'').trim();
    var name=(g('ipg-sb-fb-name').value||'').trim(), email=(g('ipg-sb-fb-email').value||'').trim();
    var ctx=fbContext();
    if(IPG_SB_FEEDBACK.endpoint){
      var btn=g('ipg-sb-fb-submit'); btn.disabled=true;
      status.className='ipg-sb-fb-status'; status.textContent=FB.sending;
      var fd=new FormData();
      if(IPG_SB_FEEDBACK.accessKey) fd.append('access_key',IPG_SB_FEEDBACK.accessKey);
      // The per-tool identifier: both voting tools share one inbox and sort by prefix.
      fd.append('subject', IPG_SB_FEEDBACK.subjectPrefix+type);
      fd.append('from_name', name||'IPG tool visitor');
      if(email) fd.append('email',email);
      fd.append('type',type);
      fd.append('comment',comment);
      if(link) fd.append('link',link);
      fd.append('context',ctx);
      fetch(IPG_SB_FEEDBACK.endpoint,{method:'POST',headers:{'Accept':'application/json'},body:fd})
        .then(function(r){ return r.json().catch(function(){ return {}; })
          .then(function(j){ return r.ok && j.success!==false && j.ok!==false; }); })
        .then(function(ok){
          if(!ok) throw new Error('bad response');
          fbDone(FB.thanks+IPG_SB_FEEDBACK.email+'.');
        })
        .catch(function(){
          btn.disabled=false; status.className='ipg-sb-fb-status err'; status.textContent=FB.failed;
          var a=document.createElement('a');
          a.href=fbMailto(type,comment,link,name,email,ctx); a.textContent=FB.failedLink;
          a.style.color='var(--sage)'; status.appendChild(a);
        });
    } else {
      window.location.href=fbMailto(type,comment,link,name,email,ctx);
      fbDone(FB.mailtoDone+IPG_SB_FEEDBACK.email+' directly.)');
    }
  }

  function loadData(){
    return fetch(IPG_SB_CONFIG.dataUrl, {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ D = j; state.status='ready'; })
      .catch(function(e){ state.status='error'; state.error=e && e.message || String(e); });
  }

  // The second of the two enumerated fetches. Isolated by construction: its failure
  // sets finStatus only, so a member page still renders its votes with a stated
  // finance notice rather than the whole tool erroring.
  function loadFinance(){
    return fetch(IPG_SB_CONFIG.financeUrl, {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ F = j; state.finStatus='ready'; })
      .catch(function(e){ state.finStatus='error'; state.finError=e && e.message || String(e); });
  }

  render();
  Promise.all([loadData(), loadFinance()]).then(render);
})();
</script>
