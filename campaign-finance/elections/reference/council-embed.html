  /* ===================================================================
     STAGE 3 — Follow the money (donor ↔ alder ↔ vote relationships)
     • Donor view — donor-anchored hub-and-spoke showing EVERY alder the
       donor funded; bubble + line size scale with amount; layout fans
       across multiple rings as the count grows. Photo-ready: if an alder
       has photoUrl, the bubble shows the photo with a vote-colored ring.
     • Table view — donor × voting-bloc matrix; shading is scaled WITHIN
       each column. Click a row for a vote-aware breakdown of who that
       donor funded and by how much. Doubles as the mobile layout.
     Reuses alderByWard, fmtMoney, pill, stat, and the --aff/--opp/--neu
     position colors. Honors the rule that this shows association, NOT
     causation.
     =================================================================== */
  const REL_POS_FILL={yes:'var(--aff)',no:'var(--opp)',present:'var(--neu)',absent:'var(--nd)'};
  const REL_POS_LABEL={yes:'Voted Yes',no:'Voted No',present:'Present',absent:'No recorded vote'};
  const REL_POS_SHORT={yes:'Yes',no:'No',present:'Present',absent:'No vote'};
  const REL_POS=['yes','no','present','absent'];
  const REL_MAX_ROWS=15;

  function relEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function relEscAttr(s){return relEsc(s).replace(/"/g,'&quot;');}
  function relTrunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'\u2026':s;}
  function relShortAmt(a){return a>=1000?Math.round(a/1000)+'k':String(Math.round(a));}
  function relVoteMeta(code){return D.votemeta.find(v=>v.code===code);}
  function relPosOf(a,vm){return a?posKey(keyVotePos(vm,a.ward)):'absent';}

  function relBuildIndex(){
    if(state._relIndex) return state._relIndex;
    const cidWard={};
    Object.entries(state.cf.committees).forEach(([cid,c])=>{ cidWard[cid]=c.ward; });
    const byDonor=new Map();
    state.cf.contributions.forEach(c=>{
      if(!cfInSubject(c)) return;
      const w=cidWard[c.committee_id]; if(w==null) return;
      const dn=state.cf.donors[c.donor_id]; if(!dn||dn.type==='Aggregate') return;
      let m=byDonor.get(c.donor_id); if(!m){m=new Map();byDonor.set(c.donor_id,m);}
      m.set(w,(m.get(w)||0)+c.amount);
    });
    const all=[];
    byDonor.forEach((m,id)=>{ let total=0; m.forEach(v=>total+=v); all.push({id,nAlders:m.size,total}); });
    const multiByDollar=all.filter(r=>r.nAlders>=2).sort((a,b)=>b.total-a.total);
    state._relIndex={cidWard,byDonor,all,multiByDollar};
    return state._relIndex;
  }

  function relationshipView(){
    if(!state.cf||!state.cf.contributions) return '<div class="ipg-cf-empty">No data loaded.</div>';
    const idx=relBuildIndex();
    const multi=idx.multiByDollar;
    if(!state.relDonorId && multi.length) state.relDonorId=multi[0].id;
    if(!relVoteMeta(state.relVoteCode)) state.relVoteCode=D.votemeta[0].code;
    const vm=relVoteMeta(state.relVoteCode);

    let h='<div class="ipg-section-h">Follow the money</div>';
    h+='<div class="ipg-rel-disclaimer"><strong>How to read this.</strong> This view places two public facts side by side \u2014 who gave money to an alder\u2019s campaign committee, and how that alder voted on a key ordinance. It is <strong>not</strong> a claim that the money caused the vote, and nothing here is deterministic. Correlation is not causation: a vote reflects many factors, and any alignment shown may be coincidental, may reflect shared values, or may run the other way around. Treat it as a map of relationships worth investigating \u2014 not a verdict.</div>';

    h+='<div class="ipg-sub-toggle" role="tablist">'
      +'<button class="ipg-rel-tab'+(state.relView==='donor'?' active':'')+'" data-relview="donor">Donor view</button>'
      +'<button class="ipg-rel-tab'+(state.relView==='table'?' active':'')+'" data-relview="table">Table view</button>'
      +'</div>';

    h+='<div class="ipg-rel-controls">';
    h+='<div class="ipg-rel-field"><label for="ipg-rel-vote">Key vote</label><select id="ipg-rel-vote">';
    D.votemeta.forEach(v=>{ h+='<option value="'+v.code+'"'+(v.code===state.relVoteCode?' selected':'')+'>'+relEsc(v.full)+' ('+relEsc(v.year)+')</option>'; });
    h+='</select></div>';
    if(state.relView==='donor'){
      const opts=multi.slice(0,150);
      h+='<div class="ipg-rel-field"><label for="ipg-rel-donor">Donor (largest first)</label><select id="ipg-rel-donor" style="min-width:320px">';
      if(!opts.find(r=>r.id===state.relDonorId)){
        const cur=state.cf.donors[state.relDonorId], cr=idx.all.find(r=>r.id===state.relDonorId);
        if(cur) h+='<option value="'+relEscAttr(state.relDonorId)+'" selected>'+relEsc(cur.name)+(cr?' \u2014 '+fmtMoney(cr.total):'')+'</option>';
      }
      opts.forEach(r=>{const d=state.cf.donors[r.id]; if(!d)return;
        h+='<option value="'+relEscAttr(r.id)+'"'+(r.id===state.relDonorId?' selected':'')+'>'+relEsc(d.name)+' \u2014 '+fmtMoney(r.total)+' ('+r.nAlders+' alders)</option>';});
      h+='</select></div>';
    }
    h+='</div>';

    h+= state.relView==='donor' ? relDonorView(idx,vm) : relTableView(idx,vm);

    h+='<div class="ipg-rel-legend">';
    REL_POS.forEach(p=>{ h+='<span><span class="ipg-rel-sw" style="background:'+REL_POS_FILL[p]+'"></span>'+REL_POS_LABEL[p]+'</span>'; });
    h+=(state.relView==='donor')
      ? '<span style="color:#9a8e7e">Bubble &amp; line size \u2248 contribution amount \u00b7 tap an alder to open their record</span>'
      : '<span style="color:#9a8e7e">Cell shade compares donors <em>within each column</em> \u00b7 tap a row for the full breakdown</span>';
    h+='</div>';
    return h;
  }

  function relDonorView(idx,vm){
    const did=state.relDonorId, d=state.cf.donors[did];
    if(!d) return '<div class="ipg-cf-empty">Select a donor to see who they funded.</div>';
    const wardMap=idx.byDonor.get(did)||new Map();
    let spokes=[];
    wardMap.forEach((amt,w)=>{ const a=alderByWard(w); if(!a)return; spokes.push({w,amt,a,pos:relPosOf(a,vm)}); });
    spokes.sort((x,y)=>y.amt-x.amt);
    const N=spokes.length, totalAll=spokes.reduce((s,x)=>s+x.amt,0);
    const cnt={yes:0,no:0,present:0,absent:0}; spokes.forEach(s=>{cnt[s.pos]++;});

    const aWord=N+' alder'+(N===1?'':'s');
    // Lead with the neutral fact (who gave how much, to how many), then state the
    // vote outcome as a separate sentence, then a short association-not-causation
    // reminder \u2014 so the caption never reads as "paid them to vote this way."
    let cap='<strong>'+relEsc(d.name)+'</strong> '+(d.type?'('+relEsc(d.type)+') ':'')
      +'gave '+fmtMoney(totalAll)+' '+(N===1?'to ':'across ')+aWord+'. '
      +'Here\u2019s how '+(N===1?'that alder':'those '+aWord)+' voted on <strong>'+relEsc(vm.full)+'</strong>: '
      +cnt.yes+' Yes, '+cnt.no+' No'
      +(cnt.present?', '+cnt.present+' Present':'')+(cnt.absent?', '+cnt.absent+' with no recorded vote':'')+'.';
    let h='<div class="ipg-rel-caption">'+cap+'</div>'
      +'<div class="ipg-rel-note">Donations and votes are two separate public facts shown side by side \u2014 not evidence that one caused the other.</div>';
    if(N<2) return h+'<div class="ipg-placeholder">This donor gave to only one alder, so there\u2019s no funding network to draw. Pick a donor who funded two or more alders.</div>';

    const sq=Math.sqrt;
    const amts=spokes.map(s=>s.amt), maxAmt=Math.max.apply(null,amts), minAmt=Math.min.apply(null,amts);
    const frac=a=> maxAmt>minAmt ? (sq(a)-sq(minAmt))/(sq(maxAmt)-sq(minAmt)) : 0.6;
    const rMax = N<=10?32 : N<=18?25 : N<=28?20 : 16;
    const rMin = Math.max(9, rMax*0.42);
    const rOf=a=> rMin + frac(a)*(rMax-rMin);
    const ringCount = N<=8?2 : N<=18?3 : N<=30?4 : 5;
    const ringGap = rMax*1.9 + 16;
    const Rbase = N<=8?120 : N<=18?152 : N<=30?196 : 214;
    const Router = Rbase + ((ringCount-1)/2)*ringGap + rMax;
    const tier = N<=16?'full' : N<=26?'last' : 'ward';
    const maxLabelW = tier==='full'?164 : tier==='last'?112 : 28;
    const W = Math.ceil((Router+maxLabelW)*2+36);
    const H = Math.ceil(Router*2 + (tier==='full'?86:62));
    const cx=W/2, cy=H/2;
    const ewOf=a=> 1.2 + sq(a/maxAmt)*(N>20?3.6:5.0);
    const place=i=>{ const ang=(-90+i*(360/N))*Math.PI/180, ring=i%ringCount, rr=Rbase+(ring-(ringCount-1)/2)*ringGap; return {ang,co:Math.cos(ang),si:Math.sin(ang),rr}; };

    let defs='', body='';
    spokes.forEach((sp,i)=>{ const p=place(i), x=cx+p.rr*p.co, y=cy+p.rr*p.si;
      body+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+REL_POS_FILL[sp.pos]+'" stroke-width="'+ewOf(sp.amt).toFixed(1)+'" stroke-opacity="'+(N>20?0.38:0.45)+'" stroke-linecap="round"></line>';
    });
    spokes.forEach((sp,i)=>{ const p=place(i), x=cx+p.rr*p.co, y=cy+p.rr*p.si, nr=rOf(sp.amt), col=REL_POS_FILL[sp.pos];
      const photo=sp.a.photoUrl;
      if(photo){ const cid='relph'+did.replace(/[^a-z0-9]/gi,'')+'-'+sp.w;
        defs+='<clipPath id="'+cid+'"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(nr-2).toFixed(1)+'"/></clipPath>';
        body+='<g class="ipg-rel-node" data-relward="'+sp.w+'">'
          +'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+nr.toFixed(1)+'" fill="'+col+'"></circle>'
          +'<image href="'+relEscAttr(photo)+'" x="'+(x-nr+2).toFixed(1)+'" y="'+(y-nr+2).toFixed(1)+'" width="'+(2*(nr-2)).toFixed(1)+'" height="'+(2*(nr-2)).toFixed(1)+'" clip-path="url(#'+cid+')" preserveAspectRatio="xMidYMid slice"></image>'
          +'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+nr.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="3.5"><title>'+relEscAttr(sp.a.name)+' \u2014 '+REL_POS_LABEL[sp.pos]+' \u00b7 '+fmtMoney(sp.amt)+'</title></circle>';
      } else {
        body+='<g class="ipg-rel-node" data-relward="'+sp.w+'">'
          +'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+nr.toFixed(1)+'" fill="'+col+'" stroke="var(--white)" stroke-width="2"><title>'+relEscAttr(sp.a.name)+' \u2014 '+REL_POS_LABEL[sp.pos]+' \u00b7 '+fmtMoney(sp.amt)+'</title></circle>';
      }
      const lr=p.rr+nr+(tier==='ward'?6:10), lx=cx+lr*p.co, ly=cy+lr*p.si;
      let anc; if(p.co>0.34)anc='start'; else if(p.co<-0.34)anc='end'; else anc='middle';
      if(tier==='ward'){
        let yy=(Math.abs(p.co)<=0.34)?(p.si<0?ly-2:ly+8):ly+3;
        body+='<text x="'+lx.toFixed(1)+'" y="'+yy.toFixed(1)+'" text-anchor="'+anc+'" font-size="10" font-weight="600" fill="var(--ink)">W'+sp.w+'</text>';
      } else {
        const lbl = tier==='full' ? ('Ward '+sp.w+' \u00b7 '+sp.a.name) : ('W'+sp.w+' '+sp.a.name.split(' ').slice(-1)[0]);
        let n1,n2; if(anc==='middle'){ if(p.si<0){n1=ly-12;n2=ly+1;} else {n1=ly+4;n2=ly+17;} } else { n1=ly-3; n2=ly+10; }
        body+='<text x="'+lx.toFixed(1)+'" y="'+n1.toFixed(1)+'" text-anchor="'+anc+'" font-size="'+(tier==='full'?12:11)+'" font-weight="600" fill="var(--ink)">'+relEsc(relTrunc(lbl,tier==='full'?23:16))+'</text>'
          +'<text x="'+lx.toFixed(1)+'" y="'+n2.toFixed(1)+'" text-anchor="'+anc+'" font-size="10.5" fill="#8a7d6e">'+fmtMoney(sp.amt)+'</text>';
      }
      body+='</g>';
    });
    body+='<g class="ipg-rel-node" data-reldonor="1">'
      +'<rect x="'+(cx-99).toFixed(1)+'" y="'+(cy-29).toFixed(1)+'" width="198" height="58" rx="13" fill="var(--sage)"></rect>'
      +'<text x="'+cx+'" y="'+(cy-5).toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--cream)">'+relEsc(relTrunc(d.name,26))+'</text>'
      +'<text x="'+cx+'" y="'+(cy+14).toFixed(1)+'" text-anchor="middle" font-size="11" fill="#e3efeb">'+fmtMoney(totalAll)+' \u00b7 '+N+' alders</text>'
      +'</g>';
    const s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+relEscAttr(d.name)+' funding map">'+(defs?'<defs>'+defs+'</defs>':'')+body+'</svg>';
    h+='<div class="ipg-rel-svg-wrap">'+s+'</div>';
    if(tier!=='full') h+='<div class="ipg-rel-note">Every alder '+relEsc(d.name)+' funded is shown. Labels are abbreviated to fit \u2014 hover a bubble for the name and amount, or open Table view for the full list.</div>';
    return h;
  }

  function relTableView(idx,vm){
    const rows=idx.multiByDollar.slice(0,REL_MAX_ROWS);
    if(!rows.length) return '<div class="ipg-cf-empty">No donors in the dataset funded two or more alders.</div>';
    const data=rows.map(r=>{ const m=idx.byDonor.get(r.id), agg={yes:{a:0,n:0},no:{a:0,n:0},present:{a:0,n:0},absent:{a:0,n:0}};
      m.forEach((amt,w)=>{ const al=alderByWard(w); const p=relPosOf(al,vm); agg[p].a+=amt; agg[p].n++; });
      return {r,d:state.cf.donors[r.id],agg}; }).filter(x=>x.d);
    const colMax={yes:0,no:0,present:0,absent:0};
    data.forEach(x=>REL_POS.forEach(p=>{ if(x.agg[p].a>colMax[p])colMax[p]=x.agg[p].a; }));

    let h='<div class="ipg-rel-caption">The '+data.length+' donors who put the most money into council races, and <strong>which way their money\u2019s recipients voted</strong> on <strong>'+relEsc(vm.full)+'</strong>. Each row splits a donor\u2019s giving across alders who voted Yes, No, were Present, or had no recorded vote \u2014 shading compares donors within each column. Tap a row to see exactly who they funded.</div>';
    h+='<div class="ipg-rel-tbl-wrap"><table class="ipg-rel-tbl rel-bloc"><thead><tr><th class="rowh">Donor</th><th>Total</th>';
    REL_POS.forEach(p=>{ h+='<th style="color:'+REL_POS_FILL[p]+'">'+REL_POS_SHORT[p]+'</th>'; });
    h+='<th>Where the money went</th></tr></thead><tbody>';
    data.forEach(x=>{ const d=x.d, tot=REL_POS.reduce((s,p)=>s+x.agg[p].a,0)||1;
      h+='<tr class="rel-row" data-reldonor2="'+relEscAttr(x.r.id)+'">';
      h+='<td class="rowh" title="'+relEscAttr(d.name)+'">'+relEsc(relTrunc(d.name,30))+'<small>'+relEsc(d.type||'')+' \u00b7 '+x.r.nAlders+' alders</small></td>';
      h+='<td class="reltot">'+fmtMoney(x.r.total)+'</td>';
      REL_POS.forEach(p=>{ const c=x.agg[p];
        if(c.a>0){ const op=Math.max(0.30,Math.min(0.95,c.a/(colMax[p]||1)));
          h+='<td class="cell" style="background:'+REL_POS_FILL[p]+';opacity:'+op.toFixed(2)+'" title="'+fmtMoney(c.a)+' to '+c.n+' alder'+(c.n===1?'':'s')+' who voted '+REL_POS_SHORT[p]+'">'+relShortAmt(c.a)+'<small>'+c.n+'</small></td>';
        } else h+='<td class="relempty">\u00b7</td>'; });
      h+='<td><span class="rel-bar" title="'+REL_POS.map(p=>REL_POS_SHORT[p]+' '+fmtMoney(x.agg[p].a)).join(' \u00b7 ')+'">';
      REL_POS.forEach(p=>{ const w=x.agg[p].a/tot*100; if(w>0.01) h+='<span style="width:'+w.toFixed(1)+'%;background:'+REL_POS_FILL[p]+'"></span>'; });
      h+='</span></td></tr>';
    });
    h+='</tbody></table></div>';
    return h;
  }

  // Vote-aware breakdown modal: who a donor funded, grouped by how they voted.
  function relDetailModal(){
    const ex=document.getElementById('ipg-rel-modal-overlay'); if(ex) ex.remove();
    if(!state.relDetailId || !state.cf) return;
    const idx=relBuildIndex(), did=state.relDetailId, d=state.cf.donors[did];
    if(!d){ state.relDetailId=null; return; }
    const vm=relVoteMeta(state.relVoteCode)||D.votemeta[0];
    const m=idx.byDonor.get(did)||new Map();
    let recips=[]; m.forEach((amt,w)=>{ const a=alderByWard(w); if(a) recips.push({w,a,amt,pos:relPosOf(a,vm)}); });
    const total=recips.reduce((s,r)=>s+r.amt,0);

    let h='<div class="ipg-modal-overlay" id="ipg-rel-modal-overlay"><div class="ipg-modal" role="dialog" aria-modal="true">'
      +'<button class="ipg-modal-close" id="ipg-rel-modal-close" aria-label="Close">\u00d7</button>'
      +'<div class="ipg-modal-head"><div class="ipg-modal-kicker">Follow the money \u00b7 '+relEsc(vm.full)+'</div>'
      +'<div class="ipg-modal-name serif">'+relEsc(d.name)+'</div>'
      +'<div class="ipg-modal-meta"><span class="ipg-modal-type">'+relEsc(d.type||'')+'</span>'
      +(d.city?' <span class="ipg-modal-city">\u00b7 '+relEsc(d.city)+'</span>':'')+'</div></div>';
    h+='<div class="ipg-modal-summary">'+stat(fmtMoney(total),'Total to these alders',true)+stat(recips.length.toLocaleString(),'Alders funded')+'</div>';
    h+='<div class="ipg-rel-note" style="margin:2px 0 6px">How that giving breaks down by how each alder voted on this ordinance \u2014 two separate public facts side by side, not evidence one caused the other.</div>';
    REL_POS.forEach(p=>{ const g=recips.filter(r=>r.pos===p).sort((a,b)=>b.amt-a.amt); if(!g.length) return;
      const sub=g.reduce((s,r)=>s+r.amt,0);
      h+='<div class="ipg-section-h" style="margin-top:16px;color:'+REL_POS_FILL[p]+'">'+REL_POS_LABEL[p]+' \u2014 '+fmtMoney(sub)+' to '+g.length+' alder'+(g.length===1?'':'s')+'</div>';
      g.forEach(r=>{ h+='<div class="ipg-cf-row ipg-cf-clickable ipg-rel-recipient" data-ward="'+r.w+'">'
        +'<div><div class="name">Ward '+r.w+' \u2014 '+relEsc(r.a.name)+'</div>'
        +'<div class="sub" style="margin-top:5px">'+pill(r.pos)+'</div></div>'
        +'<div class="amount">'+fmtMoney(r.amt)+'</div></div>'; });
    });
    h+='<div class="ipg-modal-foot">Press Esc, click outside, or use \u00d7 to close.</div></div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
    wireRelModal();
  }

  function wireRelModal(){
    const ov=document.getElementById('ipg-rel-modal-overlay'); if(!ov) return;
    const escFn=e=>{ if(e.key==='Escape') closeFn(); };
    const closeFn=()=>{ state.relDetailId=null; const e=document.getElementById('ipg-rel-modal-overlay'); if(e) e.remove(); document.removeEventListener('keydown',escFn); };
    document.addEventListener('keydown',escFn);
    ov.addEventListener('click',e=>{ if(e.target===ov) closeFn(); });
    const cb=document.getElementById('ipg-rel-modal-close'); if(cb) cb.onclick=closeFn;
    ov.querySelectorAll('.ipg-rel-recipient').forEach(r=>r.onclick=()=>{ const w=parseInt(r.dataset.ward,10); closeFn(); state.ward=w; state.view='member'; state.cfShowAll=false; state.cfCycle='current'; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  }

  // ============================================================
  // FEEDBACK — report a correction / addition / bug
  // ============================================================
  function fbEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  // A human-readable snapshot of what the user is looking at, so a report is
  // actionable without guesswork. Pulled straight from app state.
  function fbContext(){
    const bits=[];
    const viewName={member:'Your Alder',ranking:'Compare by Issue',lookup:'Political Spend',relationship:'Follow the money',record:'Voting Record'}[state.view]||state.view;
    bits.push('View: '+viewName);
    if(state.ward){ const a=(D&&D.alders)?alderByWard(state.ward):null; bits.push('Ward '+state.ward+(a?' \u2014 '+a.name:'')); }
    if(state.view==='relationship'){
      const vm=(D&&D.votemeta)?relVoteMeta(state.relVoteCode):null; if(vm) bits.push('Vote: '+vm.full);
      if(state.relDonorId && state.cf && state.cf.donors[state.relDonorId]) bits.push('Donor: '+state.cf.donors[state.relDonorId].name);
    }
    if(state.cfModalDonorId && state.cf && state.cf.donors[state.cfModalDonorId]) bits.push('Donor: '+state.cf.donors[state.cfModalDonorId].name);
    if(state.view==='lookup') bits.push('Sub-view: '+state.cfLookupSub);
    try{ bits.push('Page: '+location.href); }catch(e){}
    return bits.join(' \u00b7 ');
  }

  function feedbackBarHtml(){
    const m=FEEDBACK_CONFIG.methodologyUrl;
    const methSentence = m
      ? 'If you have questions about our data sources and methodology, see our <a href="'+fbEsc(m)+'" target="_blank" rel="noopener">methodology page</a>. '
      : 'If you have questions about our data sources and methodology, a full methodology page is on the way. ';
    return '<div class="ipg-feedback-bar">'
      +'<strong>We\u2019re committed to keeping this data as accurate as possible.</strong> '
      +methSentence
      +'If you spot an error in the data or a visualization, have something to add, or hit a bug, '
      +'<button class="ipg-fb-trigger" type="button">click here to let us know</button>.'
      +'<br><button class="ipg-fb-btn" type="button">Report a correction or bug</button>'
      +'</div>';
  }

  function mountFeedback(){
    document.querySelectorAll('.ipg-fb-trigger, .ipg-fb-btn').forEach(b=>{ b.onclick=openFeedback; });
    if(FEEDBACK_CONFIG.floatingButton!==false && !document.getElementById('ipg-fb-fab')){
      const fab=document.createElement('button');
      fab.id='ipg-fb-fab'; fab.className='ipg-fb-fab'; fab.type='button';
      fab.setAttribute('aria-label','Report a correction or bug');
      fab.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Feedback</span>';
      fab.onclick=openFeedback;
      document.body.appendChild(fab);
    }
  }

  function openFeedback(){
    const ex=document.getElementById('ipg-fb-overlay'); if(ex) ex.remove();
    const ctx=fbContext();
    const types=['Data correction','Missing data / addition','Bug or display issue','General comment'];
    const h='<div class="ipg-modal-overlay ipg-fb" id="ipg-fb-overlay"><div class="ipg-modal" role="dialog" aria-modal="true" aria-label="Report a correction">'
      +'<button class="ipg-modal-close" id="ipg-fb-close" aria-label="Close">\u00d7</button>'
      +'<div class="ipg-modal-head"><div class="ipg-modal-kicker">Help us keep this accurate</div>'
      +'<div class="ipg-modal-name serif">Report a correction or bug</div>'
      +'<div class="ipg-modal-meta">Tell us what looks wrong or what we\u2019re missing \u2014 the more specific, the faster we can fix it.</div></div>'
      +'<div id="ipg-fb-body">'
      +'<div class="ipg-fb-context"><strong>What you\u2019re viewing:</strong> '+fbEsc(ctx)+'</div>'
      +'<div class="ipg-fb-field"><label>Type</label><select id="ipg-fb-type">'+types.map(t=>'<option>'+t+'</option>').join('')+'</select></div>'
      +'<div class="ipg-fb-field"><label>What\u2019s wrong / what to add <span class="ipg-fb-hint">(required)</span></label>'
      +'<textarea id="ipg-fb-comment" placeholder="e.g. Ward 12\u2019s vote on the budget is shown as Yes, but the roll call shows No."></textarea></div>'
      +'<div class="ipg-fb-field"><label>Source / link with the correct info <span class="ipg-fb-hint">(optional)</span></label><input type="url" id="ipg-fb-link" placeholder="https://\u2026"></div>'
      +'<div class="ipg-fb-field"><label>Screenshots</label><div class="ipg-fb-hint" style="font-size:12.5px;line-height:1.5">Have a screenshot? After sending this, email it to <a href="mailto:'+fbEsc(FEEDBACK_CONFIG.email)+'" style="color:var(--sage,#508F88)">'+fbEsc(FEEDBACK_CONFIG.email)+'</a> and mention what you reported \u2014 we\u2019ll match it to this report.</div></div>'
      +'<div class="ipg-fb-field"><label>Your name <span class="ipg-fb-hint">(optional)</span></label><input type="text" id="ipg-fb-name"></div>'
      +'<div class="ipg-fb-field"><label>Your email <span class="ipg-fb-hint">(optional \u2014 only if you\u2019d like a reply)</span></label><input type="email" id="ipg-fb-email"></div>'
      +'<div class="ipg-fb-actions"><button class="ipg-fb-submit" id="ipg-fb-submit">Send to IPG</button><span class="ipg-fb-status" id="ipg-fb-status"></span></div>'
      +'</div></div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
    wireFeedback();
  }

  function wireFeedback(){
    const ov=document.getElementById('ipg-fb-overlay'); if(!ov) return;
    const escFn=e=>{ if(e.key==='Escape') closeFn(); };
    const closeFn=()=>{ const e=document.getElementById('ipg-fb-overlay'); if(e) e.remove(); document.removeEventListener('keydown',escFn); };
    document.addEventListener('keydown',escFn);
    ov.addEventListener('click',e=>{ if(e.target===ov) closeFn(); });
    const cb=document.getElementById('ipg-fb-close'); if(cb) cb.onclick=closeFn;
    const btn=document.getElementById('ipg-fb-submit'); if(btn) btn.onclick=submitFeedback;
  }

  function fbDone(msg){
    const body=document.getElementById('ipg-fb-body'); if(!body) return;
    body.innerHTML='<div class="ipg-fb-done"><div class="big">\u2713</div><p>'+fbEsc(msg)+'</p></div>';
  }

  function fbMailto(type,comment,link,name,email,ctx){
    const lines=['Type: '+type,'','Comment:',comment,''];
    if(link) lines.push('Source / link: '+link,'');
    lines.push('Context: '+ctx);
    if(name||email) lines.push('','From: '+[name,email].filter(Boolean).join(' / '));
    return 'mailto:'+encodeURIComponent(FEEDBACK_CONFIG.email)
      +'?subject='+encodeURIComponent('[IPG Council Tool] '+type)
      +'&body='+encodeURIComponent(lines.join('\n'));
  }

  async function submitFeedback(){
    const g=id=>document.getElementById(id);
    const comment=(g('ipg-fb-comment').value||'').trim();
    const status=g('ipg-fb-status');
    if(!comment){ status.className='ipg-fb-status err'; status.textContent='Please add a short description first.'; return; }
    const type=g('ipg-fb-type').value, link=(g('ipg-fb-link').value||'').trim();
    const name=(g('ipg-fb-name').value||'').trim(), email=(g('ipg-fb-email').value||'').trim();
    const ctx=fbContext();

    if(FEEDBACK_CONFIG.endpoint){
      const btn=g('ipg-fb-submit'); btn.disabled=true; status.className='ipg-fb-status'; status.textContent='Sending\u2026';
      try{
        const fd=new FormData();
        if(FEEDBACK_CONFIG.accessKey) fd.append('access_key',FEEDBACK_CONFIG.accessKey);
        fd.append('subject','[IPG Council Tool] '+type);
        fd.append('from_name', name||'IPG tool visitor');
        if(email) fd.append('email',email);
        fd.append('type',type);
        fd.append('comment',comment);
        if(link) fd.append('link',link);
        fd.append('context',ctx);
        const r=await fetch(FEEDBACK_CONFIG.endpoint,{method:'POST',headers:{'Accept':'application/json'},body:fd});
        let ok=r.ok; try{ const j=await r.json(); ok = ok && (j.success!==false && j.ok!==false); }catch(e){}
        if(ok){ fbDone('Thank you \u2014 your report reached the IPG team. We review every submission. Have a screenshot? Email it to '+FEEDBACK_CONFIG.email+'.'); return; }
        throw new Error('bad response');
      }catch(e){
        btn.disabled=false; status.className='ipg-fb-status err'; status.textContent='Couldn\u2019t send just now \u2014 ';
        const a=document.createElement('a'); a.href=fbMailto(type,comment,link,name,email,ctx); a.textContent='email it instead'; a.style.color='var(--sage)';
        status.appendChild(a);
      }
    } else {
      window.location.href=fbMailto(type,comment,link,name,email,ctx);
      fbDone('Your email app should have opened with the details filled in. (No mail app? Email '+FEEDBACK_CONFIG.email+' directly.)');
    }
  }

  // Initial render shows a loading skeleton, then fetch populates everything.
  render();
  loadData().then(()=>{ render(); });
})();
</script>
