    h += '<div class="ipg-section-h">Where this industry\u2019s money went</div>';
    h += '<div class="ipg-cf-meta" style="margin-bottom:12px;color:#7d7264">Alders ranked by how much they received from '+meta.label.toLowerCase()+' donors. Click an alder to see their full profile.</div>';
    if(!committeeRows.length){
      h += '<div class="ipg-cf-empty">No committees funded by this industry yet.</div>';
    } else {
      committeeRows.forEach(row => {
        const cmt = state.cf.committees[row.cmt_id];
        if(!cmt) return;
        const pct = totalAmount > 0 ? (row.total / totalAmount) * 100 : 0;
        const pctStr = pct ? ' \u00b7 <strong>'+(pct>=1?Math.round(pct):pct.toFixed(1))+'% of '+meta.label.toLowerCase()+' money</strong>' : '';
        const countStr = row.count+(row.count===1?' contribution':' contributions')+' from '+row.donorCount+(row.donorCount===1?' donor':' donors')+pctStr;
        const isWardRow=(cmt.ward!=null && cmt.type==='candidate');
        if(isWardRow){
          const ward=cmt.ward;
          const alderName = cmt.alder_name || alderByWard(ward)?.name || ('Ward '+ward);
          h += '<div class="ipg-cf-row ipg-cf-clickable ipg-cf-committee-row" data-ward="'+ward+'">'
            + '<div><div class="name">Ward '+ward+' \u2014 '+relEsc(alderName)+'</div>'
            + '<div class="sub">'+countStr+'</div></div>'
            + '<div class="amount">'+fmtMoney(row.total)+'</div></div>';
        } else {
          const cmName=relEsc(cmt.committee_name||cmt.name||'Political committee');
          const isIE=(cmt.type==='independent_expenditure');
          const tag='<span class="ipg-cf-pac-tag">'+(isIE?'IE PAC':'PAC')+'</span>';
          if(isIE){
            h += '<div class="ipg-cf-row ipg-cf-pac-recipient ipg-cf-ie-clickable" data-ie-id="'+relEscAttr(row.cmt_id)+'">'
              + '<div><div class="name"><span class="ipg-cf-paclink">'+cmName+'</span> '+tag+'</div>'
              + '<div class="sub">Independent-expenditure committee \u00b7 '+countStr+'</div></div>'
              + '<div class="amount">'+fmtMoney(row.total)+'</div></div>';
          } else {
            const intId=(cmt.donor_id && state.cf.donors[cmt.donor_id])?cmt.donor_id:null;
            const extUrl=(!intId && cmt.sbe_committee_id)?('https://illinoissunshine.org/committees/'+encodeURIComponent(cmt.sbe_committee_id)+'/'):null;
            let nameHtml;
            if(intId){ nameHtml='<span class="ipg-cf-paclink">'+cmName+'</span>'; }
            else if(extUrl){ nameHtml='<a class="ipg-cf-paclink" href="'+extUrl+'" target="_blank" rel="noopener">'+cmName+' \u2197</a>'; }
            else { nameHtml=cmName; }
            const cls='ipg-cf-row ipg-cf-pac-recipient'+(intId?' ipg-cf-clickable':'');
            const dataAttr=intId?(' data-donor-id="'+relEscAttr(intId)+'"'):'';
            h += '<div class="'+cls+'"'+dataAttr+'>'
              + '<div><div class="name">'+nameHtml+' '+tag+'</div>'
              + '<div class="sub">Political committee \u00b7 '+countStr+'</div></div>'
              + '<div class="amount">'+fmtMoney(row.total)+'</div></div>';
          }
        }
      });
    }

    // Donors in this industry
    h += '<div class="ipg-section-h" style="margin-top:28px">Donors in this category</div>';
    h += '<div class="ipg-cf-meta" style="margin-bottom:12px;color:#7d7264">Click a donor row to see their full footprint across the Council.</div>';
    if(!donorTotals.length){
      h += '<div class="ipg-cf-empty">No donors yet.</div>';
    } else {
      donorTotals.slice(0,25).forEach(({donor, total, count})=>{
        h += '<div class="ipg-cf-row ipg-cf-clickable" data-donor-id="'+donor.id+'">'
          + '<div><div class="name">'+donor.name+'</div>'
          + '<div class="sub">'+count+(count===1?' contribution':' contributions')+'</div>'
          + '<div class="ipg-cf-tags">'+renderIndustryChips(donor,{compact:true})+'</div></div>'
          + '<div class="amount">'+fmtMoney(total)+'</div></div>';
      });
      if(donorTotals.length > 25){
        h += '<div class="ipg-cf-meta" style="margin-top:10px;color:#9a8e7e">Showing top 25 of '+donorTotals.length+' donors. '
          + '<button class="ipg-cf-toggle" id="ipg-industry-see-all" style="margin-left:8px;text-decoration:underline">See all in Browse Donors \u2192</button></div>';
      }
    }
    return h;
  }

  // -----------------------------------------------------------
  // "Industries by Alder" sub-view
  // -----------------------------------------------------------
  // For each alder with campaign data, show a normalized stacked bar of their
  // industry mix. Side-by-side comparison reveals patterns: progressive caucus
  // with heavy labor bands, moderates with heavy real-estate, etc.
  function alderMixSubView(){
    if(!state.cf || !state.cf.committees) return '<div class="ipg-cf-empty">No data loaded.</div>';

    let h = '<div class="ipg-cf-meta" style="margin:8px 0 16px">Where each alder\u2019s <strong>direct contributions</strong> come from, by industry, shown as a 100% bar \u2014 independent spending is not included here. '
      + '<span style="color:#9a8e7e">Bars sorted by ward. Click any bar to see that alder\u2019s full profile.</span></div>';

    // Build a list of (ward, committee_id, total, inds) for every alder with contribs
    const rows = [];
    Object.values(state.cf.committees).forEach(cm => {
      const ward = cm.ward;
      if(!ward) return;
      const inds = cfIndustryTotalsForCommittee(cm.id);
      const total = inds.reduce((s,x)=>s+x.total, 0);
      if(total <= 0) return;
      const alder = alderByWard(ward);
      rows.push({
        ward,
        cm_id: cm.id,
        alder_name: cm.alder_name || (alder ? alder.name : 'Ward '+ward),
        total,
        inds,
        data_quality: cm.data_quality,
      });
    });
    rows.sort((a,b) => a.ward - b.ward);

    if(!rows.length) return h + '<div class="ipg-cf-empty">No campaign-finance data yet.</div>';

    rows.forEach(row => {
      const badge = row.data_quality === 'REAL'
        ? '<span class="ipg-mix-badge ipg-mix-real">Verified</span>'
        : '<span class="ipg-mix-badge ipg-mix-demo">Demo</span>';
      h += '<div class="ipg-mix-row ipg-cf-clickable" data-ward="'+row.ward+'">'
        + '<div class="ipg-mix-head">'
        + '<div class="ipg-mix-name"><strong>Ward '+row.ward+'</strong> \u2014 '+row.alder_name+' '+badge+'</div>'
        + '<div class="ipg-mix-amt">'+fmtMoney(row.total)+'</div>'
        + '</div>'
        + renderDollarBar(row.inds, {clickAction:'none', inlineLabelPct:12})
        + '</div>';
    });
    return h;
  }

  function flagsSubView(){
    const flags=cfFlagTotals();
    let h='<div class="ipg-cf-meta" style="margin:8px 0 16px">Flags ranked by total dollars given by donors carrying that flag. '
      +'<span style="color:#9a8e7e">Flags are sourced editorial assertions about giving patterns or alignments (e.g., AIPAC-affiliated giving, funded BCH opposition). '
      +'Click a flag to filter the donor list to everyone carrying it.</span></div>';
    if(!flags.length) return h+'<div class="ipg-cf-empty">No flagged donors yet. Editors add flags via the Donor Overrides sheet.</div>';
    flags.forEach(x=>{
      const meta=state.cf.flag_types[x.flag]||{label:x.flag,severity:'watch'};
      // String 7 (HALT-DUES, ratified): the dues-disclosure flag's structural zero explains
      // itself -- the row stays rendered (PS-95's flag clause), its amount cell carries the
      // ratified line instead of a bare figure.
      const amt=(x.flag==='pac_dues_funding'&&x.total===0)
        ?'$0 &mdash; dues transfers are excluded from all totals'
        :fmtMoney(x.total);
      h+='<div class="ipg-cf-row ipg-cf-clickable ipg-cf-flag-row" data-flag="'+x.flag+'">'
        +'<div><div class="name">'+meta.label+'</div>'
        +'<div class="sub">'+x.donorCount+(x.donorCount===1?' donor':' donors')+' &middot; funded '+x.committeeCount+(x.committeeCount===1?' committee':' committees')+'</div>'
        +'<div class="ipg-cf-tags"><span class="ipg-cf-flag sev-'+meta.severity+'"><span>'+meta.label+'</span></span></div>'
        +'</div>'
        +'<div class="amount">'+amt+'</div></div>';
    });
    return h;
  }

  // ============================================================
  // ROLLUPS — donor families (parent + members) for display
  // ============================================================
  // Consumes the donor_clusters shape written by sync_overrides.py:
  //   donor_clusters[cid] = {name, relationship, canonical_id,
  //                          members:[ids], roles:{id:role}, ...}
  // Dollars are computed from the embed's own contribution index (cfDonorTotals)
  // so they match the rest of the tool and degrade gracefully if the precomputed
  // totals aren't present. If donor_clusters is absent (pipeline not run yet),
  // every function no-ops and the modal renders exactly as before.
  function cfBuildClusterIndex(){
    if(state._cfClusterIndex) return state._cfClusterIndex;
    const byDonor=new Map();
    const clusters=(state.cf&&state.cf.donor_clusters)||{};
    Object.keys(clusters).forEach(cid=>{
      const c=clusters[cid];
      (c.members||[]).forEach(m=>{
        const mid=(typeof m==='string')?m:(m&&m.id);
        if(mid&&!byDonor.has(mid)) byDonor.set(mid,cid);
      });
    });
    state._cfClusterIndex={byDonor,clusters};
    return state._cfClusterIndex;
  }
  function cfClusterForDonor(donorId){
    const idx=cfBuildClusterIndex();
    const cid=idx.byDonor.get(donorId);
    if(!cid) return null;
    const c=idx.clusters[cid];
    return c?Object.assign({cid:cid},c):null;
  }
  function cfClusterMemberIds(cluster){
    return (cluster.members||[]).map(m=>typeof m==='string'?m:(m&&m.id)).filter(Boolean);
  }
  function cfClusterRole(cluster,memberId){
    if(cluster.canonical_id===memberId) return 'parent';
    if(cluster.roles&&cluster.roles[memberId]) return cluster.roles[memberId];
    const arr=cluster.members||[];
    for(let i=0;i<arr.length;i++){ const m=arr[i]; if(m&&typeof m==='object'&&m.id===memberId&&m.role) return m.role; }
    return 'related';
  }
  function cfRoleLabel(r){
    return ({parent:'Parent','alt-name':'Alternate name','affiliated-pac':'Affiliated PAC',subsidiary:'Subsidiary',related:'Related'})[r]||r;
  }
  function cfRollupTotals(cluster){
    const ids=cfClusterMemberIds(cluster);
    let total=0;
    const members=ids.map(id=>{
      const d=state.cf.donors[id];
      const t=cfDonorTotals(id);
      const amt=t?t.total:0;
      total+=amt;
      return {id:id,donor:d,name:d?d.name:id,role:cfClusterRole(cluster,id),amount:amt};
    });
    members.sort((a,b)=>{
      if(a.role==='parent'&&b.role!=='parent') return -1;
      if(b.role==='parent'&&a.role!=='parent') return 1;
      return b.amount-a.amount;
    });
    return {total:total,members:members};
  }
  // Rollup panel for the donor modal. Parent -> family total + breakdown;
  // child -> a banner linking up to the parent. Returns '' when not in a rollup.
  function rollupPanelHtml(donorId){
    const cluster=cfClusterForDonor(donorId);
    if(!cluster) return '';
    const ids=cfClusterMemberIds(cluster);
    if(ids.length<2) return '';
    const roll=cfRollupTotals(cluster);
    const parentId=cluster.canonical_id||(roll.members[0]&&roll.members[0].id);
    const isParent=(donorId===parentId);
    const rel=cluster.relationship||'affiliated entities';
    const parentName=((state.cf.donors[parentId]||{}).name)||cluster.name||'parent';
    if(isParent){
      let h='<div class="ipg-rollup">'
        +'<div class="ipg-rollup-kicker">Rollup \u00b7 '+relEsc(rel)+'</div>'
        +'<div class="ipg-rollup-total">'+fmtMoney(roll.total)+'</div>'
        +'<div class="ipg-rollup-sub">combined across '+roll.members.length+' affiliated '+(roll.members.length===1?'entity':'entities')+'</div>'
        +'<details class="ipg-rollup-details"'+(roll.members.length<=6?' open':'')+'>'
        +'<summary>Show the '+roll.members.length+' entities in this rollup</summary>';
      roll.members.forEach(m=>{
        h+='<div class="ipg-rollup-member ipg-cf-clickable" data-donor-id="'+relEscAttr(m.id)+'">'
          +'<div><span class="ipg-rollup-name">'+relEsc(m.name)+'</span> '
          +'<span class="ipg-rollup-role role-'+m.role+'">'+cfRoleLabel(m.role)+'</span></div>'
          +'<div class="ipg-rollup-amt">'+fmtMoney(m.amount)+'</div></div>';
      });
      h+='<div class="ipg-rollup-note">Each entity stays a distinct, source-traceable donor; the total is their sum, not a merged record.</div>'
        +'</details></div>';
      return h;
    }
    const myRole=cfClusterRole(cluster,donorId);
    return '<div class="ipg-rollup ipg-rollup-child">'
      +'<div class="ipg-rollup-kicker">Part of a rollup</div>'
      +'<div class="ipg-rollup-childline">This entity '
      +'<span class="ipg-rollup-role role-'+myRole+'">'+cfRoleLabel(myRole)+'</span> '
      +'rolls up into <button class="ipg-rollup-link ipg-cf-clickable" data-donor-id="'+relEscAttr(parentId)+'"><strong>'+relEsc(parentName)+'</strong></button>, '
      +'which gave <strong>'+fmtMoney(roll.total)+'</strong> across '+roll.members.length+' affiliated entities.</div>'
      +'</div>';
  }

  // ============================================================
  // STAGE 2 — DONOR DETAIL MODAL
  // ============================================================
  function renderModal(){
    // Remove any existing modal node first
    const existing=document.getElementById('ipg-modal-overlay');
    if(existing) existing.remove();
    if(!state.cfModalDonorId || !state.cf) return;
    const donor=state.cf.donors[state.cfModalDonorId];
    if(!donor){ state.cfModalDonorId=null; return; }
    // Rollup scope: landing on a rollup parent shows the WHOLE family's giving
    // (every entity's recipients, summed per committee). Drilling into a single
    // entity (state.cfModalAggregate===false) shows just that entity's giving.
    const _cluster=cfClusterForDonor(donor.id);
    const _memberIds=_cluster?cfClusterMemberIds(_cluster):[];
    const _isParentRollup=!!(_cluster && _cluster.canonical_id===donor.id && _memberIds.length>=2);
    const aggregate=_isParentRollup && state.cfModalAggregate!==false;
    let totals, recipients;
    if(aggregate){
      recipients=cfAggregateRecipients(_memberIds);
      const fam=cfRollupTotals(_cluster);
      const cyc=new Set(); recipients.forEach(r=>r.cycles.forEach(c=>cyc.add(c)));
      totals={total:fam.total, committeeCount:recipients.length,
              contribCount:recipients.reduce((s,r)=>s+r.count,0), cycles:[...cyc].sort()};
    } else {
      totals=cfDonorTotals(donor.id);
      recipients=cfDonorRecipients(donor.id);
    }

    let h='<div class="ipg-modal-overlay" id="ipg-modal-overlay"><div class="ipg-modal" role="dialog" aria-modal="true">'
      +'<button class="ipg-modal-close" id="ipg-modal-close" aria-label="Close">×</button>'
      +'<div class="ipg-modal-head">'
      +'<div class="ipg-modal-kicker">Donor profile</div>'
      +'<div class="ipg-modal-name serif">'+donor.name+'</div>'
      +'<div class="ipg-modal-meta">'
      +renderIndustryChips(donor)
      +' <span class="ipg-modal-type">'+donor.type+'</span>'
      +(donor.city?' <span class="ipg-modal-city">· '+donor.city+'</span>':'')
      +(donor.occupation?' <span class="ipg-modal-city">· '+donor.occupation+'</span>':'')
      +(donor.employer?' <span class="ipg-modal-city">· '+donor.employer+'</span>':'')
      +'</div>';

    // Flags if any
    if(donor.flags && donor.flags.length){
      h+='<div class="ipg-modal-flags">';
      donor.flags.forEach(f=>{
        const ft=state.cf.flag_types[f.type]; if(!ft) return;
        const inner=f.source_url
          ?'<a href="'+f.source_url+'" target="_blank" rel="noopener" title="'+(f.note||'')+'">'+ft.label+' ↗</a>'
          :'<span title="'+(f.note||'')+'">'+ft.label+'</span>';
        h+='<span class="ipg-cf-flag sev-'+ft.severity+'">'+inner+'</span>';
      });
      h+='</div>';
    }
    h+='</div>'; // /modal-head

    // Rollup context (donor family): family total + breakdown, or child banner.
    h+=rollupPanelHtml(donor.id);

    // Summary stats. The total's basis label is string 1 (PS-93: a non-window figure
    // states what it covers); a donor whose giving is entirely out-of-subject renders
    // the ratified empty state (string 2) instead of an unexplained zero.
    if(totals){
      h+='<div class="ipg-modal-summary">';
      h+=stat(fmtMoney(totals.total),'Total since the 2011 city council term',true);
      h+=stat(totals.committeeCount.toLocaleString(),'Committees funded');
      h+=stat(totals.contribCount.toLocaleString(),'Contributions');
      h+=stat(totals.cycles.join(' · '),'Cycles');
      h+='</div>';
      if(!totals.contribCount && totals.preCount)
        h+='<div class="ipg-cf-meta">No contributions in the cycles this tool covers.</div>';
    }

    // Recipient list
    h+='<div class="ipg-section-h" style="margin-top:18px">Recipients across the Council'+(aggregate?' <span style="font-weight:400;color:#9a8e7e;font-size:.8em">· combined across all '+_memberIds.length+' entities</span>':'')+'</div>';
    if(aggregate){ h+='<div class="ipg-cf-meta" style="margin:-4px 0 10px;color:#9a8e7e;font-size:12px">Every recipient this rollup gave to, summed across its entities. Click an entity in the rollup above to see just its giving.</div>'; }
    if(!recipients.length){
      h+='<div class="ipg-cf-empty">No contributions recorded.</div>';
    } else {
      recipients.forEach(r=>{
        const cm=state.cf.committees[r.committee_id];
        if(!cm) return;
        const cycleList=sortCycles(Array.from(r.cycles)).join(', ');
        const countStr=r.count+(r.count===1?' contribution':' contributions')+' · cycles: '+cycleList;
        const isWardRow=(cm.ward!=null && cm.type==='candidate');
        if(isWardRow){
          h+='<div class="ipg-cf-row ipg-cf-clickable ipg-cf-recipient" data-ward="'+cm.ward+'">'
            +'<div><div class="name">Ward '+cm.ward+' \u2014 '+relEsc(cm.alder_name||'')+'</div>'
            +'<div class="sub">'+relEsc(cm.committee_name||'Committee')+' · '+countStr+'</div>'
            +'</div>'
            +'<div class="amount">'+fmtMoney(r.total)+'</div></div>';
        } else {
          // Recipient is a political / independent-expenditure committee, not a
          // ward-mapped alder committee — render its name (not "Ward null"), tag it.
          const cmName=relEsc(cm.committee_name||cm.name||'Political committee');
          const isIE=(cm.type==='independent_expenditure');
          const tag='<span class="ipg-cf-pac-tag">'+(isIE?'IE PAC':'PAC')+'</span>';
          if(isIE){
            // IE committees open their own in-tool detail (spend for/against + funders).
            h+='<div class="ipg-cf-row ipg-cf-pac-recipient ipg-cf-ie-clickable" data-ie-id="'+relEscAttr(r.committee_id)+'">'
              +'<div><div class="name"><span class="ipg-cf-paclink">'+cmName+'</span> '+tag+'</div>'
              +'<div class="sub">Independent-expenditure committee \u00b7 '+countStr+'</div>'
              +'</div>'
              +'<div class="amount">'+fmtMoney(r.total)+'</div></div>';
          } else {
            const intId=(cm.donor_id && state.cf.donors[cm.donor_id])?cm.donor_id:null;
            const extUrl=(!intId && cm.sbe_committee_id)?('https://illinoissunshine.org/committees/'+encodeURIComponent(cm.sbe_committee_id)+'/'):null;
            let nameHtml;
            if(intId){ nameHtml='<span class="ipg-cf-paclink">'+cmName+'</span>'; }
            else if(extUrl){ nameHtml='<a class="ipg-cf-paclink" href="'+extUrl+'" target="_blank" rel="noopener">'+cmName+' \u2197</a>'; }
            else { nameHtml=cmName; }
            const cls='ipg-cf-row ipg-cf-pac-recipient'+(intId?' ipg-cf-clickable':'');
            const dataAttr=intId?(' data-donor-id="'+relEscAttr(intId)+'"'):'';
            h+='<div class="'+cls+'"'+dataAttr+'>'
              +'<div><div class="name">'+nameHtml+' '+tag+'</div>'
              +'<div class="sub">Political committee \u00b7 '+countStr+'</div>'
              +'</div>'
              +'<div class="amount">'+fmtMoney(r.total)+'</div></div>';
          }
        }
      });
    }

    h+='<div class="ipg-modal-foot">Press Esc, click outside, or use × to close.</div>';
    h+='</div></div>'; // /modal /overlay
    document.body.insertAdjacentHTML('beforeend',h);
    wireModal();
  }

  function wireModal(){
    const ov=document.getElementById('ipg-modal-overlay'); if(!ov) return;
    const closeFn=()=>{ state.cfModalDonorId=null; const e=document.getElementById('ipg-modal-overlay'); if(e) e.remove(); document.removeEventListener('keydown',escFn); };
    const escFn=e=>{ if(e.key==='Escape') closeFn(); };
    document.addEventListener('keydown',escFn);
    ov.addEventListener('click',e=>{ if(e.target===ov) closeFn(); });
    const closeBtn=document.getElementById('ipg-modal-close');
    if(closeBtn) closeBtn.onclick=closeFn;
    // Recipient rows: jump to that alder's view
    ov.querySelectorAll('.ipg-cf-recipient').forEach(r=>r.onclick=()=>{
      const w=parseInt(r.dataset.ward);
      closeFn();
      state.ward=w; state.view='member'; state.cfShowAll=false; state.cfCycle='current'; render();
      window.scrollTo({top:0,behavior:'smooth'});
    });
    // PAC / IE-committee recipient rows that bridge to an in-tool donor profile.
    ov.querySelectorAll('.ipg-cf-pac-recipient[data-donor-id]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      state.cfModalDonorId=el.dataset.donorId; state.cfModalAggregate=true;
      renderModal();
    });
    // IE-committee recipient rows → open the IE-committee detail (spend + funders).
    ov.querySelectorAll('.ipg-cf-ie-clickable[data-ie-id]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      state.cfModalDonorId=null;
      const o=document.getElementById('ipg-modal-overlay'); if(o) o.remove();
      state.cfModalCommitteeId=el.dataset.ieId; state.cfIEFundersAll=false;
      renderIECommitteeModal();
    });
    // Rollup breakdown: clicking a single entity shows just its giving…
    ov.querySelectorAll('.ipg-rollup-member[data-donor-id]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      state.cfModalDonorId=el.dataset.donorId; state.cfModalAggregate=false;
      renderModal();
    });
    // …while a child's "rolls up into <parent>" link opens the full family view.
    ov.querySelectorAll('.ipg-rollup-link[data-donor-id]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      state.cfModalDonorId=el.dataset.donorId; state.cfModalAggregate=true;
      renderModal();
    });
  }

  // ============================================================
  // INDEPENDENT-EXPENDITURE COMMITTEE DETAIL MODAL
  // ============================================================
  // Opened from any "IE PAC" row (Browse donors) or from an IE recipient inside a
  // donor's profile. Shows what the committee spent for/against (independent of the
  // candidates) and who funds it.
  function renderIECommitteeModal(){
    const existing=document.getElementById('ipg-ie-overlay');
    if(existing) existing.remove();
    if(!state.cfModalCommitteeId || !state.cf) return;
    const cid=state.cfModalCommitteeId;
    const cm=state.cf.committees[cid];
    const sp=cfIESpender(cid);
    if(!cm && !sp){ state.cfModalCommitteeId=null; return; }
    const name=(cm&&(cm.committee_name||cm.name))||(sp&&sp.name)||cid;
    const inds=(cm&&cm.industry_tags&&cm.industry_tags.length)?cm.industry_tags:(sp?sp.industries:['unclassified']);
    const targets=cfIESpendByTarget(cid);
    const funders=cfIEFunders(cid);
    const support=sp?sp.support:0, oppose=sp?sp.oppose:0, total=sp?sp.total:0, count=sp?sp.count:0;
    const fundTotal=funders.reduce((s,f)=>s+f.total,0);
    const sbe=cm&&cm.sbe_committee_id;
    const chips=(inds||[]).map(k=>{const m=state.cf.industry_tags[k]||{label:k,color:'#cfc5b5'};return '<span class="ipg-cf-chip" style="background:'+m.color+';color:'+readableText(m.color)+'">'+m.label+'</span>';}).join('');

    let h='<div class="ipg-modal-overlay" id="ipg-ie-overlay"><div class="ipg-modal" role="dialog" aria-modal="true">'
      +'<button class="ipg-modal-close" id="ipg-ie-close" aria-label="Close">\u00d7</button>'
      +'<div class="ipg-modal-head">'
      +'<div class="ipg-modal-kicker">Independent-expenditure committee</div>'
      +'<div class="ipg-modal-name serif">'+relEsc(name)+' <span class="ipg-cf-pac-tag">IE PAC</span></div>'
      +'<div class="ipg-modal-meta">'+chips
      +(sbe?' <a class="ipg-cf-paclink" href="https://illinoissunshine.org/committees/'+encodeURIComponent(sbe)+'/" target="_blank" rel="noopener" style="font-size:12px">View on Illinois Sunshine \u2197</a>':'')
      +'</div></div>';

    h+='<div class="ipg-rollup" style="border-color:var(--line)"><div class="ipg-rollup-childline" style="font-size:12.5px;color:#6a5d4e">'
      +'<strong>Independent spending</strong> is made <em>without</em> coordinating with the candidate \u2014 the candidate need not know about it, approve it, or receive any of it. It is even more attenuated from a vote than a direct contribution. This shows correlation, not causation.</div></div>';

    h+='<div class="ipg-modal-summary">';
    h+=stat(fmtMoney(total),'Total independent spend',true);
    h+=stat(fmtMoney(support),'Spent to support');
    h+=stat(fmtMoney(oppose),'Spent to oppose');
    h+=stat(targets.length.toLocaleString(),targets.length===1?'Alder targeted':'Alders targeted');
    h+='</div>';

    // Who it spent for / against
    h+='<div class="ipg-section-h" style="margin-top:18px">What it spent on</div>';
    if(!targets.length){ h+='<div class="ipg-cf-empty">No itemized independent expenditures recorded.</div>'; }
    else {
      targets.forEach(t=>{
        const bits=[];
        if(t.support) bits.push('<span style="color:var(--aff)">'+fmtMoney(t.support)+' for</span>');
        if(t.oppose) bits.push('<span style="color:var(--opp)">'+fmtMoney(t.oppose)+' against</span>');
        h+='<div class="ipg-cf-row ipg-cf-clickable ipg-cf-ie-target" data-ward="'+relEscAttr(t.ward)+'">'
          +'<div><div class="name">Ward '+relEsc(t.ward)+' \u2014 '+relEsc(t.name)+'</div>'
          +'<div class="sub">'+bits.join(' \u00b7 ')+' \u00b7 '+t.count+(t.count===1?' expenditure':' expenditures')+'</div></div>'
          +'<div class="amount">'+fmtMoney(t.total)+'</div></div>';
      });
    }

    // Who funds it
    h+='<div class="ipg-section-h" style="margin-top:18px">Who funds this committee'
      +' <span style="font-weight:400;color:#9a8e7e;font-size:.8em">\u00b7 '+fmtMoney(fundTotal)+' from '+funders.length+(funders.length===1?' funder':' funders')+'</span></div>';
    h+='<div class="ipg-cf-meta" style="margin:-4px 0 10px;color:#9a8e7e;font-size:12px">Internal dues transfers (a committee funding its own affiliated PAC) are excluded \u2014 only outside money is shown.</div>';
    if(!funders.length){ h+='<div class="ipg-cf-empty">No outside funding recorded.</div>'; }
    else {
      const showF=state.cfIEFundersAll?funders.length:Math.min(15,funders.length);
      for(let i=0;i<showF;i++){
        const f=funders[i];
        const known=!!(state.cf.donors[f.donor_id]);
        const cls='ipg-cf-row'+(known?' ipg-cf-clickable':'');
        const da=known?(' data-donor-id="'+relEscAttr(f.donor_id)+'"'):'';
        h+='<div class="'+cls+'"'+da+'>'
          +'<div><div class="name">'+relEsc(f.donor.name||f.donor_id)+'</div>'
          +'<div class="sub">'+f.count+(f.count===1?' contribution':' contributions')+'</div></div>'
          +'<div class="amount">'+fmtMoney(f.total)+'</div></div>';
      }
      if(funders.length>15){
        h+='<button class="ipg-cf-toggle" id="ipg-ie-funders-toggle">'
          +(state.cfIEFundersAll?'Show top 15 only \u2191':'Show all '+funders.length+' funders \u2193')+'</button>';
      }
    }

    h+='<div class="ipg-modal-foot">Press Esc, click outside, or use \u00d7 to close.</div>';
    h+='</div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
    wireIEModal();
  }

  function wireIEModal(){
    const ov=document.getElementById('ipg-ie-overlay'); if(!ov) return;
    const closeFn=()=>{ state.cfModalCommitteeId=null; state.cfIEFundersAll=false; const e=document.getElementById('ipg-ie-overlay'); if(e) e.remove(); document.removeEventListener('keydown',escFn); };
    const escFn=e=>{ if(e.key==='Escape') closeFn(); };

// ===== inserted into the embed IIFE: Complete Voting Record (Tier 2) =====
const RC_LBL={yes:'Yes',no:'No',present:'Present',absent:'Absent'};
function recPosKey(p){return RC_LBL[p]?p:'absent';}
function recVotesSorted(){return ((D.rollcall||{}).votes||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function recFeatured(){const m={};(D.votemeta||[]).forEach(v=>{if(v.vote_id)m[v.vote_id]=v;});return m;}
function recVoteTag(v,f){return v.tag||(f[v.id]&&f[v.id].tag)||null;}
function recTags(){const f=recFeatured(),s={};recVotesSorted().forEach(v=>{const t=recVoteTag(v,f);if(t)s[t]=1;});return Object.keys(s).sort();}
function recTypes(){const s={};recVotesSorted().forEach(v=>{if(v.type)s[v.type]=1;});return Object.keys(s).sort();}
function recTypeLabel(t){return String(t||'').replace(/\b\w/g,c=>c.toUpperCase());}
function recTallyStr(t){t=t||{};const out=[];['yes','no','present','absent'].forEach(k=>{if(t[k])out.push(t[k]+' '+RC_LBL[k]);});Object.keys(t).forEach(k=>{if(['yes','no','present','absent'].indexOf(k)<0)out.push(t[k]+' '+k);});return out.join(' \u00b7 ');}
function recFilter(v,f){
  if(state.recTag&&state.recTag!=='All'&&recVoteTag(v,f)!==state.recTag)return false;
  if(state.recType&&state.recType!=='All'&&v.type!==state.recType)return false;
  if(state.recSearch){const q=state.recSearch.toLowerCase();if(((v.title||'')+' '+(v.bill||'')).toLowerCase().indexOf(q)<0)return false;}
  return true;
}
function recDetail(v,ward,feat){
  const groups={yes:[],no:[],present:[],absent:[]},pos=v.positions||{};
  Object.keys(pos).forEach(w=>{const k=recPosKey(pos[w]);const a=alderByWard(parseInt(w,10));groups[k].push({w:w,name:a?a.name:('Ward '+w)});});
  function col(k){const arr=groups[k].slice().sort((x,y)=>(+x.w)-(+y.w));if(!arr.length)return'';
    return '<div><h5><span class="rec-dot '+k+'"></span>'+RC_LBL[k]+' ('+arr.length+')</h5><ul>'
      +arr.map(m=>{const me=ward&&String(m.w)===String(ward);return '<li class="'+(me?'me':'')+'">'+relEsc(m.name)+' \u00b7 W'+m.w+(me?' \u2190':'')+'</li>';}).join('')+'</ul></div>';}
  let lead='';
  if(feat)lead='<p class="full"><strong>'+relEsc(feat.full||feat.code)+'</strong>'+(feat.desc?' \u2014 '+relEsc(feat.desc):'')+'</p>';
  const src=v.source_url?'<p class="full">Source: <a href="'+relEscAttr(v.source_url)+'" target="_blank" rel="noopener">official record \u2192</a></p>':'';
  return '<div class="rec-detail" onclick="event.stopPropagation()">'+lead+'<div class="rec-roll">'+col('yes')+col('no')+col('present')+col('absent')+'</div>'+src+'</div>';
}
function recVoteRows(ward,raw){
  const f=recFeatured();
  const rows=recVotesSorted().filter(v=>raw?true:recFilter(v,f));
  if(!rows.length)return '<div class="ipg-empty">No votes match these filters.</div>';
  return rows.map(v=>{
    const feat=f[v.id],tag=recVoteTag(v,f);
    let posHtml='';
    if(ward){const p=(v.positions||{})[ward];posHtml='<span class="rec-pos '+recPosKey(p)+'">'+(RC_LBL[p]||'\u2014')+'</span>';}
    const meta='<div class="rec-meta">'+(feat?'<span class="rec-star">\u2605 '+relEsc(feat.code||'Featured')+'</span>':'')
      +'<span>'+fmtDateLong(v.date)+'</span><span>'+relEsc(v.bill||'')+'</span>'
      +(v.type?'<span class="rec-vtype">'+relEsc(recTypeLabel(v.type))+'</span>':'')
      +(tag?'<span class="rec-vtag">'+relEsc(tag)+'</span>':'')+'</div>';
    return '<div class="rec-vote" data-id="'+relEscAttr(v.id)+'"><div>'+meta+'<div class="rec-vtitle">'+relEsc(v.title||'(untitled measure)')+'</div></div>'
      +'<div class="rec-right"><div class="rec-tally">'+recTallyStr(v.tally)+'<span class="res">'+relEsc(v.result||'')+'</span></div>'+posHtml+'</div>'
      +(state.recOpen===v.id?recDetail(v,ward,feat):'')+'</div>';
  }).join('');
}
function recSummary(raw){
  const f=recFeatured();
  const rows=recVotesSorted().filter(v=>raw?true:recFilter(v,f));
  if(!state.ward)return '<div class="rec-summary"><span><b>'+rows.length+'</b> divided votes'+(!raw&&state.recTag&&state.recTag!=='All'?' tagged \u201c'+relEsc(state.recTag)+'\u201d':'')+(!raw&&state.recType&&state.recType!=='All'?' \u00b7 '+relEsc(recTypeLabel(state.recType)):'')+' this term.</span></div>';
  const a=alderByWard(state.ward),c={yes:0,no:0,present:0,absent:0};
  rows.forEach(v=>{const p=(v.positions||{})[state.ward];c[recPosKey(p)]++;});
  return '<div class="rec-summary"><span><b>'+relEsc(a?a.name:('Ward '+state.ward))+'</b> \u00b7 Ward '+state.ward+'</span>'
    +'<span class="pill"><span class="rec-dot yes"></span>'+c.yes+' Yes</span>'
    +'<span class="pill"><span class="rec-dot no"></span>'+c.no+' No</span>'
    +'<span class="pill"><span class="rec-dot present"></span>'+c.present+' Present</span>'
    +'<span class="pill"><span class="rec-dot absent"></span>'+c.absent+' Absent</span>'
    +'<span>of <b>'+rows.length+'</b> votes</span></div>';
}
function recTagChips(){
  const tags=recTags();if(!tags.length)return'';
  let h='<div class="rec-tags"><button class="rec-tag'+((!state.recTag||state.recTag==='All')?' on':'')+'" data-rectag="All">All topics</button>';
  tags.forEach(t=>{h+='<button class="rec-tag'+(state.recTag===t?' on':'')+'" data-rectag="'+relEscAttr(t)+'">'+relEsc(t)+'</button>';});
  return h+'</div>';
}
  // ===== METHODOLOGY (static editorial page) =====
  function methodologyView(){
    return `<div class="ipg-meth">
      <div class="ipg-meth-kicker">Methodology &amp; data sources</div>
      <h2 class="ipg-meth-doctitle serif">How this tool is built</h2>
      <div class="ipg-meth-updated">Chicago City Council Accountability Tool &mdash; Institute for the Public Good &middot; Last updated June 8, 2026</div>

      <div class="ipg-meth-toc">
        <div class="lbl">On this page</div>
        <div class="links">
          <button type="button" data-meth-target="meth-overview">What this tool does</button>
          <button type="button" data-meth-target="meth-voting">The voting record</button>
          <button type="button" data-meth-target="meth-finance">Campaign finance</button>
          <button type="button" data-meth-target="meth-donors">Identifying donors</button>
          <button type="button" data-meth-target="meth-ie">Independent expenditures</button>
          <button type="button" data-meth-target="meth-moneyvotes">Money &amp; votes together</button>
          <button type="button" data-meth-target="meth-ward">Finding your ward</button>
          <button type="button" data-meth-target="meth-current">Keeping data current</button>
          <button type="button" data-meth-target="meth-limits">Limitations</button>
          <button type="button" data-meth-target="meth-corrections">Corrections &amp; bugs</button>
        </div>
      </div>

      <h3 class="ipg-meth-h first" id="meth-overview">What this tool does</h3>
      <p>This tool brings together two public records that usually sit far apart: <strong>how each of Chicago's 50 alderpersons votes</strong> on the contested (divided) measures that come before the Council, and <strong>who funds their campaigns</strong>. Our goal is to make both legible to any resident, side by side, without requiring a subscription, a FOIA request, or a background in campaign-finance law.</p>
      <p>One principle shapes every design choice on this site, and we want to state it plainly before anything else:</p>
      <div class="ipg-meth-callout">
        <p><strong>Association is not causation.</strong> When this tool shows that a member voted a certain way and also received money from a particular industry or donor, it is showing two facts that are both true. It is <strong>not</strong> claiming that the money caused the vote. Campaign contributions, shared ideology, district interests, party, and constituent pressure all travel together and are difficult to disentangle. We present the patterns and let you draw your own conclusions; we deliberately avoid language that asserts a contribution &ldquo;bought&rdquo; a vote.</p>
        <p>You will see this caveat repeated wherever money and votes are shown together. That repetition is intentional.</p>
      </div>

      <h3 class="ipg-meth-h" id="meth-voting">The voting record</h3>
      <h4 class="ipg-meth-sub">Where the positions come from</h4>
      <p>Chicago's City Council does not record a per-member position on every item it passes. Most routine business &mdash; permits, honorifics, omnibus packages &mdash; passes by voice vote, with no individual record of who voted how. A member-by-member roll call exists <strong>only when a vote is divided</strong> (non-unanimous) and a roll call is taken.</p>
      <p>This tool therefore records <strong>every divided roll-call vote of the current (2023&ndash;2027) Council term</strong>. The positions are the factual roll-call record as published by the <strong>Chicago City Clerk</strong> (through the Council's Legistar system) and accessed via <strong>DataMade's Councilmatic</strong>, which mirrors the Clerk's data in the Open Civic Data standard. We refresh from that source on a regular automated schedule, so newly recorded divided votes appear here as the City Clerk's data is updated. Members' tenure, party, and neighborhood details come from public records, including the Chicago City Council roster.</p>
      <p><strong>Seats that changed hands mid-term.</strong> A few wards changed representatives during the 2023&ndash;2027 term, and a ward's voting record reflects whoever held the seat at the time of each vote &mdash; we do not split it into a separate per-person record. In Ward 27, the record spans Walter Burnett Jr.'s tenure and continues under Walter Burnett III, who was appointed in September 2025; Ward 35 also saw a mid-term change.</p>
      <p>Because only divided votes generate a per-member record, this is a <strong>complete record of the contested votes</strong> &mdash; not of all Council activity. We think that's the right scope for an accountability tool: unanimous, uncontested business reveals little about how a member weighs a hard choice, while divided votes are exactly where members had to take a side.</p>
      <h4 class="ipg-meth-sub">How positions are labeled</h4>
      <p>We report the <strong>factual roll-call position</strong> for each member on each vote. We do not reinterpret, translate, or re-code votes &mdash; the label is simply what the Clerk's record shows, normalized into four plain values:</p>
      <ul>
        <li><strong>Yes</strong> &mdash; voted in favor of the measure as it appeared on the floor.</li>
        <li><strong>No</strong> &mdash; voted against it.</li>
        <li><strong>Present</strong> &mdash; was present but cast no Yes/No. This folds together <em>present</em>, <em>not voting</em>, and <em>abstain</em>.</li>
        <li><strong>Absent</strong> &mdash; has no recorded vote. This folds together <em>absent</em> and <em>excused</em>.</li>
      </ul>
      <p>That is the entire scheme. We do <strong>not</strong> restate a vote as &ldquo;support&rdquo; or &ldquo;opposition&rdquo; for a cause, and we do <strong>not</strong> reverse-code any vote. A &ldquo;Yes&rdquo; means the member voted yes on the measure on the floor &mdash; nothing more, nothing less. To understand what a Yes or No <em>did</em> in substance, read the plain-language description attached to each vote, which explains what the measure was.</p>
      <h4 class="ipg-meth-sub">Key votes</h4>
      <p>Within the full set of divided votes, some carry a <strong>key vote</strong> designation. A key vote is one that drew significant public attention &mdash; through community or advocacy pressure, sustained media coverage, or because it was novel or precedent-setting.</p>
      <p>The key-vote label is an <strong>editorial judgment about prominence, not a different way of counting the vote.</strong> A key vote is recorded with the exact same factual Yes / No / Present / Absent positions as every other divided vote; it is simply surfaced more prominently, given a plain-language description, and grouped by topic so readers can quickly find the votes that drew the most attention.</p>

      <h3 class="ipg-meth-h" id="meth-finance">The campaign-finance data</h3>
      <h4 class="ipg-meth-sub">Source</h4>
      <p>All contribution data comes from <strong>campaign-finance disclosure reports filed with the Illinois State Board of Elections (SBE)</strong>. These are the same public filings that candidates and committees are legally required to submit. We ingest the raw filings and attribute them to the relevant member's campaign committee.</p>
      <p>The data shown covers contributions reported for all of the current council members. The tool also lets you switch between a current-cycle view and an all-time view.</p>
      <h4 class="ipg-meth-sub">What counts as a contribution shown here</h4>
      <p>We include itemized contributions as reported to the SBE. A few handling notes:</p>
      <ul>
        <li><strong>Itemization follows the SBE record.</strong> Contribution data is pulled directly from Illinois State Board of Elections filings, and our itemization and disclosure boundaries follow the filings themselves &mdash; every contribution the SBE itemizes, we itemize and attribute to the named donor. (Donor-cluster roll-up totals &mdash; which stand in for a group of related records rather than a single identifiable donor &mdash; remain excluded from the donor-network and &ldquo;Follow the money&rdquo; relationship views.)</li>
        <li>Amounts and dates reflect what was reported in the filings. Filers occasionally amend, misreport, or duplicate entries; see <em>Limitations</em> below.</li>
        <li>This tool also excludes contributions with no usable date. Because their date is unknown, they cannot be placed in any cycle and are not shown in any view.</li>
      </ul>

      <h3 class="ipg-meth-h" id="meth-donors">How we identify and group donors</h3>
      <p>Raw campaign-finance data is messy: the same union, firm, or person can appear under a dozen slightly different names. To make donor totals meaningful, we do careful, editor-reviewed <strong>entity resolution</strong>. We use exactly three operations, and the distinction between them is central to our integrity:</p>
      <ul>
        <li><strong>Tagging</strong> &mdash; we attach an industry classification, an optional flag, and editorial notes to a donor. This adds context; it changes no totals.</li>
        <li><strong>Merging</strong> &mdash; used <strong>only</strong> when two records are genuinely the <em>same</em> filing recorded twice (a re-ingested report, a trailing space, an encoding artifact). In that narrow case we combine them into one record. This is the only operation that removes a record, and it is reserved for true duplicates.</li>
        <li><strong>Rolling up</strong> &mdash; used to group an organization's <em>related</em> entities &mdash; for example, a union and its political action committee, or a company and its affiliated PAC &mdash; under a single parent for display. <strong>A rollup never deletes anything.</strong> Every underlying record stays in the data, individually traceable to its original SBE filing. The parent shows an aggregate total, and that total can always be expanded to the role-tagged breakdown of the members that compose it.</li>
      </ul>
      <p>When we show that an organization &ldquo;gave $X,&rdquo; that figure is <strong>auditable, not asserted</strong>: you can open it and see the specific SBE-sourced records that sum to it, each labeled by its role (the organization itself, an affiliated PAC, a subsidiary, an alternate name, or a related entity). We chose this design precisely <em>because</em> it keeps the receipts.</p>
      <h4 class="ipg-meth-sub">Industry classifications and flags</h4>
      <p>Donors are classified into industry categories (for example, real estate, labor, finance, healthcare) drawn from a <strong>controlled, published vocabulary</strong> maintained by our editors. Some donors also carry <strong>flags</strong> that note something a reader might want to weigh (for example, an entity under indictment, or a donor tied to a specific zoning or policy interest). Classifications and flags are <strong>editorial judgments</strong>, applied by hand against a fixed vocabulary; reasonable people may disagree with a given call, and we welcome correction (see below).</p>

      <h3 class="ipg-meth-h" id="meth-ie">Independent expenditures and who funds them</h3>
      <p>Not all political money flows directly to a candidate's campaign. A significant share is spent <em>independently</em> &mdash; by committees that support or oppose a candidate without coordinating with them. This tool surfaces that money too, and because it behaves differently from a direct contribution, we handle and label it with particular care.</p>
      <h4 class="ipg-meth-sub">What an independent expenditure is</h4>
      <p>An independent expenditure (IE) is money a committee spends to support or oppose a candidate <em>without</em> giving it to, or coordinating with, that candidate's campaign &mdash; a mailer, an ad buy, a field operation for or against someone. By law it is independent: the candidate need not know about it, approve it, or receive a cent of it. We draw IEs from the State Board of Elections' expenditure filings, counting only those the filer marked as supporting or opposing a specific candidate, and we match each one by candidate name (using ward to disambiguate) to the current 50 alderpersons, shown as <strong>support</strong> or <strong>opposition</strong> spending. Spending that named a <em>former</em> officeholder is out of scope, as pre-2011 contributions are. Because filers re-report the same expenditure across quarterly filings, we collapse exact duplicates so each is counted once.</p>
      <p>Transfers of member dues between political committees are excluded from all totals. In this dataset they account for $36,121,256.16 across 252 transactions.</p>
      <div class="ipg-meth-callout">
        <p><strong>IE spending <em>for</em> a member is not a contribution <em>to</em> that member.</strong> It means an outside committee spent money on that race &mdash; not that the member solicited, received, or controlled it. Because independent expenditures are by definition made without the candidate's involvement, any association between IE activity and a member's vote is <strong>even more attenuated</strong> than for a direct contribution. The association-is-not-causation principle applies here with extra force.</p>
      </div>
      <h4 class="ipg-meth-sub">Who funds these committees</h4>
      <p>An independent-expenditure committee is itself funded by someone &mdash; and that funding is often the more revealing fact. So alongside the spending, we surface the <strong>money flowing into the IE committees</strong>: the donors and organizations that bankroll them. When a person or company puts large sums into a committee that then spends to support or oppose Council candidates, that link is exactly what this tool exists to make visible.</p>
      <h4 class="ipg-meth-sub">What we exclude: an organization funding its own committee</h4>
      <p>One category of money flowing into these committees is <strong>not</strong> outside money and <strong>not</strong> spending on a Council race &mdash; it is an organization moving its own money into its own political fund. The clearest example is a union transferring a portion of its members' <strong>dues</strong> into its own affiliated PAC. That transfer capitalizes the PAC; it is the organization filling its own account, not giving to a candidate or spending on an election. Counting these internal transfers as &ldquo;giving&rdquo; would badly overstate what an organization actually directed toward Council politics &mdash; in some cases by tens of millions of dollars. So we identify these dues-and-membership transfers (the filings label them as such) and <strong>exclude them from giving and spending totals.</strong></p>
      <p>We are deliberately narrow about this. We exclude <strong>only</strong> an organization's transfers into its <em>own</em> fund. Money from a genuine third party into an IE committee &mdash; a person or company funding a committee they do not control &mdash; is <strong>kept</strong>, because that is real outside money and exactly what should be shown. And consistent with everything else here, <strong>nothing is deleted.</strong> A dues transfer is reclassified, not removed: the underlying record stays in the data, individually traceable to its SBE filing and labeled for what it is. You can always see that the money exists and where it went &mdash; we have simply declined to count an organization's self-funding as political giving.</p>

      <h3 class="ipg-meth-h" id="meth-moneyvotes">Showing money and votes together</h3>
      <p>Some views let you see how members who voted a given way on a measure were funded &mdash; for instance, the contribution patterns among members who voted Yes versus No on a measure.</p>
      <p>Two safeguards apply to every such view:</p>
      <ul>
        <li><strong>The association-is-not-causation caveat is shown alongside it.</strong> These views describe a correlation in the data, nothing more.</li>
        <li><strong>We suppress comparisons that are too thin to be meaningful.</strong> We only display a funding-versus-voting comparison when there are <strong>at least five members with real campaign-finance data on each side of the vote.</strong> Below that threshold, a &ldquo;pattern&rdquo; would be noise, so we don't show one.</li>
      </ul>

      <h3 class="ipg-meth-h" id="meth-ward">Finding your ward (address lookup)</h3>
      <p>The address lookup is <strong>best-effort</strong>. It uses <strong>U.S. Census geocoding</strong> to turn an address into coordinates and <strong>City of Chicago ward boundaries</strong> to map those coordinates to a ward. Geocoding can misplace some addresses, and ward boundaries change with redistricting. If a result looks wrong, verify your ward directly at <strong>chicago.gov</strong>. Nothing you type into the lookup is stored.</p>

      <h3 class="ipg-meth-h" id="meth-current">How the data is kept current</h3>
      <p>The tool reads from a single underlying dataset that is <strong>rebuilt and republished on a regular schedule</strong> &mdash; votes are refreshed nightly, and campaign-finance data is updated periodically as new SBE filings are processed. Divided votes are pulled fresh from the City Clerk's data each cycle, and editorial changes &mdash; key-vote designations, vote descriptions, donor classifications, corrections &mdash; are made in a reviewed editorial system and flow into the published data on that schedule. Because the dataset is rebuilt from the raw sources each time and our edits are re-applied on top, corrections are durable and the underlying records remain traceable.</p>

      <h3 class="ipg-meth-h" id="meth-limits">Limitations</h3>
      <p>We think transparency about what this tool <em>can't</em> tell you is part of doing it honestly:</p>
      <ul>
        <li><strong>It covers divided votes only.</strong> Unanimous and voice votes leave no per-member record, so they cannot be included. This is a complete record of the <em>contested</em> votes, not of all Council activity.</li>
        <li><strong>Correlation only.</strong> Co-occurrence of a contribution and a vote is not evidence that one caused the other.</li>
        <li><strong>Reported data inherits its source's errors.</strong> SBE filings can be late, amended, duplicated, or misreported by the filer; roll-call records can contain clerical errors. We correct what we catch, but we cannot guarantee the source was perfect.</li>
        <li><strong>Entity resolution involves judgment.</strong> Deciding that two differently-named records are the same organization, or that a PAC should roll up under a parent, is an editorial call. We err toward keeping records distinct and traceable, but reasonable people may group them differently.</li>
        <li><strong>Independent expenditures are matched and classified by hand.</strong> Tying an IE to the right current alder is a name-and-ward match against the filings, and deciding that a transfer into a committee is an organization's own self-funding (and so excluded from totals) is an editorial judgment against how the filing is labeled. We keep every underlying record traceable, but these calls are open to good-faith disagreement.</li>
        <li><strong>Industry tags, flags, and key-vote designations are editorial.</strong> They reflect our classification and prominence judgments, applied by people, and are open to good-faith disagreement.</li>
        <li><strong>Address lookup is approximate</strong> (see above).</li>
        <li><strong>Timing.</strong> There is a lag between when a filing or vote occurs and when it appears here.</li>
      </ul>

      <h3 class="ipg-meth-h" id="meth-corrections">Corrections, additions, and bug reports</h3>
      <p>We are committed to keeping this data as accurate as possible, and we rely on readers to help. If you spot an error in the data or a visualization, have something to add, or hit a bug, use the <button type="button" class="ipg-meth-fb">Report a correction or bug</button> button in the tool &mdash; it captures what you were viewing so we can act on it quickly. You can also email us directly at <a href="mailto:contact@i4pg.org">contact@i4pg.org</a>; if you have a screenshot, sending it to that address (mentioning what you reported) helps us a great deal.</p>
      <p>Every submission is reviewed.</p>
    </div>`;
  }

  function shortVoteLabel(vm){return vm.code||vm.full||'';}

  // Compare-by-issue: a factual position matrix over the key votes carrying an issue tag.
  function issueMatrix(tag){

  // Compute the funding-correlation analysis for one vote.
  // Returns { aff, opp, gaps } if both groups have ≥5 alders with real
  // CF data; returns { insufficient: true, ... } otherwise.
  function computeVoteFundingCorrelation(vm){
    const MIN_GROUP_SIZE = 5;
    if(!state.cf || !state.cf.committees) return { insufficient: true, reason: 'no-cf-data' };

    // Build per-position arrays of alders with REAL CF data
    const groups = { yes: [], no: [] };
    D.alders.forEach(a => {
      const pos = keyVotePos(vm, a.ward);
      if(pos !== 'yes' && pos !== 'no') return;
      // Find this alder's committee record by ward
      const cm = Object.values(state.cf.committees).find(c => c.ward === a.ward);
      if(!cm || cm.data_quality !== 'REAL') return;
      // Get their industry totals
      const inds = cfIndustryTotalsForCommittee(cm.id);
      const total = inds.reduce((s,x)=>s+x.total, 0);
      if(total <= 0) return;
      groups[pos].push({ alder: a, committee: cm, inds, total });
    });

    if(groups.yes.length < MIN_GROUP_SIZE || groups.no.length < MIN_GROUP_SIZE){
      return {
        insufficient: true,
        affCount: groups.yes.length,
        oppCount: groups.no.length,
        needed: MIN_GROUP_SIZE,
      };
    }

    // Aggregate one group: sum industry $ across alders, compute pcts.
    // Honors the include-unclassified / include-individual toggles by hiding
    // those buckets and renormalizing the remaining shares to 100%.
    function aggregateGroup(group){
      const totals = new Map();
      let grandTotal = 0;
      group.forEach(({inds, total}) => {
        grandTotal += total;
        inds.forEach(x => totals.set(x.industry, (totals.get(x.industry) || 0) + x.total));
      });
      const hide = new Set();
      if(!state.cfInclUnclassified) hide.add('unclassified');
      if(!state.cfInclIndividual) hide.add('individual');
      let excluded = 0;
      totals.forEach((amt, ind) => { if(hide.has(ind)) excluded += amt; });
      const includedTotal = grandTotal - excluded;
      const result = [];
      totals.forEach((amount, industry) => {
        if(hide.has(industry)) return;
        result.push({ industry, total: amount, pct: includedTotal > 0 ? (amount/includedTotal)*100 : 0 });
      });
      result.sort((a,b) => b.total - a.total);
      return { rows: result, grandTotal: includedTotal, fullTotal: grandTotal,
               excludedPct: grandTotal > 0 ? (excluded/grandTotal)*100 : 0, alderCount: group.length };
    }

    const aff = aggregateGroup(groups.yes);
    const opp = aggregateGroup(groups.no);

    // Compute per-industry gap (in percentage points)
    const allInds = new Set([...aff.rows.map(x=>x.industry), ...opp.rows.map(x=>x.industry)]);
    const gaps = [];
    allInds.forEach(industry => {
      const affRow = aff.rows.find(x => x.industry === industry);
      const oppRow = opp.rows.find(x => x.industry === industry);
      const affPct = affRow ? affRow.pct : 0;
      const oppPct = oppRow ? oppRow.pct : 0;
      const gap = affPct - oppPct;
      gaps.push({ industry, affPct, oppPct, gap, absGap: Math.abs(gap) });
    });
    gaps.sort((a,b) => b.absGap - a.absGap);

    return { aff, opp, gaps };
  }

  // Render one vote's correlation card (or insufficient-data message).
  function renderVoteCorrelationCard(vm){
    const correlation = computeVoteFundingCorrelation(vm);

    // Vote header + description + counts
    let h = '<div class="ipg-vote-card">';
    h += '<div class="ipg-vote-card-head">';
    h += '<div class="ipg-vote-name">' + vm.full + '</div>';
    h += '<div class="ipg-vote-meta">' + voteTags(vm).map(t=>'<span class="ipg-vote-tag">'+t+'</span>').join('');
    h += '<span class="ipg-vote-year">' + vm.year + '</span>';
    if(vm.source_url){
      h += ' \u00b7 <a href="' + vm.source_url + '" target="_blank" rel="noopener" style="color:var(--sage);font-size:11.5px">Roll-call source \u2197</a>';
    }
    h += '</div></div>';
    h += '<div class="ipg-vote-desc">' + (vm.desc || vm.description || '');
    h += '</div>';

    // Vote count summary (factual roll-call positions)
    const counts = { yes: 0, no: 0, present: 0 };
    D.alders.forEach(a => {
      const pos = keyVotePos(vm, a.ward);
      if(counts.hasOwnProperty(pos)) counts[pos]++;
    });
    h += '<div class="ipg-vote-counts">';
    h += '<span><strong>' + counts.yes + '</strong> Yes</span>';
    h += '<span><strong>' + counts.no + '</strong> No</span>';
    if(counts.present > 0) h += '<span><strong>' + counts.present + '</strong> Present</span>';
    h += '</div>';

    // Correlation analysis
    if(correlation.insufficient){
      const aff = correlation.affCount ?? 0;
      const opp = correlation.oppCount ?? 0;
      h += '<div class="ipg-correlation-empty">'
        + '<strong>Not enough data yet.</strong> '
        + 'Need at least ' + (correlation.needed || 5) + ' alders with real campaign-finance data in each position. '
        + 'Currently: ' + aff + ' Yes \u00b7 ' + opp + ' No voters have data.'
        + '</div>';
    } else {
      h += '<div class="ipg-correlation">';
      h += '<div class="ipg-correlation-side">';
      h += '<div class="ipg-correlation-label"><strong>Yes voters\u2019 funding mix</strong><br>'
        + '<span class="ipg-correlation-sub">' + correlation.aff.alderCount + ' alders \u00b7 ' + fmtMoney(correlation.aff.grandTotal) + ' total</span></div>';
      h += renderDollarBar(correlation.aff.rows, { clickAction: 'none', inlineLabelPct: 12 });
      h += '</div>';
      h += '<div class="ipg-correlation-side">';
      h += '<div class="ipg-correlation-label"><strong>No voters\u2019 funding mix</strong><br>'
        + '<span class="ipg-correlation-sub">' + correlation.opp.alderCount + ' alders \u00b7 ' + fmtMoney(correlation.opp.grandTotal) + ' total</span></div>';
      h += renderDollarBar(correlation.opp.rows, { clickAction: 'none', inlineLabelPct: 12 });
      h += '</div>';
      h += '</div>';

      const exNote = [];
      if(!state.cfInclUnclassified) exNote.push('unclassified');
      if(!state.cfInclIndividual) exNote.push('individual');
      if(exNote.length){
        h += '<div class="ipg-correlation-note" style="font-size:11.5px;color:#9a8e7e;font-style:italic;margin-top:8px">'
          + 'Excludes ' + exNote.join(' &amp; ') + ' donors \u2014 '
          + Math.round(correlation.aff.excludedPct) + '% of Yes / ' + Math.round(correlation.opp.excludedPct)
          + '% of No giving \u2014 to compare interest-group mix. Toggle above to include.</div>';
      }

      // Standout gaps — top 4 with at least 2-point absolute gap
      const topGaps = correlation.gaps.filter(g => g.absGap >= 2).slice(0, 4);
      if(topGaps.length){
        h += '<div class="ipg-correlation-gaps">';
        h += '<div class="ipg-correlation-gaps-h">Biggest funding-pattern gaps</div>';
        topGaps.forEach(g => {
          const meta = state.cf.industry_tags[g.industry] || { label: g.industry, color: '#cfc5b5' };
          const heavier = g.gap > 0 ? 'Yes' : 'No';
          h += '<div class="ipg-correlation-gap">';
          h += '<span class="ipg-cf-chip" style="background:' + meta.color + ';font-size:11px;padding:3px 9px;flex-shrink:0">' + meta.label + '</span>';
          h += '<span class="ipg-correlation-gap-text">';
          h += 'Yes: <strong>' + g.affPct.toFixed(1) + '%</strong>'
            + ' \u00b7 No: <strong>' + g.oppPct.toFixed(1) + '%</strong>'
            + ' \u00b7 <strong style="color:var(--teal)">' + g.absGap.toFixed(1) + '-pt gap</strong>'
            + ' (heavier among ' + heavier + ' voters)';
          h += '</span>';
          h += '</div>';
        });
        h += '</div>';
      }
    }

    h += '</div>'; // close ipg-vote-card
    return h;
  }

  // Lightweight hover tooltip for [data-tip] elements (vote-matrix headers, etc.).
  // The native title attribute showed the help cursor but no text on many setups;
  // this delegates off the persistent app container (so it survives re-renders)
  // and positions a body-level node that escapes the matrix's overflow clipping.
  function ensureTooltip(){
    if(state._tipWired) return;
    state._tipWired=true;
    let tip=document.getElementById('ipg-tip');
    if(!tip){ tip=document.createElement('div'); tip.id='ipg-tip'; document.body.appendChild(tip); }
    let cur=null;
    function place(e){
      const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
      let x=e.clientX+pad, y=e.clientY+pad;
      if(x+w>window.innerWidth-8) x=e.clientX-w-pad;
      if(y+h>window.innerHeight-8) y=e.clientY-h-pad;
      tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px';
    }
    app.addEventListener('mouseover',e=>{
      if(!e.target||!e.target.closest) return;
      const t=e.target.closest('[data-tip]'); if(!t||!app.contains(t)) return;
      cur=t; tip.textContent=t.getAttribute('data-tip')||''; tip.classList.add('show'); place(e);
    });
    app.addEventListener('mousemove',e=>{ if(cur) place(e); });
    app.addEventListener('mouseout',e=>{
      if(!cur) return;
      const to=e.relatedTarget;
      if(to && cur.contains(to)) return;
      cur=null; tip.classList.remove('show');
    });
  }
