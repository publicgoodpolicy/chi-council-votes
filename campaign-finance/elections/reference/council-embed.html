  Paste this whole block into a Squarespace Code Block (Edit → add block →
  Code), or Settings → Advanced → Code Injection for a full-page version.
  Self-contained. Loads Poppins + Recoleta from Google Fonts / CDN.

  ===================================================================
  HOW EDITORIAL DATA WORKS
  -------------------------------------------------------------------
  All data — alder bios, votes, vote metadata, donors, industry tags,
  flags — is managed in a Google Sheet by IPG editors. A scheduled
  GitHub Action syncs the sheet to council-data.json nightly.

  This embed has NO hardcoded data. It just fetches council-data.json
  from the URL you set in IPG_CONFIG.dataUrl below.

  Setup steps:
    1. Push council-data.json to a public GitHub repo
    2. Paste the "raw" URL into IPG_CONFIG.dataUrl below
    3. Set up the Google Sheet using the template in
       campaign-finance/sheets-sync/sheet-template.md
    4. Configure the GitHub Action to sync the sheet nightly

  Until IPG_CONFIG.dataUrl is set, this embed shows a configuration
  prompt rather than alder data.

  DATA CONVENTIONS:
  - Vote positions: factual roll-call record "yes" / "no" / "present" / "absent"
  - Some votes are reverse-coded (e.g. Cancel ShotSpotter, 1FW Repeal):
    Positions come from rollcall.votes[].positions, joined to key votes via votemeta.vote_id.
  - Ward 27 voting record spans Walter Burnett Jr.'s tenure; the seat
    is now held by Walter Burnett III (appointed Sept 2025).
  =================================================================== -->

<script>
// ============================================================
// CONFIG — edit these when you publish your data file
// ============================================================
const IPG_CONFIG = {
  // URL to council-data.json. After pushing the file to a public GitHub repo,
  // paste the "raw" URL here. Until then, leave as null — the embed will show
  // a "Configure data source" message.
  // Example:
  //   dataUrl: 'https://raw.githubusercontent.com/publicgoodpolicy/ipg-data/main/council-data.json',
  dataUrl: "https://raw.githubusercontent.com/publicgoodpolicy/chi-council-votes/refs/heads/main/campaign-finance/council-data.json",
  // SHARDED MODE (optional, recommended for faster first paint): if indexUrl is
  // set, the embed loads the small index first and streams contributions after.
  // Leave both null to use the single dataUrl monolith above (backward compatible).
  //   indexUrl: 'https://raw.githubusercontent.com/publicgoodpolicy/chi-council-votes/refs/heads/main/campaign-finance/shards/council-index.json',
  //   contributionsUrl: '.../shards/council-contributions.json',
  indexUrl: null,
  contributionsUrl: null,
};

// ============================================================
// FEEDBACK — where "report a correction" submissions go
// ============================================================
const FEEDBACK_CONFIG = {
  // The IPG inbox that should receive corrections / bug reports.
  email: 'contact@i4pg.org',                    // IPG inbox (mailto fallback + reply-to)

  // To receive screenshots in-page (no redirect), create a free form endpoint
  // (Web3Forms or Formspree) and paste its URL here. Leave null to use the
  // mailto fallback, which opens the visitor's own email app (text only — a
  // mail app can't attach the screenshot for them).
  endpoint: 'https://formspree.io/f/xjgdkkrk',  // Formspree form endpoint
  accessKey: null,                              // Web3Forms only: your access key

  // Set once the methodology page exists; null renders the sentence with no link.
  methodologyUrl: null,                         // e.g. 'https://www.publicgoodpolicy.org/methodology'

  // Small always-visible "Feedback" button in the corner. false = rely only on
  // the footer link/button.
  floatingButton: true,
};
</script>

/* Industries by alder rows */
#ipg-council-app .ipg-mix-row{

#ipg-council-app .ipg-mix-amt{font-size:16px;color:var(--teal);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

#ipg-council-app .ipg-mix-row .ipg-dollarbar{height:32px;border-radius:6px;pointer-events:none}

/* Funding-correlation cards under Compare by Issue */

#ipg-council-app .ipg-vote-card-head .ipg-vote-name{

}
#ipg-council-app .ipg-vote-card-head .ipg-vote-meta{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#7d7264;
}
#ipg-council-app .ipg-vote-card .ipg-vote-desc{

}
#ipg-council-app .ipg-vote-counts{

#ipg-council-app .ipg-correlation-side{min-width:0}

#ipg-council-app .ipg-correlation-label{
  font-size:12.5px;color:var(--ink);margin-bottom:8px;line-height:1.4;
}
#ipg-council-app .ipg-correlation-sub{
  font-size:11.5px;color:#9a8e7e;font-weight:400;
}
#ipg-council-app .ipg-correlation-empty{

}
#ipg-council-app .ipg-correlation-gaps{
  background:var(--neu-bg);border-radius:8px;padding:12px 14px;margin-top:14px;
}

  color:var(--sage);margin-bottom:8px;
}
#ipg-council-app .ipg-correlation-gap{

}

/* STAGE 2 — Clickable contributor rows */
#ipg-council-app .ipg-cf-clickable{cursor:pointer;transition:transform .08s,box-shadow .08s,border-color .08s}
#ipg-council-app .ipg-cf-clickable:hover{transform:translateY(-1px);box-shadow:-3px 3px 0 var(--tan);border-color:var(--sage)}
#ipg-council-app .ipg-cf-clickable:hover .name{color:var(--teal)}
#ipg-council-app .ipg-cf-chip-more{background:#cfc5b5;color:#5a5048;cursor:help}
#ipg-council-app #ipg-cf-clear-filters{font-size:12.5px;color:var(--sage);font-weight:600}

/* STAGE 3 — Follow the money (donor ↔ alder ↔ vote relationships) */
#ipg-council-app .ipg-rel-disclaimer{
  border:1.5px dashed var(--opp);background:var(--opp-bg);color:#5e352c;
  padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.55;margin:6px 0 18px;
}

#ipg-council-app .ipg-rel-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
#ipg-council-app .ipg-rel-field{display:flex;flex-direction:column;gap:5px}
#ipg-council-app .ipg-rel-field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7d7264;font-weight:600}
#ipg-council-app .ipg-rel-tab{

}

#ipg-council-app .ipg-rel-svg-wrap{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
#ipg-council-app .ipg-rel-svg-wrap svg{display:block;width:100%;height:auto;min-width:320px}
#ipg-council-app .ipg-rel-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#6f6358}
#ipg-council-app .ipg-rel-legend span{display:inline-flex;align-items:center;gap:6px}
#ipg-council-app .ipg-rel-sw{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.12)}
#ipg-council-app .ipg-rel-note{font-size:12px;color:#9a8e7e;margin-top:8px;line-height:1.5}
#ipg-council-app .ipg-rel-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--white)}

#ipg-council-app .ipg-rel-tbl .rowh small{display:block;font-weight:400;color:#8a7d6e;font-size:10px}
#ipg-council-app .ipg-rel-tbl .grp{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
#ipg-council-app .ipg-rel-tbl .wh{font-weight:600;color:#6f6358;cursor:pointer}
#ipg-council-app .ipg-rel-tbl td.cell{color:#2a2018;font-weight:600;border-radius:4px}
#ipg-council-app .ipg-rel-div{border-left:2px solid var(--tan)}
#ipg-council-app .ipg-rel-node{cursor:pointer}
#ipg-council-app .ipg-rel-tbl.rel-bloc th,#ipg-council-app .ipg-rel-tbl.rel-bloc td{padding:8px 10px;text-align:center}
#ipg-council-app .ipg-rel-tbl.rel-bloc .rowh{min-width:150px;text-align:left}
#ipg-council-app .ipg-rel-tbl.rel-bloc td.reltot{font-weight:600;color:var(--teal)}
#ipg-council-app .ipg-rel-tbl.rel-bloc td.cell{color:#fff;border-radius:5px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#ipg-council-app .ipg-rel-tbl.rel-bloc td.cell small{display:block;font-size:9.5px;font-weight:500;opacity:.9}
#ipg-council-app .ipg-rel-tbl.rel-bloc td.relempty{color:#cfc4b4}
#ipg-council-app .rel-bar{display:inline-flex;width:128px;height:13px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--cream);vertical-align:middle}
#ipg-council-app .rel-bar span{display:block;height:100%}
#ipg-council-app .ipg-rel-tbl.rel-bloc tbody tr{cursor:pointer}
#ipg-council-app .ipg-rel-tbl.rel-bloc tbody tr:hover{outline:2px solid var(--sage);outline-offset:-2px}
#ipg-council-app .ipg-rel-recipient .amount{font-weight:600;color:var(--teal);white-space:nowrap}

/* STAGE 2 — Sub-toggle inside "Compare by Donor" */
#ipg-council-app .ipg-sub-toggle{display:inline-flex;gap:0;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px}
#ipg-council-app .ipg-sub-tab{
  font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.04em;
  padding:8px 16px;border:none;background:none;cursor:pointer;color:#7d7264;border-radius:7px;
}
#ipg-council-app .ipg-sub-tab.active{background:var(--sage);color:var(--white)}

/* STAGE 2 — Industry row styling */
#ipg-council-app .ipg-cf-industry-row{background:var(--white)}

/* STAGE 2 — Donor detail modal */
#ipg-council-app ~ .ipg-modal-overlay,
.ipg-modal-overlay{
  position:fixed;inset:0;background:rgba(52,40,40,.55);z-index:9999;
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  animation:ipg-fade-in .14s ease-out;
}
.ipg-modal{
  background:var(--cream,#F6EFE9);border-radius:14px;
  max-width:min(680px,calc(100vw - 40px));width:100%;
  box-shadow:0 24px 48px -10px rgba(4,65,71,.35),0 0 0 1px var(--line,#dcd2c4);
  padding:32px 32px 26px;position:relative;
  --cream:#F6EFE9; --sage:#508F88; --teal:#044147; --tan:#EBDAC6;
  --ink:#342828; --white:#FFFFFF; --line:#dcd2c4;
  color:var(--ink);
}
.ipg-modal-close{
  position:absolute;top:14px;right:18px;
  font-size:28px;font-weight:300;line-height:1;width:32px;height:32px;
  border:none;background:none;cursor:pointer;color:#9a8e7e;
}
.ipg-modal-close:hover{color:var(--teal)}
.ipg-modal-head{margin-bottom:18px;padding-right:30px}
.ipg-modal-kicker{font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-bottom:6px}
.ipg-modal-name{font-size:clamp(22px,3.4vw,30px);line-height:1.15;color:var(--teal);font-family:'Recoleta','Georgia',ui-serif,serif;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.ipg-modal-meta{font-size:13px;color:#6a5d4e;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ipg-modal-meta .ipg-cf-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;padding:3px 9px;border-radius:20px;color:#fff;line-height:1.4;
}
.ipg-modal-type{font-weight:600;color:#6a5d4e}
.ipg-modal-city{color:#9a8e7e}
.ipg-modal-flags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.ipg-modal-flags .ipg-cf-flag{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;padding:3px 9px;border-radius:20px;line-height:1.4;border:1px solid;
}
.ipg-modal-flags .ipg-cf-flag::before{content:"⚑";font-size:11px}
.ipg-modal-flags .ipg-cf-flag.sev-watch{background:#fbeed0;color:#7a5a1a;border-color:#c89a3a}
.ipg-modal-flags .ipg-cf-flag.sev-alert{background:#f5dccf;color:#7a3a1a;border-color:#a23a2e}
.ipg-modal-flags .ipg-cf-flag.sev-critical{background:#9c3b2e;color:#fff;border-color:#9c3b2e}
.ipg-modal-flags .ipg-cf-flag a{color:inherit;text-decoration:underline}

.ipg-modal-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ipg-modal-summary .ipg-stat{
  flex:1;min-width:120px;background:var(--white);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;
}
.ipg-modal-summary .ipg-stat .num{font-size:24px;line-height:1;color:var(--teal)}
.ipg-modal-summary .ipg-stat .num.serif{font-family:'Recoleta',Georgia,serif;font-weight:700}
.ipg-modal-summary .ipg-stat .lab{font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9a8e7e;margin-top:6px}

.ipg-modal .ipg-section-h{
  font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);
  margin:24px 0 12px;padding-bottom:9px;border-bottom:2px solid var(--tan);
}
.ipg-modal .ipg-cf-row{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:flex-start;
  background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;margin-bottom:8px;
}
.ipg-modal .ipg-cf-clickable{cursor:pointer;transition:transform .08s,box-shadow .08s,border-color .08s}
.ipg-modal .ipg-cf-clickable:hover{transform:translateY(-1px);box-shadow:-3px 3px 0 var(--tan);border-color:var(--sage)}
.ipg-modal .ipg-cf-row .name{font-size:15.5px;color:var(--ink);font-weight:600;line-height:1.3}
.ipg-modal .ipg-cf-row .sub{font-size:12.5px;color:#9a8e7e;margin-top:3px;font-weight:400}
.ipg-modal .ipg-cf-row .amount{font-size:17px;color:var(--teal);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ipg-modal .ipg-cf-pac-recipient{border-left:4px solid #508F88;background:#eef4f3;padding-left:11px;border-radius:6px}
.ipg-modal .ipg-cf-pac-recipient .name{color:#044147}
.ipg-modal .ipg-cf-pac-recipient.ipg-cf-clickable{cursor:pointer}
.ipg-cf-pac-tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle;background:#dceae8;color:#044147}
.ipg-cf-paclink,a.ipg-cf-paclink{color:#044147;font-weight:600;text-decoration:underline}
.ipg-modal-foot{font-size:11.5px;color:#9a8e7e;margin-top:18px;text-align:center;font-style:italic}
/* ===== FEEDBACK / REPORT-A-CORRECTION ===== */
#ipg-council-app .ipg-feedback-bar{background:var(--tan);border-top:1px solid var(--line);padding:18px max(30px,calc((100% - var(--content))/2)) 28px;font-size:12.5px;line-height:1.65;color:#6a5d4e}
#ipg-council-app .ipg-feedback-bar strong{color:#5a4f43}
#ipg-council-app .ipg-feedback-bar a{color:var(--sage);text-decoration:underline}
#ipg-council-app .ipg-fb-trigger{font-family:'Poppins',sans-serif;font-weight:600;color:var(--sage);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;font-size:inherit}
#ipg-council-app .ipg-fb-trigger:hover{color:var(--teal)}
#ipg-council-app .ipg-fb-btn{display:inline-block;margin-top:12px;font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--white);background:var(--sage);border:none;border-radius:9px;padding:10px 16px;cursor:pointer}
#ipg-council-app .ipg-fb-btn:hover{background:var(--teal)}
.ipg-fb-fab{position:fixed;right:20px;bottom:20px;z-index:9990;font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;color:#fff;background:var(--teal,#044147);border:none;border-radius:30px;padding:11px 16px;cursor:pointer;box-shadow:0 6px 18px -4px rgba(4,65,71,.45);display:inline-flex;align-items:center;gap:7px}

.ipg-fb-fab svg{width:15px;height:15px}

.ipg-fb .ipg-fb-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ipg-fb label{font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7d7264}
.ipg-fb input[type=text],.ipg-fb input[type=email],.ipg-fb input[type=url],.ipg-fb select,.ipg-fb textarea{font-family:'Poppins',sans-serif;font-size:14.5px;padding:11px 12px;border:1.5px solid var(--teal,#044147);background:#fff;color:var(--ink,#342828);border-radius:9px;width:100%;appearance:none}
.ipg-fb textarea{min-height:96px;resize:vertical;line-height:1.5}
.ipg-fb input[type=file]{font-family:'Poppins',sans-serif;font-size:13px;color:#6a5d4e;border:none;padding:0}
.ipg-fb input:focus,.ipg-fb select:focus,.ipg-fb textarea:focus{outline:2.5px solid var(--sage,#508F88);outline-offset:1px}
.ipg-fb .ipg-fb-hint{font-size:11.5px;color:#9a8e7e;font-weight:400;text-transform:none;letter-spacing:0}
.ipg-fb .ipg-fb-context{font-size:11.5px;color:#7d7264;background:var(--neu-bg,#efe7d8);border-radius:8px;padding:9px 11px;margin-bottom:16px;line-height:1.45}
.ipg-fb-actions{display:flex;gap:12px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ipg-fb-submit{font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;color:#fff;background:var(--teal,#044147);border:none;border-radius:9px;padding:11px 20px;cursor:pointer}

.ipg-fb-status{font-size:12.5px;color:#6a5d4e}

/* ROLLUPS — donor family panel inside the donor modal. Lives outside #ipg-council-app
   like the other .ipg-modal rules, so these are unprefixed; vars resolve from .ipg-modal. */

</style>

<script>
(function(){
  const app=document.getElementById('ipg-council-app');
  // D and tagList get populated after data loads. state.data is the authoritative
  // store; D is kept as a name-compatible alias so existing code paths still read.
  let D = null;
  let tagList = [];
  let _rcIndex = null;
  let state={view:'member',ward:null,tagFilter:'All',rankTag:'All',
             data:null,dataStatus:'idle',dataError:null,
             cf:null,cfStatus:'idle',cfShowAll:false,cfCycle:'current',
             cfAlderInd:'All',
             cfInclUnclassified:false,cfInclIndividual:false,
             cfLookupSub:'donors',cfSearch:'',cfTypeFilter:'All',cfIndustryFilter:'All',cfFlagFilter:'All',cfShowAllLookup:false,cfPre2011View:false,
             cfIndustryDetail:null,
             cfModalDonorId:null,cfModalAggregate:true,cfModalCommitteeId:null,contribStatus:'idle',
             relView:'donor',relDonorId:null,relVoteCode:'BCH',relDetailId:null,_relIndex:null,
             recTag:'All',recType:'All',recSearch:'',recOpen:null,memberRecOpen:false};

  function applyData(j){
    j.contributions=j.contributions||[];
    state.data=j; state.cf=j;             // legacy alias — campaign-finance fields live in the same object
    D=j;                                   // legacy alias — D.alders, D.votemeta still work
    _rcIndex=null;
    tagList=[...new Set((j.votemeta||[]).flatMap(v=>voteTags(v)))].sort();
    if(!state.ward && j.alders && j.alders.length){
      state.ward = j.alders.slice().sort((a,b)=>a.ward-b.ward)[0].ward;
    }
  }
  async function loadData(){
    const cfg=IPG_CONFIG||{};
    if(!cfg.dataUrl && !cfg.indexUrl){state.dataStatus='unconfigured'; state.cfStatus='unconfigured'; return}
    state.dataStatus='loading'; state.cfStatus='loading';
    try{
      if(cfg.indexUrl){
        // Sharded: load the small index first (fast first paint), then stream contributions.
        const r=await fetch(cfg.indexUrl,{cache:'no-cache'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        applyData(await r.json());
        state.dataStatus='loaded'; state.cfStatus='loaded';
        if(cfg.contributionsUrl){
          state.contribStatus='loading';
          fetch(cfg.contributionsUrl,{cache:'no-cache'})
            .then(rr=>{ if(!rr.ok) throw new Error('HTTP '+rr.status); return rr.json(); })
            .then(cj=>{
              state.cf.contributions = Array.isArray(cj)?cj:((cj&&cj.contributions)||[]);
              state._cfDonorIndex=null; state._cfClusterIndex=null; state._cfIESpenders=null;   // rebuild memoized indexes with real data
              state.contribStatus='loaded'; renderBody();
            })
            .catch(e=>{ state.contribStatus='error'; console.warn('IPG: contributions shard failed:',e); renderBody(); });
        } else { state.contribStatus='loaded'; }
      } else {
        // Monolith (backward compatible): one fetch, contributions included.
        const r=await fetch(cfg.dataUrl,{cache:'no-cache'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        applyData(await r.json());
        state.dataStatus='loaded'; state.cfStatus='loaded'; state.contribStatus='loaded';
      }
    }catch(e){
      state.dataStatus='error'; state.cfStatus='error';
      state.dataError=e.message||String(e); state.cfError=state.dataError;
      console.warn('IPG: data failed to load:',e);
    }
  }
  // Find this ward's committee in CF data (committee_id is the linking key).
  function cfCommitteeForWard(w){
    if(!state.cf||!state.cf.committees) return null;
    return Object.values(state.cf.committees).find(c=>c.ward===w)||null;
  }
  function cfContributionsForCommittee(cid){
    if(!state.cf) return [];
    return state.cf.contributions.filter(c=>c.committee_id===cid);
  }
  // Aggregate by donor for a given list of contributions.
  function aggregateByDonor(contribs){
    const m=new Map();
    contribs.forEach(c=>{
      const cur=m.get(c.donor_id)||{donor_id:c.donor_id,total:0,count:0,latest:null,earliest:null};
      cur.total+=c.amount; cur.count++;
      if(!cur.latest||c.date>cur.latest) cur.latest=c.date;
      if(!cur.earliest||c.date<cur.earliest) cur.earliest=c.date;
      m.set(c.donor_id,cur);
    });
    return Array.from(m.values()).sort((a,b)=>b.total-a.total);
  }

  const BURST='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    +'<g fill="currentColor">'
    +'<rect x="47" y="12" width="6" height="76" transform="rotate(0 50 50)"/>'
    +'<rect x="47" y="12" width="6" height="76" transform="rotate(45 50 50)"/>'
    +'<rect x="47" y="12" width="6" height="76" transform="rotate(90 50 50)"/>'
    +'<rect x="47" y="12" width="6" height="76" transform="rotate(135 50 50)"/>'
    +'<circle cx="50" cy="14" r="8"/><circle cx="86" cy="50" r="6"/>'
    +'<circle cx="50" cy="86" r="5"/><circle cx="14" cy="50" r="7"/>'
    +'<circle cx="75" cy="25" r="5"/><circle cx="75" cy="75" r="4"/>'
    +'<circle cx="25" cy="75" r="6"/><circle cx="25" cy="25" r="5"/>'
    +'<circle cx="50" cy="50" r="9"/></g></svg>';

  async function lookupWardByAddress(addr){
    const gURL='https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?address='
      +encodeURIComponent(addr+', Chicago, IL')+'&benchmark=Public_AR_Current&format=json';
    const gj=await (await fetch(gURL)).json();
    const m=gj.result&&gj.result.addressMatches&&gj.result.addressMatches[0];
    if(!m) throw new Error('Address not found — try adding a ZIP code.');
    const lng=m.coordinates.x,lat=m.coordinates.y;
    const wURL='https://gisapps.chicago.gov/arcgis/rest/services/ExternalApps/Boundaries/MapServer/13/query'
      +'?geometry='+lng+','+lat+'&geometryType=esriGeometryPoint&inSR=4326'
      +'&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=false&f=json';
    const wj=await (await fetch(wURL)).json();
    const f=wj.features&&wj.features[0];
    if(!f) throw new Error('Found the address but could not match a ward.');
    const at=f.attributes;
    const wardNum=at.WARD||at.ward||at.Ward||at.WARD_ID||Object.values(at).find(v=>!isNaN(parseInt(v)));
    return parseInt(wardNum);
  }

  const POS_LBL={yes:'Yes',no:'No',present:'Present',absent:'Absent'};
  function posKey(p){return (p==='yes'||p==='no'||p==='present')?p:'absent';}
  function pill(v){const k=posKey(v);return '<span class="ipg-pill pill-'+k+'">'+POS_LBL[k]+'</span>';}
  // tags: tolerate a single string, a comma-separated string, or an array
  function voteTags(v){if(!v)return[];const t=(v.tags!=null?v.tags:v.tag);if(Array.isArray(t))return t.map(s=>String(s).trim()).filter(Boolean);return String(t||'').split(',').map(s=>s.trim()).filter(Boolean);}
  // join a key vote (votemeta) to its factual roll-call positions
  function rollcallById(id){if(!id)return null;if(!_rcIndex){_rcIndex={};((((D||{}).rollcall)||{}).votes||[]).forEach(v=>{_rcIndex[v.id]=v;});}return _rcIndex[id]||null;}
  function keyVotePos(vm,ward){const rc=rollcallById(vm&&vm.vote_id);if(!rc||!rc.positions)return null;return rc.positions[String(ward)]||null;}
  // factual Yes/No/Present/Absent counts across the key votes (optionally one issue tag)
  function memberVoteCounts(a,tag){const c={yes:0,no:0,present:0,absent:0};(D.votemeta||[]).forEach(vm=>{if(tag&&tag!=='All'&&!voteTags(vm).includes(tag))return;c[posKey(keyVotePos(vm,a.ward))]++;});return c;}
  const alderByWard=w=>D.alders.find(a=>a.ward===w);

  function render(){
    let h='<div class="ipg-head">'
      +'<h1 class="ipg-title serif">How is your Chicago City Council member voting?</h1>'
      +'<p class="ipg-sub">Find your alder by ward or address, see how they voted on key ordinances and why each vote mattered, '
      +'and compare how the whole Council voted, by issue area.</p></div>';
    // Until data is loaded we can't render the tabs or body usefully
    if(state.dataStatus!=='loaded'){
      h+='<div class="ipg-body" id="ipg-body">';
      if(state.dataStatus==='loading' || state.dataStatus==='idle'){
        h+='<div class="ipg-cf-empty" style="text-align:center;padding:60px 20px"><strong style="display:block;color:var(--sage);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px">Loading</strong>Fetching the latest Council data…</div>';
      } else if(state.dataStatus==='unconfigured'){
        h+='<div class="ipg-placeholder"><strong>Configure data source</strong>'

      +'Positions are the factual roll-call record \u2014 Yes, No, Present, or Absent \u2014 as recorded by the City Clerk via DataMade\u2019s Councilmatic. Present folds \u201cnot voting\u201d and \u201cabstain\u201d; Absent folds \u201cexcused.\u201d '

  function fmtMoney(n){return '$'+Math.round(n).toLocaleString()}
  // PS-93 (EXCL-UNIFORM): out-of-subject rows (pre-2011/undated cycles) never enter an
  // unchosen figure -- build_rollups' EXCLUDED_CYCLES, applied at every raw-row consumer.
  // The deliberate before-May-2011 surfaces read the separate accumulators, never this.
  function cfInSubject(c){return c.cycle!=='pre-2011'&&c.cycle!=='undated';}
  // PS-95 (HALT-DUES): dues transfers are excluded from every published total and kept in
  // the substrate, typed distinctly (rule c of the FW-1 firewall set; text of record now
  // in RULINGS.md). PS-94: the FULL exclusion set binds every row-aggregating consumer,
  // through ONE shared predicate -- a repeated condition is how the last gap happened.
  function cfDuesRow(c){return c.contribution_type==='IE Committee Dues Transfer';}
  function cfCountable(c){return !cfDuesRow(c)&&cfInSubject(c);}
  function cycleKey(c){var s=String(c),pre=/^pre-?(\d{4})/i.exec(s);if(pre)return (+pre[1])-0.5;var y=/(\d{4})/.exec(s);return y?+y[1]:1e9;}
  function sortCycles(arr){return arr.slice().sort(function(a,b){return cycleKey(a)-cycleKey(b);});}
  function fmtMoneyExact(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',year:'numeric'})}
  function fmtDateLong(s){if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}

  function renderContributors(alder){
    // State variants for the Campaign Contributors section.
    if(state.cfStatus==='loading')
      return '<div class="ipg-cf-empty">Loading campaign finance data…</div>';
    if(state.cfStatus==='unconfigured')
      return '<div class="ipg-placeholder"><strong>Coming soon</strong>'
        +'Campaign-contributor data will appear here once the IPG team publishes '
        +'<code>campaign-finance.json</code> and sets <code>IPG_CONFIG.campaignFinanceUrl</code>. '
        +'Data is pulled quarterly from the Illinois State Board of Elections.</div>';
    if(state.cfStatus==='error')
      return '<div class="ipg-cf-empty">Could not load campaign finance data ('+state.cfError+'). '
        +'<a href="'+IPG_CONFIG.campaignFinanceUrl+'" target="_blank" rel="noopener">Try opening the data file directly ↗</a></div>';
    if(state.contribStatus==='loading' && (!state.cf.contributions || !state.cf.contributions.length))
      return '<div class="ipg-cf-empty">Loading contribution details…</div>';

    const cm=cfCommitteeForWard(alder.ward);
    if(!cm||cm.data_quality==='EMPTY')
      return '<div class="ipg-cf-empty"><strong style="display:block;margin-bottom:6px;color:#6a5d4e">No data yet</strong>'
        +'Campaign-finance data for Ward '+alder.ward+' has not been ingested yet. '
        +'The IPG team is researching this committee.</div>';

    const allContribs=cfContributionsForCommittee(cm.id);
    if(!allContribs.length)
      return '<div class="ipg-cf-empty">Committee found but no contributions in the current dataset.</div>';

    // Cycle filtering. state.cfCycle: 'current' (default), specific cycle key, 'all',
    // or 'pre-2011' (the deliberate out-of-subject view).
    // PS-93 (EXCL-UNIFORM): out-of-subject rows (pre-2011/undated) leave the unchosen
    // views ('all' and the enumerated cycle options) and are offered ONLY as the
    // deliberate, named option below (E2a: curated, present when nonempty), never
    // aggregated with in-subject money in any shared total.
    const currentCycle=state.cf.current_cycle;
    const cycleDefs=state.cf.cycles||{};
    // D16(iii) / PS-93 as amended: `undated` leaves the curated view too. The two halves of
    // EXCLUDED_CYCLES are excluded for DIFFERENT reasons and are not interchangeable -- a
    // date-less row is not "before May 2011", so strings 3/4/5/6 would name it as something
    // it is not. It therefore renders in NO view. NOTE the asymmetry is deliberate: the next
    // line keeps BOTH clauses, so undated falls into neither collection. Symmetrising it
    // would put undated money back into the in-subject views -- the inverse of the ruling.
    const preContribs=allContribs.filter(c=>c.cycle==='pre-2011');
    const inContribs=allContribs.filter(c=>c.cycle!=='pre-2011'&&c.cycle!=='undated');
    let effectiveCycle=state.cfCycle;
    if(effectiveCycle==='current') effectiveCycle=currentCycle;
    const contribs = effectiveCycle==='all'
      ? inContribs
      : (effectiveCycle==='pre-2011' ? preContribs : inContribs.filter(c=>c.cycle===effectiveCycle));

    const cyclesInData=[...new Set(inContribs.map(c=>c.cycle))].sort().reverse();

    let h='';
    // Data-quality banner
    if(cm.data_quality==='DEMO')
      h+='<div class="ipg-cf-quality q-DEMO">⚠ Demo data — illustrative only</div>';
    else if(cm.data_quality==='REAL')
      h+='<div class="ipg-cf-quality q-REAL">Verified · Illinois State Board of Elections</div>';
    else if(cm.data_quality==='PARTIAL')
      h+='<div class="ipg-cf-quality q-PARTIAL">Partial data</div>';

    // Meta line
    let metaBits=[];
    if(cm.committee_name) metaBits.push('<strong>'+cm.committee_name+'</strong>');
    if(cm.last_updated) metaBits.push('Updated '+fmtDate(cm.last_updated));
    if(cm.il_sunshine_url) metaBits.push('<a href="'+cm.il_sunshine_url+'" target="_blank" rel="noopener">View on Illinois Sunshine ↗</a>');
    if(metaBits.length) h+='<div class="ipg-cf-meta">'+metaBits.join(' · ')+'</div>';
    if(cm.notes) h+='<div class="ipg-cf-meta" style="font-style:italic">'+cm.notes+'</div>';

    // Cycle filter -- show when more than one in-subject cycle exists, or when the
    // deliberate before-May-2011 option (E2a) has rows to offer.
    if(cyclesInData.length>1 || preContribs.length){
      h+='<div class="ipg-cf-cycle-bar"><label>Cycle:</label><select id="ipg-cf-cycle-sel">';
      h+='<option value="current"'+(state.cfCycle==='current'?' selected':'')+'>Current cycle ('+(cycleDefs[currentCycle]?cycleDefs[currentCycle].label.replace("Current cycle (","").replace(/\)$/,""):currentCycle)+')</option>';
      cyclesInData.filter(cy=>cy!==currentCycle).forEach(cy=>{
        const lbl=cycleDefs[cy]?cycleDefs[cy].label:cy+' cycle';
        h+='<option value="'+cy+'"'+(state.cfCycle===cy?' selected':'')+'>'+lbl+'</option>';
      });
      h+='<option value="all"'+(state.cfCycle==='all'?' selected':'')+'>All cycles ('+cyclesInData.length+')</option>';
      // E2a: the curated out-of-subject option -- string 3, appended by design (never an
      // enumeration artifact), present only when this committee has such rows.
      if(preContribs.length)
        h+='<option value="pre-2011"'+(state.cfCycle==='pre-2011'?' selected':'')+'>Before 2011 (outside this tool\'s cycles)</option>';
      h+='</select></div>';
    }
    // String 4: the explainer on the deliberate view, visible whenever it is selected.
    if(effectiveCycle==='pre-2011')
      h+='<div class="ipg-cf-meta">Contributions before the city council term seated in May 2011 are outside the cycles this tool covers.</div>';

    if(!contribs.length){
      h+='<div class="ipg-cf-empty">No contributions recorded for this cycle.</div>';
      return h;
    }

    const agg=aggregateByDonor(contribs);
    const itemized=agg.filter(a=>{const d=state.cf.donors[a.donor_id];return d && d.type!=='Aggregate'});
    const aggregates=agg.filter(a=>{const d=state.cf.donors[a.donor_id];return d && d.type==='Aggregate'});
    const total=contribs.reduce((s,c)=>s+c.amount,0);

    // Counts that include the small-dollar tail
    const aggDonorTotal = contribs.filter(c=>c.is_aggregate)
                                  .reduce((s,c)=>s+(c.donor_count||0),0);
    const aggContribTotal = contribs.filter(c=>c.is_aggregate)
                                    .reduce((s,c)=>s+(c.contribution_count||c.donor_count||0),0);
    const itemizedContribCount = contribs.filter(c=>!c.is_aggregate).length;
    const totalDonors = itemized.length + aggDonorTotal;
    const totalContribs = itemizedContribCount + aggContribTotal;
    const avgGift = totalContribs ? total / totalContribs : 0;

    // Summary stats — cash on hand gets a special tile when available
    h+='<div class="ipg-cf-summary">';
    if(cm.cash_on_hand!=null){
      h+=statCash(fmtMoney(cm.cash_on_hand),'Cash on hand', cm.cash_on_hand_as_of?'as of '+fmtDateLong(cm.cash_on_hand_as_of):null);
    }
    h+=stat(fmtMoney(total),'Raised',true);
    h+=stat(totalDonors.toLocaleString(),'Donors');
    h+=stat(fmtMoney(avgGift),'Avg. gift',true);
    h+=stat(totalContribs.toLocaleString(),'Contributions');
    h+='</div>';

    // Per-alder industry breakdown (dollar-bill stacked bar).
    // Skip if no industries (very early data or no real contributions yet).
    const alderInds = cfIndustryTotalsForCommittee(cm.id);
    if(alderInds.length){
      h+='<div class="ipg-cf-meta" style="margin:18px 0 6px;color:var(--ink);font-weight:600">Where this alder\u2019s money comes from</div>'
        +'<div class="ipg-cf-meta" style="margin:0 0 12px;color:#7d7264;font-size:12.5px">Each segment is one industry; width is its share of total raised. Click a segment to filter the donor list below.</div>';
      h+=renderDollarBar(alderInds, {clickAction:'filter-alder', inlineLabelPct:8, legend:true, activeFilter:state.cfAlderInd});
    }

    // Apply optional industry filter to itemized donors
    const indFilter = state.cfAlderInd;
    const filteredItemized = (indFilter && indFilter !== 'All')
      ? itemized.filter(x => {
          const d = state.cf.donors[x.donor_id]; if(!d) return false;
          return donorIndustries(d).includes(indFilter);
        })
      : itemized;

    if(indFilter && indFilter !== 'All'){
      const indMeta = state.cf.industry_tags[indFilter] || {label:indFilter};
      h += '<div class="ipg-cf-meta" style="margin:14px 0 8px;padding:9px 12px;background:var(--neu-bg);border-radius:8px">'
        + 'Donor list filtered to <strong>'+indMeta.label+'</strong> \u00b7 '+filteredItemized.length+' donor'+(filteredItemized.length===1?'':'s')+' '
        + '<button class="ipg-cf-toggle" id="ipg-cf-alder-clear" style="margin-left:8px">Clear filter</button>'
        + '</div>';
    }

    // Itemized donors (named, ≥ disclosure threshold)
    const showCount=state.cfShowAll?filteredItemized.length:Math.min(10,filteredItemized.length);
    for(let i=0;i<showCount;i++){
      h+=renderDonorRow(filteredItemized[i]);
    }
    if(filteredItemized.length>10){
      h+='<button class="ipg-cf-toggle" id="ipg-cf-toggle">'
        +(state.cfShowAll?'Show top 10 only \u2191':'Show all '+filteredItemized.length+' itemized donors \u2193')
        +'</button>';
    }
    if(!filteredItemized.length && indFilter !== 'All'){
      h += '<div class="ipg-cf-empty">No itemized donors in this category for this committee.</div>';
    }

    // Small-dollar aggregate rows: the render line was REMOVED at HALT-MIG-1 (the SBE-bulk
    // source itemizes every receipt, so no Aggregate-typed donors remained to render) while
    // its money kept counting in the headline above -- PS-96's one named standing
    // non-conformance. RESTORED at REPAIR-AGG-1 (authorization sha256 26cbc371eba48c14d4a944
    // f5979db2f844280009d95d2d3425889b6a4522e641) as the residual-disclosure clause requires:
    // the reader can reconcile the visible list against the headline. Amount only (F1); the
    // donor-type partition is exhaustive over `agg`, so itemized + this line == the headline
    // total exactly. Renders ONLY when the class is present (E1.2) -- zero rows render nothing
    // at all, never a $0 line, so today's real data is byte-identical to the pre-restore page.
    // Non-clickable by construction: the click delegation binds `.ipg-cf-clickable
    // [data-donor-id]` and this row carries neither -- a residual is not a donor, there is no
    // profile to open.
    if(aggregates.length){
      const aggResidual=aggregates.reduce((s,a)=>s+a.total,0);
      h+='<div class="ipg-cf-row">'
        +'<div><div class="name">Small-dollar and un-itemized contributions</div>'
        +'<div class="sub">Contributions reported to the state in aggregate, without individual donor identities. Counted in this committee\'s totals; not attributable to any listed donor.</div>'
        +'</div>'
        +'<div class="amount">'+fmtMoney(aggResidual)+'</div></div>';
    }

    return h;
  }

  function renderDonorRow(a){
    const d=state.cf.donors[a.donor_id];
    if(!d) return '';
    const indChips=renderIndustryChips(d);
    const flagChips=(d.flags||[]).map(f=>{
      const ft=state.cf.flag_types[f.type];
      if(!ft) return '';
      const inner=f.source_url
        ?'<a href="'+f.source_url+'" target="_blank" rel="noopener" title="'+(f.note||'')+'">'+ft.label+'</a>'
        :'<span title="'+(f.note||'')+'">'+ft.label+'</span>';
      return '<span class="ipg-cf-flag sev-'+ft.severity+'">'+inner+'</span>';
    }).join('');
    // Sub-line: contributions count, date range, occupation/city for individuals
    let subBits=[a.count+(a.count===1?' contribution':' contributions')];
    if(a.earliest&&a.latest&&a.earliest!==a.latest) subBits.push(fmtDate(a.earliest)+' – '+fmtDate(a.latest));
    else if(a.latest) subBits.push(fmtDate(a.latest));
    if(d.occupation) subBits.push(d.occupation);
    if(d.employer) subBits.push(d.employer);
    if(d.city) subBits.push(d.city);
    return '<div class="ipg-cf-row ipg-cf-clickable" data-donor-id="'+a.donor_id+'">'
      +'<div><div class="name">'+d.name+'</div>'
      +'<div class="sub">'+subBits.join(' · ')+'</div>'
      +'<div class="ipg-cf-tags">'+indChips+flagChips+'</div>'
      +'</div>'
      +'<div class="amount">'+fmtMoney(a.total)+'</div></div>';
  }
  function bioCell(k,v){
    const val=(v===null||v===undefined||v==='')?'<span class="v empty">Not yet added</span>':'<span class="v">'+v+'</span>';
    return '<div class="ipg-bio-cell"><div class="k">'+k+'</div>'+val+'</div>';
  }
  function stat(n,l,ser){return '<div class="ipg-stat"><div class="num'+(ser?' serif':'')+'">'+n+'</div><div class="lab">'+l+'</div></div>'}
  function statCash(n,l,sub){return '<div class="ipg-stat ipg-stat-cash"><div class="num serif">'+n+'</div><div class="lab">'+l+'</div>'+(sub?'<div class="ipg-stat-sub">'+sub+'</div>':'')+'</div>'}

  // ============================================================
  // STAGE 2.5 — Multi-tag helpers (schema v1.4)
  // ============================================================
  // Donors can carry multiple industry tags (e.g. an Individual who is also
  // tagged 'aipac-aligned' from editorial overrides). The first tag is the
  // "primary" — used for legacy single-chip displays. We support legacy
  // `donor.industry` (string) and new `donor.industries` (array).
  function donorIndustries(d){
    if(!d) return ['unclassified'];
    if(Array.isArray(d.industries) && d.industries.length) return d.industries;
    if(d.industry) return [d.industry];
    return ['unclassified'];
  }
  // Renders one or more industry chips for a donor. Pass {compact:true} to
  // condense to "Primary tag +N more" when there are several.
  function readableText(hex){
    var h=String(hex||'').replace('#','');
    if(h.length!==6) return '#fff';
    function ch(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
    var L=0.2126*ch(parseInt(h.slice(0,2),16))+0.7152*ch(parseInt(h.slice(2,4),16))+0.0722*ch(parseInt(h.slice(4,6),16));
    var cWhite=1.05/(L+0.05), cInk=(L+0.05)/(0.0331+0.05);
    return cWhite>=cInk?'#fff':'#342828';
  }
  function renderIndustryChips(d, opts){
    opts=opts||{};
    const inds=donorIndustries(d);
    if(opts.compact && inds.length>2){
      const meta0=state.cf.industry_tags[inds[0]]||state.cf.industry_tags['unclassified'];
      return '<span class="ipg-cf-chip" style="background:'+meta0.color+';color:'+readableText(meta0.color)+'">'+meta0.label+'</span>'
        +'<span class="ipg-cf-chip ipg-cf-chip-more" title="'+inds.slice(1).map(k=>(state.cf.industry_tags[k]||{label:k}).label).join(', ')+'">+'+(inds.length-1)+' more</span>';
    }
    return inds.map(k=>{
      const m=state.cf.industry_tags[k]||state.cf.industry_tags['unclassified'];
      return '<span class="ipg-cf-chip" style="background:'+m.color+';color:'+readableText(m.color)+'">'+m.label+'</span>';
    }).join('');
  }

  // ============================================================
  // STAGE 2 — DONOR LOOKUP HELPERS
  // ============================================================
  // One-time, memoized index of contributions grouped by donor_id (single O(n)
  // pass over contributions[]). Mirrors relBuildIndex's pattern. Replaces the old
  // per-donor full-scan of contributions[] that made cfAllDonors O(donors x
  // contributions) ~= 1.4B ops (~27s) on the unfiltered default render.
  function cfBuildDonorIndex(){
    if(state._cfDonorIndex) return state._cfDonorIndex;
    const byDonor=new Map();
    state.cf.contributions.forEach(c=>{
      // Internal union-dues transfers into a committee's own PAC are funding, not
      // Council spend — excluded from donor totals/rollup aggregates (matches build_rollups).
      if(c.contribution_type==='IE Committee Dues Transfer') return;
      let e=byDonor.get(c.donor_id);
      if(!e){ e={total:0,contribCount:0,committees:new Set(),cycles:new Set(),pre:0,preCount:0,byCmte:new Map()}; byDonor.set(c.donor_id,e); }
      // PS-93 (EXCL-UNIFORM): out-of-subject rows (pre-2011/undated cycles) never enter
      // the unchosen totals below -- this index previously matched build_rollups on dues
      // but not on EXCLUDED_CYCLES. They accumulate separately for the deliberate,
      // named before-May-2011 view (E2a); never summed with in-subject money.
      if(c.cycle==='pre-2011'||c.cycle==='undated'){ e.pre+=c.amount; e.preCount++; return; }
      e.total+=c.amount; e.contribCount++; e.committees.add(c.committee_id); e.cycles.add(c.cycle);
      let cm=e.byCmte.get(c.committee_id);
      if(!cm){ cm={committee_id:c.committee_id,total:0,count:0,cycles:new Set()}; e.byCmte.set(c.committee_id,cm); }
      cm.total+=c.amount; cm.count++; cm.cycles.add(c.cycle);
    });
    state._cfDonorIndex={byDonor};
    return state._cfDonorIndex;
  }
  // Aggregate one donor's giving across all committees they touch. Reads from the
  // memoized index above (O(1) lookup) instead of re-scanning contributions[].
  function cfDonorTotals(donorId){
    if(!state.cf) return null;
    const e=cfBuildDonorIndex().byDonor.get(donorId);
    // A donor whose every row is out-of-subject still resolves (pre/preCount populated),
    // so their profile renders the ratified empty state instead of vanishing (E3/E4).
    if(!e || (!e.contribCount && !e.preCount)) return null;
    return {total:e.total, committeeCount:e.committees.size, contribCount:e.contribCount,
            cycles:[...e.cycles].sort(), pre:e.pre, preCount:e.preCount};
  }
  // List of recipient committees for a donor, with per-committee totals. Reads the
  // per-committee breakdown straight from the memoized index (no rescan).
  function cfDonorRecipients(donorId){
    if(!state.cf) return [];
    const e=cfBuildDonorIndex().byDonor.get(donorId);
    if(!e) return [];
    return Array.from(e.byCmte.values()).sort((a,b)=>b.total-a.total);
  }
  // Recipients merged across several donor ids (a rollup family): one row per
  // recipient committee, totals/counts summed and cycles unioned across members.
  function cfAggregateRecipients(memberIds){
    if(!state.cf) return [];
    const idx=cfBuildDonorIndex();
    const map=new Map();
    (memberIds||[]).forEach(id=>{
      const e=idx.byDonor.get(id); if(!e||!e.byCmte) return;
      e.byCmte.forEach((rec,cmteId)=>{
        let m=map.get(cmteId);
        if(!m){ m={committee_id:cmteId,total:0,count:0,cycles:new Set()}; map.set(cmteId,m); }
        m.total+=rec.total||0; m.count+=rec.count||0;
        (rec.cycles||[]).forEach(c=>m.cycles.add(c));
      });
    });
    return Array.from(map.values()).sort((a,b)=>b.total-a.total);
  }
  // Ranked list of all donors across the dataset, with optional filters.
  function cfAllDonors(opts){
    opts=opts||{};
    if(!state.cf) return [];
    const out=[];
    Object.values(state.cf.donors).forEach(d=>{
      if(opts.type && opts.type!=='All' && d.type!==opts.type) return;
      if(opts.industry && opts.industry!=='All' && !donorIndustries(d).includes(opts.industry)) return;
      if(opts.flag && opts.flag!=='All'){
        const flagTypes=(d.flags||[]).map(f=>f.type);
        if(!flagTypes.includes(opts.flag)) return;
      }
      if(opts.search){
        const q=opts.search.toLowerCase();
        if(!d.name.toLowerCase().includes(q)) return;
      }
      const t=cfDonorTotals(d.id);
      if(!t) return;
      out.push({donor:d, ...t});
    });
    return out.sort((a,b)=>b.total-a.total);
  }
  // Rollup-first donor list. Prefers precomputed rollups.by_parent (no client
  // re-scan); falls back to grouping cfAllDonors by parent_id, then to per-donor,
  // so the embed still works against older data files without rollups.
  function cfAllParents(opts){
    opts=opts||{};
    if(!state.cf) return [];
    const donors=state.cf.donors||{};
    function passes(pid,name,type,industries){
      if(opts.type && opts.type!=='All' && type!==opts.type) return false;
      if(opts.industry && opts.industry!=='All' && !(industries||[]).includes(opts.industry)) return false;
      if(opts.flag && opts.flag!=='All'){
        const d=donors[pid]; const ft=((d&&d.flags)||[]).map(f=>f.type);
        if(!ft.includes(opts.flag)) return false;
      }
      if(opts.search && !String(name||'').toLowerCase().includes(opts.search.toLowerCase())) return false;
      return true;
    }
    const bp=state.cf.rollups && state.cf.rollups.by_parent;
    if(bp){
      const out=[];
      Object.keys(bp).forEach(pid=>{
        const r=bp[pid];
        const ind=r.industries||donorIndustries(donors[pid]||{});
        if(!passes(pid,r.name,r.type,ind)) return;
        out.push({id:pid, donor:donors[pid]||{id:pid,name:r.name,type:r.type,industries:ind},
          name:r.name, total:r.total||0, count:r.count||0,
          committees:r.committees||0, members:r.members||1});
      });
      return out.sort((a,b)=>b.total-a.total);
    }
    // Fallback for legacy data: group by parent_id (or treat each donor as its own parent).
    const groups=new Map();
    cfAllDonors({type:opts.type,industry:opts.industry,flag:opts.flag}).forEach(x=>{
      const pid=x.donor.parent_id||x.donor.id;
      let g=groups.get(pid);
      if(!g){ const pd=donors[pid]||x.donor; g={id:pid,donor:pd,name:pd.name,total:0,count:0,committees:0,members:0}; groups.set(pid,g); }
      g.total+=x.total; g.count+=x.contribCount; g.members++;
      g.committees=Math.max(g.committees,x.committeeCount||0);
    });
    let arr=Array.from(groups.values());
    if(opts.search){ const q=opts.search.toLowerCase(); arr=arr.filter(g=>String(g.name||'').toLowerCase().includes(q)); }
    return arr.sort((a,b)=>b.total-a.total);
  }
  // Industry rollups across the entire dataset.
  // When a donor carries multiple industry tags, their dollars are counted in
  // EACH category they belong to. This is by design — overlap is expected and
  // accurate (an "AIPAC-aligned individual" contributes to both the Individual
  // total and the AIPAC-aligned total). Note: this means sum-of-industries
  // can exceed total raised, which is correct semantics.
  function cfIndustryTotals(){
    if(!state.cf) return [];
    const byInd=new Map();
    state.cf.contributions.forEach(c=>{
      if(!cfCountable(c)) return;
      const d=state.cf.donors[c.donor_id]; if(!d) return;
      donorIndustries(d).forEach(ind=>{
        const cur=byInd.get(ind)||{industry:ind,total:0,donors:new Set(),committees:new Set()};
        cur.total+=c.amount;
        cur.donors.add(c.donor_id);
        cur.committees.add(c.committee_id);
        byInd.set(ind,cur);
      });
    });
    return Array.from(byInd.values()).map(x=>({...x,donorCount:x.donors.size,committeeCount:x.committees.size}))
      .sort((a,b)=>b.total-a.total);
  }
  // Industry rollup for one committee (per-alder view). Same multi-tag logic
  // as the global rollup.
  function cfIndustryTotalsForCommittee(committeeId){
    if(!state.cf) return [];
    const byInd=new Map();
    state.cf.contributions.forEach(c=>{
      if(c.committee_id !== committeeId) return;
      if(!cfCountable(c)) return;
      const d=state.cf.donors[c.donor_id]; if(!d) return;
      donorIndustries(d).forEach(ind=>{
        const cur=byInd.get(ind)||{industry:ind,total:0,donors:new Set()};
        cur.total+=c.amount;
        cur.donors.add(c.donor_id);
        byInd.set(ind,cur);
      });
    });
    return Array.from(byInd.values()).map(x=>({...x,donorCount:x.donors.size}))
      .sort((a,b)=>b.total-a.total);
  }
  // Shared "dollar bill" stacked-bar renderer. Returns HTML.
  //   inds:   array of {industry, total, ...} sorted by total desc
  //   opts.clickAction: 'industry-detail' (default), 'filter-alder', or 'none'
  //   opts.minPct: hide segments below this percent (default 0.3%)
  //   opts.inlineLabelPct: minimum pct to show inline label (default 6%)
  //   opts.legend: if true, render a full legend listing every industry below the bar
  //   opts.activeFilter: industry key currently filtered (highlights/dims segments)
  function renderDollarBar(inds, opts){
    opts=opts||{};
    const minPct = opts.minPct ?? 0.3;
    const inlinePct = opts.inlineLabelPct ?? 6;
    const action = opts.clickAction || 'industry-detail';
    const grandTotal = inds.reduce((s,x)=>s+x.total,0);
    if(grandTotal <= 0) return '';
    // The bar
    let h = '<div class="ipg-dollarbar">';
    inds.forEach(x=>{
      const meta = state.cf.industry_tags[x.industry] || {label:x.industry, color:'#cfc5b5'};
      const pct = (x.total / grandTotal) * 100;
      if(pct < minPct) return;
      const showLabel = pct >= inlinePct;
      const pctStr = pct >= 10 ? Math.round(pct)+'%' : pct.toFixed(1)+'%';
      let cls, dataAttr;
      if(action === 'industry-detail'){
        cls = 'ipg-dollarbar-seg ipg-cf-industry-row';
        dataAttr = ' data-industry="'+x.industry+'"';
      } else if(action === 'filter-alder'){
        cls = 'ipg-dollarbar-seg ipg-cf-alder-filter';
        dataAttr = ' data-industry="'+x.industry+'"';
      } else {
        cls = 'ipg-dollarbar-seg ipg-dollarbar-static';
        dataAttr = '';
      }
      // Dim segments not matching the active filter
      const isActive = opts.activeFilter && opts.activeFilter !== 'All';
      const isMe = opts.activeFilter === x.industry;
      const dimStyle = isActive && !isMe ? ';opacity:.32' : '';
      const tag = action === 'none' ? 'div' : 'button';
      h += '<'+tag+' class="'+cls+'"'+dataAttr+' '
        + 'style="background:'+meta.color+';flex:'+pct+' 0 0'+dimStyle+';" '
        + 'title="'+meta.label+' \u2014 '+fmtMoney(x.total)+' ('+pctStr+'). '+(action==='filter-alder'?'Click to filter donors below.':'Click to drill in.')+'">'
        + (showLabel ? '<span class="ipg-dollarbar-label">'+meta.label+'</span><span class="ipg-dollarbar-pct">'+pctStr+'</span>' : '')
        + '</'+tag+'>';
    });
    h += '</div>';
    // Optional legend — full list of segments with chip, label, $, %
    if(opts.legend){
      h += '<div class="ipg-dollarbar-legend">';
      inds.forEach(x=>{
        if(x.total <= 0) return;
        const meta = state.cf.industry_tags[x.industry] || {label:x.industry, color:'#cfc5b5'};
        const pct = (x.total / grandTotal) * 100;
        const pctStr = pct >= 10 ? Math.round(pct)+'%' : pct.toFixed(1)+'%';
        const isActive = opts.activeFilter && opts.activeFilter !== 'All';
        const isMe = opts.activeFilter === x.industry;
        const dimCls = isActive && !isMe ? ' ipg-legend-dim' : '';
        let tag, cls, dataAttr;
        if(action === 'industry-detail'){
          tag = 'button'; cls = 'ipg-dollarbar-legend-item ipg-cf-industry-row'+dimCls;
          dataAttr = ' data-industry="'+x.industry+'"';
        } else if(action === 'filter-alder'){
          tag = 'button'; cls = 'ipg-dollarbar-legend-item ipg-cf-alder-filter'+dimCls;
          dataAttr = ' data-industry="'+x.industry+'"';
        } else {
          tag = 'div'; cls = 'ipg-dollarbar-legend-item'+dimCls; dataAttr = '';
        }
        h += '<'+tag+' class="'+cls+'"'+dataAttr+'>'
          + '<span class="ipg-dollarbar-legend-swatch" style="background:'+meta.color+'"></span>'
          + '<span class="ipg-dollarbar-legend-label">'+meta.label+'</span>'
          + '<span class="ipg-dollarbar-legend-pct">'+pctStr+'</span>'
          + '<span class="ipg-dollarbar-legend-amt">'+fmtMoney(x.total)+'</span>'
          + '</'+tag+'>';
      });
      h += '</div>';
    }
    return h;
  }
  // Flag rollups across the entire dataset.
  // A donor carrying flag X contributes their total dollars to flag X's total.
  // Multiple flags per donor = donor counted in multiple flag totals (same as
  // industry rollups). Useful for "how much money tagged anti-BCH flowed to
  // the Council" or "what's the AIPAC-affiliated giving footprint."
  function cfFlagTotals(){
    if(!state.cf) return [];
    const byFlag=new Map();
    // PS-95's flag clause: a flag row is SEEDED from flagged donors, so a flag whose every
    // dollar is excluded renders $0 and never disappears -- the zero is informative, and a
    // non-zero on a dues-coextensive flag is a tell worth keeping visible.
    Object.values(state.cf.donors).forEach(d=>{
      (d.flags||[]).forEach(f=>{
        if(!byFlag.has(f.type)) byFlag.set(f.type,{flag:f.type,total:0,donors:new Set(),committees:new Set()});
        byFlag.get(f.type).donors.add(d.id);
      });
    });
    state.cf.contributions.forEach(c=>{
      if(!cfCountable(c)) return;
      const d=state.cf.donors[c.donor_id]; if(!d) return;
      (d.flags||[]).forEach(f=>{
        const cur=byFlag.get(f.type);
        cur.total+=c.amount;
        cur.committees.add(c.committee_id);
      });
    });
    return Array.from(byFlag.values()).map(x=>({...x,donorCount:x.donors.size,committeeCount:x.committees.size}))
      .sort((a,b)=>b.total-a.total);
  }

  // ============================================================
  // INDEPENDENT-EXPENDITURE COMMITTEES ("political spenders")
  // ============================================================
  // An IE committee both RECEIVES money (its funders, in contributions[]) and
  // SPENDS money independently for/against candidates (independent_expenditures[],
  // keyed by spender_committee_id). It is not a donor to a campaign, so it never
  // appeared in Browse donors and could not be opened. These helpers surface it.
  //
  // Memoized roll-up of every IE committee's independent spend (support + oppose).
  function cfIESpenders(){
    if(state._cfIESpenders) return state._cfIESpenders;
    const ies=(state.cf&&state.cf.independent_expenditures)||[];
    const cmts=(state.cf&&state.cf.committees)||{};
    const by=new Map();
    ies.forEach(e=>{
      const cid=e.spender_committee_id; if(!cid) return;
      // PS-93 (EXCL-UNIFORM): out-of-subject IE rows leave these spender totals too --
      // this sum previously included pre-2011 expenditures that build_rollups excludes.
      if(e.cycle==='pre-2011'||e.cycle==='undated') return;
      let m=by.get(cid);
      if(!m){ const cm=cmts[cid]||{}; m={committee_id:cid, name:cm.committee_name||cm.name||cid,
        committee:cm, support:0, oppose:0, total:0, count:0,
        industries:(cm.industry_tags&&cm.industry_tags.length)?cm.industry_tags:['unclassified']}; by.set(cid,m); }
      const amt=+e.amount||0;
      if(e.stance==='oppose') m.oppose+=amt; else m.support+=amt;
      m.total+=amt; m.count++;
    });
    const out=Array.from(by.values()).sort((a,b)=>b.total-a.total);
    state._cfIESpenders=out;
    return out;
  }
  function cfIESpender(committeeId){ return cfIESpenders().find(s=>s.committee_id===committeeId)||null; }
  // One IE committee's spend grouped by target ward (for / against), name-resolved.
  function cfIESpendByTarget(committeeId){
    const ies=(state.cf&&state.cf.independent_expenditures)||[];
    const wn={}; (state.cf.alders||[]).forEach(a=>{wn[String(a.ward)]=a.name;});
    Object.values(state.cf.committees||{}).forEach(c=>{ if(c&&c.ward!=null&&c.alder_name&&!wn[String(c.ward)]) wn[String(c.ward)]=c.alder_name; });
    const by=new Map();
    ies.forEach(e=>{
      if(e.spender_committee_id!==committeeId) return;
      const w=String(e.target_ward);
      let m=by.get(w);
      if(!m){ m={ward:w, name:wn[w]||('Ward '+w), support:0, oppose:0, total:0, count:0}; by.set(w,m); }
      const amt=+e.amount||0;
      if(e.stance==='oppose') m.oppose+=amt; else m.support+=amt;
      m.total+=amt; m.count++;
    });
    return Array.from(by.values()).sort((a,b)=>b.total-a.total);
  }
  // Who funds one IE committee: contributions INTO it, by donor, dues excluded
  // (same editorial rule as everywhere else — self-funding dues are not giving).
  function cfIEFunders(committeeId){
    if(!state.cf) return [];
    const by=new Map();
    state.cf.contributions.forEach(c=>{
      if(c.committee_id!==committeeId) return;
      if(c.contribution_type==='IE Committee Dues Transfer') return;
      if(!cfInSubject(c)) return;
      let m=by.get(c.donor_id);
      if(!m){ m={donor_id:c.donor_id, donor:state.cf.donors[c.donor_id]||{id:c.donor_id,name:c.donor_id}, total:0, count:0}; by.set(c.donor_id,m); }
      m.total+=(+c.amount||0); m.count++;
    });
    return Array.from(by.values()).sort((a,b)=>b.total-a.total);
  }

  // ============================================================
  // STAGE 2 — "COMPARE BY DONOR" VIEW
  // ============================================================
  function donorLookupView(){
    if(state.cfStatus==='loading') return '<div class="ipg-cf-empty">Loading campaign finance data…</div>';
    if(state.cfStatus==='unconfigured')
      return '<div class="ipg-placeholder"><strong>Coming soon</strong>'
        +'Donor lookup will appear here once <code>IPG_CONFIG.campaignFinanceUrl</code> is set. '
        +'See the data pipeline README for setup.</div>';
    if(state.cfStatus==='error')
      return '<div class="ipg-cf-empty">Could not load campaign finance data ('+state.cfError+').</div>';
    if(!state.cf) return '<div class="ipg-cf-empty">No data loaded.</div>';

    // Sub-toggle: Donors / Industries / Industries by Alder / Flags
    let h='<div class="ipg-sub-toggle">'
      +'<button class="ipg-sub-tab'+(state.cfLookupSub==='donors'?' active':'')+'" data-sub="donors">Browse donors</button>'
      +'<button class="ipg-sub-tab'+(state.cfLookupSub==='alder-spend'?' active':'')+'" data-sub="alder-spend">Spend by alder</button>'
      +'<button class="ipg-sub-tab'+(state.cfLookupSub==='industries'?' active':'')+'" data-sub="industries">Industry totals</button>'
      +'<button class="ipg-sub-tab'+(state.cfLookupSub==='alder-mix'?' active':'')+'" data-sub="alder-mix">Industries by alder</button>'
      +'<button class="ipg-sub-tab'+(state.cfLookupSub==='flags'?' active':'')+'" data-sub="flags">Flag totals</button>'
      +'</div>';

    if(state.cfLookupSub==='industries') h+=industriesSubView();
    else if(state.cfLookupSub==='industry-detail') h+=industryDetailView();
    else if(state.cfLookupSub==='alder-spend') h+=alderSpendSubView();
    else if(state.cfLookupSub==='alder-mix') h+=alderMixSubView();
    else if(state.cfLookupSub==='flags') h+=flagsSubView();
    else h+=donorsSubView();
    return h;
  }

  // The deliberate before-May-2011 view (E2a; string 6's target). Named per string 3,
  // explained per string 4, ranked by out-of-subject giving from the donor index's
  // separate accumulator -- never aggregated with any in-subject figure (PS-93 carve-out).
  // Rows are display-only: a pre-2011-only donor's profile shows in-subject zeros by
  // design, and hopping there from this view would read as the money vanishing.
  function pre2011SubView(){
    const idx=cfBuildDonorIndex().byDonor;
    const rows=[];
    idx.forEach((e,did)=>{
      if(e.pre>0){ const d=state.cf.donors[did]; rows.push({name:d?d.name:did,total:e.pre,count:e.preCount}); }
    });
    rows.sort((a,b)=>b.total-a.total);
    let h='<div class="ipg-section-h">Before 2011 (outside this tool\'s cycles)'
      +' <button class="ipg-cf-toggle" id="ipg-cf-pre2011-back" style="margin-left:8px;text-decoration:underline" aria-label="close">&#8592;</button></div>';
    h+='<div class="ipg-cf-meta">Contributions before the city council term seated in May 2011 are outside the cycles this tool covers.</div>';
    if(!rows.length) return h+'<div class="ipg-cf-empty">No contributions recorded.</div>';
    rows.forEach(r=>{
      h+='<div class="ipg-cf-meta" style="display:flex;justify-content:space-between;gap:12px">'
        +'<span>'+r.name+'</span><span><strong>'+fmtMoney(r.total)+'</strong> &middot; '
        +r.count+(r.count===1?' contribution':' contributions')+'</span></div>';
    });
    return h;
  }

  function donorsSubView(){
    if(state.cfPre2011View) return pre2011SubView();
    const types=['All','PAC','Individual','Aggregate','Corporation','Union','Other'];
    const industries=['All',...Object.keys(state.cf.industry_tags||{})];
    // Use the same flag set (and order) as the "Flag totals" tab — i.e. flags that
    // actually appear on donors with giving — instead of the full vocabulary, so the
    // dropdown and the Flag totals tab can never diverge.
    const flagTypes=['All',...cfFlagTotals().map(f=>f.flag)];
    let h='<div class="ipg-controls">';
    h+='<div class="ipg-field" style="flex:2 1 280px"><label>Search donors</label>'
      +'<input type="text" id="ipg-cf-search" placeholder="e.g. Realtors, CTU, JPMorgan" value="'+(state.cfSearch||'').replace(/"/g,'&quot;')+'" autocomplete="off"/></div>';
    h+='<div class="ipg-field"><label>Donor type</label><select id="ipg-cf-type-sel">';
    types.forEach(t=>h+='<option value="'+t+'"'+(state.cfTypeFilter===t?' selected':'')+'>'+t+'</option>');
    h+='</select></div>';
    h+='<div class="ipg-field"><label>Industry</label><select id="ipg-cf-ind-sel">';
    industries.forEach(t=>{
      const lbl=t==='All'?'All industries':(state.cf.industry_tags[t]?state.cf.industry_tags[t].label:t);
      h+='<option value="'+t+'"'+(state.cfIndustryFilter===t?' selected':'')+'>'+lbl+'</option>';
    });
    h+='</select></div>';
    h+='<div class="ipg-field"><label>Flag</label><select id="ipg-cf-flag-sel">';
    flagTypes.forEach(t=>{
      const lbl=t==='All'?'All flags':(state.cf.flag_types[t]?state.cf.flag_types[t].label:t);
      h+='<option value="'+t+'"'+(state.cfFlagFilter===t?' selected':'')+'>'+lbl+'</option>';
    });
    h+='</select></div>';
    h+='</div>';

    const list=cfAllParents({search:state.cfSearch,type:state.cfTypeFilter,industry:state.cfIndustryFilter,flag:state.cfFlagFilter});

    // Independent-expenditure committees ("political spenders") are not donors to a
    // campaign, so cfAllParents never returns them. Surface them here as their own
    // rows, ranked by independent spend, honouring the same filters. They open the
    // IE-committee detail (who they spent for/against + who funds them).
    const q=(state.cfSearch||'').toLowerCase();
    const ieRows=cfIESpenders().filter(s=>{
      if(state.cfTypeFilter!=='All' && state.cfTypeFilter!=='PAC') return false; // committee, PAC-like
      if(state.cfIndustryFilter!=='All' && !(s.industries||[]).includes(state.cfIndustryFilter)) return false;
      if(state.cfFlagFilter!=='All') return false; // IE committees don't carry donor flags
      if(q && !String(s.name||'').toLowerCase().includes(q)) return false;
      return s.total>0;
    }).map(s=>({_ie:true, id:s.committee_id, name:s.name, total:s.total,
                support:s.support, oppose:s.oppose, count:s.count, industries:s.industries}));

    // Merge donors + IE spenders into one ranking by dollar size.
    const merged=list.map(x=>({_ie:false, ...x})).concat(ieRows).sort((a,b)=>b.total-a.total);

    // Active-filter summary line
    let filtBits=[];
    if(state.cfTypeFilter!=='All') filtBits.push('type: '+state.cfTypeFilter);
    if(state.cfIndustryFilter!=='All') filtBits.push('industry: '+(state.cf.industry_tags[state.cfIndustryFilter]?state.cf.industry_tags[state.cfIndustryFilter].label:state.cfIndustryFilter));
    if(state.cfFlagFilter!=='All') filtBits.push('flag: '+(state.cf.flag_types[state.cfFlagFilter]?state.cf.flag_types[state.cfFlagFilter].label:state.cfFlagFilter));
    const filtSummary = filtBits.length
      ? ' <span style="color:#7d7264;font-weight:500">·</span> <span style="color:#7d7264">Filtered by '+filtBits.join(' + ')+'.</span>'
        +' <button class="ipg-cf-toggle" id="ipg-cf-clear-filters" style="margin-left:6px;text-decoration:underline">Clear filters</button>'
      : '';
    h+='<div class="ipg-cf-meta" style="margin-top:8px">'+merged.length+(merged.length===1?' result':' results')
      +(ieRows.length?' ('+ieRows.length+' independent-expenditure '+(ieRows.length===1?'committee':'committees')+')':'')+' matched.'+filtSummary
      +' <span style="color:#9a8e7e;display:block;margin-top:4px">Affiliated donors are combined into one group. Independent-expenditure committees (political spenders) appear here too, tagged <span class="ipg-cf-pac-tag">IE PAC</span>. Click any row to see its full footprint.</span></div>';
    // E4's list-level coverage statement (string 5) + the pointer to the deliberate
    // before-May-2011 view (string 6). Ship WITH the ranked-list scope, never after it:
    // donors who gave only before the covered cycles are absent from this list, and a
    // per-row label cannot explain an absence.
    h+='<div class="ipg-cf-meta" style="margin-top:6px">This tool covers contributions from the city council term seated in May 2011 onward. Donors who gave only before then are not listed.'
      +' <button class="ipg-cf-toggle" id="ipg-cf-pre2011" style="text-decoration:underline">See contributions before May 2011</button></div>';

    if(!merged.length) return h+'<div class="ipg-cf-empty">No donors or spenders match these filters.</div>';
    const showN=state.cfShowAllLookup?merged.length:Math.min(25,merged.length);
    for(let i=0;i<showN;i++){
      const x=merged[i];
      if(x._ie){
        const sub=[];
        sub.push(fmtMoney(x.support)+' for');
        sub.push(fmtMoney(x.oppose)+' against');
        sub.push(x.count+(x.count===1?' expenditure':' expenditures'));
        const chips=(x.industries||[]).map(k=>{const m=state.cf.industry_tags[k]||{label:k,color:'#cfc5b5'};return '<span class="ipg-cf-chip" style="background:'+m.color+';color:'+readableText(m.color)+'">'+m.label+'</span>';}).join('');
        h+='<div class="ipg-cf-row ipg-cf-ie-clickable" data-ie-id="'+relEscAttr(x.id)+'">'
          +'<div><div class="name">'+relEsc(x.name)+' <span class="ipg-cf-pac-tag">IE PAC</span></div>'
          +'<div class="sub">Independent spending \u00b7 '+sub.join(' \u00b7 ')+'</div>'
          +'<div class="ipg-cf-tags">'+chips+'</div>'
          +'</div>'
          +'<div class="amount">'+fmtMoney(x.total)+'</div></div>';
      } else {
        const sub=[];
        if(x.members>1) sub.push(x.members+' entities');
        sub.push(x.committees+(x.committees===1?' committee':' committees'));
        sub.push(x.count+(x.count===1?' contribution':' contributions'));
        h+='<div class="ipg-cf-row ipg-cf-clickable" data-donor-id="'+x.id+'">'
          +'<div><div class="name">'+x.name
          +(x.members>1?' <span class="ipg-cf-rollup-pill">rollup</span>':'')+'</div>'
          +'<div class="sub">'+sub.join(' \u00b7 ')+'</div>'
          +'<div class="ipg-cf-tags">'+renderIndustryChips(x.donor,{compact:true})+'</div>'
          +'</div>'
          +'<div class="amount">'+fmtMoney(x.total)+'</div></div>';
      }
    }
    if(merged.length>25){
      h+='<button class="ipg-cf-toggle" id="ipg-cf-lookup-toggle">'
        +(state.cfShowAllLookup?'Show top 25 only \u2191':'Show all '+merged.length+' results \u2193')+'</button>';
    }
    return h;
  }

  // Political Spend — "Spend by alder": each ward's race ranked by total money,
  // split into direct contributions + independent support/opposition. Reads the
  // precomputed rollups.by_alder (independent segments stay empty until IE lands).
  function alderSpendSubView(){
    const R=(state.cf.rollups&&state.cf.rollups.by_alder)||{};
    const cyc=state.cfSpendCycle||'all';
    const wardName={}; (state.cf.alders||[]).forEach(a=>{wardName[String(a.ward)]=a.name;});
    Object.values(state.cf.committees||{}).forEach(c=>{ if(c&&c.ward!=null&&c.alder_name&&!wardName[String(c.ward)]) wardName[String(c.ward)]=c.alder_name; });
    const pick=o=> !o?{}:(cyc==='all'?(o.all||{}):((o.by_cycle&&o.by_cycle[cyc])||{}));
    const rows=Object.keys(R).map(w=>{
      const v=pick(R[w]); const direct=v.direct||0, sup=v.ie_support||0, opp=v.ie_oppose||0;
      return {ward:w, name:wardName[w]||('Ward '+w), direct:direct, sup:sup, opp:opp};
    }).filter(r=>r.direct||r.sup||r.opp).sort((a,b)=>b.direct-a.direct);
    const anyIE=rows.some(r=>r.sup||r.opp);
    const maxDirect=Math.max(1,...rows.map(r=>r.direct));
    const maxIE=Math.max(1,...rows.map(r=>Math.max(r.sup,r.opp)));
    const cycles=state.cf.cycles||{};
    let h='<div class="ipg-controls"><div class="ipg-field"><label>Cycle</label><select id="ipg-spend-cycle">';
    h+='<option value="all"'+(cyc==='all'?' selected':'')+'>All cycles</option>';
    sortCycles(Object.keys(cycles)).forEach(k=>{ h+='<option value="'+k+'"'+(cyc===k?' selected':'')+'>'+(cycles[k].label||k)+'</option>'; });
    h+='</select></div></div>';
    h+='<div class="ipg-cf-meta" style="margin-top:8px">Money in each ward\u2019s council race, shown as <strong>three separate streams</strong> \u2014 direct contributions to the alder\u2019s committee'+(anyIE?', plus independent spending <strong>for</strong> and <strong>against</strong> them':'')+'.'
      +(anyIE?' Opposition spending is made <em>against</em> a candidate, so the three streams are shown separately and never added together.':'')
      +' <span style="color:#9a8e7e;display:block;margin-top:4px">Ranked by direct fundraising (shown at right). Click a ward to open that alder\u2019s full profile. Independent spending is made without coordinating with the candidate; correlation is not causation.</span></div>';
    if(!rows.length) return h+'<div class="ipg-cf-empty">No spending data for this cycle.</div>';
    if(anyIE){
      h+='<div class="ipg-cf-meta" style="margin:8px 0;padding:9px 11px;background:#f6f1e9;border-radius:8px;font-size:.85em;color:#6a5d4e"><strong>How to read the bars:</strong> Each stream has its own scale \u2014 direct bars are sized against the top-fundraising ward, independent-spending bars against the ward with the most independent spending. Compare bar <em>length</em> only within the same stream; the dollar amount on each bar gives its true size.</div>';
      h+='<div class="ipg-cf-meta" style="margin:0 0 8px;font-size:.85em">'
        +'<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--teal);vertical-align:-1px;margin-right:4px"></span>direct &nbsp; '
        +'<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3f9d78;vertical-align:-1px;margin-right:4px"></span>independent \u2014 for &nbsp; '
        +'<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#c0563a;vertical-align:-1px;margin-right:4px"></span>independent \u2014 against</div>';
    }
    const barTrack=(frac,color,amt)=>{
      const w=Math.max(amt>0?2:0, Math.min(100, frac*100)).toFixed(2);
      return '<span style="flex:1 1 auto;height:8px;border-radius:4px;background:#ece7df;overflow:hidden;max-width:340px"><span style="display:block;height:100%;width:'+w+'%;background:'+color+'"></span></span>';
    };
    const barLine=(lab,frac,color,amt)=> '<div style="display:flex;align-items:center;gap:8px;margin:5px 0 0">'
        +'<span style="flex:0 0 132px;font-size:11.5px;color:#6a5d4e">'+lab+'</span>'
        +barTrack(frac,color,amt)
        +'<span style="flex:0 0 auto;font-size:11.5px;color:#6a5d4e;font-variant-numeric:tabular-nums">'+fmtMoney(amt)+'</span></div>';
    rows.forEach(r=>{
      h+='<div class="ipg-cf-row ipg-cf-clickable ipg-alder-spend-row" data-ward="'+r.ward+'">'
        +'<div style="flex:1 1 auto;min-width:0">'
        +'<div class="name">Ward '+r.ward+' \u00b7 '+r.name+'</div>'
        +barLine('Direct contributions', r.direct/maxDirect, 'var(--teal)', r.direct)
        +((r.sup||r.opp)
            ? (r.sup?barLine('Independent \u2014 for', r.sup/maxIE, '#3f9d78', r.sup):'')
              +(r.opp?barLine('Independent \u2014 against', r.opp/maxIE, '#c0563a', r.opp):'')
            : '<div style="font-size:11.5px;color:#9a8e7e;margin:5px 0 0">No independent spending recorded.</div>')
        +'</div>'
        +'<div class="amount">'+fmtMoney(r.direct)+'</div></div>';
    });
    return h;
  }

  function industriesSubView(){
    const inds=cfIndustryTotals();
    let h='<div class="ipg-cf-meta" style="margin:8px 0 16px">Industries ranked by total dollars given across all committees in the dataset. '
      +'<span style="color:#9a8e7e">Click an industry to see who its donors are and which alders they\u2019ve funded.</span></div>';
    if(!inds.length) return h+'<div class="ipg-cf-empty">No industry data yet.</div>';

    // Dollar-bill visualization: horizontal stacked bar where each segment is one
    // industry, width proportional to its share of total. Hover shows label;
    // segments wide enough also show inline label.
    const grandTotal = inds.reduce((s,x)=>s+x.total, 0);
    if(grandTotal > 0){
      h+='<div class="ipg-cf-meta" style="margin:18px 0 6px;color:var(--ink);font-weight:600">Where each dollar comes from</div>';
      h+='<div class="ipg-cf-meta" style="margin:0 0 12px;color:#7d7264;font-size:12.5px">Total raised across all committees in dataset: <strong>'+fmtMoney(grandTotal)+'</strong>. '
        +'Each segment below is one industry; width is its share of the total. Donors with multiple industry tags count in each category.</div>';
      h+=renderDollarBar(inds, {clickAction:'industry-detail', legend:true});
    }

    // The ranked-list section header
    h+='<div class="ipg-section-h" style="margin-top:24px">Industry breakdown</div>';

    inds.forEach(x=>{
      const meta=state.cf.industry_tags[x.industry]||{label:x.industry,color:'#cfc5b5'};
      const pct = grandTotal > 0 ? (x.total / grandTotal) * 100 : 0;
      h+='<div class="ipg-cf-row ipg-cf-clickable ipg-cf-industry-row" data-industry="'+x.industry+'">'
        +'<div><div class="name">'+meta.label+'</div>'
        +'<div class="sub">'+x.donorCount+(x.donorCount===1?' donor':' donors')+' \u00b7 funded '+x.committeeCount+(x.committeeCount===1?' committee':' committees')
        +(pct ? ' \u00b7 <strong>'+(pct>=1?Math.round(pct):pct.toFixed(1))+'% of total</strong>' : '')+'</div>'
        +'<div class="ipg-cf-tags"><span class="ipg-cf-chip" style="background:'+meta.color+';color:'+readableText(meta.color)+'">'+meta.label+'</span></div>'
        +'</div>'
        +'<div class="amount">'+fmtMoney(x.total)+'</div></div>';
    });
    return h;
  }

  // -----------------------------------------------------------
  // Industry detail view: drill into one industry to see donors
  // AND the committees those donors funded.
  // -----------------------------------------------------------
  function industryDetailView(){
    const ind = state.cfIndustryDetail;
    if(!ind) return '<div class="ipg-cf-empty">No industry selected.</div>';
    const meta=state.cf.industry_tags[ind]||{label:ind,color:'#cfc5b5'};

    // Find all donors in this industry
    const donorsInIndustry = Object.values(state.cf.donors).filter(d => donorIndustries(d).includes(ind));
    const donorIds = new Set(donorsInIndustry.map(d => d.id));

    // All contributions from these donors
    const contribs = state.cf.contributions.filter(c => donorIds.has(c.donor_id) && cfCountable(c));
    const totalAmount = contribs.reduce((s,c)=>s+c.amount, 0);

    // Group contributions by committee
    const byCommittee = new Map();
    contribs.forEach(c => {
      if(!byCommittee.has(c.committee_id)) byCommittee.set(c.committee_id, {total:0, count:0, donors:new Set()});
      const e = byCommittee.get(c.committee_id);
      e.total += c.amount;
      e.count += 1;
      e.donors.add(c.donor_id);
    });
    const committeeRows = Array.from(byCommittee.entries())
      .map(([cmt_id, e]) => ({cmt_id, ...e, donorCount: e.donors.size}))
      .sort((a,b) => b.total - a.total);

    // Donor totals (within this industry)
    const donorTotals = donorsInIndustry.map(d => {
      const ds = contribs.filter(c => c.donor_id === d.id);
      return {donor:d, total: ds.reduce((s,c)=>s+c.amount,0), count: ds.length};
    }).filter(x => x.total > 0).sort((a,b)=>b.total-a.total);

    let h = '';
    // Header with back button
    h += '<button class="ipg-cf-toggle" id="ipg-industry-back" style="margin-bottom:14px">\u2190 Back to all industries</button>';
    h += '<div style="margin-bottom:18px">'
      + '<span class="ipg-cf-chip" style="background:'+meta.color+';color:'+readableText(meta.color)+';font-size:13px;padding:6px 14px">'+meta.label+'</span>'
      + '</div>';

    // Top-line stats card row
    h += '<div class="ipg-cf-summary" style="margin-bottom:18px">';
    h += '<div class="ipg-stat ipg-stat-cash"><div class="num">'+fmtMoney(totalAmount)+'</div><div class="lab">Total Raised</div></div>';
    h += '<div class="ipg-stat"><div class="num">'+donorTotals.length+'</div><div class="lab">Donors</div></div>';
    h += '<div class="ipg-stat"><div class="num">'+committeeRows.length+'</div><div class="lab">Committees Funded</div></div>';
    h += '<div class="ipg-stat"><div class="num">'+contribs.length+'</div><div class="lab">Contributions</div></div>';
    h += '</div>';

    // Committees this industry funded (the new accountability view)
