  // E-6 Level 1 — election-wide industry totals as sorted bars (Option A). Each industry is ONE
  // aggregate bar: direct industries in teal, IE-funded industries in sage ("independent"). The
  // aggregate is legitimate here because no candidate is in view — support/oppose are NOT split
  // at Level 1; that split appears only on drill into a candidate (Level 3). Click a bar to see
  // that industry's spenders (Level 2). Sorted high-to-low (industryTotals is pre-sorted by total).
  function industryChart(industries) {
    var max = 1;
    for (var m = 0; m < industries.length; m++) if (industries[m].total > max) max = industries[m].total;
    var note = '<p class="contrib-note">Total money deployed by industry — direct contributions plus ' +
      'independent support and opposition, shown separately. Largest first. Click an industry to see ' +
      'who gave or spent.</p>';
    var legend = '<div class="ind-legend" aria-hidden="true"><span><i class="sw third"></i>Direct contributions</span>' +
      '<span><i class="sw support"></i>Independent support</span>' +
      '<span><i class="sw oppose"></i>Independent opposition</span></div>';
    var rows = industries.map(function (x) {
      var uncat = (x.industry === 'unclassified' || x.industry === 'uncategorized');
      var drill = uncat ? 'uncategorized' : x.industry;
      var label = uncat ? 'uncategorized' : prettyTag(x.industry);
      var w = max > 0 ? Math.min(100, Math.max(1.5, x.total / max * 100)) : 0;
      // Rule (b): three streams shown as separate labeled segments + a default-visible breakdown
      // line. Only non-zero streams render (a direct-only industry shows one 'Direct' part, never
      // empty $0 segments), and the top figure is labeled 'total deployed', never 'independent'.
      var seg = function (v, cls) { return v > 0 ? '<div class="seg ' + cls + '" style="width:' + (v / x.total * 100) + '%"></div>' : ''; };
      var segs = seg(x.direct, 'third') + seg(x.support, 'support') + seg(x.oppose, 'oppose');
      // Largest-remainder apportionment so the displayed parts sum EXACTLY to the displayed total
      // (money() rounds each stream independently, which can drift by $1 against round(total)).
      var streams = [];
      if (x.direct > 0) streams.push({ lab: 'Direct', cls: 'bd-d', raw: x.direct });
      if (x.support > 0) streams.push({ lab: 'Independent support', cls: 'bd-s', raw: x.support });
      if (x.oppose > 0) streams.push({ lab: 'Independent opposition', cls: 'bd-o', raw: x.oppose });
      var disp = streams.map(function (s) { return Math.floor(s.raw); });
      var leftover = Math.round(x.total) - disp.reduce(function (a, b) { return a + b; }, 0);
      streams.map(function (s, i) { return i; })
        .sort(function (a, b) { return (streams[b].raw - Math.floor(streams[b].raw)) - (streams[a].raw - Math.floor(streams[a].raw)); })
        .slice(0, Math.max(0, leftover)).forEach(function (i) { disp[i] += 1; });
      var parts = streams.map(function (s, i) { return '<span class="bd ' + s.cls + '">' + s.lab + ' $' + disp[i].toLocaleString('en-US') + '</span>'; });
      return '<button class="indbar" type="button" data-industry-drill="' + esc(drill) + '">' +
        '<div class="indbar-top"><span class="indbar-label">' + esc(label) + '</span>' +
          '<span class="indbar-val">' + money(x.total) + ' <span class="indbar-val-lab">total deployed</span></span></div>' +
        '<div class="bartrack"><div class="barfill" style="width:' + w + '%">' + segs + '</div></div>' +
        '<div class="indbar-breakdown">' + parts.join(' <span class="bd-sep">·</span> ') + '</div></button>';
    }).join('');
    return note + legend + '<div class="indchart">' + rows + '</div>';
  }

  function renderSpend(vm, office) {
    var tab = vm.tab || 'donors', body;
    if (tab === 'candidates') {
      // E-7: full roster grouped by race (President -> d01 -> d20), ranked within each race by
      // contributions.total (direct raised, single-stream). The three figures stay SEPARATE.
      body = candidateRaceFilter(vm.raceOptions, vm.raceFilter, office) +
        '<p class="contrib-note">Candidates grouped by race, ranked within each race by money raised (direct ' +
        'contributions). The three figures — raised, independent support, independent opposition — are shown ' +
        'separately and never added together.</p>' +
        vm.groups.map(function (g) {
          var rows;
          if (g.candidates.length) {
            rows = g.candidates.map(function (c) {
              var f = c.figures;
              // X-2: the enriched candidate is by construction the single expanded one
              // (Stage 3 enriches exactly the id === expandedCandidateId), so slug presence
              // is the expand signal. threeFig stays visible in BOTH states (display-only).
              var isExpanded = !!c.slug;
              var inner = (c.hasCommittee ? '<span class="caret" aria-hidden="true">▸</span> ' : '') + esc(c.name) +
                (c.incumbent ? ' <span class="chip-inc">Incumbent</span>' : '') +
                (c.hasCommittee ? '' : ' <span class="badge">no committee registered</span>') +
                '<div class="rankfig">' + money(f.contributions.total) + ' <span class="n">raised</span></div>' +
                '<div class="figrow">' + threeFig(f) + '</div>';
              // Expand affordance: its OWN element carrying ONLY data-expand-cand + aria-expanded.
              // No aria-controls (that's a dispatch attr caught by an earlier handler; the expand
              // is redraw-driven, not the in-place .open toggle). Shown only when there's a card to
              // open (hasCommittee); committee-less candidates stay flat, exactly as raceView.
              var head = c.hasCommittee
                ? '<button class="sname srow-expand" type="button" data-expand-cand="' + esc(c.id) +
                    '" aria-expanded="' + (isExpanded ? 'true' : 'false') + '">' + inner + '</button>'
                : '<div class="sname">' + inner + '</div>';
              // Inline card is a SIBLING AFTER the .srow (never a child of the affordance) — the
              // structural collision guarantee from Stage 2's trace. Rendered VERBATIM via card()
              // with the 'g-' prefix; no bar/panel markup is reproduced here.
              var cardHtml = isExpanded ? '<div class="srow-card">' + card(c, g.scale, 'g-') + '</div>' : '';
              return '<div class="srow">' + head + '</div>' + cardHtml;
            }).join('');
          } else {
            rows = '<div class="srow empty"><div class="sname">No finance reported yet.</div></div>';
          }
          // HALT-GUARD: the section names its election (the HALT-F2 shipped pattern,
          // unconditional) — under shape 3' a section's race can belong to an election
          // other than the selected scope, and the label is what keeps that honest.
          var gy = (/^(\d{4})-/.exec(g.race.election_id || '') || [])[1];
          return '<div class="racegroup"><h3 class="racehead">' + esc(g.race.label) +
            (gy ? '<span class="race-meta"> \u00b7 ' + esc(gy) + ' election</span>' : '') + '</h3>' + rows + '</div>';
        }).join('');
    } else if (tab === 'industries') {
      body = industryChart(vm.industries);   // E-6 Level 1: sorted-bar chart, click -> spenders (Level 2)
    } else if (tab === 'industry-candidate') {
      body = '<p class="contrib-note">Each candidate’s direct contributions by donor industry. Independent spending is not candidate money and is shown separately. ' +
        'Uncategorized shown as uncategorized.</p>' +
        vm.rows.map(function (r) {
          return '<div class="srow"><div class="sname">' + esc(r.name) + ' <span class="muted">· ' + esc(r.race) + '</span>' +
            '<div class="ixc">' + r.industries.filter(function (i) { return i.direct > 0; }).map(function (i) {
              return '<span class="tagchip ind">' + esc(prettyTag(i.industry === 'unclassified' ? 'uncategorized' : i.industry)) + ' ' + money(i.direct) + '</span>';
            }).join('') + '</div></div></div>';
        }).join('');
    } else if (tab === 'flags') {
      body = '<p class="contrib-note">Editorial flags aggregated across this office’s donors.</p>' +
        (vm.flags.length ? vm.flags.map(function (x) {
          return '<div class="srow"><div class="sname">⚑ ' + esc(prettyTag(x.flag)) +
            '<div class="figrow"><span class="mini c">' + money(x.amount) + '</span><span class="muted">· ' + x.count + ' contributions</span></div></div></div>';
        }).join('') : '<div class="soon"><p>No flags recorded for this office yet.</p></div>');
    } else { // donors
      var controls = donorFilterControls(vm.facets, vm.donorFilters);
      var note = browseResultsNote(vm.rows, vm.ieCount || 0, vm.donorFilters, vm.facets);
      if (!vm.rows.length) {
        body = controls + note + '<div class="soon"><p>No donors or spenders match these filters.</p></div>';
      } else {
        var LIMIT = 50, rows = vm.rows, top = '';
        for (var i = 0; i < Math.min(LIMIT, rows.length); i++) top += browseRow(rows[i], vm.industryTags);
        var more = '';
        if (rows.length > LIMIT) {
          var moreRows = ''; for (var j = LIMIT; j < rows.length; j++) moreRows += browseRow(rows[j], vm.industryTags);
          more = '<button class="show-more" type="button" aria-expanded="false" aria-controls="spend-donors-more">' +
            '<span class="caret" aria-hidden="true">▸</span> Show all ' + rows.length + ' donors &amp; spenders</button>' +
            '<div class="contrib tall" id="spend-donors-more"><div class="contrib-inner bare">' + moreRows + '</div></div>';
        }
        body = controls + note + top + more;
      }
    }
    // The active election window rides on the container so a spender drill-down opened
    // from this tab (donor footprint OR IE-PAC profile) stays scoped to the same window
    // (winFromEl reads the nearest [data-win-end] ancestor).
    var winAttr = vm.win ? (' data-win-start="' + esc(vm.win.start || '') + '" data-win-end="' + esc(vm.win.end || '') + '"') : '';
    return '<div class="spend"' + winAttr + '>' + spendNav(tab) + '<div class="spend-body">' + body + '</div></div>';
  }

  // (Cycle/year pills removed from the election views — the This/Last/All election
  // toggle is the sole time selector. The council tool keeps its own cycle pills.)

  function officeComingSoon(office) {
    return '<div class="soon"><h2>' + esc(pageLabel(office)) + ' — coming soon</h2>' +
      '<p>Candidates are still filing for this office. Campaign-finance data appears here as committees are ' +
      'identified and processed — check back as the field fills in.</p></div>';
  }

  // Full inner HTML for the mount container — used by the browser app AND the
  // future SEO pre-render (same pure output).
  function renderPage(state) {
    var inner;
    if (state.topView === 'methodology') {
      // D-22 (PS-112): NOT tool-wide any more. The methodology describes ONE office's
      // subject and sources, so an office with no ratified methodology renders coming-soon
      // on this tab like every other tab, rather than shipping another office's copy.
      inner = METHODOLOGY_OFFICES[state.office]
        ? methodologyView(state.verify) : officeComingSoon(state.office);
      return '<div class="wrap">' + masthead(state.office, state.topView) +
        '<section>' + inner + '</section>' + footer() + '</div>';
    }
    var ready = state.officeRaces && state.officeRaces.groups.some(function (g) {
      return g.races.some(function (r) { return r.hasFinance; });
    });
    if (!ready) {
      inner = officeComingSoon(state.office);     // city_council / mayor: clean coming-soon, never a crash
    } else {
      var byrace = state.topView !== 'spend';
      var content = selectorNav(state.selector) + (byrace
        ? (renderOfficeNav(state.officeRaces, state.activeSlug) +
           '<div aria-live="polite">' + (state.raceView ? renderRaceView(state.raceView) : '') + '</div>')
        : (state.spend ? renderSpend(state.spend, state.office) : spendPlaceholder()));
      // The legacy SBE 4-year cycle pills are removed from the election views: they
      // cannot express 2024-vs-2026 (both cycle '2027') and duplicate the election
      // toggle, which is now the SOLE time selector. (Council still uses cycle pills.)
      inner = content;
    }
    return '<div class="wrap">' + masthead(state.office, state.topView) +
      '<section>' + inner + '</section>' + footer() + '</div>';
  }

  return {
    styles: styles,
    masthead: masthead, footer: footer,
    renderOfficeNav: renderOfficeNav, renderRaceView: renderRaceView,
    renderComingSoon: renderComingSoon, spendPlaceholder: spendPlaceholder, renderSpend: renderSpend,
    methodologyView: methodologyView,
    renderFunderModal: renderFunderModal, renderCommitteeProfile: renderCommitteeProfile,
    renderPersonModal: renderPersonModal, renderPersonMissing: renderPersonMissing,
    // Ratified display strings + the methodology gate, exported for [MUNI/COPY] to pin against
    // an independently stated oracle (D-21/PS-111, D-22/PS-112). Test hook only — the render
    // paths above are the app's consumers, exactly as data.js exports OFFICE_TYPE for
    // [MUNI/TABLE] without the app ever reading it.
    _ratified: { browseFraming: BROWSE_FRAMING, raceFilterAll: RACE_FILTER_ALL,
                 personElectionNoun: PERSON_ELECTION_NOUN, methodologyOffices: METHODOLOGY_OFFICES },
    tagsHtml: tagsHtml, readableText: readableText,
    donorRow: donorRow, contributorPanel: contributorPanel, iePanel: iePanel,
    renderPage: renderPage, pageLabel: pageLabel,
    _money: money, _esc: esc
  };
});

</script>
<script>
/* Elections embed — APP layer (browser-only, THIN).
 *
 * Fetch + mount + state + event wiring only. ALL view-model and render logic
 * lives in the pure data.js / render.js layers (so the SEO pre-render reuses
 * them); nothing data/render-shaped may leak in here.
 *
 * OFFICE is set per Squarespace Code Block via data-office on the mount node
 * (school_board | city_council | mayor); default school_board. data-src can
 * override the data URL (default = GitHub raw CDN, same pattern as the council
 * embed).
 */
(function () {
  'use strict';
  var ROOT_ID = 'ipg-elect-root';
  // D-5's refs/heads/main/ form, carried here at D-26 (MUNI-ENABLE-1 G7b, discharging open
  // ledger 8): "main" is a fragment GitHub resolves against branches AND tags, so a future tag
  // named "main" would silently repoint every fetch below; refs/heads/main/ is structurally
  // unambiguous. This was the last embed on the bare form — council and school board already
  // carry refs/heads/. Taken now because one paste is already owed this lane and the pasted
  // surfaces triple after it, so this is the cheapest moment the form will have.
  var DEFAULT_SRC = 'https://raw.githubusercontent.com/publicgoodpolicy/chi-council-votes/refs/heads/main/campaign-finance/election-data.json';
  // Verification artifacts, fetched at runtime from the same raw-CDN base as the data, so
  // the methodology page's numbers can never drift from the artifacts it cites (they deploy
  // together on push, paste-free). URLs are baked; they don't drift.
  var ART_BASE = DEFAULT_SRC.replace(/election-data\.json$/, 'elections/');
  var RECON_URL = ART_BASE + 'reconciliation-report.json';
  var GAPS_URL = ART_BASE + 'known-gaps.json';
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
    'September', 'October', 'November', 'December'];
  function fmtPulled(iso) {
    var p = String(iso || '').split('-');
    return (p.length === 3 && MONTHS[+p[1] - 1]) ? (MONTHS[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0]) : null;
  }
  // Build the `verify` object for methodologyView. URLs are ALWAYS returned (baked); on any
  // fetch/parse failure the numeric fields are omitted, so the view renders its neutral
  // fallback — never a stale or default number. Isolated from the main data fetch: a failure
  // here degrades only the methodology numbers, never the candidate views.
  function loadVerify(cb) {
    var base = { reconUrl: RECON_URL, gapsUrl: GAPS_URL };
    if (typeof fetch === 'undefined') { cb(base); return; }
    var get = function (u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); };
    Promise.all([get(RECON_URL), get(GAPS_URL)]).then(function (res) {
      var h = (res[0] && res[0].headline) || {}, run = (res[0] && res[0].run) || {};
      var glist = (res[1] && res[1].gaps) || [];
      var pulled = fmtPulled(run.pulled);
      if (pulled == null || h.dollar_weighted_match_pct == null || h.committees_with_sbe_id == null) { cb(base); return; }
      base.pulled = pulled;
      base.matchRate = h.dollar_weighted_match_pct;
      base.nCommittees = h.committees_with_sbe_id;
      base.nGaps = glist.length;
      base.disclosedTotal = glist.reduce(function (s, g) { return s + Math.abs(g.amount || 0); }, 0);
      cb(base);
    }).catch(function () { cb(base); });
  }

  function injectStyles() {
    if (typeof document === 'undefined' || document.getElementById('ipg-elect-css')) return;
    document.head.insertAdjacentHTML('beforeend',
      ElectRender.styles().replace('<style>', '<style id="ipg-elect-css">'));
  }

  // ONE modal system, two content types (donor footprint + committee profile).
  // Mounted on <body> wrapped in .ipg-elect so scoped styles apply; closed by ×,
  // backdrop, or Esc. App only mounts/unmounts and dispatches by data-attr — it
  // does NOT fork into separate handlers per content type. The modals are
  // bidirectional: a footprint's committee row opens a committee profile, whose
  // funder rows open footprints, all through the same openModal/closeModal.
  var IDX = null;  // current loaded index (set in start)
  function escClose(e) { if (e.key === 'Escape') closeModal(); }
  function closeModal() {
    var m = document.getElementById('ipg-elect-modal');
    if (m) m.parentNode.removeChild(m);
    document.removeEventListener('keydown', escClose);
  }
  function openFunder(pid, win) { if (IDX) openModal(ElectRender.renderFunderModal(ElectData.donorFootprint(IDX, pid, win))); }
  function openCommittee(key, win) { if (IDX) openModal(ElectRender.renderCommitteeProfile(ElectData.committeeProfile(IDX, key, win))); }
  // Person surface (P1D-PERSON). Takes NO window parameter — a person modal is framed by
  // its entity, never by the container it was opened from (PS-89's exemption, visible in
  // the signature). The deep-link boot path calls this same function, on which inheritance
  // is impossible by construction (no container exists at boot). Unresolvable → string 7.
  function openPerson(ref) {
    if (!IDX) return;
    var vm = ElectData.personView(IDX, ref);
    openModal(vm ? ElectRender.renderPersonModal(vm) : ElectRender.renderPersonMissing());
  }
  // A donor clicked inside a per-election panel carries a [data-win-*] ancestor; scope
  // its footprint to that election window (Gate G). Elsewhere -> null -> full footprint.
  function winFromEl(el) {
    var w = el && el.closest && el.closest('[data-win-end]');
    if (!w) return null;
    return { start: w.getAttribute('data-win-start') || null, end: w.getAttribute('data-win-end') || null };
  }
  // Shared dispatch: a clicked donor row -> footprint, a clicked committee row ->
  // committee profile, a person affordance -> person surface. Used by BOTH the page
  // handler and the in-modal handler. The person branch passes NO window (PS-89).
  function modalNav(target) {
    var pr = target.closest && target.closest('[data-person]');
    if (pr) { openPerson(pr.getAttribute('data-person')); return true; }
    var fr = target.closest && target.closest('[data-funder]');
    if (fr) { openFunder(fr.getAttribute('data-funder'), winFromEl(fr)); return true; }
    var cr = target.closest && target.closest('[data-committee]');
    if (cr) { openCommittee(cr.getAttribute('data-committee'), winFromEl(cr)); return true; }
    return false;
  }
  function openModal(html) {
    closeModal();
    var w = document.createElement('div');
    w.id = 'ipg-elect-modal'; w.className = 'ipg-elect'; w.innerHTML = html;
    w.addEventListener('click', function (e) {
      if ((e.target.closest && e.target.closest('[data-modal-close]')) ||
          (e.target.matches && e.target.matches('[data-modal-overlay]'))) { closeModal(); return; }
      modalNav(e.target);  // same dispatch as the page → bidirectional navigation
    });
    document.body.appendChild(w);
    document.addEventListener('keydown', escClose);
  }

  function notice(root, msg, coral) {
    root.innerHTML = '<div class="wrap"><p style="padding:44px 0;font-family:Poppins,system-ui,sans-serif;color:' +
      (coral ? '#B0553A' : '#6E5F58') + '">' + msg + '</p></div>';
  }

  function firstSlug(omVM) {
    var live = null, first = null;
    for (var g = 0; g < omVM.groups.length; g++) {
      for (var i = 0; i < omVM.groups[g].races.length; i++) {
        var r = omVM.groups[g].races[i];
        if (first === null) first = r.slug;
        if (!live && r.hasFinance) live = r.slug;
      }
    }
    return live || first;
  }
  function groupFirstSlug(group) {
    var live = null;
    for (var i = 0; i < group.races.length; i++) if (!live && group.races[i].hasFinance) live = group.races[i].slug;
    return live || (group.races[0] && group.races[0].slug) || null;
  }

  function start(root, office, index) {
    IDX = index;
    var cycles = ElectData.availableCycles(index);
    // SCOPE-UI: the GLOBAL election selector. Options come from the ratified {year} {body}
    // pattern; default = newest. A read-only ?election= URL param (validated against the
    // option ids) pre-selects a scope — no history writes, absent/invalid falls back.
    var selOpts = ElectData.selectorOptions(office);
    var urlSel = null;
    try {
      if (typeof location !== 'undefined' && typeof URLSearchParams !== 'undefined') {
        var q = new URLSearchParams(location.search).get('election');
        if (q && selOpts.some(function (o) { return o.id === q; })) urlSel = q;
      }
    } catch (e0) {}
    var state = { office: office, topView: 'byrace', activeSlug: null, cycle: null, spendTab: 'donors',
      election: urlSel || (selOpts[0] && selOpts[0].id) || null,
      donorFilters: { search: '', type: 'All', industry: 'All', flag: 'All' }, raceFilter: 'all',
      expandedCandidateId: null,   // X-2: the ONE grouped row expanded to its inline funder card (accordion-of-one)
      verify: { reconUrl: RECON_URL, gapsUrl: GAPS_URL } };   // methodology fields; numbers fill in async
    var browseSearchTimer = null;
    state.activeSlug = firstSlug(ElectData.viewModels.officeRaces(index, office, state.election));
    loadVerify(function (v) { state.verify = v; draw(); });   // runtime-plumb the methodology numbers

    function draw() {
      var omVM = ElectData.viewModels.officeRaces(index, state.office, state.election);
      var raceId = index.raceBySlug[state.activeSlug];
      var rv = raceId ? ElectData.viewModels.raceView(index, raceId, state.cycle) : null;
      var spend = state.topView === 'spend' ? ElectData.spendSubtab(index, state.office, state.spendTab, state.cycle, state.election, state.donorFilters, state.raceFilter, state.expandedCandidateId) : null;
      root.innerHTML = ElectRender.renderPage({
        office: state.office, topView: state.topView, cycles: cycles, cycle: state.cycle,
        officeRaces: omVM, activeSlug: state.activeSlug, raceView: rv, spend: spend,
        selector: { options: selOpts, active: state.election }, verify: state.verify
      });
    }

    root.addEventListener('click', function (e) {
      // donor/committee rows open a modal (shared dispatch — same as in-modal nav)
      if (modalNav(e.target)) return;
      var cl = function (sel) { return e.target.closest && e.target.closest(sel); };
      // Tier 1/2 + figure bars: any aria-controls toggle expands its panel in place
      // (no redraw → open state persists)
      var dz = cl('[aria-controls]');
      if (dz) {
        var pid = dz.getAttribute('aria-controls'), panel = pid && document.getElementById(pid);
        if (panel) { var open = panel.classList.toggle('open'); dz.setAttribute('aria-expanded', open ? 'true' : 'false'); }
        return;
      }
      // X-2: E-7 grouped row -> inline funder card. MUST sit after modalNav and the
      // aria-controls toggle: a click on a funder row (data-funder -> modalNav, line above)
      // or an internal disclosure (aria-controls) INSIDE an already-expanded card is caught
      // and returned by those handlers first, so it never collapses the card. This branch
      // fires only when neither matched. The affordance is its own element carrying ONLY
      // data-expand-cand (no data-slug/funder/committee/aria-controls), so one click never
      // satisfies two dispatch paths. Accordion-of-one: re-clicking the open row toggles off.
      var xc = cl('[data-expand-cand]');
      if (xc) {
        var cid = xc.getAttribute('data-expand-cand');
        state.expandedCandidateId = (state.expandedCandidateId === cid) ? null : cid;
        draw(); return;
      }
      var v = cl('[data-view]');
      if (v) { state.topView = v.getAttribute('data-view'); draw(); return; }
      var st = cl('[data-spendtab]');
      if (st) { state.spendTab = st.getAttribute('data-spendtab'); draw(); return; }
      // E-6 Level 1 -> 2: click an industry bar -> that industry's ranked spenders, via the
      // E-1 industry filter on Browse Donors (donors subtab). Level 3 is then the existing
      // spender modal (donor footprint / IE committee profile, dispatch-by-kind).
      var idr = cl('[data-industry-drill]');
      if (idr) {
        state.spendTab = 'donors';
        state.donorFilters = { search: '', type: 'All', industry: idr.getAttribute('data-industry-drill'), flag: 'All' };
        draw(); return;
      }
      // GLOBAL election selector (SCOPE-UI): switching scope resets the active race to the
      // new scope's first race — the 2024/2026 namespaces are disjoint, so preserving a
      // selection across a switch is impossible by construction (ruled B6 resolution).
      var es = cl('[data-election]');
      if (es) {
        var eid = es.getAttribute('data-election');
        if (eid !== state.election) {
          state.election = eid;
          state.activeSlug = firstSlug(ElectData.viewModels.officeRaces(index, state.office, state.election));
          state.expandedCandidateId = null;
        }
        draw(); return;
      }
      // Browse-Donors filters: clear-all (the search input + selects are handled by input/change).
      if (cl('[data-clear-filters]')) { state.donorFilters = { search: '', type: 'All', industry: 'All', flag: 'All' }; draw(); return; }
      // chips AND the vacating-incumbent "→" link both navigate by slug
      var ch = cl('[data-slug]');
      if (ch) { state.activeSlug = ch.getAttribute('data-slug'); state.topView = 'byrace'; draw(); return; }
      var of = cl('.office[data-group]');
      if (of) {
        var label = of.getAttribute('data-group');
        var omVM = ElectData.viewModels.officeRaces(index, state.office, state.election);
        for (var i = 0; i < omVM.groups.length; i++) {
          if (omVM.groups[i].label === label && omVM.groups[i].races.length) {
            state.activeSlug = groupFirstSlug(omVM.groups[i]); break;
          }
        }
        draw(); return;
      }
    });

    // Client-side donor search inside a drill-down panel (council behavior): filter the
    // panel's donor rows by name; reveal the collapsed remainder while a query is active.
    // Browse-Donors filter selects (E-1): re-run browseDonors through the active filters.
    root.addEventListener('change', function (e) {
      var t = e.target; if (!(t && t.matches)) return;
      if (t.matches('[data-donor-type]')) { state.donorFilters.type = t.value; draw(); return; }
      if (t.matches('[data-donor-industry]')) { state.donorFilters.industry = t.value; draw(); return; }
      if (t.matches('[data-donor-flag]')) { state.donorFilters.flag = t.value; draw(); return; }
      if (t.matches('[data-race-filter]')) { state.raceFilter = t.value; draw(); return; }   // E-7 race filter
    });

    root.addEventListener('input', function (e) {
      // Browse-Donors search (E-1): debounced redraw through browseDonors, then restore focus +
      // cursor to the search box (council behavior) so typing isn't interrupted by the rerender.
      if (e.target.matches && e.target.matches('[data-browse-search]')) {
        var val = e.target.value;
        clearTimeout(browseSearchTimer);
        browseSearchTimer = setTimeout(function () {
          state.donorFilters.search = val; draw();
          var s = root.querySelector('[data-browse-search]');
          if (s) { s.focus(); try { s.setSelectionRange(s.value.length, s.value.length); } catch (e2) {} }
        }, 180);
        return;
      }
      if (!(e.target.matches && e.target.matches('[data-donor-search]'))) return;
      var panel = e.target.closest('.contrib-inner'); if (!panel) return;
      var q = (e.target.value || '').trim().toLowerCase();
      var rows = panel.querySelectorAll('.crow');
      for (var i = 0; i < rows.length; i++) {
        var hit = !q || (rows[i].textContent || '').toLowerCase().indexOf(q) >= 0;
        rows[i].style.display = hit ? '' : 'none';
      }
      var more = panel.querySelector('.contrib.tall');
      if (more) more.classList.toggle('open', !!q);
    });

    draw();

    // Deep link (D4): a read-only ?person= param opens the person surface after first
    // paint — the PS-89 rev 2 proof path, with no container to inherit a window from.
    // Validation is by resolution (openPerson renders string 7 for anything unresolvable);
    // no history writes, absent param is a no-op.
    try {
      if (typeof location !== 'undefined' && typeof URLSearchParams !== 'undefined') {
        var pq = new URLSearchParams(location.search).get('person');
        if (pq) openPerson(pq);
      }
    } catch (e3) {}
  }

  function init() {
    var root = document.getElementById(ROOT_ID);
    if (!root) return;
    if (typeof ElectData === 'undefined' || typeof ElectRender === 'undefined') {
      notice(root, 'Election tool failed to load (scripts missing).', true); return;
    }
    var office = root.getAttribute('data-office') || (typeof window !== 'undefined' && window.IPG_OFFICE) || 'school_board';
    var src = root.getAttribute('data-src') || (typeof window !== 'undefined' && window.IPG_DATA_URL) || DEFAULT_SRC;
    root.className = 'ipg-elect';
    injectStyles();
    notice(root, 'Loading election data…');
    fetch(src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) { start(root, office, ElectData.loadData(json, { office: office })); })
      .catch(function (err) { notice(root, 'Couldn’t load election data (' + String(err && err.message || err) + ').', true); });
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  }
})();

</script>
</body>
</html>
