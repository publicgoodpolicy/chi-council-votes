<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0">
<!-- ============================================================
     IPG Elections embed — paste this ENTIRE block into a Squarespace Code Block.
     Per page, set data-office on the mount div:
       school_board  (live)  |  city_council  (coming soon)  |  mayor (coming soon)
     Data is fetched at runtime from the GitHub raw CDN (election-data.json).
     ============================================================ -->
<div id="ipg-elect-root" data-office="school_board"></div>
<script>
/* Elections embed — DATA layer (pure, dual-runtime).
 *
 * No window / document / fetch / localStorage. Node can require() this for the
 * future SEO pre-render; the browser app layer (B2+) loads it as a global.
 *
 *   loadData(parsedJson) -> ONE memoized single-pass index
 *   candidateFigures(index, candidateId, cycle)  // cycle=null => all-time
 *   viewModels.raceBrowse(index, office, cycle)
 *   viewModels.raceView(index, raceId, cycle)
 *
 * The index is built in a single pass over contributions and a single pass over
 * IEs (O(C+I)); view models read pre-bucketed rows (no donors x contributions
 * nested scan — that was the council Compare-by-Donor regression).
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.ElectData = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // Office page -> the race.office values it owns.
  var OFFICE_RACE_OFFICES = {
    school_board: ['school_board_president', 'school_board_member'],
    city_council: ['alderperson'],
    mayor: ['mayor']
    // NOTE: city_clerk / city_treasurer races exist in the data but have no page
    // among the three Code Blocks (flagged in HALT 1) — intentionally unmapped.
  };

  // How each office page groups its races (sub-tabs / pickers).
  var OFFICE_GROUPS = {
    school_board: [
      { label: 'Board President', offices: ['school_board_president'] },
      { label: 'Districts', offices: ['school_board_member'] }
    ],
    city_council: [{ label: 'Wards', offices: ['alderperson'] }],
    mayor: [{ label: 'Mayor', offices: ['mayor'] }]
  };

  // Cycles never shown (out of SBE range / unattributable). Always excluded.
  var EXCLUDED_CYCLES = { 'pre-2011': 1, 'undated': 1 };
  var DUES_TYPE = 'IE Committee Dues Transfer';

  // ---- stable, URL-safe slugs (locked scheme: e.g. "bruce-leon-district-2a") ----
  // Pure + deterministic so the browser app and the future SEO pre-render derive
  // identical paths from the same data.
  function kebab(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function raceSlug(race) {
    if (race.district) return kebab(race.district);              // "District 2A" -> "district-2a"
    if (race.ward) return 'ward-' + race.ward;                   // ward "23"      -> "ward-23"
    return kebab({ school_board_president: 'school-board-president', mayor: 'mayor',
                   city_clerk: 'city-clerk', city_treasurer: 'city-treasurer' }[race.office] || race.office);
  }
  function candidateSlug(cand, race) { return kebab(cand.name) + '-' + raceSlug(race); }
  function raceCode(race) {           // short chip label
    if (race.district) return String(race.district).replace(/^District\s+/i, '');  // "2A"
    if (race.ward) return 'Ward ' + race.ward;
    return ({ school_board_president: 'President', mayor: 'Mayor',
              city_clerk: 'Clerk', city_treasurer: 'Treasurer' }[race.office]) || race.label;
  }
  function officeFriendly(office) {   // for the "running for X" note
    return ({ school_board_president: 'Board President', school_board_member: 'School Board',
              alderperson: 'City Council', mayor: 'Mayor',
              city_clerk: 'City Clerk', city_treasurer: 'City Treasurer' }[office]) || office;
  }

  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

  // A contribution is self-funded if it is a loan OR comes from the candidate
  // themselves (donor typed Candidate / self-funding). Small-dollar aggregate
  // and third-party donors are NOT self.
  function isSelfFunded(donors, c) {
    var d = donors[c.donor_id] || {};
    return !!(c.is_loan || c.contribution_type === 'Loan Received' ||
              d.type === 'Candidate' ||
              (d.industries || []).indexOf('self-funding') >= 0);
  }

  function loadData(json, opts) {
    opts = opts || {};
    var races = json.races || [];
    var candidates = json.candidates || [];
    var committees = json.committees || {};
    var donors = json.donors || {};
    var contributions = json.contributions || [];
    var ies = json.independent_expenditures || [];

    var raceById = {}, candidateById = {}, candidatesByRace = {};
    for (var i = 0; i < races.length; i++) raceById[races[i].id] = races[i];
    for (var j = 0; j < candidates.length; j++) {
      var cnd = candidates[j];
      candidateById[cnd.id] = cnd;
      (candidatesByRace[cnd.race_id] || (candidatesByRace[cnd.race_id] = [])).push(cnd);
    }

    // Office scope (opts.office): keep only IEs whose TARGET candidate runs for
    // this office, so council/municipal IE activity never bleeds into a
    // school-board view. inScopeCand=null means no scoping (all offices).
    var officeSet = opts.office ? OFFICE_RACE_OFFICES[opts.office] : null;
    var inScopeCand = null;
    if (officeSet) {
      inScopeCand = {};
      for (var s = 0; s < candidates.length; s++) {
        var rc = raceById[candidates[s].race_id];
        if (rc && officeSet.indexOf(rc.office) >= 0) inScopeCand[candidates[s].id] = 1;
      }
    }

    // committee key <-> candidate_id, and the committee meta lookup
    var candByCommittee = {};            // committee key -> candidate_id
    var committeeKeyByCandidate = {};    // candidate_id  -> committee key
    for (var key in committees) {
      if (!committees.hasOwnProperty(key)) continue;
      var cid = committees[key].candidate_id;
      if (cid) { candByCommittee[key] = cid; committeeKeyByCandidate[cid] = key; }
    }

    var directByCandidate = {};    // candidate_id -> [contrib rows]
    var fundersBySpender = {};     // spender committee key -> [contrib rows]  (second hop)
    var parentRollup = {};         // parent_id -> { parent_id, name, rows:[] }
    var industryByCandidate = {};  // candidate_id -> { industry -> {direct, support, oppose} }  (B4)
    var flagByCandidate = {};      // candidate_id -> { flagType -> {amount, count} }            (B4)
    var cyclesSeen = {};
    var stats = { contributionRowsVisited: 0, ieRowsVisited: 0 };

    // ---- single pass over contributions ----
    for (var k = 0; k < contributions.length; k++) {
      stats.contributionRowsVisited++;
      var ct = contributions[k];
      var ck = ct.committee_id;
      var candId = candByCommittee[ck];
      var donor = donors[ct.donor_id];
      var inScope = !EXCLUDED_CYCLES[ct.cycle] && ct.contribution_type !== DUES_TYPE;
      if (inScope && ct.cycle) cyclesSeen[ct.cycle] = 1;

      if (candId) {
        (directByCandidate[candId] || (directByCandidate[candId] = [])).push(ct);
        if (inScope) {
          var amt = ct.amount || 0;
          var inds = (donor && donor.industries && donor.industries.length) ? donor.industries : ['uncategorized'];
          var ibc = industryByCandidate[candId] || (industryByCandidate[candId] = {});
          for (var a = 0; a < inds.length; a++) {
            var slot = ibc[inds[a]] || (ibc[inds[a]] = { direct: 0, support: 0, oppose: 0 });
            slot.direct = round2(slot.direct + amt);
          }
          var flags = (donor && donor.flags) || [];
          if (flags.length) {
            var fbc = flagByCandidate[candId] || (flagByCandidate[candId] = {});
            for (var f = 0; f < flags.length; f++) {
              var ft = (flags[f] && flags[f].type) || String(flags[f]);
              var fslot = fbc[ft] || (fbc[ft] = { amount: 0, count: 0 });
              fslot.amount = round2(fslot.amount + amt); fslot.count++;
            }
          }
        }
      } else {
        var cm = committees[ck];
        if (cm && cm.type === 'independent_expenditure') {
          (fundersBySpender[ck] || (fundersBySpender[ck] = [])).push(ct);
        }
      }

      // parent rollup (browse-donors / contributor drill-down) — all contributions
      if (donor) {
        var pid = donor.parent_id || ct.donor_id;
        var pr = parentRollup[pid] ||
          (parentRollup[pid] = { parent_id: pid, name: (donors[pid] && donors[pid].name) || donor.name, rows: [] });
        pr.rows.push(ct);
      }
    }

    // ---- single pass over IEs ----
    var ieByCandidate = {};  // candidate_id -> {support:[], oppose:[]}
    var iesBySpender = {};   // spender committee key -> [ie rows]
    var inScopeIE = {};      // IE committee keys with >=1 kept IE (office-scoped)
    for (var m = 0; m < ies.length; m++) {
      stats.ieRowsVisited++;
      var ie = ies[m];
      // item 5: a candidate's OWN committee is never an independent spender
      if (candByCommittee[ie.spender_committee_id]) continue;
      // item 4: office scope — drop IEs whose target runs for another office
      if (inScopeCand && !inScopeCand[ie.target_candidate_id]) continue;
      if (ie.spender_committee_id) {
        (iesBySpender[ie.spender_committee_id] || (iesBySpender[ie.spender_committee_id] = [])).push(ie);
        inScopeIE[ie.spender_committee_id] = 1;
      }
      var tcand = ie.target_candidate_id;
      if (!tcand) continue;
      var bucket = ieByCandidate[tcand] || (ieByCandidate[tcand] = { support: [], oppose: [] });
      (ie.stance === 'oppose' ? bucket.oppose : bucket.support).push(ie);
      if (!EXCLUDED_CYCLES[ie.cycle]) {
        if (ie.cycle) cyclesSeen[ie.cycle] = 1;
        var sp = committees[ie.spender_committee_id];
        var tags = (sp && sp.industry_tags) || [];
        var ibc2 = industryByCandidate[tcand] || (industryByCandidate[tcand] = {});
        var field = ie.stance === 'oppose' ? 'oppose' : 'support';
        for (var t = 0; t < tags.length; t++) {
          var s2 = ibc2[tags[t]] || (ibc2[tags[t]] = { direct: 0, support: 0, oppose: 0 });
          s2[field] = round2(s2[field] + (ie.amount || 0));
        }
      }
    }

    // slug -> id resolvers (for app navigation + SEO paths)
    var raceBySlug = {}, candidateBySlug = {};
    for (var ri = 0; ri < races.length; ri++) raceBySlug[raceSlug(races[ri])] = races[ri].id;
    for (var ci = 0; ci < candidates.length; ci++) {
      var cc = candidates[ci], rr = raceById[cc.race_id];
      if (rr) candidateBySlug[candidateSlug(cc, rr)] = cc.id;
    }

    return {
      races: races, candidates: candidates, committees: committees, donors: donors,
      raceById: raceById, candidateById: candidateById, candidatesByRace: candidatesByRace,
      candByCommittee: candByCommittee, committeeKeyByCandidate: committeeKeyByCandidate,
      directByCandidate: directByCandidate, ieByCandidate: ieByCandidate, iesBySpender: iesBySpender,
      inScopeIE: inScopeIE, office: opts.office || null,
      fundersBySpender: fundersBySpender, parentRollup: parentRollup,
      industryByCandidate: industryByCandidate, flagByCandidate: flagByCandidate,
      raceBySlug: raceBySlug, candidateBySlug: candidateBySlug,
      cyclesSeen: cyclesSeen, _stats: stats, _memo: {}
    };
  }

  function sumIE(list, cycle) {
    var s = 0, n = 0;
    for (var i = 0; i < list.length; i++) {
      var ie = list[i];
      if (EXCLUDED_CYCLES[ie.cycle]) continue;
      if (cycle != null && ie.cycle !== cycle) continue;
      s += ie.amount || 0; n++;
    }
    return { amount: s, count: n };
  }

  // The three money figures, kept SEPARATE — never summed into one number.
  // cycle = null -> all-time (all non-excluded cycles); else a specific cycle code.
  function candidateFigures(index, candidateId, cycle) {
    var direct = index.directByCandidate[candidateId] || [];
    var total = 0, self = 0, count = 0;
    for (var i = 0; i < direct.length; i++) {
      var c = direct[i];
      if (EXCLUDED_CYCLES[c.cycle]) continue;
      if (c.contribution_type === DUES_TYPE) continue;
      if (cycle != null && c.cycle !== cycle) continue;
      var a = c.amount || 0;
      total += a; count++;
      if (isSelfFunded(index.donors, c)) self += a;
    }
    var ieB = index.ieByCandidate[candidateId] || { support: [], oppose: [] };
    var sup = sumIE(ieB.support, cycle), opp = sumIE(ieB.oppose, cycle);
    return {
      contributions: { total: round2(total), selfFunded: round2(self), thirdParty: round2(total - self), count: count },
      independentSupport: round2(sup.amount), independentSupportCount: sup.count,
      independentOpposition: round2(opp.amount), independentOppositionCount: opp.count
    };
  }

  // Illinois Sunshine link — council embed's exact construction: prefer a stored
  // il_sunshine_url, else build from the SBE id (encoded), else none.
  function sunshineUrl(cm) {
    if (!cm) return null;
    if (cm.il_sunshine_url) return cm.il_sunshine_url;
    if (cm.sbe_committee_id) return 'https://illinoissunshine.org/committees/' + encodeURIComponent(cm.sbe_committee_id) + '/';
    return null;
  }

  function committeeMeta(index, candidateId) {
    var ckey = index.committeeKeyByCandidate[candidateId];
    if (!ckey) return null;
    var cm = index.committees[ckey];
    return {
      key: ckey, name: cm.committee_name || null, sbe_committee_id: cm.sbe_committee_id || null,
      sunshineUrl: sunshineUrl(cm)
    };
  }

  // Contributor drill-down: a candidate's direct contributions rolled up by
  // parent_id, sorted desc, INCLUDING the small-dollar aggregate as its own line.
  // Option A: lines sum EXACTLY to candidateFigures().contributions.total.
  function candidateContributors(index, candidateId, cycle) {
    var rows = index.directByCandidate[candidateId] || [];
    var by = {};
    for (var i = 0; i < rows.length; i++) {
      var c = rows[i];
      if (EXCLUDED_CYCLES[c.cycle]) continue;
      if (c.contribution_type === DUES_TYPE) continue;
      if (cycle != null && c.cycle !== cycle) continue;
      var donor = index.donors[c.donor_id] || {};
      var pid = donor.parent_id || c.donor_id;
      var parent = index.donors[pid] || donor;
      var m = by[pid] || (by[pid] = { parent_id: pid, name: parent.name || pid,
        industries: parent.industries || [], flags: parent.flags || [],
        total: 0, count: 0, isSelf: false, isAggregate: false });
      m.total = round2(m.total + (c.amount || 0)); m.count++;
      if (c.is_loan || c.contribution_type === 'Loan Received' || parent.type === 'Candidate' ||
          (parent.industries || []).indexOf('self-funding') >= 0) m.isSelf = true;
      if (parent.type === 'Aggregate' || (parent.industries || []).indexOf('small-dollar') >= 0) m.isAggregate = true;
    }
    var lines = []; for (var k in by) if (by.hasOwnProperty(k)) lines.push(by[k]);
    lines.sort(function (a, b) { return b.total - a.total; });
    var total = 0; for (var j = 0; j < lines.length; j++) total += lines[j].total;
    return { lines: lines, total: round2(total), count: lines.length };
  }

  // Second hop: who funds one IE committee — contributions INTO it, dues excluded,
  // rolled up by parent_id, sorted desc.
  function spenderFunders(index, spenderKey) {
    var rows = index.fundersBySpender[spenderKey] || [];
    var by = {};
    for (var i = 0; i < rows.length; i++) {
      var c = rows[i];
      if (c.contribution_type === DUES_TYPE) continue;        // internal dues transfers are not giving
      var donor = index.donors[c.donor_id] || {};
      var pid = donor.parent_id || c.donor_id;
      var parent = index.donors[pid] || donor;
      var m = by[pid] || (by[pid] = { parent_id: pid, name: parent.name || pid,
        industries: parent.industries || [], flags: parent.flags || [], total: 0, count: 0 });
      m.total = round2(m.total + (c.amount || 0)); m.count++;
    }
    var funders = []; for (var k in by) if (by.hasOwnProperty(k)) funders.push(by[k]);
    funders.sort(function (a, b) { return b.total - a.total; });
    var total = 0; for (var j = 0; j < funders.length; j++) total += funders[j].total;
    return { funders: funders, total: round2(total), count: funders.length };
  }

  // Tier 3: a donor's footprint WITHIN this election artifact — every committee /
  // candidate this parent has funded (direct gifts + money into IE committees),
  // dues excluded. Election-scoped only; council-side giving is NOT included.
  function donorFootprint(index, parentId) {
    var parent = index.donors[parentId] || { id: parentId, name: parentId };
    var pr = index.parentRollup[parentId];
    var rows = (pr && pr.rows) || [];
    var by = {};
    for (var i = 0; i < rows.length; i++) {
      var c = rows[i];
      if (c.contribution_type === DUES_TYPE) continue;
      var cid = c.committee_id, cm = index.committees[cid] || {};
      // office scope: an IE committee that didn't spend in this office is out of
      // scope (e.g. a council-only IE PAC must not appear in a school-board view).
      if (cm.type === 'independent_expenditure' && index.office && !index.inScopeIE[cid]) continue;
      var m = by[cid];
      if (!m) {
        m = by[cid] = { committee_id: cid, total: 0, count: 0, kind: 'other', label: cm.committee_name || cid };
        if (cm.candidate_id) {
          var cand = index.candidateById[cm.candidate_id] || {}, race = index.raceById[cand.race_id] || {};
          m.kind = 'candidate'; m.label = (cand.name || cm.candidate_id) + (race.label ? (' — ' + race.label) : '');
        } else if (cm.type === 'independent_expenditure') {
          m.kind = 'ie'; m.label = cm.committee_name || cid;
          m.ieIdentity = spenderFunders(index, cid).funders.slice(0, 3).map(function (x) { return x.name; });
        }
      }
      m.total = round2(m.total + (c.amount || 0)); m.count++;
    }
    var committees = []; for (var k in by) if (by.hasOwnProperty(k)) committees.push(by[k]);
    committees.sort(function (a, b) { return b.total - a.total; });
    var total = 0; for (var j = 0; j < committees.length; j++) total += committees[j].total;
    return {
      parent_id: parentId, name: parent.name || parentId,
      industries: parent.industries || [], flags: parent.flags || [],
      committees: committees, total: round2(total), count: committees.length
    };
  }

  // Committee profile (bidirectional with the donor footprint). For an IE
  // committee: what it spent in support vs opposition, by candidate, + who funds
  // it (second hop). For a candidate committee: what it raised + its contributors.
  // funders/contributors are donorRow-compatible lines (clickable back to a
  // footprint) — one modal system, two content types.
  function committeeProfile(index, committeeKey) {
    var cm = index.committees[committeeKey] || {};
    var sun = sunshineUrl(cm);
    if (cm.type === 'independent_expenditure') {
      // group this committee's IEs by target candidate
      var byCand = {}, support = 0, oppose = 0;
      var src = index.iesBySpender[committeeKey] || [];
      for (var i = 0; i < src.length; i++) {
        var ie = src[i];
        if (EXCLUDED_CYCLES[ie.cycle]) continue;
        var tc = ie.target_candidate_id || ('race:' + ie.target_race_id);
        var cand = index.candidateById[ie.target_candidate_id] || {};
        var race = index.raceById[cand.race_id || ie.target_race_id] || {};
        var m = byCand[tc] || (byCand[tc] = { candidate_id: ie.target_candidate_id || null,
          name: cand.name || ('race ' + ie.target_race_id), raceLabel: race.label || null, support: 0, oppose: 0, total: 0, count: 0 });
        var a = ie.amount || 0;
        if (ie.stance === 'oppose') { m.oppose = round2(m.oppose + a); oppose = round2(oppose + a); }
        else { m.support = round2(m.support + a); support = round2(support + a); }
        m.total = round2(m.total + a); m.count++;
      }
      var targets = []; for (var k in byCand) if (byCand.hasOwnProperty(k)) targets.push(byCand[k]);
      targets.sort(function (a, b) { return b.total - a.total; });
      var ff = spenderFunders(index, committeeKey);
      return {
        committee_id: committeeKey, kind: 'ie', name: cm.committee_name || committeeKey,
        sunshineUrl: sun, isIE: true, identity: ff.funders.slice(0, 3).map(function (x) { return x.name; }),
        support: round2(support), oppose: round2(oppose), total: round2(support + oppose), targets: targets,
        funders: ff.funders, funderTotal: ff.total, funderCount: ff.count
      };
    }
    // candidate (or other) committee — show what it raised + its contributors
    var candId = cm.candidate_id || null;
    var cand2 = candId ? (index.candidateById[candId] || {}) : {};
    var race2 = cand2.race_id ? (index.raceById[cand2.race_id] || {}) : {};
    var contrib = candId ? candidateContributors(index, candId, null) : { lines: [], total: 0, count: 0 };
    return {
      committee_id: committeeKey, kind: 'candidate', name: cm.committee_name || committeeKey,
      candidateName: cand2.name || null, raceLabel: race2.label || null, sunshineUrl: sun, isIE: false,
      raised: contrib.total, funders: contrib.lines, funderTotal: contrib.total, funderCount: contrib.count
    };
  }

  // IE drill-down for one candidate + stance: the spender committee(s), each with
  // its second-hop top funders. Spender names are placeholders, so the funders
  // are the identity ("funded primarily by ...").
  function candidateIE(index, candidateId, stance, cycle) {
    var ieB = index.ieByCandidate[candidateId] || { support: [], oppose: [] };
    var list = stance === 'oppose' ? ieB.oppose : ieB.support;
    var by = {};
    for (var i = 0; i < list.length; i++) {
      var ie = list[i];
      if (EXCLUDED_CYCLES[ie.cycle]) continue;
      if (cycle != null && ie.cycle !== cycle) continue;
      var sk = ie.spender_committee_id;
      var m = by[sk] || (by[sk] = { spender_committee_id: sk, amount: 0, count: 0 });
      m.amount = round2(m.amount + (ie.amount || 0)); m.count++;
    }
    var spenders = [];
    for (var key in by) {
      if (!by.hasOwnProperty(key)) continue;
      var s = by[key], cm = index.committees[key] || {};
      var ff = spenderFunders(index, key);
      s.committeeName = cm.committee_name || key;
      s.sunshineUrl = sunshineUrl(cm);
      s.topFunders = ff.funders.slice(0, 3);
      s.funders = ff.funders;
      s.funderTotal = ff.total;
      s.funderCount = ff.count;
      spenders.push(s);
    }
    spenders.sort(function (a, b) { return b.amount - a.amount; });
    var total = 0; for (var t = 0; t < spenders.length; t++) total += spenders[t].amount;
    return { stance: stance, spenders: spenders, total: round2(total) };
  }

  // Neutral order = alphabetical by SURNAME (ballot convention), never by amount.
  // Strip a trailing generational suffix, then key on the last token.
  function surnameKey(name) {
    var n = String(name || '').replace(/,?\s*(jr|sr|ii|iii|iv)\.?$/i, '').trim();
    var toks = n.split(/\s+/);
    return (toks[toks.length - 1] || n).toLowerCase();
  }
  function byNameNeutral(a, b) {
    var s = surnameKey(a.name).localeCompare(surnameKey(b.name));
    return s !== 0 ? s : String(a.name).localeCompare(String(b.name));
  }
  function byRaceOrder(a, b) {
    var ak = (a.geo_key == null) ? 0 : 1, bk = (b.geo_key == null) ? 0 : 1; // citywide first

        }

      ['support', 'oppose'].forEach(function (field) {
        ieB[field].forEach(function (ie) {

          for (var t = 0; t < tags.length; t++) ind(byCand, cid, tags[t])[field] = round2(ind(byCand, cid, tags[t])[field] + amt2);
        });
      });
    }
    return { byCand: byCand, flags: flags };
  }

  // 3) Industry totals — office-scoped, cycle-aware (sum the cross-tab).
  function industryTotals(index, office, cycle) {

  // 4) Industries by candidate — per in-office candidate, their industry breakdown.

    list.sort(function (a, b) { return b.amount - a.amount; });

  function spendSubtab(index, office, tab, cycle) {
    if (tab === 'candidates') return { tab: tab, candidates: spendByCandidate(index, office, cycle) };
    if (tab === 'industries') return { tab: tab, industries: industryTotals(index, office, cycle) };
    if (tab === 'industry-candidate') return { tab: tab, rows: industriesByCandidate(index, office, cycle) };
    if (tab === 'flags') return { tab: tab, flags: flagTotals(index, office, cycle) };

  }

    OFFICE_GROUPS: OFFICE_GROUPS,
    EXCLUDED_CYCLES: EXCLUDED_CYCLES,
    loadData: loadData,

    candidateContributors: candidateContributors,
    candidateIE: candidateIE,
    spenderFunders: spenderFunders,

});

      '@media (max-width:560px){.ipg-elect .barrow{grid-template-columns:1fr;gap:4px;}.ipg-elect .barval{text-align:left;}.ipg-elect .selfline{padding-left:0;}}' +
      '</style>';

  // One figure bar. scale = race-wide max for width. panelId (if given) makes the
  // row a clickable disclosure button controlling a drill-down panel.
  function bar(label, segs, countText, scale, panelId) {
    var sum = 0, i; for (i = 0; i < segs.length; i++) sum += segs[i].v;
    var fillW = scale > 0 ? Math.min(100, (sum / scale) * 100) : 0;
    var inner = '';
    for (i = 0; i < segs.length; i++) {
      if (segs[i].v <= 0) continue;
      var w = sum > 0 ? (segs[i].v / sum * 100) : 0;
      inner += '<div class="seg ' + segs[i].cls + '" style="width:' + w + '%"></div>';
    }
    var val = sum > 0
      ? (money(sum) + (countText ? '<span class="sub">' + esc(countText) + '</span>' : ''))
      : '<span class="zero">none reported</span>';
    var labelHtml = panelId
      ? '<span class="barlabel"><span class="caret" aria-hidden="true">▸</span>' + esc(label) + '</span>'
      : '<span class="barlabel">' + esc(label) + '</span>';
    var body = labelHtml +
      '<div class="bartrack"><div class="barfill" style="width:' + fillW + '%">' + inner + '</div></div>' +
      '<div class="barval">' + val + '</div>';
    return panelId
      ? '<button class="barrow click" type="button" aria-expanded="false" aria-controls="' + panelId + '">' + body + '</button>'
      : '<div class="barrow">' + body + '</div>';
  }

  // Shared donor-row render path — used by the contributor drill-down AND the
  // Tier-2 PAC-funder list, so a direct contributor behaves exactly like a PAC
  // funder: real rolled-up donors (by parent_id) are clickable into the Tier-3
  // footprint modal and show their tags/flags. The small-dollar aggregate and the
  // candidate self-funding/loan line are NOT donor entities — labeled lines only,
  // no modal, no tag.
  function donorRow(line) {
    var amt = '<div class="amt">' + money(line.total) +
      (line.count ? ' <span class="n">· ' + plural(line.count, 'gift', 'gifts') + '</span>' : '') + '</div>';
    if (line.isSelf) {
      return '<div class="crow plain"><div class="who">' + esc(line.name) +
        ' <span class="tagchip self">Candidate’s own money / loans</span></div>' + amt + '</div>';
    }
    if (line.isAggregate) {
      return '<div class="crow plain"><div class="who">' + esc(line.name) + '</div>' + amt + '</div>';
    }
    return '<button class="crow funder-row" type="button" data-funder="' + esc(line.parent_id) + '">' +
      '<div class="who">' + esc(line.name) + ' ' + tagsHtml(line.industries, line.flags) + '</div>' + amt + '</button>';
  }

  // Contributor drill-down panel (collapsed; app toggles .open). Top 25 real
  // donors, then a "Show all N donors" toggle revealing the FULL remainder inline
  // (mirrors the council embed's single show-all toggle) — every remainder row is
  // a real, clickable donorRow. The small-dollar aggregate is a labeled,
  // non-clickable line pinned at the bottom. All rows (top + remainder + aggregate
  // + self) are in the DOM, so they sum EXACTLY to the contributions headline.
  function contributorPanel(cd, id) {
    var rest = [], agg = [], realCount = 0, t;   // N counts REAL donors only (excl. self + small-dollar)
    for (t = 0; t < cd.lines.length; t++) {
      var l = cd.lines[t];
      if (l.isAggregate) { agg.push(l); continue; }
      rest.push(l);
      if (!l.isSelf) realCount++;
    }
    var LIMIT = 25, top = '';
    for (t = 0; t < Math.min(LIMIT, rest.length); t++) top += donorRow(rest[t]);
    var moreHtml = '';
    if (rest.length > LIMIT) {
      var moreRows = ''; for (t = LIMIT; t < rest.length; t++) moreRows += donorRow(rest[t]);
      var mid = id + '-more';
      moreHtml = '<button class="show-more" type="button" aria-expanded="false" aria-controls="' + mid + '">' +
        '<span class="caret" aria-hidden="true">▸</span> Show all ' + realCount + ' donors</button>' +
        '<div class="contrib tall" id="' + mid + '"><div class="contrib-inner bare">' + moreRows + '</div></div>';
    }
    var aggHtml = ''; for (t = 0; t < agg.length; t++) aggHtml += donorRow(agg[t]);
    return '<div class="contrib" id="' + id + '"><div class="contrib-inner">' +
      '<p class="contrib-h">Who gave to this campaign · ' + money(cd.total) + ' total</p>' +
      top + moreHtml + aggHtml +
      '<p class="contrib-note">Rolled up by affiliation; lines sum to the contributions figure. Click a donor to see ' +
      'their full footprint. Small-dollar (under $150) donors are disclosed only in aggregate.</p></div></div>';
  }

  // IE drill-down — THREE explicit tiers so a funder never reads as a direct
  // opponent/supporter:
  //   Tier 1 (this panel): the IE COMMITTEE(s) that spent for/against — amount,
  //     stance, Sunshine. NOT the funders.
  //   Tier 2 (click a committee): that committee's second-hop funders (dues
  //     excluded), with explicit "gave this committee over time, not this race"
  //     framing and a plain-language identity line.
  //   Tier 3 (click a funder): the donor-footprint modal (app opens it).
  function iePanel(detail, candName, id) {
    var verb = detail.stance === 'oppose' ? 'against' : 'for';
    var verbing = detail.stance === 'oppose' ? 'opposing' : 'supporting';
    var committees = detail.spenders.map(function (s, idx) {
      var t2 = id + '-' + idx;
      var sun = s.sunshineUrl ? ' <a class="paclink" href="' + esc(s.sunshineUrl) +
        '" target="_blank" rel="noopener">Illinois Sunshine ↗</a>' : '';
      var names = s.topFunders.map(function (f) { return esc(f.name); });
      var primarily = names.length ? ('Funded primarily by ' + names.join(', ') + '.') : 'No outside funding recorded.';
      var fLimit = 10, frows = '';
      for (var i = 0; i < Math.min(fLimit, s.funders.length); i++) frows += donorRow(s.funders[i]);  // shared donor-row path
      var more = '';
      if (s.funders.length > fLimit) {        // expandable tail (same as the contributor "show all")
        var moreRows = ''; for (var j = fLimit; j < s.funders.length; j++) moreRows += donorRow(s.funders[j]);
        var fid = t2 + '-f';
        more = '<button class="show-more" type="button" aria-expanded="false" aria-controls="' + fid + '">' +
          '<span class="caret" aria-hidden="true">▸</span> Show all ' + s.funders.length + ' funders</button>' +
          '<div class="contrib tall" id="' + fid + '"><div class="contrib-inner bare">' + moreRows + '</div></div>';
      }
      var cn = ieNaming(s.committeeName, names);
      return '<div class="ie-cmte"><div class="ie-cmte-head">' +
        '<button class="ie-cmte-toggle" type="button" aria-expanded="false" aria-controls="' + t2 + '">' +
        '<span class="caret" aria-hidden="true">▸</span> <b>' + money(s.amount) + ' ' + verb + '</b> ' + verbing + ' ' +
        esc(candName) + ' · <span class="ie-pac-tag">IE PAC</span> ' + cn.primary + '</button>' + sun + '</div>' +
        '<div class="contrib tier2" id="' + t2 + '"><div class="contrib-inner">' +
          '<p class="ie-lead">' + primarily + '</p>' +
          '<p class="contrib-note framing">Amounts below are what each donor gave <b>this committee</b> over time — ' +
          'not money spent on this race.</p>' +
          '<p class="contrib-h">Who funds this committee · ' + money(s.funderTotal) + ' from ' +
          plural(s.funderCount, 'funder', 'funders') + ' (dues excluded)</p>' + frows + more +
        '</div></div></div>';
    }).join('');
    return '<div class="contrib" id="' + id + '"><div class="contrib-inner">' +
      '<p class="contrib-h">Outside spending ' + verbing + ' ' + esc(candName) + '</p>' +
      '<p class="contrib-note">Independent-expenditure committees — outside groups not coordinated with the campaign. ' +
      'Click a committee to see who funds it.</p>' + committees + '</div></div>';
  }

  // Tier 3 — donor-footprint modal (app mounts/unmounts it). Election-scoped.
  // Committee rows show the committee NAME, never the bare id: candidate
  // committees use their real name; placeholder IE PACs use the identity
  // treatment ("Funded primarily by …"). Each row is clickable -> committee profile.
  function renderFunderModal(fp) {
    var rows = fp.committees.map(function (x) {
      var who;
      if (x.kind === 'ie') {
        var nm = ieNaming(x.label, x.ieIdentity);
        who = nm.primary + ' <span class="kind ie">IE PAC</span>' + (nm.subtitle ? '<div class="sub">' + nm.subtitle + '</div>' : '');
      } else if (x.kind === 'candidate') {
        who = esc(x.label) + ' <span class="kind cand">candidate</span>';
      } else { who = esc(x.label) + ' <span class="kind">committee</span>'; }
      return '<button class="crow funder-row" type="button" data-committee="' + esc(x.committee_id) + '">' +
        '<div class="who">' + who + '</div>' +
        '<div class="amt">' + money(x.total) + ' <span class="n">· ' + plural(x.count, 'gift', 'gifts') + '</span></div></button>';
    }).join('') || '<p class="contrib-note">No election giving recorded.</p>';
    return '<div class="ipg-modal-overlay" data-modal-overlay><div class="ipg-modal" role="dialog" aria-modal="true" aria-label="Donor footprint">' +
      '<button class="ipg-modal-close" type="button" data-modal-close aria-label="Close">×</button>' +
      '<div class="modal-kicker">Donor footprint · this election only</div>' +
      '<div class="modal-name">' + esc(fp.name) + '</div>' +
      '<div class="modal-tags">' + tagsHtml(fp.industries, fp.flags) + '</div>' +
      '<p class="modal-note">Everything <b>' + esc(fp.name) + '</b> has given within the 2026 Board of Education data — ' +
      'direct contributions and money into independent-expenditure committees. Council-side giving is a separate, ' +
      'not-yet-connected view.</p>' +
      '<div class="modal-summary">' + money(fp.total) + ' across ' + plural(fp.count, 'recipient', 'recipients') + '</div>' +
      rows + '</div></div>';
  }

  // Committee-profile modal — bidirectional with the donor footprint. Same modal
  // system (app mounts/closes it the same way). Its funder/contributor rows are
  // donorRows (clickable back into a footprint).
  function renderCommitteeProfile(p) {
    var sun = p.sunshineUrl ? ' <a class="paclink" href="' + esc(p.sunshineUrl) + '" target="_blank" rel="noopener">Illinois Sunshine ↗</a>' : '';
    var head, summary, spent = '';
    if (p.isIE) {
      var idy = (p.identity && p.identity.length) ? ('Funded primarily by ' + p.identity.join(', ') + '. ') : '';
      head = '<div class="modal-kicker">Independent-expenditure committee · this election</div>' +
        '<div class="modal-name"><span class="ie-pac-tag">IE PAC</span> ' + ieNaming(p.name, p.identity).primary + '</div>' +
        '<p class="modal-note">' + idy + 'Independent spending is made without coordinating with any candidate.' + sun + '</p>';
      summary = '<div class="modal-summary">' + money(p.total) + ' spent · ' +
        money(p.support) + ' support · ' + money(p.oppose) + ' oppose</div>';
      spent = '<p class="contrib-h">What it spent on</p>' + (p.targets.length ? p.targets.map(function (t) {
        var bits = [];
        if (t.support) bits.push('<span style="color:var(--sage)">' + money(t.support) + ' for</span>');
        if (t.oppose) bits.push('<span style="color:var(--coral)">' + money(t.oppose) + ' against</span>');
        return '<div class="crow"><div class="who">' + esc(t.name) +
          (t.raceLabel ? ' <span class="muted">· ' + esc(t.raceLabel) + '</span>' : '') + '</div>' +
          '<div class="amt">' + bits.join(' · ') + '</div></div>';
      }).join('') : '<p class="contrib-note">No itemized spending recorded.</p>');
    } else {
      head = '<div class="modal-kicker">Campaign committee · this election</div>' +
        '<div class="modal-name">' + esc(p.name) + '</div>' +
        '<p class="modal-note">Campaign committee' + (p.candidateName ? ' for <b>' + esc(p.candidateName) + '</b>' : '') +
        (p.raceLabel ? ' — ' + esc(p.raceLabel) : '') + '.' + sun + '</p>';
      summary = '<div class="modal-summary">' + money(p.raised) + ' raised</div>';
    }
    var label = p.isIE
      ? ('Who funds this committee · ' + money(p.funderTotal) + ' from ' + plural(p.funderCount, 'funder', 'funders') + ' (dues excluded)')
      : ('Contributors · ' + money(p.funderTotal) + ' from ' + plural(p.funderCount, 'donor', 'donors'));
    var fl = p.funders.slice(0, 30), funders = '';
    for (var i = 0; i < fl.length; i++) funders += donorRow(fl[i]);
    var moreF = p.funders.length > 30 ? '<p class="contrib-note">+ ' + (p.funders.length - 30) + ' more</p>' : '';
    return '<div class="ipg-modal-overlay" data-modal-overlay><div class="ipg-modal" role="dialog" aria-modal="true" aria-label="Committee profile">' +
      '<button class="ipg-modal-close" type="button" data-modal-close aria-label="Close">×</button>' +
      head + summary + spent + '<p class="contrib-h" style="margin-top:14px">' + label + '</p>' + funders + moreF + '</div></div>';
  }

  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function card(c, scale) {
    var f = c.figures;
    var mostlySelf = f.contributions.total > 0 && (f.contributions.selfFunded / f.contributions.total) >= 0.5;
    var chips = (c.incumbent ? '<span class="chip-inc">Incumbent</span>' : '') +
      (mostlySelf ? '<span class="chip-self">Mostly self-funded</span>' : '');
    var base = 'd-' + esc(c.slug);
    var hasSup = f.independentSupport > 0, hasOpp = f.independentOpposition > 0;
    var contribBar = bar('From contributors',
      [{ cls: 'third', v: f.contributions.thirdParty }, { cls: 'self', v: f.contributions.selfFunded }],
      plural(f.contributions.count, 'contribution', 'contributions'), scale, base + '-c');
    var contribPanel = contributorPanel(c.contributors, base + '-c');
    var supportBar = bar('Independent support', [{ cls: 'support', v: f.independentSupport }],
      f.independentSupportCount ? plural(f.independentSupportCount, 'expenditure', 'expenditures') : '', scale, hasSup ? base + '-s' : null);
    var supportPanel = hasSup ? iePanel(c.ieSupportDetail, c.name, base + '-s') : '';
    var opposeBar = bar('Independent opposition', [{ cls: 'oppose', v: f.independentOpposition }],
      f.independentOppositionCount ? plural(f.independentOppositionCount, 'expenditure', 'expenditures') : '', scale, hasOpp ? base + '-o' : null);
    var opposePanel = hasOpp ? iePanel(c.ieOpposeDetail, c.name, base + '-o') : '';
    var selfLine = f.contributions.selfFunded > 0
      ? '<p class="selfline"><b>' + money(f.contributions.selfFunded) + '</b> is the candidate’s own money or loans · <b>' +
        money(f.contributions.thirdParty) + '</b> from other donors</p>' : '';
    var committeeLine = (c.committee && c.committee.name)
      ? '<p class="committee">Committee: ' + esc(c.committee.name) +
        (c.committee.sunshineUrl ? ' · <a href="' + esc(c.committee.sunshineUrl) + '" target="_blank" rel="noopener">Illinois Sunshine ↗</a>' : '') + '</p>'
      : '';
    return '<article class="card" id="cand-' + esc(c.slug) + '">' +
      '<div class="card-top"><h3 class="cand-name">' + esc(c.name) + '</h3>' + chips + '</div>' + committeeLine +
      '<div class="bars">' + contribBar + contribPanel + supportBar + supportPanel + opposeBar + opposePanel + '</div>' + selfLine +
      '<p class="caption">Independent support and opposition are spending by outside groups, reported by those ' +
      'groups and not coordinated with the campaign. Figures are shown separately, never added together.</p></article>';
  }

  function legend() {
    return '<div class="legend" aria-hidden="true">' +
      '<span><i class="sw third"></i>From other donors</span>' +
      '<span><i class="sw self"></i>Candidate’s own money / loans</span>' +
      '<span><i class="sw support"></i>Independent support</span>' +
      '<span><i class="sw oppose"></i>Independent opposition</span></div>';
  }

  function pendingCard(c) {
    return '<article class="card"><div class="card-top"><h3 class="cand-name">' + esc(c.name) + '</h3>' +
      (c.incumbent ? '<span class="chip-inc">Incumbent</span>' : '') + '</div>' +
      '<p class="committee">Finance data still populating — committee not yet identified.</p></article>';
  }

  // Race view: head + vacating-incumbent note(s) + legend + candidate cards
  // (neutral order from the data layer; the three figures never summed).
  function renderRaceView(vm) {
    if (!vm) return '<div class="soon"><h2>Race not found</h2></div>';
    var vac = (vm.race.vacating || []).map(function (v) {
      return '<p class="vacating-note">↳ Current member <b>' + esc(v.name) + '</b> is running for ' +
        '<button class="goto-link" type="button" data-slug="' + esc(v.targetSlug) + '">' + esc(v.targetLabel) + ' →</button></p>';
    }).join('');
    var meta = plural(vm.candidates.length, 'candidate', 'candidates') +
      (vm.cycle ? ' · cycle ' + esc(vm.cycle) : ' · current cycle');
    var head = '<div class="race-head"><h2>' + esc(vm.race.label) + '</h2>' +
      '<span class="race-meta">' + meta + '</span></div>' + vac;

    if (!vm.candidates.length) {
      return head + '<div class="soon"><h2>Field forming</h2>' +
        '<p>No candidate committees are processed for this race yet. Check back as the field fills in.</p></div>';
    }
    var live = vm.candidates.filter(function (c) { return c.hasFinance; });
    if (!live.length) return head + vm.candidates.map(pendingCard).join('');

    var scale = 1;
    for (var i = 0; i < vm.candidates.length; i++) {
      var f = vm.candidates[i].figures; if (!f) continue;
      scale = Math.max(scale, f.contributions.total, f.independentSupport, f.independentOpposition);
    }
    var anyPending = vm.candidates.some(function (c) { return !c.hasFinance; });
    var cards = vm.candidates.map(function (c) { return c.hasFinance ? card(c, scale) : pendingCard(c); }).join('');
    return head +
      (anyPending ? '<p class="field-note">▸ <span><b>Field still being added.</b> Candidates with registered ' +
        'committees are shown; others appear as they file and finance is processed.</span></p>' : '') +
      legend() + '<div style="height:18px"></div>' + cards;
  }

  function renderComingSoon(label) {
    return '<div class="soon"><h2>' + esc(label) + ' — coming soon</h2>' +
      '<p>We’re adding candidates and campaign-finance data for this race. Check back as the field fills in.</p></div>';
  }

  // Office nav (sub-tabs) + race picker chips.
  function renderOfficeNav(omVM, activeSlug) {
    var groups = omVM.groups;
    var multi = groups.length > 1;
    var nav = '';
    if (multi) {
      nav = '<nav class="offices" role="tablist" aria-label="Office section">' + groups.map(function (g) {
        var sel = g.races.some(function (r) { return r.slug === activeSlug; });
        return '<button class="office" role="tab" data-group="' + esc(g.label) + '" aria-selected="' + sel + '">' +
          esc(g.label) + (g.races.length > 1 ? ' <span class="tag">' + g.races.length + ' seats</span>' : '') + '</button>';
      }).join('') + '</nav>';
    }
    // chips for the group that owns the active race (or the first group)
    var active = null;
    for (var gi = 0; gi < groups.length; gi++) if (groups[gi].races.some(function (r) { return r.slug === activeSlug; })) active = groups[gi];
    if (!active) active = groups[0] || { races: [] };
    var chips = active.races.map(function (r) {
      return '<button class="chip" data-status="' + (r.hasFinance ? 'live' : 'soon') + '" data-slug="' + esc(r.slug) + '" ' +
        'aria-pressed="' + (r.slug === activeSlug) + '">' + esc(r.code) + (r.hasFinance ? '' : ' · soon') + '</button>';
    }).join('');
    return nav + '<div class="districts" role="group" aria-label="Race">' + chips + '</div>' +
      '<p class="picker-note">Races with processed campaign-finance data are live; the rest fill in as candidates file.</p>';
  }

  function masthead(office, topView) {
    var m = MAST[office] || MAST.school_board;
    var byrace = topView !== 'spend';
    return '<header class="masthead"><p class="eyebrow"><span class="box" aria-hidden="true"></span>' + esc(m.kicker) + '</p>' +
      '<h1>Who’s running, and who’s funding them</h1><p class="lede">' + m.lede + '</p>' +
      '<div class="topnav" role="tablist" aria-label="View">' +
      '<button role="tab" data-view="byrace" aria-selected="' + byrace + '">By race</button>' +
      '<button role="tab" data-view="spend" aria-selected="' + (!byrace) + '">Election spend</button></div></header>';
  }

  function footer() {
    return '<footer><h3>How to read this</h3>' +
      '<p>The three figures for each candidate — money from contributors, independent support, and independent ' +
      'opposition — are shown <strong>separately and never added together</strong>. Money a campaign raises goes to ' +
      'that campaign. Independent spending is made by outside groups; it is reported by the group that spent it, is ' +
      'not coordinated with the candidate, and does not go to their campaign. Where a candidate has loaned or given ' +
      'money to their own campaign, that is shown apart from money raised from other people.</p>' +
      '<p>Showing who funds a candidate is not a claim about how they would act in office. This tool reports ' +
      'disclosed money; it does not draw conclusions from it.</p>' +
      '<p class="src">Source: Illinois State Board of Elections filings, via Illinois Sunshine (Reform for Illinois). ' +
      'Donor classification is in progress; uncategorized donors are shown as not-yet-categorized. Independent ' +
      'expenditures reflect filings matched to candidates in this tool.</p></footer>';
  }

  function spendPlaceholder() {
    return '<div class="soon"><h2>Election spend — coming soon</h2>' +
      '<p>Browse donors, spend by candidate, and industry breakdowns for this office arrive in the next build.</p></div>';
  }

  // ---- Election Spend subtabs (vm computed by the data layer; render is pure) ----
  var SPEND_TABS = [['donors', 'Browse donors'], ['candidates', 'Spend by candidate'],
    ['industries', 'Industry totals'], ['industry-candidate', 'Industries by candidate'], ['flags', 'Flag totals']];

  function spendNav(active) {
    return '<div class="subnav" role="tablist" aria-label="Election spend">' + SPEND_TABS.map(function (t) {
      return '<button class="subtab" role="tab" data-spendtab="' + t[0] + '" aria-selected="' + (t[0] === active) + '">' + esc(t[1]) + '</button>';
    }).join('') + '</div>';
  }

  function browseRow(r) {
    if (r.kind === 'ie') {
      var nm = ieNaming(r.name, r.identity);
      return '<button class="crow funder-row" type="button" data-committee="' + esc(r.committee_id) + '">' +
        '<div class="who">' + nm.primary + ' <span class="kind ie">IE PAC</span>' +
        (nm.subtitle ? '<div class="sub">' + nm.subtitle + '</div>' : '') + '</div>' +
        '<div class="amt">' + money(r.total) + ' <span class="n">· spent</span></div></button>';
    }
    return donorRow({ parent_id: r.parent_id, name: r.name, industries: r.industries, flags: r.flags, total: r.total, count: 0 });
  }

  function threeFig(f) {
    return '<span class="mini c">' + money(f.contributions.total) + ' contrib</span>' +
      '<span class="mini s">' + money(f.independentSupport) + ' support</span>' +
      '<span class="mini o">' + money(f.independentOpposition) + ' oppose</span>';
  }

  function renderSpend(vm) {
    var tab = vm.tab || 'donors', body;
    if (tab === 'candidates') {
      body = '<p class="contrib-note">The three figures are shown separately and never added together. Candidates are listed ' +
        'alphabetically (never ranked by money). Candidates with no committee yet still show independent spending for or against them.</p>' +
        vm.candidates.map(function (c) {
          return '<div class="srow"><div class="sname">' + esc(c.name) + ' <span class="muted">· ' + esc(c.race) + '</span>' +
            (c.hasCommittee ? '' : ' <span class="badge">no committee yet</span>') +
            '<div class="figrow">' + threeFig(c.figures) + '</div></div></div>';
        }).join('');
    } else if (tab === 'industries') {
      body = '<p class="contrib-note">Direct contributions and independent spending are shown separately. ' +
        'Uncategorized donors are shown as uncategorized.</p>' +
        vm.industries.map(function (x) {
          return '<div class="srow"><div class="sname">' + esc(prettyTag(x.industry === 'unclassified' ? 'uncategorized' : x.industry)) +
            '<div class="figrow"><span class="mini c">' + money(x.direct) + ' contrib</span>' +
            '<span class="mini s">' + money(x.support) + ' support</span><span class="mini o">' + money(x.oppose) + ' oppose</span></div></div></div>';
        }).join('');
    } else if (tab === 'industry-candidate') {
      body = '<p class="contrib-note">Each candidate’s money by donor/​spender industry (direct + independent). ' +
        'Uncategorized shown as uncategorized.</p>' +
        vm.rows.map(function (r) {
          return '<div class="srow"><div class="sname">' + esc(r.name) + ' <span class="muted">· ' + esc(r.race) + '</span>' +
            '<div class="ixc">' + r.industries.map(function (i) {
              return '<span class="tagchip ind">' + esc(prettyTag(i.industry === 'unclassified' ? 'uncategorized' : i.industry)) + ' ' + money(i.total) + '</span>';
            }).join('') + '</div></div></div>';
        }).join('');
    } else if (tab === 'flags') {
      body = '<p class="contrib-note">Editorial flags aggregated across this office’s donors.</p>' +
        (vm.flags.length ? vm.flags.map(function (x) {
          return '<div class="srow"><div class="sname">⚑ ' + esc(prettyTag(x.flag)) +
            '<div class="figrow"><span class="mini c">' + money(x.amount) + '</span><span class="muted">· ' + x.count + ' contributions</span></div></div></div>';
        }).join('') : '<div class="soon"><p>No flags recorded for this office yet.</p></div>');
    } else { // donors
      var LIMIT = 50, rows = vm.rows, top = '';
      for (var i = 0; i < Math.min(LIMIT, rows.length); i++) top += browseRow(rows[i]);
      var more = '';
      if (rows.length > LIMIT) {
        var moreRows = ''; for (var j = LIMIT; j < rows.length; j++) moreRows += browseRow(rows[j]);
        more = '<button class="show-more" type="button" aria-expanded="false" aria-controls="spend-donors-more">' +
          '<span class="caret" aria-hidden="true">▸</span> Show all ' + rows.length + ' donors &amp; spenders</button>' +
          '<div class="contrib tall" id="spend-donors-more"><div class="contrib-inner bare">' + moreRows + '</div></div>';
      }
      body = '<p class="contrib-note">Everyone who gave to a candidate or funded an independent-expenditure committee in this ' +
        'office, by affiliation. Click a donor for their footprint; an <span class="kind ie">IE PAC</span> opens its profile.</p>' + top + more;
    }
    return '<div class="spend">' + spendNav(tab) + '<div class="spend-body">' + body + '</div></div>';
  }

  // Year/cycle filter. Default label "current cycle" (honest single-cycle default);
  // selecting a specific cycle re-derives the view models. active=null => current.
  function cycleSelector(cycles, active) {
    if (!cycles || !cycles.length) return '';
    var chips = '<button class="chip cyc" type="button" data-cycle="" aria-pressed="' + (active == null) + '">current cycle</button>';
    for (var i = 0; i < cycles.length; i++) {
      chips += '<button class="chip cyc" type="button" data-cycle="' + esc(cycles[i]) + '" aria-pressed="' + (active === cycles[i]) + '">' + esc(cycles[i]) + ' cycle</button>';
    }
    return '<div class="cycle-bar"><span class="cycle-label">Year:</span>' + chips + '</div>';
  }

  function officeComingSoon(office) {
    return '<div class="soon"><h2>' + esc(pageLabel(office)) + ' — coming soon</h2>' +
      '<p>Candidates are still filing for this office. Campaign-finance data appears here as committees are ' +
      'identified and processed — check back as the field fills in.</p></div>';
  }

  // Full inner HTML for the mount container — used by the browser app AND the
  // future SEO pre-render (same pure output).
  function renderPage(state) {
    var ready = state.officeRaces && state.officeRaces.groups.some(function (g) {
      return g.races.some(function (r) { return r.hasFinance; });
    });
    var inner;
    if (!ready) {
      inner = officeComingSoon(state.office);     // city_council / mayor: clean coming-soon, never a crash
    } else {
      var byrace = state.topView !== 'spend';
      var content = byrace
        ? (renderOfficeNav(state.officeRaces, state.activeSlug) +
           '<div aria-live="polite">' + (state.raceView ? renderRaceView(state.raceView) : '') + '</div>')
        : (state.spend ? renderSpend(state.spend) : spendPlaceholder());
      inner = cycleSelector(state.cycles, state.cycle) + content;
    }
    return '<div class="wrap">' + masthead(state.office, state.topView) +
      '<section>' + inner + '</section>' + footer() + '</div>';
  }

  return {
    styles: styles,
    masthead: masthead, footer: footer,
    renderOfficeNav: renderOfficeNav, renderRaceView: renderRaceView,
    renderComingSoon: renderComingSoon, spendPlaceholder: spendPlaceholder, renderSpend: renderSpend,
    renderFunderModal: renderFunderModal, renderCommitteeProfile: renderCommitteeProfile,
    donorRow: donorRow, contributorPanel: contributorPanel, iePanel: iePanel,
    renderPage: renderPage, pageLabel: pageLabel,
    _money: money, _esc: esc
  };
});

</script>
<script>
/* Elections embed — APP layer (browser-only, THIN).
 *
 * Fetch + mount + state + event wiring only. ALL view-model and render logic
 * lives in the pure data.js / render.js layers (so the SEO pre-render reuses
 * them); nothing data/render-shaped may leak in here.
 *
 * OFFICE is set per Squarespace Code Block via data-office on the mount node
 * (school_board | city_council | mayor); default school_board. data-src can
 * override the data URL (default = GitHub raw CDN, same pattern as the council
 * embed).
 */
(function () {
  'use strict';
  var ROOT_ID = 'ipg-elect-root';
  var DEFAULT_SRC = 'https://raw.githubusercontent.com/publicgoodpolicy/chi-council-votes/main/campaign-finance/election-data.json';

  function injectStyles() {
    if (typeof document === 'undefined' || document.getElementById('ipg-elect-css')) return;
    document.head.insertAdjacentHTML('beforeend',
      ElectRender.styles().replace('<style>', '<style id="ipg-elect-css">'));
  }

  // ONE modal system, two content types (donor footprint + committee profile).
  // Mounted on <body> wrapped in .ipg-elect so scoped styles apply; closed by ×,
  // backdrop, or Esc. App only mounts/unmounts and dispatches by data-attr — it
  // does NOT fork into separate handlers per content type. The modals are
  // bidirectional: a footprint's committee row opens a committee profile, whose
  // funder rows open footprints, all through the same openModal/closeModal.
  var IDX = null;  // current loaded index (set in start)
  function escClose(e) { if (e.key === 'Escape') closeModal(); }
  function closeModal() {
    var m = document.getElementById('ipg-elect-modal');
    if (m) m.parentNode.removeChild(m);
    document.removeEventListener('keydown', escClose);
  }
  function openFunder(pid) { if (IDX) openModal(ElectRender.renderFunderModal(ElectData.donorFootprint(IDX, pid))); }
  function openCommittee(key) { if (IDX) openModal(ElectRender.renderCommitteeProfile(ElectData.committeeProfile(IDX, key))); }
  // Shared dispatch: a clicked donor row -> footprint, a clicked committee row ->
  // committee profile. Used by BOTH the page handler and the in-modal handler.
  function modalNav(target) {
    var fr = target.closest && target.closest('[data-funder]');
    if (fr) { openFunder(fr.getAttribute('data-funder')); return true; }
    var cr = target.closest && target.closest('[data-committee]');
    if (cr) { openCommittee(cr.getAttribute('data-committee')); return true; }
    return false;
  }
  function openModal(html) {
    closeModal();
    var w = document.createElement('div');
    w.id = 'ipg-elect-modal'; w.className = 'ipg-elect'; w.innerHTML = html;
    w.addEventListener('click', function (e) {
      if ((e.target.closest && e.target.closest('[data-modal-close]')) ||
          (e.target.matches && e.target.matches('[data-modal-overlay]'))) { closeModal(); return; }
      modalNav(e.target);  // same dispatch as the page → bidirectional navigation
    });
    document.body.appendChild(w);
    document.addEventListener('keydown', escClose);
  }

  function notice(root, msg, coral) {
    root.innerHTML = '<div class="wrap"><p style="padding:44px 0;font-family:Poppins,system-ui,sans-serif;color:' +
      (coral ? '#B0553A' : '#6E5F58') + '">' + msg + '</p></div>';
  }

  function firstSlug(omVM) {
    var live = null, first = null;
    for (var g = 0; g < omVM.groups.length; g++) {
      for (var i = 0; i < omVM.groups[g].races.length; i++) {
        var r = omVM.groups[g].races[i];
        if (first === null) first = r.slug;
        if (!live && r.hasFinance) live = r.slug;
      }
    }
    return live || first;
  }
  function groupFirstSlug(group) {
    var live = null;
    for (var i = 0; i < group.races.length; i++) if (!live && group.races[i].hasFinance) live = group.races[i].slug;
    return live || (group.races[0] && group.races[0].slug) || null;
  }

  function start(root, office, index) {
    IDX = index;
    var cycles = ElectData.availableCycles(index);
    var state = { office: office, topView: 'byrace', activeSlug: null, cycle: null, spendTab: 'donors' };
    state.activeSlug = firstSlug(ElectData.viewModels.officeRaces(index, office));

    function draw() {
      var omVM = ElectData.viewModels.officeRaces(index, state.office);
      var raceId = index.raceBySlug[state.activeSlug];
      var rv = raceId ? ElectData.viewModels.raceView(index, raceId, state.cycle) : null;
      var spend = state.topView === 'spend' ? ElectData.spendSubtab(index, state.office, state.spendTab, state.cycle) : null;
      root.innerHTML = ElectRender.renderPage({
        office: state.office, topView: state.topView, cycles: cycles, cycle: state.cycle,
        officeRaces: omVM, activeSlug: state.activeSlug, raceView: rv, spend: spend
      });
    }

    root.addEventListener('click', function (e) {
      // donor/committee rows open a modal (shared dispatch — same as in-modal nav)
      if (modalNav(e.target)) return;
      var cl = function (sel) { return e.target.closest && e.target.closest(sel); };
      // Tier 1/2 + figure bars: any aria-controls toggle expands its panel in place
      // (no redraw → open state persists)
      var dz = cl('[aria-controls]');
      if (dz) {
        var pid = dz.getAttribute('aria-controls'), panel = pid && document.getElementById(pid);
        if (panel) { var open = panel.classList.toggle('open'); dz.setAttribute('aria-expanded', open ? 'true' : 'false'); }
        return;
      }
      var v = cl('[data-view]');
      if (v) { state.topView = v.getAttribute('data-view'); draw(); return; }
      var st = cl('[data-spendtab]');
      if (st) { state.spendTab = st.getAttribute('data-spendtab'); draw(); return; }
      var cy = cl('[data-cycle]');
      if (cy) { state.cycle = cy.getAttribute('data-cycle') || null; draw(); return; }
      // chips AND the vacating-incumbent "→" link both navigate by slug
      var ch = cl('[data-slug]');
      if (ch) { state.activeSlug = ch.getAttribute('data-slug'); state.topView = 'byrace'; draw(); return; }
      var of = cl('.office[data-group]');
      if (of) {
        var label = of.getAttribute('data-group');
        var omVM = ElectData.viewModels.officeRaces(index, state.office);
        for (var i = 0; i < omVM.groups.length; i++) {
          if (omVM.groups[i].label === label && omVM.groups[i].races.length) {
            state.activeSlug = groupFirstSlug(omVM.groups[i]); break;
          }
        }
        draw(); return;
      }
    });

    draw();
  }

  function init() {
    var root = document.getElementById(ROOT_ID);
    if (!root) return;
    if (typeof ElectData === 'undefined' || typeof ElectRender === 'undefined') {
      notice(root, 'Election tool failed to load (scripts missing).', true); return;
    }
    var office = root.getAttribute('data-office') || (typeof window !== 'undefined' && window.IPG_OFFICE) || 'school_board';
    var src = root.getAttribute('data-src') || (typeof window !== 'undefined' && window.IPG_DATA_URL) || DEFAULT_SRC;
    root.className = 'ipg-elect';
    injectStyles();
    notice(root, 'Loading election data…');
    fetch(src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) { start(root, office, ElectData.loadData(json, { office: office })); })
      .catch(function (err) { notice(root, 'Couldn’t load election data (' + String(err && err.message || err) + ').', true); });
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  }
})();
