<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unclassified Worklist — read-only viewer</title>
<style>
  /* House design tokens (matched to the council/elections embed footer) */
  :root{
    --cream:#F6EFE9; --ink:#342828; --teal:#044147; --sage:#508F88;
    --tan:#EBDAC6; --line:#dcd2c4; --opp:#9c3b2e; --neu:#9a8e74;
    --card:#FFFFFF; --muted:#7d7264; --hint-bg:#efe7d8; --content:1080px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.45;
  }
  h1,h2{font-family:'Recoleta','Georgia',serif; font-weight:600; margin:0;}
  .wrap{max-width:var(--content); margin:0 auto; padding:0 18px 60px;}

  /* persistent header — the live gap metric */
  header.gap{
    position:sticky; top:0; z-index:10; background:var(--teal); color:var(--cream);
    border-bottom:3px solid var(--sage);
  }
  .gap-inner{max-width:var(--content); margin:0 auto; padding:14px 18px;
    display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 22px;}
  .gap h1{color:var(--cream); font-size:20px;}
  .gap .sub{color:#cfe0dd; font-size:12px; flex-basis:100%; margin-top:-2px;}
  .metric{display:flex; align-items:baseline; gap:7px;}
  .metric .n{font-family:'Recoleta','Georgia',serif; font-size:26px; line-height:1; color:#fff;}
  .metric .l{font-size:12px; color:#bcd3cf; text-transform:uppercase; letter-spacing:.04em;}
  .ro-badge{margin-left:auto; align-self:center; font-size:11px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--teal); background:var(--tan);
    padding:3px 9px; border-radius:99px; font-weight:600;}

  /* tabs + controls */
  .controls{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:18px 0 12px;}
  .tabs{display:flex; gap:6px;}
  .tab{cursor:pointer; border:1px solid var(--line); background:var(--card);
    color:var(--muted); padding:7px 15px; border-radius:99px; font-weight:600; font-size:14px;}
  .tab.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .search{margin-left:auto; flex:1; min-width:180px; max-width:340px;}
  .search input{width:100%; padding:8px 12px; border:1px solid var(--line);
    border-radius:8px; background:var(--card); color:var(--ink); font:inherit;}
  .count-note{font-size:12px; color:var(--muted); margin:0 0 10px;}

  /* rows */
  .row{display:grid; grid-template-columns:46px 1fr auto; gap:14px; align-items:start;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;}
  .rank{font-family:'Recoleta','Georgia',serif; font-size:15px; color:var(--neu);
    text-align:right; padding-top:2px;}
  .name{font-weight:600; font-size:16px;}
  .meta-line{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .meta-line .sep{color:var(--line); padding:0 5px;}
  .funded{font-size:12px; color:var(--muted); margin-top:4px; font-style:italic;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .badges{margin-top:5px;}
  .badge{display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    padding:2px 7px; border-radius:99px; margin-right:5px; font-weight:600; border:1px solid transparent;}
  .badge.council{background:var(--hint-bg); color:#6a5d4e; border-color:#cfc5b5;}
  .badge.election{background:#dCEae8; color:var(--teal); border-color:#9ec4bf;}
  .hint{display:inline-block; margin-top:6px; font-size:12px; background:var(--hint-bg);
    border:1px dashed var(--neu); color:#5a5048; border-radius:7px; padding:3px 9px;}
  .hint b{color:var(--teal); font-weight:600;}
  .hint .why{color:var(--muted);}
  .hint .tag-na{color:var(--opp); font-weight:600; text-transform:uppercase;
    font-size:10px; letter-spacing:.04em; margin-left:6px;}
  .amt{text-align:right; white-space:nowrap;}
  .amt .big{font-family:'Recoleta','Georgia',serif; font-size:19px; color:var(--ink);}
  .amt .small{font-size:11.5px; color:var(--muted);}

  .empty{padding:40px; text-align:center; color:var(--muted);}
  .err{padding:30px; background:#f1e1dc; border:1px solid var(--opp); color:var(--opp);
    border-radius:10px; margin-top:20px;}
  .err code{background:#fff; padding:2px 6px; border-radius:4px;}
</style>
</head>
<body>
<header class="gap">
  <div class="gap-inner">
    <h1>Unclassified Worklist</h1>
    <span class="ro-badge">read-only</span>
    <div class="sub">Dollar-ranked donors &amp; committees still missing an industry classification —
      the live gap. Suggestions are hints only; nothing here is applied. (H1 viewer.)</div>
    <div id="metrics" style="flex-basis:100%; display:flex; flex-wrap:wrap; gap:10px 30px; margin-top:6px;"></div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="tabs">
      <div class="tab active" data-view="donors" id="tab-donors">Donors</div>
      <div class="tab" data-view="committees" id="tab-committees">Committees</div>
    </div>
    <div class="search"><input id="search" type="text" placeholder="Filter by name / employer / city…" autocomplete="off"></div>
  </div>
  <p class="count-note" id="count-note"></p>
  <div id="list"></div>
</div>

<script>
// Read-only viewer. Fetches the localhost JSON the backend serves and renders two
// dollar-ranked lists. No writes, no Sheet calls, no localStorage anywhere.
// When this file is served by serve.py the API is same-origin; opened as a file://
// it falls back to the default localhost port (serve.py sends permissive CORS).
const API = (location.protocol === 'http:' ? '' : 'http://localhost:8765') + '/api/worklist';

const state = { view:'donors', q:'', data:null };

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd = n => '$' + Math.round(n).toLocaleString('en-US');
const usdShort = n => {
  n = +n || 0;
  if (n >= 1e6) return '$' + (n/1e6).toFixed(n>=1e7?0:1) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + Math.round(n);
};

function renderMetrics(meta){
  const d = meta.donors, c = meta.committees;
  const el = document.getElementById('metrics');
  el.innerHTML = `
    <div class="metric"><span class="n" id="m-donor-n">${d.union_count.toLocaleString()}</span>
      <span class="l">unclassified donors</span></div>
    <div class="metric"><span class="n">${usdShort(d.union_total)}</span>
      <span class="l">donor dollars at stake</span></div>
    <div class="metric"><span class="n">${c.union_count.toLocaleString()}</span>
      <span class="l">untagged committees</span></div>
    <div class="metric"><span class="n">${usdShort(c.union_total)}</span>
      <span class="l">committee dollars</span></div>`;
}

function toolBadges(tools){
  return (tools||[]).map(t => `<span class="badge ${esc(t)}">${esc(t)}</span>`).join('');
}

function donorRow(r, i){
  const idLine = [r.occupation, r.employer, r.city].filter(Boolean).map(esc);
  const counts = `${r.contribution_count} contribution${r.contribution_count===1?'':'s'}`;
  const nFunded = r.committees_funded ? r.committees_funded.split('; ').filter(Boolean).length : 0;
  let hint = '';
  if (r.suggested_industry){
    hint = `<div class="hint">suggests <b>${esc(r.suggested_industry)}</b>` +
           (r.suggested_reason ? ` <span class="why">— ${esc(r.suggested_reason)}</span>` : '') +
           `<span class="tag-na">not applied</span></div>`;
  } else {
    hint = `<div class="hint"><span class="why">no suggestion — needs editorial research</span></div>`;
  }
  return `<div class="row">
    <div class="rank">${i+1}</div>
    <div>
      <div class="name">${esc(r.name) || '<em>(unnamed)</em>'}</div>
      ${idLine.length ? `<div class="meta-line">${idLine.join('<span class="sep">•</span>')}</div>` : ''}
      ${r.committees_funded ? `<div class="funded">funds: ${esc(r.committees_funded)}</div>` : ''}
      <div class="badges">${toolBadges(r.tools)}</div>
      ${hint}
    </div>
    <div class="amt">
      <div class="big">${usd(r.total_given)}</div>
      <div class="small">${counts}${nFunded?` · ${nFunded} committee${nFunded===1?'':'s'}`:''}</div>
    </div>
  </div>`;
}

function committeeRow(r, i){
  const sub = [r.ward?`Ward ${esc(r.ward)}`:'', esc(r.alder_name)].filter(Boolean).join(' • ');
  return `<div class="row">
    <div class="rank">${i+1}</div>
    <div>
      <div class="name">${esc(r.name) || esc(r.committee_id)}</div>
      ${sub ? `<div class="meta-line">${sub}</div>` : ''}
      <div class="badges">${toolBadges(r.tools)}</div>
      <div class="hint"><span class="why">no industry_tags — tag via the Committee Tags tab</span>
        <span class="tag-na">not applied</span></div>
    </div>
    <div class="amt">
      <div class="big">${usd(r.received_total)}</div>
      <div class="small">${r.contribution_count} contribution${r.contribution_count===1?'':'s'} received</div>
    </div>
  </div>`;
}

function matches(r, q){
  if (!q) return true;
  const hay = [r.name, r.employer, r.occupation, r.city, r.committee_id, r.suggested_industry]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.indexOf(q) !== -1;
}

function render(){
  const list = document.getElementById('list');
  const note = document.getElementById('count-note');
  if (!state.data){ return; }
  const isD = state.view === 'donors';
  const rows = (isD ? state.data.donors : state.data.committees);
  const q = state.q.trim().toLowerCase();
  const shown = q ? rows.filter(r => matches(r, q)) : rows;

  note.textContent = q
    ? `${shown.length.toLocaleString()} of ${rows.length.toLocaleString()} ${state.view} match “${state.q.trim()}” · ranked by ${isD?'total given':'total received'}`
    : `${rows.length.toLocaleString()} ${state.view}, ranked by ${isD?'total given':'total received'} (highest first)`;

  if (!shown.length){ list.innerHTML = `<div class="empty">No ${state.view} to show.</div>`; return; }
  const make = isD ? donorRow : committeeRow;
  list.innerHTML = shown.map(make).join('');
}

function setView(v){
  state.view = v;
  document.getElementById('tab-donors').classList.toggle('active', v==='donors');
  document.getElementById('tab-committees').classList.toggle('active', v==='committees');
  render();
}

document.getElementById('tab-donors').onclick = () => setView('donors');
document.getElementById('tab-committees').onclick = () => setView('committees');
document.getElementById('search').addEventListener('input', e => { state.q = e.target.value; render(); });

fetch(API)
  .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(payload => { state.data = payload; renderMetrics(payload.meta); render(); })
  .catch(err => {
    document.getElementById('list').innerHTML =
      `<div class="err"><b>Couldn't load the worklist.</b><br>${esc(err.message)}<br><br>` +
      `Start the backend first: <code>python3 campaign-finance/editor/serve.py</code>, ` +
      `then reload this page (or open <code>http://localhost:8765/</code>).</div>`;
  });
</script>
</body>
</html>
